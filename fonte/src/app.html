<title>Caderno SESA Pedagogo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Plataforma de estudo para o concurso SESA-AP 2026, cargo 472 · Pedagogo (Instituto AOCP).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,800&display=swap">
<style>
/* Identidade: caderno de estudo. Papel claro, verde-rio do Amapá como cor da marca,
   marca-texto amarelo para o que importa e uma cor por disciplina. */
:root{
  --bg:#F3F4EF; --surface:#FFFFFF; --surface-2:#EEF1EA; --surface-3:#E4E9E1;
  --ink:#17201D; --ink-2:#36423E; --muted:#5E6A65; --line:#DADFD6; --line-2:#C9D0C5;
  --brand:#0E6A5B; --brand-2:#0A5246; --brand-ink:#FFFFFF; --brand-soft:#DAEDE6;
  --hl:#FFD84D; --hl-soft:#FFF0B3; --hl-ink:#3B2F00;
  --ok:#1C7845; --ok-soft:#DCF1E3; --bad:#B23D2B; --bad-soft:#FBE3DD; --warn:#8F6200; --warn-soft:#FFF0C9;
  --m-esp:#6A4FBC; --m-por:#BF512A; --m-sus:#1E875A; --m-amp:#A87400; --m-inf:#2B66C6; --m-rl:#BF3A74; --m-x:#6C7772;
  --shadow:0 1px 2px rgb(23 32 29 / .05), 0 6px 22px rgb(23 32 29 / .06);
  --shadow-2:0 2px 6px rgb(23 32 29 / .08), 0 14px 40px rgb(23 32 29 / .10);
  --r:16px; --r-sm:11px; --r-xs:8px;
  --font-d:"Bricolage Grotesque", ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  --font-b:"Atkinson Hyperlegible", ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --side:252px;
  --q0:#E4E9E1; --q1:#7FC3AE; --q2:#45A58C; --q3:#1F7D68; --q4:#0B4F44;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101614; --surface:#171F1C; --surface-2:#1D2724; --surface-3:#25312D;
    --ink:#E6EDE9; --ink-2:#C7D2CD; --muted:#98A7A1; --line:#29352F; --line-2:#36443E;
    --brand:#5BC2AB; --brand-2:#7DD3C0; --brand-ink:#08201A; --brand-soft:#17392F;
    --hl:#F1C842; --hl-soft:#3D3415; --hl-ink:#FFF0BB;
    --ok:#69D198; --ok-soft:#163525; --bad:#F2917D; --bad-soft:#3C1E18; --warn:#F0C05E; --warn-soft:#382C12;
    --m-esp:#A893F2; --m-por:#F08B62; --m-sus:#5CCB95; --m-amp:#E2B33C; --m-inf:#7BA7F3; --m-rl:#F17BAD; --m-x:#9AA6A1;
    --q0:#25312D; --q1:#2B6457; --q2:#2F8A74; --q3:#4AB399; --q4:#86E0CA;
    --shadow:0 1px 2px rgb(0 0 0 / .3), 0 6px 22px rgb(0 0 0 / .25);
    --shadow-2:0 2px 6px rgb(0 0 0 / .35), 0 14px 40px rgb(0 0 0 / .35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#171F1C; --surface-2:#1D2724; --surface-3:#25312D;
  --ink:#E6EDE9; --ink-2:#C7D2CD; --muted:#98A7A1; --line:#29352F; --line-2:#36443E;
  --brand:#5BC2AB; --brand-2:#7DD3C0; --brand-ink:#08201A; --brand-soft:#17392F;
  --hl:#F1C842; --hl-soft:#3D3415; --hl-ink:#FFF0BB;
  --ok:#69D198; --ok-soft:#163525; --bad:#F2917D; --bad-soft:#3C1E18; --warn:#F0C05E; --warn-soft:#382C12;
  --m-esp:#A893F2; --m-por:#F08B62; --m-sus:#5CCB95; --m-amp:#E2B33C; --m-inf:#7BA7F3; --m-rl:#F17BAD; --m-x:#9AA6A1;
  --q0:#25312D; --q1:#2B6457; --q2:#2F8A74; --q3:#4AB399; --q4:#86E0CA;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 6px 22px rgb(0 0 0 / .25);
  --shadow-2:0 2px 6px rgb(0 0 0 / .35), 0 14px 40px rgb(0 0 0 / .35);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
h1,h2,h3,h4{font-family:var(--font-d);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- moldura ---------- */
.app{min-height:100vh;display:grid;grid-template-columns:var(--side) minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;padding:22px 16px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;border-right:1px solid var(--line);background:var(--surface)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;padding:2px 6px}
.logo-mark{width:36px;height:36px;border-radius:10px;background:var(--brand);display:grid;place-items:center;color:var(--brand-ink);flex:none}
.logo-mark svg{width:22px;height:22px}
.logo b{font-family:var(--font-d);font-size:1.12rem;display:block;line-height:1.1}
.logo small{display:block;color:var(--muted);font-size:.78rem;line-height:1.2}
.nav{display:grid;gap:3px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink-2);text-decoration:none;font-weight:700;font-size:.97rem}
.nav a svg{width:20px;height:20px;flex:none;opacity:.8}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--brand-soft);color:var(--brand-2)}
:root[data-theme="dark"] .nav a[aria-current="page"]{color:var(--brand-2)}
.nav .badge{margin-left:auto}
.side-foot{margin-top:auto;display:grid;gap:10px}
.count{border-radius:var(--r);padding:14px;background:var(--surface-2);display:grid;gap:2px}
.count b{font-family:var(--font-d);font-size:2rem;line-height:1}
.count span{color:var(--muted);font-size:.84rem}
.theme{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px}
.theme button{flex:1;border:0;background:none;padding:7px 4px;border-radius:9px;font-size:.8rem;color:var(--muted);font-weight:700}
.theme button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.top{display:none}
.tabs{display:none}
.main{min-width:0;padding-block:28px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:22px}
.wrap.narrow{max-width:820px}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .side{display:none}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
  .top .logo-mark{width:32px;height:32px}
  .top .logo b{font-size:1.02rem}
  .top .chip{font-size:.8rem}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabs a{display:grid;justify-items:center;gap:2px;padding:8px 2px 7px;color:var(--muted);text-decoration:none;font-size:.7rem;font-weight:700;position:relative}
  .tabs a svg{width:22px;height:22px}
  .tabs a[aria-current="page"]{color:var(--brand)}
  .tabs a[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
  .tabs .dot{position:absolute;top:6px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--bad)}
  .main{padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .wrap{gap:18px}
}

/* ---------- peças ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.card.tint{background:var(--surface-2);border-color:transparent;box-shadow:none}
.stack{display:grid;gap:12px;min-width:0}
.stack.s6{gap:6px}.stack.s18{gap:18px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--muted)}
.small{font-size:.88rem}.tiny{font-size:.8rem}
.eyebrow{font-size:.76rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.h1{font-size:clamp(1.7rem,3.4vw,2.35rem);font-weight:800}
.h2{font-size:1.3rem;font-weight:650}
.h3{font-size:1.06rem;font-weight:650}
.lead{font-size:1.04rem;color:var(--ink-2);max-width:62ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:11px 18px;font-weight:700;font-size:.97rem;text-decoration:none;line-height:1.2;min-height:44px;transition:background .15s,border-color .15s,transform .05s}
.btn:active{transform:translateY(1px)}
.btn svg{width:18px;height:18px;flex:none}
.btn.pri{background:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{background:var(--brand-2)}
.btn.sec{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn.sec:hover{background:var(--surface-2)}
.btn.ghost{background:none;color:var(--brand);padding-inline:10px}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.sm{min-height:36px;padding:7px 12px;font-size:.88rem;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:700;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.m{background:color-mix(in srgb,var(--mc) 14%,var(--surface));color:color-mix(in srgb,var(--mc) 78%,var(--ink))}
.chip .d{width:8px;height:8px;border-radius:50%;background:var(--mc)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.brand{background:var(--brand-soft);color:var(--brand-2)}
.badge{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--bad);color:#fff;font-size:.75rem;font-weight:700;display:inline-grid;place-items:center}
[data-m="esp"]{--mc:var(--m-esp)}[data-m="por"]{--mc:var(--m-por)}[data-m="sus"]{--mc:var(--m-sus)}[data-m="amp"]{--mc:var(--m-amp)}[data-m="inf"]{--mc:var(--m-inf)}[data-m="rl"]{--mc:var(--m-rl)}[data-m="x"],[data-m="leg"]{--mc:var(--m-x)}
.bar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--mc,var(--brand));transition:width .4s}
.ring{--p:0;--s:52px;width:var(--s);height:var(--s);border-radius:50%;background:conic-gradient(var(--mc,var(--brand)) calc(var(--p)*1%),var(--surface-3) 0);display:grid;place-items:center;flex:none}
.ring::before{content:"";grid-area:1/1;width:calc(var(--s) - 12px);height:calc(var(--s) - 12px);border-radius:50%;background:var(--surface)}
.ring b{grid-area:1/1;font-size:.82rem;font-family:var(--font-d)}
.icon-c{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--mc,var(--brand)) 14%,var(--surface));color:var(--mc,var(--brand));flex:none}
.icon-c svg{width:22px;height:22px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1.5px dashed var(--line-2);border-radius:var(--r)}
.seg{display:inline-flex;background:var(--surface-2);padding:4px;border-radius:12px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;font-weight:700;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.crumbs a{color:var(--muted);text-decoration:none;font-weight:700}
.crumbs a:hover{color:var(--brand)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.kpi b{display:block;font-family:var(--font-d);font-size:1.7rem;line-height:1.1}
.kpi span{color:var(--muted);font-size:.84rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;font-size:.92rem;z-index:50;box-shadow:var(--shadow-2);max-width:calc(100vw - 32px)}
@media (max-width:900px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}

/* ---------- início ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:stretch}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}
.next{position:relative;overflow:hidden;background:var(--brand);color:var(--brand-ink);border:0}
.next .eyebrow{color:color-mix(in srgb,var(--brand-ink) 75%,transparent)}
.next h2{font-size:clamp(1.35rem,2.6vw,1.75rem);font-weight:800}
.next .btn.pri{background:var(--brand-ink);color:var(--brand)}
.next .btn.pri:hover{background:color-mix(in srgb,var(--brand-ink) 88%,var(--brand))}
.next .chip{background:color-mix(in srgb,var(--brand-ink) 18%,transparent);color:var(--brand-ink)}
.next-art{position:absolute;right:-30px;bottom:-40px;width:200px;height:200px;opacity:.13;pointer-events:none}
.today li{list-style:none}
.today{margin:0;padding:0;display:grid;gap:8px}
.titem{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--surface-2);text-decoration:none;color:inherit}
.titem:hover{background:var(--surface-3)}
.titem .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;flex:none}
.titem.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.titem.done .tt{text-decoration:line-through;color:var(--muted)}
.titem .ck svg{width:14px;height:14px}
.titem .tt{font-weight:700;line-height:1.3}
.method{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;counter-reset:m}
@media (max-width:900px){.method{grid-template-columns:repeat(2,minmax(0,1fr))}}
.method div{padding:14px;border-radius:var(--r-sm);background:var(--surface-2);display:grid;gap:4px;align-content:start}
.method b{font-family:var(--font-d);font-size:1rem}
.method b::before{counter-increment:m;content:counter(m);display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-size:.8rem;margin-right:8px}
.mlist{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr) auto;gap:14px;align-items:center;text-decoration:none;color:inherit;padding:6px 4px;border-radius:10px}
.mrow:hover{background:var(--surface-2)}
@media (max-width:640px){.mrow{grid-template-columns:minmax(0,1fr) auto}.mrow .bar{grid-column:1/-1;order:3}}
.mrow b{font-size:.95rem}

/* ---------- trilha ---------- */
.week{display:grid;gap:10px}
.day{display:grid;grid-template-columns:86px minmax(0,1fr);gap:14px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.day.hoje{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.day.extra{background:var(--surface-2);border-style:dashed}
.day .dt{display:grid;align-content:start;gap:0}
.day .dt b{font-family:var(--font-d);font-size:1.5rem;line-height:1}
.day .dt span{font-size:.8rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.day ul{margin:0;padding:0;display:grid;gap:6px}
.day li{list-style:none;display:flex;gap:10px;align-items:center;min-width:0}
.day li a{color:inherit;text-decoration:none;font-weight:700;min-width:0}
.day li a:hover{color:var(--brand)}
.day li .d{width:10px;height:10px;border-radius:3px;background:var(--mc,var(--brand));flex:none}
.day li.ok a{color:var(--muted);text-decoration:line-through}
@media (max-width:640px){.day{grid-template-columns:62px minmax(0,1fr);gap:10px;padding:12px}.day .dt b{font-size:1.3rem}}
.wk-h{display:flex;align-items:baseline;gap:10px;margin-top:8px}

/* ---------- disciplinas ---------- */
.mcard{display:grid;gap:14px;text-decoration:none;color:inherit;border-top:5px solid var(--mc)}
.mcard:hover{box-shadow:var(--shadow-2)}
.mcard h3{font-size:1.14rem}
.peso{font-family:var(--font-d);font-weight:800;font-size:1.9rem;line-height:1;color:var(--mc)}
.mhead{border-radius:var(--r);padding:24px;background:color-mix(in srgb,var(--mc) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--mc) 25%,var(--line));display:grid;gap:12px}
.mhead .h1{color:color-mix(in srgb,var(--mc) 70%,var(--ink))}
.alist{display:grid;gap:8px}
.arow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line);text-decoration:none;color:inherit}
.arow:hover{border-color:var(--mc,var(--line-2))}
.arow .n{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-d);font-weight:800;background:color-mix(in srgb,var(--mc) 12%,var(--surface));color:color-mix(in srgb,var(--mc) 80%,var(--ink))}
.arow.done .n{background:var(--ok);color:#fff}
.arow .n svg{width:20px;height:20px}
.arow b{line-height:1.3}
.ed-l{display:grid;gap:6px}
.ed-i{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);align-items:start}
.ed-i .ck{width:22px;height:22px;border-radius:6px;border:2px solid var(--line-2);display:grid;place-items:center;margin-top:1px}
.ed-i.ok .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.ed-i .ck svg{width:13px;height:13px}
.ed-i a{font-size:.82rem;font-weight:700;text-decoration:none}

/* ---------- aula ---------- */
.ahead{display:grid;gap:12px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;position:sticky;top:calc(env(safe-area-inset-top,0px));z-index:10;background:var(--bg);padding-block:10px}
@media (max-width:900px){.steps{top:calc(57px + env(safe-area-inset-top,0px))}}
.step{display:grid;gap:6px;text-align:left;border:0;background:none;padding:0;color:var(--muted)}
.step i{display:block;height:5px;border-radius:9px;background:var(--surface-3)}
.step span{font-size:.84rem;font-weight:700;display:flex;align-items:center;gap:6px}

.deck:hover{background:var(--surface-2)}
.deck span{font-weight:400;color:var(--muted);font-size:.82rem}
/* ---------- por que errei ---------- */

/* ---------- backup ---------- */

<script>
"use strict";
const DATA=/*__DATA__*/null;
const ALVO=/*__ALVO__*/"artifact";

/* =====================================================================
   DADOS
   ===================================================================== */
const DIA_PROVA="2026-12-20", ULTIMO_DIA="2026-12-18", SIM_DIA="2026-12-12";
const MAT={
  esp:{n:"Conhecimentos Específicos",c:"Específicos",peso:30,dur:60,teste:15,desc:"Pedagogia hospitalar, desenvolvimento, inclusão e legislação da área."},
  por:{n:"Língua Portuguesa",c:"Português",peso:10,dur:50,teste:10,desc:"Interpretação, sintaxe, concordância, regência, pontuação e semântica."},
  sus:{n:"Legislação do SUS",c:"SUS",peso:5,dur:50,teste:10,desc:"Constituição, Leis 8.080 e 8.142, LC 141, Decreto 7.508 e PNAB."},
  rl:{n:"Raciocínio Lógico",c:"Raciocínio",peso:5,dur:45,teste:10,desc:"Frações, porcentagem, regra de três, equações, conjuntos e sequências."},
  amp:{n:"História e Geografia do Amapá",c:"Amapá",peso:5,dur:40,teste:10,desc:"Da colonização ao Estado, cultura, espaço natural, população e economia."},
  inf:{n:"Informática",c:"Informática",peso:5,dur:40,teste:10,desc:"Hardware, Windows, LibreOffice, internet, segurança e Google."}
};
const MAT_ORD=["esp","por","sus","rl","amp","inf"];
// Ordem de estudo: o que pesa mais e é menos familiar vem primeiro; básicas intercaladas para variar.
const ORD_E=["E11","E12","E13","E18","E09","E07","E06","E05","E08","E20","E19","E14","E10","E03","E02","E01","E04","E17","E15","E16"];
const ORD_B=["S02","P01","S03","R02","P02","S01","P03","R01","S06","P04","A01","S04","P05","R03","S05","P07","A02","S07","P06","A04","I03","P08","A05","I04","P09","A03","I02","P10","I01"];
const AULAS=DATA.aulas, AULA={};
AULAS.forEach(a=>{AULA[a.id]=a;});
const SEQ_AULAS=[]; // ordem da trilha
for(let i=0;i<Math.max(ORD_E.length,ORD_B.length);i++){ if(ORD_E[i]) SEQ_AULAS.push(ORD_E[i]); if(ORD_B[i]) SEQ_AULAS.push(ORD_B[i]); }
AULAS.forEach(a=>{ if(!SEQ_AULAS.includes(a.id)) SEQ_AULAS.push(a.id); });
const POR_M={}; MAT_ORD.forEach(m=>POR_M[m]=SEQ_AULAS.map(id=>AULA[id]).filter(a=>a.m===m));
const NUM_AULA=a=>POR_M[a.m].indexOf(a)+1;
const SIM=DATA.sim, SIMQ=SIM.q.map(q=>({m:q[0],e:q[1],a:q[2],c:q[3],com:q[4],tx:q[5]||null}));
const PROVAS=DATA.provas, PROVA={}; PROVAS.forEach(p=>{PROVA[p.id]=p;});
const ORD_PROVAS=["hrl16","chufpa16","unirio25"];
const EDITAL=DATA.edital;
const CARDS=DATA.cards||{};
const L="ABCDE";

function Q(k){
  const [a,i]=k.split(":");
  if(a==="sim"){ const q=SIMQ[+i]; return q?{e:q.e,a:q.a,c:q.c,com:q.com,m:q.m,tx:q.tx,orig:"Simulado SESA · questão "+(+i+1)}:null; }
  const au=AULA[a]; if(!au||!au.q[+i]) return null;
  const q=au.q[+i]; return {e:q[0],a:q[1],c:q[2],com:q[3],m:au.m,aula:a,orig:"Aula "+NUM_AULA(au)+" · "+au.t};
}
const CHAVES_M={}; MAT_ORD.forEach(m=>{ CHAVES_M[m]=[]; POR_M[m].forEach(a=>a.q.forEach((_,i)=>CHAVES_M[m].push(a.id+":"+i))); });

/* =====================================================================
   ESTADO (navegador + banco do artefato, por pessoa)
   ===================================================================== */
const KEY="sesa-ped-v3";
function novo(){ return {v:3,upd:0,aulas:{},resp:{},rev:{},sim:null,testes:{},provas:{},quiz:null,tempo:{},cfg:null,fc:{},fcs:null,mot:{},backup:null}; }
function migra(s){ const b=novo(); if(!s||typeof s!=="object"||s.v!==3) return b; for(const k in b){ if(s[k]===undefined) s[k]=b[k]; } return s; }
let S=novo();
try{ const raw=localStorage.getItem(KEY); if(raw) S=migra(JSON.parse(raw)); }catch(e){}
let DBREF=null, dbTimer=null, dbBusy=false, dbPend=false;
function salvar(){
  S.upd=Date.now();
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
  if(DBREF){ clearTimeout(dbTimer); dbTimer=setTimeout(enviaDb,2500); }
}
async function enviaDb(){
  if(!DBREF) return;
  if(dbBusy){ dbPend=true; return; }
  dbBusy=true;
  try{ await DBREF.set({upd:S.upd,json:JSON.stringify(S)}); }
  catch(e){ if(e&&(e.code==="invalid_argument"||e.code==="revoked"||e.code==="not_granted")) DBREF=null; }
  dbBusy=false;
  if(dbPend){ dbPend=false; enviaDb(); }
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"&&DBREF&&dbTimer){ clearTimeout(dbTimer); enviaDb(); } });
(async()=>{
  try{
    if(!(window.claude&&window.claude.use)) return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    const ref=db.doc("data/users/"+uid+"/progresso");
    const snap=await ref.get();
    const r=snap.exists?snap.data():null;
    DBREF=ref;
    if(r&&r.json&&r.upd>(S.upd||0)){
      S=migra(JSON.parse(r.json));
      try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
      render(); toast("Progresso sincronizado");
    } else if(S.upd&&(!r||(r.upd||0)<S.upd)) enviaDb();
  }catch(e){}
})();

/* =====================================================================
   UTILIDADES
   ===================================================================== */
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
const plain=s=>String(s).replace(/\*\*/g,"");
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
const hoje=()=>iso(new Date());
const dt=s=>new Date(s+"T12:00:00");
function somaDias(s,n){ const d=dt(s); d.setDate(d.getDate()+n); return iso(d); }
function diasEntre(a,b){ return Math.round((dt(b)-dt(a))/864e5); }
const DS=["dom","seg","ter","qua","qui","sex","sáb"], DSL=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const MS=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const MSL=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function dataCurta(s){ const d=dt(s); return DS[d.getDay()]+", "+d.getDate()+" "+MS[d.getMonth()]; }
function dataLonga(s){ const d=dt(s); return DSL[d.getDay()]+", "+d.getDate()+" de "+MSL[d.getMonth()]; }
const FERIADOS={"2026-11-02":"Finados","2026-11-20":"Consciência Negra"};
const DS3=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
// Rotina da Sammy: dias da semana em que estuda, minutos por dia e exceções (folga ou dia extra).
function CFG(){
  if(!S.cfg||!Array.isArray(S.cfg.dias)||!S.cfg.dias.length) S.cfg={dias:[1,2,3,4,5],min:120,exc:{},inicio:hoje()};
  if(!S.cfg.exc) S.cfg.exc={};
  if(!S.cfg.min) S.cfg.min=120;
  if(!S.cfg.inicio) S.cfg.inicio=hoje();
  return S.cfg;
}
function ehDiaEstudo(s){ const c=CFG(), e=c.exc[s]; if(e===true||e===false) return e; return c.dias.includes(dt(s).getDay())&&!FERIADOS[s]; }
const util=ehDiaEstudo;
function proxEstudo(d){ let n=0; do{ d=somaDias(d,1); n++; }while(!ehDiaEstudo(d)&&n<370); return d; }
function fmtMin(m){ m=Math.max(0,Math.round(m)); if(m<60) return m+" min"; const h=Math.floor(m/60), r=m%60; return h+"h"+(r?String(r).padStart(2,"0"):""); }
function fmtMinC(m){ m=Math.round(m); if(m<60) return m+"m"; const h=Math.floor(m/60), r=m%60; return h+"h"+(r?String(r).padStart(2,"0"):""); }
function hms(s){ s=Math.max(0,Math.floor(s)); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60; return (h?h+":":"")+String(m).padStart(h?2:1,"0")+":"+String(x).padStart(2,"0"); }
const pct=(a,b)=>b?Math.round(100*a/b):0;
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>{el.hidden=true;},2600); }
const plural=(n,s,p)=>n+" "+(n===1?s:(p||s+"s"));
const chipM=m=>`<span class="chip m" data-m="${m}"><span class="d"></span>${esc(MAT[m].c)}</span>`;

const I={
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>',
  trilha:'<path d="M6 3v4"/><path d="M18 3v4"/><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="m9 15 2 2 4-4"/>',
  livro:'<path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/>',
  quest:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.6v.6"/><path d="M12 17.5h.01"/>',
  prova:'<path d="M9 3h6l1 3H8z"/><rect x="4" y="5" width="16" height="16" rx="2"/><path d="m8.5 13 2 2 4.5-4.5"/>',
  check:'<path d="m5 12 5 5 9-10"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  seta:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  voltar:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
  play:'<path d="M7 4v16l13-8z" fill="currentColor" stroke="none"/>',
  ler:'<path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><path d="M8 9h8M8 13h6"/>',
  video:'<rect x="2" y="5" width="15" height="14" rx="2"/><path d="m17 10 5-3v10l-5-3"/>',
  resumo:'<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>',
  alvo:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  alerta:'<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/>',
  luz:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/>',
  relogio:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  repetir:'<path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/>',
  arquivo:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>',
  bandeira:'<path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/>',
  chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
  grafico:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  edital:'<path d="M7 3h10v18H7z"/><path d="M10 7h4M10 11h4M10 15h2"/>',
  pausa:'<path d="M8 5v14M16 5v14"/>',
  estrela:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/>'
};
const ico=(k,extra="")=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${I[k]}</svg>`;

/* =====================================================================
   PROGRESSO
   ===================================================================== */
const stA=id=>S.aulas[id]||(S.aulas[id]={step:0,sec:0,vis:[0],ok:0,qz:null});
const aulaOk=id=>!!(S.aulas[id]&&S.aulas[id].ok);
function respAula(id){ const a=AULA[id]; let n=0,ok=0; a.q.forEach((_,i)=>{ const r=S.resp[id+":"+i]; if(r){ n++; if(r.ok1) ok++; } }); return {n,ok}; }
function statsM(m){
  const ks=CHAVES_M[m]; let n=0,ok=0;
  ks.forEach(k=>{ const r=S.resp[k]; if(r){ n++; if(r.ok1) ok++; } });
  SIMQ.forEach((q,i)=>{ if(q.m===m){ const r=S.resp["sim:"+i]; if(r){ n++; if(r.ok1) ok++; } } });
  const aulas=POR_M[m].length, feitas=POR_M[m].filter(a=>aulaOk(a.id)).length;
  return {n,ok,aulas,feitas,tot:ks.length};
}
function registra(k,r){
  const q=Q(k); if(!q) return;
  const ok=r===q.c, p=S.resp[k];
  if(!p) S.resp[k]={r,ok,ok1:ok,n:1,t:Date.now(),t1:Date.now()};
  else { p.r=r; p.ok=ok; p.n=(p.n||1)+1; p.t=Date.now(); }
  if(!ok){ S.rev[k]={lv:0,due:somaDias(hoje(),1)}; }
}
const INTERV=[1,3,7,14];
function revisa(k,ok){
  const v=S.rev[k]||{lv:0}, q=Q(k), p=S.resp[k];
  if(p&&q){ p.ok=ok; p.n=(p.n||1)+1; p.t=Date.now(); }
  if(ok){ const lv=(v.lv||0)+1; if(lv>=INTERV.length) delete S.rev[k]; else S.rev[k]={lv,due:somaDias(hoje(),INTERV[lv])}; }
  else S.rev[k]={lv:0,due:somaDias(hoje(),1)};
}
const revHoje=()=>Object.keys(S.rev).filter(k=>S.rev[k].due<=hoje()&&Q(k));

/* =====================================================================
   TEMPO DE ESTUDO (conta sozinho enquanto ela estuda aqui)
   ===================================================================== */
// Conta o tempo nas páginas de estudo com a aba visível e alguma atividade nos últimos 4 minutos.
// Durante prova online ou simulado com o relógio correndo, conta sempre.
const ROTAS_ESTUDO=/^(aula-|revisao$|pratica$|simulado$|teste-|prova-)/;
let ATIV=Date.now(), TT=Date.now(), VIDEO_ATE=0, ACUM=0, SAIU=null, CONTANDO=false;
["pointerdown","pointermove","keydown","wheel","touchstart","scroll"].forEach(ev=>window.addEventListener(ev,()=>{ ATIV=Date.now(); },{passive:true,capture:true}));
function minDia(d){ const t=S.tempo&&S.tempo[d]; if(!t) return 0; return Math.floor((t.a||0)/60)+(t.m||[]).reduce((s,x)=>s+(+x.min||0),0); }
function contando(){
  const ex=exameAtivo();
  if(ex&&ex.ini&&!ex.fim&&!ex.pausa) return true;
  if(document.visibilityState!=="visible") return false;
  if(!ROTAS_ESTUDO.test(rota())) return false;
  return Date.now()-ATIV<4*60e3||Date.now()<VIDEO_ATE;
}
function tickTempo(){
  const agora=Date.now(), seg=Math.min(60,Math.max(0,(agora-TT)/1000)); TT=agora;
  CONTANDO=contando();
  if(CONTANDO&&seg>0){ const d=hoje(); S.tempo=S.tempo||{}; const t=S.tempo[d]||(S.tempo[d]={a:0,m:[]}); t.a=(t.a||0)+seg; ACUM+=seg; if(ACUM>=60){ ACUM=0; salvar(); } }
  mostraTempo();
}
setInterval(tickTempo,10000);
function mostraTempo(){
  const m=minDia(hoje()), meta=CFG().min;
  const s=document.getElementById("tempo-side"); if(s) s.innerHTML=`<span class="pulse ${CONTANDO?"on":""}"></span><span>${m||CONTANDO?`<b>${fmtMin(m)}</b> estudados hoje${CONTANDO?" · contando":""}`:"O tempo de estudo é contado sozinho"}</span>`;
  const top=document.getElementById("tempo-top"); if(top){ top.hidden=!m&&!CONTANDO; top.innerHTML=`<span class="pulse ${CONTANDO?"on":""}"></span>${fmtMin(m)}`; top.title="Estudado hoje"; }
  const hm=document.getElementById("hoje-min"); if(hm) hm.textContent=fmtMin(m);
  const hr=document.getElementById("hoje-ring"); if(hr){ hr.style.setProperty("--p",Math.min(100,pct(m,meta))); const b=hr.querySelector("b"); if(b) b.textContent=pct(m,meta)+"%"; }
}
function addManual(d,min,nota){
  min=Math.round(+min||0); if(min<=0) return false;
  S.tempo=S.tempo||{}; const t=S.tempo[d]||(S.tempo[d]={a:0,m:[]}); (t.m=t.m||[]).push({min,nota:String(nota||"").slice(0,80),t:Date.now()});
  salvar(); return true;
}

function oferecerTempo(min,o){
  const el=document.getElementById("nudge");
  el.innerHTML=`<span>Você passou <b>${min} min</b> ${o==="video"?"na videoaula":"fora daqui"}. Somar ao seu tempo de hoje?</span><span class="row" style="gap:6px"><button class="btn sm pri" data-act="nudge-sim" data-min="${min}" data-o="${esc(o)}">Somar ${min} min</button><button class="btn sm sec" data-act="nudge-nao">Agora não</button></span>`;
  el.hidden=false; clearTimeout(oferecerTempo._t); oferecerTempo._t=setTimeout(()=>{ el.hidden=true; },60000);
}
function semana(d){ const x=dt(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); const ds=[]; for(let i=0;i<7;i++){ ds.push(iso(x)); x.setDate(x.getDate()+1); } return ds; }
function sequencias(){
  const c=CFG(), h=hoje(); let cur=0, best=0, g=0;
  for(let d=c.inicio; d<=h&&g<400; d=somaDias(d,1), g++){
    if(minDia(d)>=15){ cur++; best=Math.max(best,cur); }
    else if(ehDiaEstudo(d)&&d!==h) cur=0;
  }
  return {cur,best};
}
// Média real por dia de estudo nos últimos 10 dias que já passaram (dias sem estudo contam como zero).
function ritmoReal(){
  const c=CFG(), h=hoje(); let n=0, tot=0, g=0;
  for(let d=somaDias(h,-1); d>=c.inicio&&n<10&&g<60; d=somaDias(d,-1), g++){ const m=minDia(d); if(ehDiaEstudo(d)||m>0){ n++; tot+=m; } }
  return n>=3?{media:Math.round(tot/n),dias:n}:null;
}

/* =====================================================================
   TRILHA (plano que se ajusta ao ritmo)
   ===================================================================== */
function itensTrilha(){
  const it=[]; const restam={}; MAT_ORD.forEach(m=>restam[m]=POR_M[m].length);
  SEQ_AULAS.forEach(id=>{
    const a=AULA[id];
    it.push({k:"a:"+id,tipo:"aula",m:a.m,t:a.t,sub:MAT[a.m].c+" · Aula "+NUM_AULA(a),min:MAT[a.m].dur,href:"#aula-"+id,ok:aulaOk(id)?S.aulas[id].ok:0});
    restam[a.m]--;
    if(restam[a.m]===0){ const t=S.testes[a.m]; it.push({k:"t:"+a.m,tipo:"teste",m:a.m,t:"Prova online de "+MAT[a.m].c,sub:MAT[a.m].teste+" questões, com tempo",min:MAT[a.m].teste*3,href:"#teste-"+a.m,ok:t&&t.hist&&t.hist.length?t.hist[0].t:0}); }
  });
  ORD_PROVAS.forEach(id=>{ const p=PROVA[id], s=S.provas[id]; it.push({k:"p:"+id,tipo:"banca",m:"x",t:"Prova real: "+p.titulo,sub:"Instituto AOCP · só o que cai na SESA",min:id==="chufpa16"?90:120,href:"#prova-"+id,ok:s&&s.fim?s.fim:0}); });
  it.push({k:"s",tipo:"sim",m:"x",t:"Simulado SESA (60 questões, 5 horas)",sub:"Sábado à tarde, no horário da prova",min:300,href:"#simulado",ok:S.sim&&S.sim.fim?S.sim.fim:0,fds:true});
  return it;
}
function plano(cap){
  const c=CFG(); cap=cap||c.min;
  const it=itensTrilha(), h=hoje(), dias={};
  const add=(d,x)=>{ (dias[d]=dias[d]||[]).push(x); };
  // o que foi concluído hoje ocupa a capacidade de hoje
  let usado=0;
  it.forEach(x=>{ if(x.ok&&iso(new Date(x.ok))===h){ add(h,x); if(!x.fds) usado+=x.min; } });
  // hoje entra no plano se for dia da rotina ou se ela já estudou hoje (dia extra automático)
  const hojeConta=ehDiaEstudo(h)||(minDia(h)>=10&&c.exc[h]!==false);
  let d=h; if(!hojeConta){ d=proxEstudo(h); usado=0; }
  let ultimoAula=null;
  for(const x of it.filter(y=>!y.ok)){
    if(x.fds){ add(SIM_DIA<h?h:SIM_DIA,x); continue; } // simulado no sábado 12/12, uma semana antes da prova
    if(usado>0&&usado+x.min>cap+15){ d=proxEstudo(d); usado=0; }
    add(d,x); usado+=x.min;
    if(x.tipo==="aula"||x.tipo==="teste") ultimoAula=d;
  }
  const fim=d;
  // dias que sobram até a véspera viram revisão
  let r=somaDias(fim,1), i=0, posSim=false; const rot=["esp","por","sus","esp","rl","amp","inf"];
  while(r<=ULTIMO_DIA){ if(ehDiaEstudo(r)&&!dias[r]){
      if(!posSim&&r>SIM_DIA&&!(S.sim&&S.sim.fim&&iso(new Date(S.sim.fim))<SIM_DIA)){ posSim=true; add(r,{k:"r:"+r,tipo:"rev",m:"x",t:"Revisão: erros do simulado",sub:"Releia a correção e refaça as questões erradas",min:c.min,href:"#simulado",ok:0}); }
      else { const m=rot[i++%rot.length]; add(r,{k:"r:"+r,tipo:"rev",m,t:"Revisão: "+MAT[m].c,sub:"Caderno de erros + resumos das aulas",min:c.min,href:"#materia-"+m,ok:0}); } }
    r=somaDias(r,1); }
  // folgas marcadas e feriados aparecem na trilha
  for(let x=h, g=0; x<=ULTIMO_DIA&&g<120; x=somaDias(x,1), g++){
    const e=c.exc[x], naRotina=c.dias.includes(dt(x).getDay());
    if(e===false&&!dias[x]) add(x,{k:"fo:"+x,tipo:"folga",m:"x",t:"Folga",sub:"O conteúdo deste dia foi para frente",min:0,href:"#trilha",ok:0});
    else if(FERIADOS[x]&&naRotina&&e===undefined&&!dias[x]) add(x,{k:"f:"+x,tipo:"feriado",m:"x",t:"Feriado de "+FERIADOS[x],sub:"Fora do plano. Se quiser estudar, marque como dia de estudo.",min:0,href:"#trilha",ok:0});
  }
  add("2026-12-19",{k:"v",tipo:"vesp",m:"x",t:"Véspera: descanse",sub:"Separe documento com foto e caneta preta de tubo transparente",min:0,href:"#inicio",ok:0});
  return {dias,fim,ultimoAula,atraso:fim>ULTIMO_DIA,cap};
}

const NAV=[["inicio","Início","home"],["trilha","Trilha","trilha"],["disciplinas","Disciplinas","livro"],["questoes","Questões","quest"],["provas","Provas","prova"]];
function rota(){ const h=(location.hash||"").replace(/^#/,""); return h||"inicio"; }
function secaoNav(r){

    if(r==="inicio") h=vInicio();

function pos(r){
  clearInterval(TICK); TICK=null;

  if(ex&&ex.ini&&!ex.fim&&!ex.pausa){ TICK=setInterval(()=>{ const t=document.getElementById("timer"); const rest=exTempo(ex)-exGasto(ex); if(t) t.textContent=hms(rest); if(rest<=0){ entrega(); } },1000); }
  if(r.startsWith("prova-")) pdfAuto(r.slice(6));

}

// Estimativa: acerto de primeira de cada disciplina × número de questões dela na prova.
// Disciplina com poucas respostas puxa para a média geral.
function projecao(){
  let tot=0,okT=0; const pm={};
  MAT_ORD.forEach(m=>{ const s=statsM(m); pm[m]=s; tot+=s.n; okT+=s.ok; });
  if(tot<30) return null;
  const geral=okT/tot; let nota=0;
  MAT_ORD.forEach(m=>{ const s=pm[m]; const acc=(s.ok+geral*4)/(s.n+4); nota+=MAT[m].peso*acc; });
  return {nota:Math.round(nota),base:tot};
}
function desempenho(){
  const st={}; MAT_ORD.forEach(m=>st[m]=statsM(m));
  const linhas=MAT_ORD.map(m=>{ const s=st[m], p=pct(s.ok,s.n); return `<div class="dr" data-m="${m}"><span class="stack s6" style="gap:0"><b class="small">${esc(MAT[m].c)}</b><span class="tiny muted">${MAT[m].peso} na prova · ${s.feitas}/${s.aulas} aulas</span></span><span class="bar" title="${s.n?p+"% de acerto":"sem questões ainda"}"><i style="width:${s.n?p:0}%;background:${!s.n?"var(--surface-3)":p>=70?"var(--ok)":p>=50?"var(--warn)":"var(--bad)"}"></i></span><span class="v">${s.n?`<b>${p}%</b> <span class="tiny muted">${s.n} q.</span>`:'<span class="tiny muted">—</span>'}</span></div>`; }).join("");
  const cand=MAT_ORD.filter(m=>st[m].n>=8).map(m=>({m,acc:st[m].ok/st[m].n,ganho:MAT[m].peso*(1-st[m].ok/st[m].n)})).sort((a,b)=>b.ganho-a.ganho);
  const g=cand[0];

function constancia(){

function vTrilha(){
  const c=CFG(), p=plano(), h=hoje();
  const datas=Object.keys(p.dias).filter(d=>d>=h).sort();
  const sem={};
  datas.forEach(d=>{ const k=semana(d)[0]; (sem[k]=sem[k]||[]).push(d); });
  const blocos=Object.keys(sem).sort().map((k,ix)=>{
    const ds=sem[k];
    const titulo=k===semana(h)[0]?"Esta semana":`Semana de ${dt(k).getDate()} de ${MSL[dt(k).getMonth()]}`;
    return `<div class="stack s6"><div class="wk-h"><h2 class="h3">${titulo}</h2></div><div class="week">${ds.map(d=>{
      const its=p.dias[d], folga=its.some(x=>x.tipo==="folga"), fer=its.some(x=>x.tipo==="feriado");
      const extra=!folga&&its.every(x=>x.tipo==="rev"||x.tipo==="vesp"||x.tipo==="sim"||x.tipo==="feriado");
      const pode=!folga&&!fer&&d<=ULTIMO_DIA&&its.some(x=>!x.ok&&(x.tipo==="aula"||x.tipo==="teste"||x.tipo==="banca"||x.tipo==="rev"));
      const acao=folga?`<button class="btn ghost sm dfolga" data-act="folga-off" data-d="${d}">Desfazer folga</button>`:fer?`<button class="btn ghost sm dfolga" data-act="estudar-dia" data-d="${d}">Vou estudar</button>`:pode?`<button class="btn ghost sm dfolga" data-act="folga" data-d="${d}" title="Não vou estudar neste dia">Folga</button>`:"<span></span>";
      const mm=d===h?minDia(h):0;
      return `<div class="day ${d===h?"hoje":""} ${extra?"extra":""} ${folga?"folga":""}"><div class="dt"><span>${d===h?"Hoje":DS[dt(d).getDay()]}</span><b>${dt(d).getDate()}</b><span>${MS[dt(d).getMonth()]}</span>${mm?`<span class="tmin">${fmtMin(mm)}</span>`:""}</div><ul>${its.map(x=>`<li class="${x.ok?"ok":""}" data-m="${x.m}"><span class="d"></span><span class="stack" style="gap:0;min-width:0">${x.tipo==="folga"||x.tipo==="feriado"?`<b>${esc(x.t)}</b>`:`<a href="${x.href}">${esc(x.t)}</a>`}<span class="tiny muted">${esc(x.sub)}${x.min?" · ~"+x.min+" min":""}</span></span>${x.ok?`<span class="chip ok" style="margin-left:auto">${ico("check",'style="width:13px;height:13px"')} feito</span>`:""}</li>`).join("")}</ul>${acao}</div>`;
    }).join("")}</div></div>`;
  }).join("");
  const rr=ritmoReal(); let real="";
  if(rr&&rr.media<c.min*0.85){ const pr=plano(Math.max(20,rr.media)); real=` No seu ritmo real dos últimos ${rr.dias} dias de estudo (média de ${fmtMin(rr.media)} por dia), as aulas terminariam em <b>${pr.ultimoAula?dataCurta(pr.ultimoAula):dataCurta(pr.fim)}</b>${pr.atraso?", depois da prova":""}.`; }
  else if(rr) real=` Nos últimos ${rr.dias} dias de estudo você fez em média ${fmtMin(rr.media)} por dia: está no ritmo.`;
  const msg=p.atraso?`<div class="card" style="background:var(--warn-soft);border-color:transparent"><b>Com ${fmtMin(c.min)} por dia nos dias marcados, a trilha passa da data da prova.</b> <span class="small">Aumente o tempo por dia ou inclua o sábado na rotina.${real}</span></div>`
    :`<div class="card tint small">Com ${fmtMin(c.min)} por dia, aulas e provas online terminam em <b>${dataCurta(p.ultimoAula||p.fim)}</b>. Depois vêm as provas reais da banca, o simulado e dias de revisão até ${dataCurta(ULTIMO_DIA)}.${real}</div>`;
  const rotina=`<div class="card stack">
    <div class="spread"><h2 class="h3">Sua rotina</h2><span class="tiny muted">Mudou aqui, a trilha se reorganiza na hora</span></div>
    <div class="stack s6"><span class="tiny muted" style="font-weight:700">Dias em que você estuda</span><div class="seg wd" role="group" aria-label="Dias da semana">${[1,2,3,4,5,6,0].map(w=>`<button data-act="cfg-dia" data-w="${w}" aria-pressed="${c.dias.includes(w)}">${DS3[w]}</button>`).join("")}</div></div>
    <div class="stack s6"><span class="tiny muted" style="font-weight:700">Tempo por dia</span><div class="seg" role="group" aria-label="Tempo por dia">${[60,90,120,150,180,240].map(m=>`<button data-act="cfg-min" data-v="${m}" aria-pressed="${c.min===m}">${fmtMin(m)}</button>`).join("")}</div></div>
    <p class="tiny muted">Vai faltar num dia? Toque em “Folga” nele e o conteúdo vai para frente. Estudou num dia fora da rotina? O tempo é contado e a trilha usa esse dia sozinha.</p>
  </div>`;
  // histórico: dias anteriores com tempo e o que foi concluído
  const itens=itensTrilha().filter(x=>x.ok), hist=[];
  for(let d=somaDias(h,-1), g=0; d>=c.inicio&&g<90; d=somaDias(d,-1), g++){ const fe=itens.filter(x=>iso(new Date(x.ok))===d), m=minDia(d); if(m||fe.length) hist.push({d,m,fe}); }
  const histHTML=hist.length?`<details class="fold"><summary>Dias anteriores (${hist.length})</summary><div class="stack s6">${hist.map(x=>`<div class="row" style="gap:10px;align-items:flex-start"><span class="small" style="min-width:110px"><b>${esc(dataCurta(x.d))}</b><br><span class="muted">${x.m?fmtMin(x.m):"tempo não contado"}</span></span><span class="small">${x.fe.map(f=>`<a href="${f.href}">${esc(f.t)}</a>`).join(" · ")||'<span class="muted">Estudo sem item concluído</span>'}</span></div>`).join("")}</div></details>`:"";
  return `<div class="wrap narrow">
    <div class="stack s6"><span class="eyebrow">Plano de estudos</span><h1 class="h1">Sua trilha até 20 de dezembro</h1><p class="lead">Uma aula de Conhecimentos Específicos (metade da prova) e uma das básicas por dia, começando pelo que pesa mais e é menos familiar.</p></div>
    ${rotina}
    ${msg}
    ${blocos}
    ${histHTML}
  </div>`;
}

const PASSOS=[["Conteúdo","Ler","ler"],["Questões","Questões","quest"],["Videoaulas","Vídeos","video"],["Resumo","Resumo","resumo"]];
function vAula(id){
  const a=AULA[id], st=stA(id), m=a.m;

  let corpo="";
  if(st.step===0) corpo=aulaConteudo(a,st);
  else if(st.step===1) corpo=`<div class="lesson" id="quizbox">${quizAula(a,st)}</div>`;
  else if(st.step===2) corpo=aulaVideos(a,st);
  else corpo=aulaResumo(a,st);
  return `<div class="wrap" data-m="${m}">
    <div class="ahead">
      <div class="crumbs"><a href="#disciplinas">Disciplinas</a><span>/</span><a href="#materia-${m}">${esc(MAT[m].c)}</a><span>/</span><span>Aula ${NUM_AULA(a)}</span></div>
      <div class="stack s6"><div class="row">${chipM(m)}<span class="tiny muted">Aula ${NUM_AULA(a)} de ${POR_M[m].length} · ~${MAT[m].dur} min</span>${st.ok?`<span class="chip ok">${ico("check",'style="width:13px;height:13px"')} Concluída</span>`:""}</div><h1 class="h1">${esc(a.t)}</h1></div>
    </div>

function bloco(b){
  if(typeof b==="string") return `<p>${md(b)}</p>`;
  if(b.a) return `<aside class="callout alerta"><b>${ico("alerta")} Pegadinha de prova</b><p>${md(b.a)}</p></aside>`;

// Estado do quiz: {itens:[chaves], i, picks:{k:r}, fim, ctx}
function quizAula(a,st){
  if(!st.qz) st.qz={itens:a.q.map((_,i)=>a.id+":"+i),i:0,picks:{},fim:false};

function quizHTML(z,ctx){
  if(!z.itens.length) return `<div class="empty">Nenhuma questão nesta lista.</div>`;
  if(z.fim) return quizFim(z,ctx);
  const k=z.itens[z.i], q=Q(k); if(!q) return `<div class="empty">Questão indisponível.</div>`;
  const pick=z.picks[k], resp=pick!==undefined;
  const pips=z.itens.map((kk,j)=>{ const p=z.picks[kk]; const c=p===undefined?"":p===Q(kk).c?"ok":"bad"; return `<button class="${c} ${j===z.i?"cur":""}" data-act="qz-go" data-i="${j}" aria-label="Questão ${j+1}">${j+1}</button>`; }).join("");
  const alts=q.a.map((t,j)=>{ let c=""; if(resp){ if(j===q.c) c="ok"; else if(j===pick) c="bad"; else c="dim"; }
    return `<button class="alt ${c}" data-act="qz-pick" data-i="${j}" ${resp?"disabled":""}><span class="L">${L[j]}</span><span class="tx">${esc(t)}</span><span class="st">${resp&&j===q.c?ico("check"):resp&&j===pick?ico("x"):""}</span></button>`; }).join("");
  const fb=resp?`<div class="feedback ${pick===q.c?"ok":"bad"}"><b>${pick===q.c?ico("check")+" Correta!":ico("x")+" Resposta: letra "+L[q.c]}</b><p>${esc(q.com)}</p>${pick!==q.c?motivoHTML(k):""}${ALVO==="artifact"?`<div data-askq="${esc(k)}" hidden><button class="btn ghost sm" data-act="ask-q">${ico("chat")} Explique de outro jeito</button><div class="ask-qout" hidden></div></div>`:""}</div>`:"";
  const ultima=z.i===z.itens.length-1;
  const origem=ctx!=="aula"?`<div class="qmeta">${chipM(q.m)}<span class="tiny muted">${esc(q.orig)}</span></div>`:"";
  return `<div class="qbox">
    <div class="qtop"><span class="eyebrow">Questão ${z.i+1} de ${z.itens.length}</span><div class="pips">${pips}</div></div>
    ${origem}
    <div class="enun">${esc(q.e)}</div>
    <div class="alts" role="group" aria-label="Alternativas">${alts}</div>
    ${fb}
    <div class="secnav"><div>${z.i>0?`<button class="btn sec" data-act="qz-go" data-i="${z.i-1}">${ico("voltar")} Anterior</button>`:""}</div>
    <div>${resp?`<button class="btn pri" data-act="qz-next">${ultima?"Ver resultado":"Próxima"} ${ico("seta")}</button>`:`<button class="btn ghost" data-act="qz-next">Pular</button>`}</div></div>
  </div>`;
}
function quizFim(z,ctx){
  const res=z.itens.map(k=>({k,p:z.picks[k],q:Q(k)})); const n=res.filter(x=>x.p!==undefined).length, ok=res.filter(x=>x.p===x.q.c).length, err=res.filter(x=>x.p!==undefined&&x.p!==x.q.c).length, br=z.itens.length-n;
  const p=pct(ok,z.itens.length);
  const msg=p>=80?"Muito bem! Esse tema está firme.":p>=60?"Bom caminho. Revise os comentários das que errou.":"Vale reler os módulos e ver as videoaulas com atenção.";
  let acoes="";
  if(ctx==="aula") acoes=`${err||br?`<button class="btn sec" data-act="qz-refazer-erros">${ico("repetir")} Refazer erradas</button>`:""}<button class="btn pri" data-act="passo" data-i="2">Ir para as videoaulas ${ico("seta")}</button>`;

}

/* =====================================================================
   FLASHCARDS (repetição espaçada: caixas 0 a 5)
   ===================================================================== */
const FC_INT=[0,1,3,7,14,30];
const fcChaves=id=>(CARDS[id]||[]).map((_,i)=>id+":"+i);
function fcCard(k){ const [a,i]=k.split(":"); const c=CARDS[a]&&CARDS[a][+i]; return c?{f:c[0],v:c[1],aula:a,m:AULA[a]?AULA[a].m:"x"}:null; }
// Cartões entram na rotação quando a aula é concluída (ou quando ela chega ao resumo).
const fcLiberadas=()=>SEQ_AULAS.filter(id=>CARDS[id]&&(aulaOk(id)||(S.aulas[id]&&S.aulas[id].step>=3)));
function fcHoje(){
  S.fc=S.fc||{}; const h=hoje();
  const due=Object.keys(S.fc).filter(k=>S.fc[k].due<=h&&fcCard(k));
  const novos=[]; fcLiberadas().forEach(id=>fcChaves(id).forEach(k=>{ if(!S.fc[k]) novos.push(k); }));
  return {due,novos:novos.slice(0,12),novosTot:novos.length};
}
function fcNota(k,n){
  S.fc=S.fc||{}; let b=(S.fc[k]&&S.fc[k].b)||0;
  if(n===0) b=0; else if(n===1) b=Math.max(1,b); else b=Math.min(5,b===0?2:b+1);
  S.fc[k]={b,due:somaDias(hoje(),n===0?1:Math.max(1,FC_INT[b])),t:Date.now()};
}
function fcProx(k,n){ let b=(S.fc&&S.fc[k]&&S.fc[k].b)||0; if(n===0) return "volta amanhã"; b=n===1?Math.max(1,b):Math.min(5,b===0?2:b+1); const d=Math.max(1,FC_INT[b]); return d===1?"volta amanhã":"volta em "+d+" dias"; }
function fcDeck(deck){
  if(deck==="hoje"){ const x=fcHoje(); return shuffle(x.due).concat(x.novos); }
  if(deck.startsWith("m:")){ const m=deck.slice(2); let ks=[]; POR_M[m].forEach(a=>ks=ks.concat(fcChaves(a.id))); return shuffle(ks).slice(0,25); }
  if(deck.startsWith("a:")) return fcChaves(deck.slice(2));
  return [];
}
function fcLinhaHoje(){
  const x=fcHoje(), n=x.due.length+x.novos.length; if(!n) return "";
  return `<a class="titem" href="#cartoes" data-act="fc-ini" data-deck="hoje" style="background:var(--brand-soft)"><span class="icon-c" style="width:36px;height:36px">${ico("estrela")}</span><span class="stack s6" style="gap:2px"><span class="tt">${plural(n,"flashcard","flashcards")} para hoje</span><span class="tiny muted">${x.due.length?x.due.length+" de revisão":""}${x.due.length&&x.novos.length?" · ":""}${x.novos.length?x.novos.length+" novos das aulas que você fez":""}</span></span></a>`;
}

  </div>`;

function fcNotasHTML(k){ return `<div class="fc-ctl"><button class="btn b0" data-act="fc-nota" data-n="0">Não lembrei<small>${fcProx(k,0)}</small></button><button class="btn b1" data-act="fc-nota" data-n="1">Com esforço<small>${fcProx(k,1)}</small></button><button class="btn b2" data-act="fc-nota" data-n="2">Fácil<small>${fcProx(k,2)}</small></button></div>`; }

function b64(bytes){ let s=""; const u=new Uint8Array(bytes); for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
function deb64(t){ const s=atob(t); const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
async function geraCodigo(){
  const copia=JSON.parse(JSON.stringify(S)); delete copia.quiz; delete copia.fcs;
  const json=JSON.stringify(copia);
  try{ if("CompressionStream" in window){ const st=new Blob([json]).stream().pipeThrough(new CompressionStream("gzip")); return "SESA1:"+b64(await new Response(st).arrayBuffer()); } }catch(e){}
  return "SESA0:"+b64(new TextEncoder().encode(json));
}
async function leCodigo(txt){
  txt=String(txt||"").trim();
  if(txt.startsWith("{")) return JSON.parse(txt);
  const m=txt.replace(/\s+/g,"").match(/^SESA([01]):([A-Za-z0-9+/=]+)$/); if(!m) throw new Error("formato");
  const bytes=deb64(m[2]);
  if(m[1]==="1"){ const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip")); return JSON.parse(await new Response(st).text()); }
  return JSON.parse(new TextDecoder().decode(bytes));
}
function resumoEstado(x){
  const aulas=Object.values(x.aulas||{}).filter(a=>a&&a.ok).length, q=Object.keys(x.resp||{}).length;
  let min=0; Object.keys(x.tempo||{}).forEach(d=>{ const t=x.tempo[d]; min+=Math.floor((t.a||0)/60)+(t.m||[]).reduce((s,e)=>s+(+e.min||0),0); });
  return {aulas,q,min,upd:x.upd||0};
}

function juntar(a,b){
  const r=JSON.parse(JSON.stringify(a)); const tm=x=>x||0;
  r.aulas=r.aulas||{}; for(const id in b.aulas||{}){ const x=b.aulas[id], y=r.aulas[id]; if(!x) continue; if(!y){ r.aulas[id]=x; continue; }
    y.ok=y.ok&&x.ok?Math.min(y.ok,x.ok):(y.ok||x.ok||0); y.step=Math.max(y.step||0,x.step||0); y.vis=[...new Set([...(y.vis||[]),...(x.vis||[])])]; y.vid=y.vid||x.vid; if(!y.qz&&x.qz) y.qz=x.qz; }
  r.resp=r.resp||{}; for(const k in b.resp||{}){ const x=b.resp[k], y=r.resp[k]; if(!y){ r.resp[k]=x; continue; }
    const p1=x=>x.t1||x.t||Infinity; const prim=p1(x)<p1(y)?x:y, ult=tm(x.t)>tm(y.t)?x:y;
    r.resp[k]={r:ult.r,ok:ult.ok,ok1:prim.ok1,n:Math.max(x.n||1,y.n||1),t:ult.t,t1:Math.min(p1(x),p1(y))}; }
  r.rev=r.rev||{}; for(const k in b.rev||{}){ const x=b.rev[k], y=r.rev[k]; if(!y||x.due>y.due) r.rev[k]=x; }
  r.fc=r.fc||{}; for(const k in b.fc||{}){ const x=b.fc[k], y=r.fc[k]; if(!y||tm(x.t)>tm(y.t)) r.fc[k]=x; }
  r.mot=r.mot||{}; for(const k in b.mot||{}){ const x=b.mot[k], y=r.mot[k]; if(!y||tm(x.t)>tm(y.t)) r.mot[k]=x; }
  r.tempo=r.tempo||{}; for(const d in b.tempo||{}){ const x=b.tempo[d], y=r.tempo[d]; if(!y){ r.tempo[d]=x; continue; }
    y.a=Math.max(y.a||0,x.a||0); const ts=new Set((y.m||[]).map(e=>e.t)); (x.m||[]).forEach(e=>{ if(!ts.has(e.t)) (y.m=y.m||[]).push(e); }); }
  const peso=s=>!s?-1:s.fim?1e13+s.fim:Object.keys(s.r||{}).length;
  if(peso(b.sim)>peso(r.sim)) r.sim=b.sim;
  r.provas=r.provas||{}; for(const id in b.provas||{}){ if(peso(b.provas[id])>peso(r.provas[id])) r.provas[id]=b.provas[id]; }
  r.testes=r.testes||{}; for(const m in b.testes||{}){ const x=b.testes[m], y=r.testes[m]; if(!y){ r.testes[m]=x; continue; }
    const vis=new Set(), hist=[...(y.hist||[]),...(x.hist||[])].filter(h=>{ if(vis.has(h.t)) return false; vis.add(h.t); return true; }).sort((p,q)=>q.t-p.t).slice(0,10);
    const cur=tm(x.ini)>tm(y.ini)?x:y; r.testes[m]=Object.assign({},cur,{hist}); }
  if(b.cfg){ r.cfg=r.cfg||b.cfg; r.cfg.exc=Object.assign({},b.cfg.exc||{},r.cfg.exc||{}); if(b.cfg.inicio&&(!r.cfg.inicio||b.cfg.inicio<r.cfg.inicio)) r.cfg.inicio=b.cfg.inicio; }
  r.upd=Date.now(); return r;
}

/* ---------- PDF (pdf.js) guardado no IndexedDB ---------- */
const PDFOK={};
function idb(){ return new Promise((ok,no)=>{ try{ const r=indexedDB.open("sesa-ped",1); r.onupgradeneeded=()=>r.result.createObjectStore("pdf"); r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error); }catch(e){ no(e); } }); }
async function pdfSalva(id,buf){ try{ const d=await idb(); d.transaction("pdf","readwrite").objectStore("pdf").put(buf,id); }catch(e){} }
async function pdfLe(id){ try{ const d=await idb(); return await new Promise(ok=>{ const r=d.transaction("pdf").objectStore("pdf").get(id); r.onsuccess=()=>ok(r.result||null); r.onerror=()=>ok(null); }); }catch(e){ return null; } }
function pdfAuto(id){ if(!document.getElementById("pdfbox")) return; pdfLe(id).then(b=>{ if(b&&rota()==="prova-"+id) mostraPdf(id,b); }); }
const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
function carregaScript(src){ return new Promise((ok,no)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=no; document.head.appendChild(s); }); }
let PDFCARGA=null;
async function pdfLib(){
  // O worker roda na própria página (o navegador não permite worker de outro domínio aqui).
  if(!window.pdfjsLib){ PDFCARGA=PDFCARGA||carregaScript(PDFJS+"pdf.worker.min.js").then(()=>carregaScript(PDFJS+"pdf.min.js")); await PDFCARGA; }
  if(!window.pdfjsLib) throw new Error("pdf.js indisponível");
  try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.js"; }catch(e){}
  return window.pdfjsLib;
}
let PDFIO=null;
async function mostraPdf(id,buf){
  const box=document.getElementById("pdfbox"); if(!box) return;
  box.innerHTML=`<p class="muted small" style="padding:12px">Abrindo o PDF…</p>`;
  try{
    const lib=await pdfLib();
    const doc=await lib.getDocument({data:new Uint8Array(buf.slice(0))}).promise;
    if(!document.getElementById("pdfbox")) return;
    box.innerHTML=`<div class="spread" style="padding:2px 4px"><b class="small">Caderno de questões · ${doc.numPages} páginas</b><label class="btn ghost sm" style="cursor:pointer">Trocar PDF<input type="file" accept="application/pdf" id="pdf-in" hidden></label></div>`;
    // Cada página vira uma imagem leve quando chega perto da tela.
    const p1=await doc.getPage(1), v1=p1.getViewport({scale:1});
    const alvoW=Math.round(Math.min(1100,Math.max(720,box.clientWidth||0))*Math.min(1.5,window.devicePixelRatio||1));
    const fila=[]; let ocupado=false;
    async function desenha(div){
      const n=+div.dataset.pg; div.dataset.ok="1";
      const pg=await doc.getPage(n), v0=pg.getViewport({scale:1}), vp=pg.getViewport({scale:alvoW/v0.width});
      const c=document.createElement("canvas"); c.width=Math.floor(vp.width); c.height=Math.floor(vp.height);
      const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height);
      await pg.render({canvasContext:g,viewport:vp}).promise;
      await new Promise(ok=>c.toBlob(bl=>{ if(bl){ const img=new Image(); img.alt="Página "+n; img.src=URL.createObjectURL(bl); img.style.cssText="width:100%;height:auto;display:block;border-radius:6px"; div.textContent=""; div.appendChild(img); } else { c.style.width="100%"; div.textContent=""; div.appendChild(c); } ok(); },"image/jpeg",0.86));
      pg.cleanup();
    }
    async function roda(){ if(ocupado) return; ocupado=true; while(fila.length){ const d=fila.shift(); if(!document.body.contains(d)) continue; try{ await desenha(d); }catch(e){ d.dataset.ok=""; } } ocupado=false; }
    if(PDFIO) PDFIO.disconnect();
    PDFIO=("IntersectionObserver" in window)?new IntersectionObserver(es=>{ es.forEach(en=>{ if(en.isIntersecting&&!en.target.dataset.ok){ en.target.dataset.ok="q"; fila.push(en.target); } }); roda(); },{root:box,rootMargin:"900px 0px"}):null;
    for(let n=1;n<=doc.numPages;n++){
      const d=document.createElement("div"); d.dataset.pg=n; d.style.cssText=`aspect-ratio:${v1.width}/${v1.height};max-width:100%;background:#fff;border-radius:6px;box-shadow:var(--shadow);display:grid;place-items:center;color:#888;font-size:.8rem`; d.textContent="Página "+n;
      box.appendChild(d); if(PDFIO) PDFIO.observe(d); else fila.push(d);
    }
    if(!PDFIO) roda();
  }catch(e){
    const b=document.getElementById("pdfbox"); if(b) b.innerHTML=`<div class="empty stack" style="gap:10px">Não consegui mostrar o PDF aqui. Abra o arquivo em outra janela e use só a folha de respostas.<label class="btn sec sm" style="cursor:pointer;justify-self:center">Tentar outro arquivo<input type="file" accept="application/pdf" id="pdf-in" hidden></label></div>`;
  }
}

const PERSONA="Você é professora de um cursinho para o concurso SESA-AP 2026 (banca Instituto AOCP), cargo 472 · Pedagogo (pedagogia hospitalar). Responda em português do Brasil, de forma clara e curta (até 170 palavras), com um exemplo quando ajudar e, se fizer sentido, como a banca costuma cobrar. Escreva em texto corrido, sem markdown. Não invente números de artigos de lei; se não tiver certeza, diga isso.";
async function perguntar(){

async function explicarQ(btn){
  const box=btn.closest("[data-askq]"), k=box.dataset.askq, q=Q(k), out=box.querySelector(".ask-qout"); if(!q||!SAMPLE) return;
  const c=quizAtual(); const pick=c&&c.z.picks[k];
  const prompt=PERSONA+"\n\nExplique esta questão de outro jeito, como se fosse para quem errou. Diga por que a correta está certa e, se a aluna marcou outra, por que aquela está errada.\n\nEnunciado: "+q.e+"\n"+q.a.map((x,j)=>L[j]+") "+x).join("\n")+"\nGabarito: "+L[q.c]+(pick!==undefined?"\nA aluna marcou: "+L[pick]:"")+"\nComentário que ela já leu: "+q.com;

  const o=out.querySelector(".out");
  try{ const res=await SAMPLE(prompt,{onText:({text})=>{ o.textContent=text; }}); if(res&&res.text) o.textContent=res.text; }
  catch(e){ o.textContent=e&&e.code==="rate_limited"?"Muitas perguntas seguidas. Tente daqui a pouco.":"Não consegui explicar agora."; btn.hidden=false; }
}

   EVENTOS

function temaAtual(){ try{ return localStorage.getItem("sesa-tema")||"system"; }catch(e){ return "system"; } }
function aplicaTema(t){ const r=document.documentElement; if(t==="light"||t==="dark") r.setAttribute("data-theme",t); else r.removeAttribute("data-theme"); }

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, r=rota();
  if(act==="tema"){ try{ localStorage.setItem("sesa-tema",b.dataset.t); }catch(x){} aplicaTema(b.dataset.t); navHTML(); return; }
  // ----- rotina e tempo
  if(act==="cfg-dia"){ const c=CFG(), w=+b.dataset.w, i=c.dias.indexOf(w); if(i>=0){ if(c.dias.length===1){ toast("Deixe pelo menos um dia de estudo."); return; } c.dias.splice(i,1); } else c.dias.push(w); salvar(); render(); return; }
  if(act==="cfg-min"){ CFG().min=+b.dataset.v; salvar(); render(); return; }
  if(act==="folga"){ CFG().exc[b.dataset.d]=false; salvar(); render(); toast("Folga marcada. A trilha foi reorganizada."); return; }
  if(act==="folga-off"){ delete CFG().exc[b.dataset.d]; salvar(); render(); return; }
  if(act==="estudar-dia"){ CFG().exc[b.dataset.d]=true; salvar(); render(); toast("Dia de estudo marcado."); return; }
  if(act==="ft-toggle"){ FT.aberto=!FT.aberto; render(); return; }
  if(act==="ft-dia"){ FT.dia=+b.dataset.v; render(); return; }
  if(act==="ft-min"){ const i=document.getElementById("ft-min"); if(i) i.value=b.dataset.v; return; }
  if(act==="ft-del"){ const t=S.tempo[b.dataset.d]; if(t&&t.m){ t.m.splice(+b.dataset.i,1); salvar(); render(); } return; }
  if(act==="nudge-sim"){ const o=b.dataset.o; addManual(hoje(),+b.dataset.min,o==="video"?"Videoaula no YouTube":"Estudo fora da plataforma"); document.getElementById("nudge").hidden=true; toast("Tempo somado."); if(rota()==="inicio"||rota()==="trilha") render(); else mostraTempo(); return; }
  if(act==="nudge-nao"){ document.getElementById("nudge").hidden=true; return; }
  // ----- aula

    const id=r.slice(5), st=stA(id);
    if(act==="passo"){ st.step=+b.dataset.i; salvar(); render(); window.scrollTo(0,0); return; }
    if(act==="sec"){ st.sec=+b.dataset.i; if(!st.vis.includes(st.sec)) st.vis.push(st.sec); salvar(); render(); window.scrollTo(0,0); return; }
    if(act==="videos-ok"){ st.vid=1; st.step=3; salvar(); render(); window.scrollTo(0,0); return; }
    if(act==="concluir"){ st.ok=Date.now(); st.vid=st.vid||1; salvar(); render(); toast("Aula concluída. Muito bem!"); return; }
    if(act==="embed"){ VIDEO_ATE=Date.now()+45*60e3; const v=b.dataset.v, w=document.getElementById("v-"+v); if(w){ w.innerHTML=`<iframe class="vframe" src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v)}?autoplay=1&rel=0" title="Videoaula" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe><a class="small" href="${ytUrl(v)}" target="_blank" rel="noopener">Abrir no YouTube</a>`; } st.vid=1; salvar(); return; }
  }
  // ----- quiz
  const c=quizAtual();
  if(c&&act.startsWith("qz-")){
    const z=c.z;
    if(act==="qz-pick"){ const k=z.itens[z.i]; if(z.picks[k]!==undefined) return; const i=+b.dataset.i; z.picks[k]=i; if(c.ctx==="rev") revisa(k,i===Q(k).c); else registra(k,i); salvar(); rerenderQuiz(); navHTML(); return; }
    if(act==="qz-next"){ if(z.i<z.itens.length-1) z.i++; else z.fim=true; salvar(); rerenderQuiz(); const bx=document.getElementById("quizbox"); if(bx) bx.scrollIntoView({block:"start",behavior:"smooth"}); return; }
    if(act==="qz-go"){ z.i=+b.dataset.i; z.fim=false; salvar(); rerenderQuiz(); return; }
    if(act==="qz-refazer-erros"){ z.itens=z.itens.filter(k=>z.picks[k]!==Q(k).c); z.picks={}; z.i=0; z.fim=false; salvar(); rerenderQuiz(); return; }
  }
  // ----- flashcards
  if(act==="fc-ini"){ e.preventDefault(); const it=fcDeck(b.dataset.deck); if(!it.length){ toast("Nenhum cartão aqui ainda."); return; } S.fcs={deck:b.dataset.deck,itens:it,i:0,virado:false,notas:{},rep:{},fim:false}; salvar(); if(rota()==="cartoes") render(); else location.hash="cartoes"; return; }
  if(act==="fc-virar"&&S.fcs&&!S.fcs.fim){ const z=S.fcs; if(z.virado){ z.virado=false; } else z.virado=true; const el=document.getElementById("fc"); if(el) el.classList.toggle("on",z.virado); const ctl=document.getElementById("fc-ctl"); if(ctl) ctl.innerHTML=z.virado?fcNotasHTML(z.itens[z.i]):`<button class="btn pri" style="width:100%" data-act="fc-virar">Mostrar resposta</button>`; return; }
  if(act==="fc-nota"&&S.fcs&&!S.fcs.fim){ const z=S.fcs, k=z.itens[z.i], n=+b.dataset.n; fcNota(k,n); z.notas[k]=n; if(n===0&&!z.rep[k]){ z.rep[k]=1; z.itens.push(k); } z.i++; z.virado=false; if(z.i>=z.itens.length) z.fim=true; salvar(); render(); return; }
  if(act==="fc-sair"){ if(S.fcs) S.fcs.fim=true; salvar(); render(); return; }
  // ----- por que errei
  if(act==="mot"){ const box=b.closest("[data-motk]"); if(!box) return; const k=box.dataset.motk, c=b.dataset.c; S.mot=S.mot||{}; if(S.mot[k]&&S.mot[k].c===c) delete S.mot[k]; else S.mot[k]={c,t:Date.now()}; salvar(); box.querySelectorAll(".mchip").forEach(x=>x.setAttribute("aria-pressed",String(!!(S.mot[k]&&S.mot[k].c===x.dataset.c)))); return; }
  if(act==="mot-rev"){ const c=b.dataset.c; const ks=shuffle(Object.keys(S.mot||{}).filter(k=>S.mot[k].c===c&&Q(k))).slice(0,20); if(!ks.length) return; S.quiz={ctx:"banco",itens:ks,i:0,picks:{},fim:false}; salvar(); location.hash="pratica"; if(rota()==="pratica") render(); return; }
  // ----- backup
  if(act==="bk-copiar"){ const t=document.getElementById("bk-codigo"); const ok=()=>{ marcaBackup(); toast("Código copiado. Guarde num lugar seguro."); };
    const sel=()=>{ if(t){ t.focus(); t.select(); try{ document.execCommand("copy"); ok(); }catch(x){ toast("Selecione o código e copie."); } } };
    if(navigator.clipboard&&BK.codigo) navigator.clipboard.writeText(BK.codigo).then(ok,sel); else sel(); return; }
  if(act==="bk-baixar"){ (async()=>{ const copia=JSON.parse(JSON.stringify(S)); delete copia.quiz; delete copia.fcs; const blob=new Blob([JSON.stringify(copia)],{type:"application/json"}); const u=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=u; a.download="caderno-sesa-backup-"+hoje()+".json"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); marcaBackup(); toast("Arquivo de backup baixado."); })(); return; }
  if(act==="bk-ler"){ const t=(document.getElementById("bk-entrada")||{}).value||""; BK.erro=""; BK.ok=""; BK.lido=null;
    leCodigo(t).then(x=>{ if(!x||x.v!==3) throw new Error("versão"); BK.lido=x; render(); }).catch(()=>{ BK.erro="Não consegui ler esse código. Confira se copiou ele inteiro, começando por SESA1:"; render(); }); return; }
  if(act==="bk-juntar"&&BK.lido){ S=migra(juntar(S,BK.lido)); BK.lido=null; BK.ok="Pronto: o progresso dos dois aparelhos foi juntado."; salvar(); render(); return; }
  if(act==="bk-substituir"&&BK.lido){ const x=BK.lido; x.upd=Date.now(); S=migra(x); BK.lido=null; BK.ok="Pronto: o progresso do backup foi restaurado."; salvar(); render(); return; }
  if(act==="bk-proteger"){ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().then(v=>{ BK.persist=v; const el=document.getElementById("bk-persist"); if(el) el.innerHTML=persistHTML(); toast(v?"Dados protegidos neste aparelho.":"O navegador não liberou. Instale como app e faça backups."); }); return; }
  if(act==="instalar"&&INSTALAR){ INSTALAR.prompt(); INSTALAR.userChoice.finally(()=>{ INSTALAR=null; render(); }); return; }
  if(act==="ask"){ perguntar(); return; }
  if(act==="ask-stop"){ ABORT&&ABORT.abort(); return; }
  if(act==="ask-q"){ explicarQ(b); return; }
  // ----- questões
  if(act==="f-m"){ FILTRO.m=b.dataset.v; render(); return; }
  if(act==="f-s"){ FILTRO.s=b.dataset.v; render(); return; }
  if(act==="rev-ini"){ S.quiz={ctx:"rev",itens:shuffle(revHoje()).slice(0,30),i:0,picks:{},fim:false}; salvar(); location.hash="revisao"; if(r==="revisao") render(); return; }
  if(act==="banco-ini"){ const ks=shuffle(chavesFiltro()).slice(0,+b.dataset.n); S.quiz={ctx:"banco",itens:ks,i:0,picks:{},fim:false}; salvar(); location.hash="pratica"; if(r==="pratica") render(); return; }
  // ----- exames
  if(act==="ex-ini"){ novoExame(b.dataset.id); salvar(); render(); return; }
  const ex=exameAtivo();
  if(ex&&!ex.fim&&act.startsWith("ex-")){
    const id=r==="simulado"?"sim":r.slice(6);
    if(act==="ex-pick"){ const i=ex.i||0, j=+b.dataset.i; if(ex.r[i]===j) delete ex.r[i]; else ex.r[i]=j; salvar(); render(); return; }
    if(act==="ex-go"){ ex.i=+b.dataset.i; salvar(); render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
    if(act==="ex-flag"){ const i=ex.i||0; if(ex.flag[i]) delete ex.flag[i]; else ex.flag[i]=1; salvar(); render(); return; }
    if(act==="ex-pausa"){ if(ex.pausa){ ex.pausa=false; ex.t0=Date.now(); } else { ex.gasto=exGasto(ex); ex.pausa=true; ex.t0=0; } salvar(); render(); return; }
    if(act==="ex-entregar"){ const falta=exItens(id).length-Object.keys(ex.r).length; const box=document.getElementById("ex-confirm"); box.innerHTML=`<div class="card stack" style="background:var(--warn-soft);border-color:transparent"><b>${falta?`Ainda ${falta===1?"falta 1 questão":"faltam "+falta+" questões"} em branco. `:""}Entregar e ver a correção?</b><div class="row"><button class="btn sec sm" data-act="ex-cancela">Continuar</button><button class="btn pri sm" data-act="ex-confirma">Entregar</button></div></div>`; box.scrollIntoView({block:"center",behavior:"smooth"}); return; }
    if(act==="ex-cancela"){ document.getElementById("ex-confirm").innerHTML=""; return; }
    if(act==="ex-confirma"){ entrega(); return; }
  }
  if(act==="ex-refazer"){ const id=b.dataset.id; if(id==="sim"){ S.sim=null; } else { novoExame(id); } salvar(); render(); return; }
  if(act==="res-f"){ S._fRes=b.dataset.v; render(); return; }
  // ----- provas da banca
  if(r.startsWith("prova-")){
    const id=r.slice(6), s=S.provas[id];
    if(act==="b-pick"){ const n=+b.dataset.n, j=+b.dataset.i; if(s.r[n]===j) delete s.r[n]; else s.r[n]=j; salvar(); const row=b.closest(".bubbles"); row.querySelectorAll("button").forEach((x,ix)=>x.className=s.r[n]===ix?"on":""); const cnt=document.querySelector(".sheet .spread .small.muted"); if(cnt) cnt.textContent=Object.keys(s.r).length+" marcadas"; const cb=document.querySelector('[data-act="b-corrigir"]'); if(cb) cb.disabled=!Object.keys(s.r).length; return; }
    if(act==="b-filtro"){ s.filtro=b.dataset.v; salvar(); render(); return; }
    if(act==="b-aba"){ S._abaBanca=b.dataset.v; const sp=document.querySelector(".split"); if(sp) sp.dataset.aba=b.dataset.v; document.querySelectorAll('[data-act="b-aba"]').forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.v===b.dataset.v))); return; }
    if(act==="b-corrigir"){ const p=PROVA[id], f=s.filtro||"i"; let falta=0; [...p.st].forEach((st,ix)=>{ const ok=f==="todas"||(f==="ix"?st!=="f":st==="i"); if(ok&&s.r[ix+1]===undefined) falta++; });
      const box=document.getElementById("b-confirm"); box.innerHTML=`<div class="card stack" style="background:var(--warn-soft);border-color:transparent"><b>${falta?`${falta===1?"1 questão do filtro está":falta+" questões do filtro estão"} em branco. `:""}Corrigir agora?</b><div class="row"><button class="btn sec sm" data-act="b-cancela">Continuar marcando</button><button class="btn pri sm" data-act="b-confirma">Corrigir</button></div></div>`; return; }
    if(act==="b-cancela"){ document.getElementById("b-confirm").innerHTML=""; return; }
    if(act==="b-confirma"){ s.fim=Date.now(); salvar(); render(); window.scrollTo(0,0); toast("Prova corrigida"); return; }
    if(act==="b-refazer"){ S.provas[id]={r:{},filtro:s.filtro||"i",fim:0}; salvar(); render(); return; }
  }
});

// Dica flutuante dos gráficos: valor primeiro, rótulo depois. Mostra no hover e no foco.
const TIP=document.createElement("div"); TIP.className="tip"; TIP.hidden=true; TIP.setAttribute("role","tooltip"); document.body.appendChild(TIP);
function tipMostra(el){
  TIP.textContent=""; const b=document.createElement("b"); b.textContent=el.dataset.tipV||""; const sp=document.createElement("span"); sp.textContent=el.dataset.tipL||""; TIP.append(b,sp); TIP.hidden=false;
  const r=el.getBoundingClientRect(), t=TIP.getBoundingClientRect();
  let x=r.left+r.width/2-t.width/2; x=Math.max(8,Math.min(window.innerWidth-t.width-8,x));
  let y=r.top-t.height-8; if(y<8) y=r.bottom+8;
  TIP.style.left=x+"px"; TIP.style.top=y+"px";
}
document.addEventListener("pointerover",e=>{ const el=e.target.closest&&e.target.closest("[data-tip-v]"); if(el) tipMostra(el); else TIP.hidden=true; });
document.addEventListener("focusin",e=>{ const el=e.target.closest&&e.target.closest("[data-tip-v]"); if(el) tipMostra(el); });
document.addEventListener("focusout",()=>{ TIP.hidden=true; });
window.addEventListener("scroll",()=>{ TIP.hidden=true; },{passive:true});

render();
