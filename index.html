enos que o mínimo, a diferença deve ser acrescida no ano seguinte."]},{"t":[["Instrumento","Prazo e destino"],["Relatório de gestão (anual)","Enviado ao **Conselho de Saúde até 30 de março** do ano seguinte; o Conselho emite parecer conclusivo"],["Relatório detalhado do quadrimestre anterior","Apresentado pelo gestor **até o fim de maio, setembro e fevereiro**, em **audiência pública na Casa Legislativa**"],["Plano de saúde","Aprovado pelo Conselho de Saúde; base das ações"]]}]]],"r":["LC 141 regulamenta o art. 198, § 3º: mínimos, rateio, fiscalização.","Estados 12%; municípios 15%; DF 12% e 15%; União 15% da RCL (texto original: ano anterior + variação do PIB).","ASPS: universal, igualitária, gratuita, prevista no plano, específica da saúde.","Não contam: aposentadorias, merenda, saneamento por taxa, limpeza urbana, meio ambiente, assistência social, infraestrutura, clientela fechada.","Fundo de Saúde sob fiscalização do Conselho; fundo a fundo, regular e automático.","Relatório anual ao Conselho até 30/3; quadrimestral em audiência pública (maio, setembro, fevereiro)."],"q":[["Segundo a Lei Complementar nº 141/2012, os Municípios aplicarão anualmente em ações e serviços públicos de saúde, no mínimo,",["15% da arrecadação de impostos e transferências.","10% da receita corrente bruta.","12% da arrecadação de impostos e transferências.","25% da arrecadação, como na educação.","20% do orçamento total."],0,"Municípios: 15%. Estados: 12%. Educação tem outro percentual (25%)."],["Os Estados aplicarão, anualmente, em ações e serviços públicos de saúde, no mínimo,",["15% da receita corrente líquida.","10% dos impostos.","o mesmo valor aplicado pela União.","12% da arrecadação dos impostos e transferências, deduzidas as parcelas transferidas aos Municípios.","18% do total arrecadado."],3,"Estados: 12%, deduzidas as parcelas transferidas aos municípios."],["NÃO constitui despesa com ações e serviços públicos de saúde, para fins de apuração dos percentuais mínimos da LC nº 141/2012,",["a atenção integral à saúde em todos os níveis.","a vigilância epidemiológica.","a capacitação do pessoal de saúde do SUS.","a merenda escolar.","a aquisição de medicamentos para a rede pública."],3,"Merenda escolar é excluída expressamente (art. 4º)."],["Também NÃO é considerada despesa com ações e serviços públicos de saúde",["a produção de imunobiológicos.","o pagamento de aposentadorias e pensões, inclusive dos servidores da saúde.","a remuneração do pessoal ativo da saúde em atividade na saúde.","o saneamento em distritos sanitários especiais indígenas.","o investimento na rede física do SUS."],1,"Aposentadorias e pensões não contam, mesmo de servidores da saúde."],["De acordo com a LC nº 141/2012, os recursos de cada ente destinados às ações e serviços públicos de saúde serão",["depositados em conta pessoal do secretário.","administrados pelo Tribunal de Contas.","geridos pelos hospitais privados conveniados.","administrados livremente pelo chefe do Executivo, sem fiscalização.","aplicados por meio do Fundo de Saúde e movimentados sob fiscalização do respectivo Conselho de Saúde."],4,"Fundo de Saúde, sob fiscalização do Conselho de Saúde."],["O gestor do SUS deve apresentar o relatório detalhado referente ao quadrimestre anterior",["no Diário Oficial, a cada dois anos.","apenas ao Ministério da Saúde, uma vez por ano.","em audiência pública na Casa Legislativa do respectivo ente, até o final dos meses de maio, setembro e fevereiro.","somente quando solicitado pelo Ministério Público.","ao Conselho Tutelar, mensalmente."],2,"É a regra do art. 36, § 5º: audiência pública no Legislativo, ao fim de maio, setembro e fevereiro."],["As transferências de recursos da União para Estados e Municípios destinados às ações e serviços públicos de saúde serão feitas, segundo a LC nº 141/2012,",["por meio de emendas parlamentares exclusivamente.","diretamente para os respectivos fundos de saúde, de forma regular e automática.","diretamente aos hospitais.","apenas em situações de calamidade.","por meio de convênios eventuais, a critério do Ministro."],1,"Transferência fundo a fundo, regular e automática."],["Analise as afirmativas sobre a LC nº 141/2012.\nI. Para ser considerada despesa de saúde, a ação deve ser de acesso universal, igualitário e gratuito.\nII. A limpeza urbana e a remoção de resíduos contam como ações de saúde.\nIII. O relatório de gestão deve ser enviado ao Conselho de Saúde até 30 de março do ano seguinte.\nIV. A diferença não aplicada no mínimo deve ser acrescida no exercício seguinte.\nEstão corretas apenas",["I, III e IV.","II, III e IV.","I e IV.","II e III.","I e II."],0,"I, III e IV estão corretas. Limpeza urbana não conta como ação de saúde."]]},{"id":"S06","m":"sus","t":"Decreto 7.508/2011: regiões, redes, portas de entrada e pactuação","ed":["S4","S9"],"v":[["pRV6Nh-Oq7U","Principais conceitos do Decreto 7.508/2011 (Natale Souza)"],["vS2qxqYnq_o","Decreto 7.508 de 2011 comentado"]],"obj":["Conhecer os conceitos do art. 2º","Saber o que uma Região de Saúde deve conter","Listar as portas de entrada","Diferenciar CIT, CIB e CIR, RENASES e RENAME, e entender o COAP"],"s":[["Conceitos do decreto",["O Decreto 7.508/2011 regulamenta a Lei 8.080/1990 quanto à organização do SUS, ao planejamento, à assistência e à articulação entre os entes.",{"t":[["Conceito","Definição resumida"],["Região de Saúde","Espaço geográfico contínuo formado por **municípios limítrofes**, com identidades culturais, econômicas e sociais e redes de comunicação e transporte compartilhadas, para integrar o planejamento e a execução das ações"],["Contrato Organizativo da Ação Pública da Saúde (COAP)","**Acordo de colaboração** entre entes federativos para organizar e integrar as ações e serviços na rede regionalizada e hierarquizada, com responsabilidades, indicadores, metas e recursos"],["Portas de Entrada","Serviços de atendimento inicial ao usuário no SUS"],["Comissões Intergestores","Instâncias de **pactuação consensual** entre os entes para definir as regras da gestão compartilhada"],["Mapa da Saúde","Descrição geográfica da distribuição de recursos humanos, ações e serviços do SUS e da iniciativa privada"],["Rede de Atenção à Saúde","Ações e serviços articulados em níveis de complexidade crescente, para garantir a integralidade"],["Serviços Especiais de Acesso Aberto","Serviços para quem, por agravo ou situação laboral, precisa de atendimento especial"],["Protocolo Clínico e Diretriz Terapêutica (PCDT)","Documento com critérios de diagnóstico, tratamento, medicamentos, posologia e acompanhamento"]]}]],["Região de Saúde e portas de entrada",["As Regiões de Saúde são instituídas pelo **estado**, em articulação com os **municípios**. Para ser instituída, a região deve conter, **no mínimo**, ações e serviços de:",{"l":["atenção **primária**;","**urgência e emergência**;","atenção **psicossocial**;","atenção **ambulatorial especializada e hospitalar**;","**vigilância em saúde**."]},"São **Portas de Entrada** às ações e serviços nas Redes de Atenção:",{"l":["atenção **primária**;","atenção de **urgência e emergência**;","atenção **psicossocial**;","**especiais de acesso aberto**."]},"Os serviços hospitalares e ambulatoriais especializados são **referenciados** pelas portas de entrada. O acesso universal e igualitário é **ordenado pela atenção primária** e baseado na avaliação da gravidade do risco e no critério cronológico.",{"a":"Atenção hospitalar **não** é porta de entrada; é serviço referenciado. Vigilância em saúde está na lista mínima da região, mas não é porta de entrada."}]],["RENASES e RENAME",[{"t":[["Relação","O que contém","Atualização"],["RENASES","Todas as **ações e serviços** que o SUS oferece ao usuário para a integralidade da assistência","Publicada pelo Ministério da Saúde a cada **2 anos**"],["RENAME","Seleção e padronização dos **medicamentos** indicados no SUS, acompanhada do Formulário Terapêutico Nacional","A cada **2 anos**"]]},"O acesso à assistência farmacêutica pressupõe: usuário assistido pelo SUS; prescrição por profissional do SUS; prescrição conforme a RENAME e os PCDT (ou relação complementar local); dispensação em unidade indicada pelo SUS."]],["Comissões Intergestores e COAP",[{"t":[["Comissão","Âmbito","Vinculação"],["CIT (Tripartite)","Nacional: União, estados e municípios","Ministério da Saúde"],["CIB (Bipartite)","Estadual: estado e municípios","Secretaria Estadual de Saúde"],["CIR (Regional)","Região de Saúde","Secretaria Estadual de Saúde, observando as diretrizes da CIB"]]},{"lei":"Serão de competência exclusiva da CIT a pactuação: I – das diretrizes gerais para a composição da RENASES; II – dos critérios para o planejamento integrado das ações e serviços de saúde da Região de Saúde, em razão do compartilhamento da gestão; e III – das diretrizes nacionais, do financiamento e das questões operacionais das Regiões de Saúde situadas em fronteiras com outros países.","f":"DECRETO 7.508/2011, ART. 32, PARÁGRAFO ÚNICO"},"O **planejamento** da saúde é **ascendente e integrado**, do nível local ao federal, ouvidos os Conselhos de Saúde. O **COAP** formaliza a colaboração entre os entes numa Região de Saúde, integrando seus planos de saúde."]]],"r":["Região de Saúde: municípios limítrofes; instituída pelo estado com os municípios.","Mínimo na região: atenção primária, urgência e emergência, psicossocial, ambulatorial especializada e hospitalar, vigilância em saúde.","Portas de entrada: primária, urgência e emergência, psicossocial, especiais de acesso aberto.","Acesso ordenado pela atenção primária; hospitalar é referenciado.","RENASES (ações e serviços) e RENAME (medicamentos): atualizadas a cada 2 anos.","CIT (nacional), CIB (estadual), CIR (regional). Exclusivo da CIT: diretrizes da RENASES, critérios do planejamento regional, regiões de fronteira.","COAP: acordo de colaboração entre entes. Planejamento ascendente."],"q":[["Conforme o Decreto nº 7.508/2011, a Região de Saúde deve conter, no mínimo, ações e serviços de",["atenção hospitalar de alta complexidade exclusivamente.","atenção primária, transplantes e oncologia.","urgência e emergência e hemodiálise.","atenção primária, urgência e emergência, atenção psicossocial, atenção ambulatorial especializada e hospitalar e vigilância em saúde.","apenas atenção primária e hospitalar."],3,"São os cinco tipos do art. 5º."],["São Portas de Entrada às ações e aos serviços de saúde nas Redes de Atenção à Saúde, segundo o Decreto nº 7.508/2011:",["atenção primária e laboratórios.","hospitais universitários e centros de especialidades.","atenção primária; atenção de urgência e emergência; atenção psicossocial; e especiais de acesso aberto.","atenção hospitalar, atenção ambulatorial especializada e vigilância sanitária.","somente a atenção primária."],2,"As quatro portas do art. 9º. Hospitalar e ambulatorial especializado são referenciados."],["O acordo de colaboração firmado entre entes federativos com a finalidade de organizar e integrar as ações e serviços de saúde na rede regionalizada e hierarquizada denomina-se",["Plano Diretor de Regionalização.","Relatório Anual de Gestão.","Contrato Organizativo da Ação Pública da Saúde (COAP).","Protocolo Clínico e Diretriz Terapêutica.","Mapa da Saúde."],2,"É o COAP (art. 2º, II)."],["De acordo com o Decreto nº 7.508/2011, a pactuação das diretrizes gerais para a composição da RENASES é de competência",["comum entre o Ministro da Saúde e o CONASEMS.","exclusiva do CONASEMS.","exclusiva da Comissão Intergestores Bipartite (CIB).","exclusiva do Presidente da República.","exclusiva da Comissão Intergestores Tripartite (CIT)."],4,"Art. 32, parágrafo único, I: competência exclusiva da CIT."],["A Relação Nacional de Medicamentos Essenciais (RENAME) compreende",["a lista de hospitais credenciados.","o mapa dos recursos humanos do SUS.","os medicamentos sem registro na Anvisa.","a seleção e a padronização de medicamentos indicados para atendimento de doenças ou agravos no âmbito do SUS.","todas as ações e serviços que o SUS oferece ao usuário."],3,"RENAME = medicamentos. RENASES = ações e serviços."],["As Regiões de Saúde são instituídas",["pelo Conselho Nacional de Saúde.","pelo Estado, em articulação com os Municípios.","pelos consórcios privados.","pela União, por decreto presidencial.","pelos Municípios isoladamente."],1,"Art. 4º: pelo estado, em articulação com os municípios, respeitadas as diretrizes da CIT."],["Segundo o Decreto nº 7.508/2011, o acesso universal, igualitário e ordenado às ações e serviços de saúde se inicia",["pelas portas de entrada e se completa na rede regionalizada e hierarquizada, sendo ordenado pela atenção primária.","pela vigilância sanitária.","pelo hospital de referência do usuário.","exclusivamente pelos serviços privados conveniados.","pelo Conselho Municipal de Saúde."],0,"O acesso começa pelas portas de entrada e é ordenado pela atenção primária."],["A Comissão Intergestores que atua no âmbito da Região de Saúde, vinculada à Secretaria Estadual de Saúde e observando as diretrizes da CIB, é a",["CIR.","CIB.","CNS.","CONASS.","CIT."],0,"CIR: Comissão Intergestores Regional."]]},{"id":"S07","m":"sus","t":"Atenção Primária, Redes de Atenção, planejamento e direitos dos usuários","ed":["S5","S6","S7"],"v":[["O_yVB8N6t3w","PNAB 2017: Política Nacional da Atenção Básica"],["RuuWzJyzikc","Rede de Atenção à Saúde (Portaria 4.279/2010) com questões"]],"obj":["Conhecer o conceito, princípios e diretrizes da PNAB","Entender as Redes de Atenção à Saúde","Diferenciar Plano de Saúde, PAS, RAG e PRI","Conhecer os direitos e deveres dos usuários"],"s":[["Política Nacional de Atenção Básica (PNAB 2017)",["A **Portaria 2.436/2017** aprovou a PNAB (hoje consolidada na Portaria de Consolidação nº 2/2017). Atenção Básica e Atenção Primária à Saúde são tratadas como **termos equivalentes**.","A Atenção Básica é o conjunto de ações individuais, familiares e coletivas de **promoção, prevenção, proteção, diagnóstico, tratamento, reabilitação, redução de danos, cuidados paliativos e vigilância em saúde**, feito por equipe multiprofissional para uma população em **território definido**, sobre a qual a equipe assume **responsabilidade sanitária**.",{"l":["É a **principal porta de entrada** e o **centro de comunicação** da Rede de Atenção à Saúde.","É **coordenadora do cuidado** e **ordenadora** das ações e serviços da rede."]},{"t":[["Princípios","Diretrizes"],["Universalidade, equidade, integralidade","Regionalização e hierarquização; territorialização; população adscrita; cuidado centrado na pessoa; resolutividade; longitudinalidade do cuidado; coordenação do cuidado; ordenação da rede; participação da comunidade"]]},"A **Estratégia Saúde da Família (eSF)** é a estratégia prioritária. A equipe mínima tem **médico, enfermeiro, auxiliar ou técnico de enfermagem e agente comunitário de saúde**; pode incluir agente de combate às endemias e saúde bucal. A população adscrita recomendada é de **2.000 a 3.500 pessoas** por equipe.",{"a":"**Longitudinalidade** é o acompanhamento contínuo ao longo do tempo, com vínculo. Não confunda com integralidade."}]],["Redes de Atenção à Saúde (RAS)",["A **Portaria 4.279/2010** define as RAS como arranjos organizativos de ações e serviços de **diferentes densidades tecnológicas**, integrados por sistemas de apoio técnico, logístico e de gestão, que buscam garantir a **integralidade do cuidado**.",{"l":["**Elementos**: população, estrutura operacional e modelo de atenção.","**Estrutura operacional**: atenção primária (centro de comunicação), pontos de atenção secundários e terciários, sistemas de apoio (diagnóstico, assistência farmacêutica, informação), sistemas logísticos (cartão SUS, prontuário, regulação, transporte) e governança.","A organização é **poliárquica** (em rede, horizontal), e não uma pirâmide hierárquica rígida.","**Redes temáticas prioritárias**: materna e infantil (Rede Cegonha, hoje Rede Alyne), urgência e emergência, atenção psicossocial (RAPS), cuidados à pessoa com deficiência e atenção às doenças crônicas."]}]],["Vigilância e planejamento",["**Vigilância em saúde** é o processo contínuo e sistemático de coleta, análise e divulgação de dados sobre eventos de saúde, para planejar e executar medidas de saúde pública. Inclui vigilância epidemiológica, sanitária, ambiental e em saúde do trabalhador. Algumas doenças e agravos são de **notificação compulsória**.",{"t":[["Instrumento","O que é"],["Plano de Saúde","Instrumento central, com duração de **4 anos**, aprovado pelo Conselho de Saúde; base de todas as ações"],["Programação Anual de Saúde (PAS)","Operacionaliza o plano a cada ano, com ações, metas e recursos"],["Relatório Anual de Gestão (RAG)","Mostra os resultados alcançados; enviado ao Conselho até 30 de março do ano seguinte"],["Relatório quadrimestral (RDQA)","Prestação de contas em audiência pública no Legislativo"],["Planejamento Regional Integrado (PRI)","Coordenado pelo estado com municípios e União, no espaço regional; gera o Plano Regional"]]},"O planejamento no SUS é **ascendente**: parte das necessidades locais até o nível federal."]],["Direitos e deveres dos usuários",["A **Carta dos Direitos dos Usuários da Saúde** (Portaria 1.820/2009, hoje consolidada) se apoia em seis princípios:",{"l":["acesso **ordenado e organizado** aos sistemas de saúde;","tratamento **adequado e efetivo** para o problema;","atendimento **humanizado, acolhedor e livre de discriminação**;","atendimento que **respeite a pessoa**, seus valores e direitos;","**responsabilidades** do usuário para que o tratamento seja adequado;","**comprometimento dos gestores** para que esses princípios sejam cumpridos."]},"Entre os direitos: informação clara sobre o próprio estado de saúde, acesso ao prontuário, acompanhante nos casos previstos, sigilo, uso do nome social e consentimento livre e esclarecido."]]],"r":["PNAB 2017: AB = APS; porta de entrada preferencial, centro de comunicação, coordenadora do cuidado e ordenadora da rede.","Princípios: universalidade, equidade, integralidade. Diretrizes: território, adscrição, cuidado centrado na pessoa, resolutividade, longitudinalidade, coordenação, ordenação, participação.","eSF: médico, enfermeiro, técnico/auxiliar de enfermagem, ACS; 2.000 a 3.500 pessoas.","RAS (Portaria 4.279/2010): diferentes densidades tecnológicas, integralidade, organização poliárquica; APS no centro.","Plano de Saúde (4 anos) → PAS (anual) → RAG (até 30/3). PRI no espaço regional.","Carta dos direitos dos usuários: seis princípios."],"q":[["Segundo a PNAB (Portaria nº 2.436/2017), a Atenção Básica é",["a porta de entrada exclusiva para urgências.","um nível de atenção restrito a ações curativas.","responsável apenas pela vacinação.","um serviço complementar ao hospital.","a principal porta de entrada e centro de comunicação da Rede de Atenção à Saúde, coordenadora do cuidado e ordenadora das ações e serviços disponibilizados na rede."],4,"É o conceito central da PNAB."],["São princípios da Atenção Básica, segundo a PNAB 2017:",["universalidade, equidade e integralidade.","complementaridade e privatização.","territorialização, adscrição e longitudinalidade.","transversalidade e protagonismo.","centralização e hierarquização rígida."],0,"Universalidade, equidade e integralidade são princípios. Territorialização, adscrição e longitudinalidade são diretrizes."],["A diretriz da Atenção Básica que se refere à continuidade da relação de cuidado, com construção de vínculo e responsabilização entre profissionais e usuários ao longo do tempo, é a",["integralidade.","regionalização.","resolutividade.","territorialização.","longitudinalidade do cuidado."],4,"Longitudinalidade é o acompanhamento contínuo ao longo do tempo."],["A equipe mínima da Estratégia Saúde da Família é composta por",["médico, psicólogo e assistente social.","enfermeiro e farmacêutico.","médico, enfermeiro, auxiliar ou técnico de enfermagem e agente comunitário de saúde.","médico especialista, fisioterapeuta e nutricionista.","agente comunitário de saúde e dentista apenas."],2,"Médico, enfermeiro, auxiliar/técnico de enfermagem e ACS."],["Segundo a Portaria nº 4.279/2010, as Redes de Atenção à Saúde são",["consórcios intermunicipais.","sistemas de informação do Ministério da Saúde.","redes de hospitais privados conveniados.","arranjos organizativos de ações e serviços de saúde, de diferentes densidades tecnológicas, que, integradas por sistemas de apoio técnico, logístico e de gestão, buscam garantir a integralidade do cuidado.","estruturas piramidais rígidas, centradas no hospital."],3,"Definição da Portaria 4.279/2010. A organização é poliárquica, não piramidal."],["O instrumento de planejamento que operacionaliza as intenções do Plano de Saúde a cada ano é a",["Relação Nacional de Medicamentos (RENAME).","Lei Orçamentária da União.","Programação Anual de Saúde (PAS).","Relação Nacional de Ações e Serviços (RENASES).","Carta dos Direitos dos Usuários."],2,"A PAS detalha, a cada ano, o que o Plano de Saúde de 4 anos prevê."],["NÃO é princípio da Carta dos Direitos dos Usuários da Saúde:",["comprometimento dos gestores para o cumprimento dos princípios.","atendimento prioritário a quem possui plano de saúde privado.","tratamento adequado e efetivo para o problema de saúde.","atendimento humanizado, acolhedor e livre de discriminação.","acesso ordenado e organizado aos sistemas de saúde."],1,"Não há prioridade para quem tem plano privado. As demais estão entre os seis princípios."],["São redes temáticas prioritárias da Rede de Atenção à Saúde:",["rede materna e infantil, urgência e emergência, atenção psicossocial, cuidados à pessoa com deficiência e atenção às doenças crônicas.","rede de farmácias privadas.","rede bancária, rede escolar e rede hoteleira.","apenas a rede de urgência.","rede de laboratórios particulares."],0,"São as cinco redes prioritárias definidas a partir de 2011."]]},{"id":"A01","m":"amp","t":"História do Amapá I: povos originários, colonização e disputa com a França","ed":["H1","H2","H3"],"v":[["PYHhPJLsn_4","História do Amapá: grandes navegações e colonização"],["RJwHTahBQDQ","História do Amapá (concurso SEED/AP)"]],"obj":["Reconhecer os povos e culturas originárias do território","Ordenar os marcos da colonização portuguesa","Explicar o Contestado franco-brasileiro e o Laudo Suíço","Conhecer o papel de Cabralzinho e do Barão do Rio Branco"],"s":[["Antes dos europeus",["O território do Amapá é habitado há milhares de anos. A arqueologia registra culturas importantes:",{"l":["**Cultura Maracá**: urnas funerárias de cerâmica em forma humana, encontradas em grutas da região do rio Maracá (Mazagão).","**Cultura Cunani** e **cultura Aristé**: cerâmicas decoradas do norte do estado.","**Sítio do Rego Grande**, em Calçoene: blocos de pedra alinhados, interpretados como observatório astronômico indígena, chamado de “Stonehenge da Amazônia”."]},"Hoje vivem no Amapá povos como **Wajãpi**, **Karipuna**, **Palikur**, **Galibi Marworno**, **Galibi Kali’na**, **Tiriyó**, **Kaxuyana**, **Aparai** e **Wayana**."]],["A colonização",[{"t":[["Quando","O que aconteceu"],["1500","O navegador espanhol Vicente Yáñez Pinzón passa pela foz do Amazonas; o Oiapoque chegou a ser chamado de rio de Vicente Pinzón"],["Século XVII","Ingleses, holandeses, irlandeses e franceses montam feitorias e fortes na região; os portugueses os expulsam"],["1637","Criação da Capitania do Cabo Norte, doada a Bento Maciel Parente"],["1713","Tratado de Utrecht: a França reconhece o limite no rio “Japoc ou Vicente Pinzón”; a dúvida sobre qual rio era esse alimenta a disputa"],["1751","Chegada de famílias açorianas para povoar Macapá"],["1758","Mendonça Furtado, governador do Grão-Pará e irmão do Marquês de Pombal, eleva o povoado a **Vila de São José de Macapá** (4 de fevereiro, aniversário da cidade)"],["1764–1782","Construção da **Fortaleza de São José de Macapá**, com trabalho de indígenas e africanos escravizados; inaugurada em 19 de março de 1782"],["1770","Fundação de **Nova Mazagão** com famílias transferidas da praça portuguesa de Mazagão, no Marrocos"]]},"A presença africana, trazida pela escravidão para as obras e a agricultura, está na origem das comunidades quilombolas e de manifestações como o **Marabaixo**."]],["O Contestado franco-brasileiro",["França e Brasil disputaram a área entre os rios **Oiapoque** e **Araguari**. A França afirmava que o “rio de Vicente Pinzón” do Tratado de Utrecht era mais ao sul; o Brasil defendia que era o Oiapoque.",{"l":["Em **1886**, aventureiros franceses proclamaram a chamada **República do Cunani**, sem reconhecimento oficial.","A descoberta de **ouro no Calçoene**, por volta de 1893, aumentou a tensão.","Em dezembro de 1894 formou-se em Amapá um **triunvirato** de governo local, do qual fazia parte **Francisco Xavier da Veiga Cabral, o Cabralzinho**.","Em **15 de maio de 1895**, tropas francesas vindas de Caiena atacaram a **Vila do Espírito Santo do Amapá**. Houve mortes e incêndio; o capitão francês Lunier morreu no confronto. Cabralzinho se tornou herói local."]},{"lei":"Em 1º de dezembro de 1900, o laudo arbitral do presidente da Suíça, Walter Hauser, fixou o rio Oiapoque como fronteira entre o Brasil e a Guiana Francesa. O Brasil foi defendido pelo Barão do Rio Branco.","f":"LAUDO SUÍÇO (1900)"},"Com a vitória, a área foi incorporada ao **Pará**. Em 1901 foi criado o Território do Aricari para administrar a região.",{"a":"Datas-chave: **1713** (Utrecht), **1895** (ataque francês, Cabralzinho), **1900** (Laudo Suíço, Barão do Rio Branco, fronteira no Oiapoque)."}]]],"r":["Culturas arqueológicas: Maracá (urnas antropomorfas), Cunani, Aristé; Rego Grande (Calçoene).","Povos atuais: Wajãpi, Karipuna, Palikur, Galibi Marworno, Galibi Kali’na, Tiriyó, entre outros.","1637: Capitania do Cabo Norte (Bento Maciel Parente).","1751: açorianos; 1758: Vila de São José de Macapá (Mendonça Furtado), 4 de fevereiro.","Fortaleza: 1764–1782 (inaugurada em 19/3/1782). Nova Mazagão: 1770, famílias do Marrocos.","Contestado: 1713 Utrecht; 1886 Cunani; ouro no Calçoene; 15/5/1895 ataque francês e Cabralzinho; 1º/12/1900 Laudo Suíço (Walter Hauser, Barão do Rio Branco)."],"q":[["As urnas funerárias de cerâmica com forma humana, encontradas em grutas da região de Mazagão, estão associadas à",["cultura Marajoara.","cultura Maracá.","cultura Tapajônica.","cultura Guarani.","cultura Santarém."],1,"As urnas antropomorfas do rio Maracá caracterizam a cultura Maracá, no Amapá."],["O sítio arqueológico de Calçoene, formado por blocos de pedra alinhados e interpretado como observatório astronômico indígena, é o",["Sítio do Curiaú.","Marco Zero.","Sítio da Pedra do Guindaste.","Forte de Cumaú.","Sítio do Rego Grande."],4,"É o sítio do Rego Grande, apelidado de “Stonehenge da Amazônia”."],["Em 1758, o povoado de Macapá foi elevado à condição de vila por",["Barão do Rio Branco.","Francisco Xavier de Mendonça Furtado.","Janary Nunes.","Cabralzinho.","Bento Maciel Parente."],1,"Mendonça Furtado, governador do Grão-Pará e Maranhão, criou a Vila de São José de Macapá em 1758."],["A Fortaleza de São José de Macapá foi",["construída pelos franceses em 1895.","erguida após o Laudo Suíço, em 1900.","construída pelos holandeses no século XVII.","iniciada em 1764 e inaugurada em 1782.","inaugurada em 1943, junto com o Território Federal."],3,"As obras começaram em 29 de junho de 1764 e a inauguração foi em 19 de março de 1782."],["A fundação de Nova Mazagão, em 1770, está ligada",["à criação do Território Federal.","à chegada de imigrantes japoneses.","à exploração do manganês.","à transferência de famílias da praça portuguesa de Mazagão, no Marrocos.","à corrida do ouro no Calçoene."],3,"Famílias da praça de Mazagão, no norte da África, foram transferidas para o Amapá."],["O conflito conhecido como Contestado franco-brasileiro envolveu a disputa pela área entre os rios",["Oiapoque e Araguari.","Calçoene e Cassiporé, apenas.","Amazonas e Jari.","Matapi e Vila Nova.","Jari e Paru."],0,"A disputa era sobre a faixa entre o Oiapoque e o Araguari."],["Sobre o episódio de 15 de maio de 1895, é correto afirmar que",["tropas francesas atacaram a Vila do Espírito Santo do Amapá, e Cabralzinho liderou a resistência.","foi assinado o Tratado de Utrecht.","tropas brasileiras invadiram Caiena.","foi descoberto o manganês da Serra do Navio.","a capital do Território foi transferida para Macapá."],0,"Em 15/5/1895 tropas francesas atacaram a vila do Amapá; Cabralzinho tornou-se herói da resistência."],["O Laudo Suíço, de 1º de dezembro de 1900,",["criou o Território Federal do Amapá.","foi decidido pelo rei de Portugal.","fixou o rio Oiapoque como fronteira, em favor do Brasil, que foi defendido pelo Barão do Rio Branco.","deu à França a área até o rio Araguari.","dividiu a região entre Brasil, França e Holanda."],2,"O árbitro foi o presidente suíço Walter Hauser; o Barão do Rio Branco defendeu o Brasil e a fronteira ficou no Oiapoque."]]},{"id":"A02","m":"amp","t":"História do Amapá II: economia, Cabanagem, Território Federal e Estado","ed":["H4","H5","H6"],"v":[["RMyRCJZDx6g","Cabanagem no Amapá (história do Amapá)"],["OXYNTiGnydY","Documentário ICOMI (1992): Serra do Navio"]],"obj":["Conhecer as atividades econômicas dos séculos XIX e XX","Situar a Cabanagem no contexto do Grão-Pará","Ordenar os fatos da criação do Território Federal","Explicar a era do manganês e a transformação em Estado"],"s":[["A Cabanagem (1835–1840)",["A **Cabanagem** foi a grande revolta popular do **Grão-Pará** no período regencial. Reuniu indígenas, negros, mestiços pobres, chamados de **cabanos** por morarem em cabanas à beira dos rios, e parte da elite local, contra o governo e as condições de miséria.",{"l":["Os cabanos chegaram a tomar Belém e governar a província.","A repressão foi violenta: estima-se que dezenas de milhares de pessoas morreram, uma parte enorme da população da província.","A região do atual Amapá fazia parte do Grão-Pará. Em relato oficial de 1838, o presidente da província citou a **praça militar de Macapá** entre as localidades que escaparam da destruição causada pelo conflito."]}]],["Economia nos séculos XIX e XX",[{"l":["**Drogas do sertão**, gado e cacau movimentavam a economia colonial e imperial.","**Ouro do Calçoene** (década de 1890): atraiu garimpeiros e acirrou o Contestado.","**Borracha e castanha** no vale do Jari, no fim do século XIX e início do XX.","**Manganês da Serra do Navio** (a partir de 1945), o grande ciclo econômico do Território.","**Projeto Jari** (1967), do empresário norte-americano Daniel Ludwig, voltado à celulose, na divisa com o Pará."]}]],["O Território Federal do Amapá",[{"t":[["Data","Fato"],["13/9/1943","**Decreto-Lei 5.812**, de Getúlio Vargas, cria o Território Federal do Amapá, desmembrado do Pará, durante a Segunda Guerra Mundial. No mesmo ato surgiram outros territórios de fronteira"],["21/9/1943","A cidade de **Amapá** é escolhida como capital"],["25/1/1944","**Janary Nunes** assume como primeiro governador"],["31/5/1944","**Decreto-Lei 6.550** transfere a capital para **Macapá**"]]},"A criação dos territórios fazia parte da política de Vargas de **ocupar e defender as fronteiras** e integrar a Amazônia. Janary Nunes investiu na estrutura urbana de Macapá, em escolas e saúde."]],["A era do manganês",[{"l":["Em **1945**, foram identificadas jazidas de manganês em **Serra do Navio**.","Em 1947, a concessão foi dada à **ICOMI** (Indústria e Comércio de Minérios), associada ao capital norte-americano.","Em **1957** foi inaugurada a **Estrada de Ferro do Amapá**, com cerca de 194 km, ligando Serra do Navio ao **porto de Santana**, e começou a exportação.","A ICOMI construiu as vilas operárias de **Serra do Navio** e **Vila Amazonas** (Santana).","A exploração terminou em **1997**, com o esgotamento das jazidas, deixando passivos ambientais."]},"Em 1975 entrou em operação a **Usina Hidrelétrica Coaracy Nunes**, no rio Araguari, em Ferreira Gomes, a primeira hidrelétrica da Amazônia."]],["De Território a Estado",[{"l":["A **Constituição de 5 de outubro de 1988** transformou o Território do Amapá em **Estado** (ADCT, art. 14).","O Estado foi instalado em **1º de janeiro de 1991**, com o primeiro governador eleito, **Annibal Barcellos**.","Em 1991 foi criada a **Área de Livre Comércio de Macapá e Santana (ALCMS)**, e em 1990 a **Universidade Federal do Amapá (Unifap)**."]},{"a":"Não confunda as capitais: o Território começou com a capital em **Amapá** (1943) e mudou para **Macapá** em 1944."}]]],"r":["Cabanagem (1835–1840): revolta popular no Grão-Pará; repressão violenta; Macapá citada entre as localidades que escaparam da destruição.","Economia: drogas do sertão, gado, cacau, ouro do Calçoene, borracha e castanha (Jari), manganês, Projeto Jari (1967).","13/9/1943: Território (Decreto-Lei 5.812, Vargas, Segunda Guerra). Capital em Amapá; Janary Nunes governador (1944); capital em Macapá (Decreto-Lei 6.550, 31/5/1944).","Manganês: 1945 Serra do Navio; ICOMI; Estrada de Ferro do Amapá e exportação em 1957; fim em 1997.","1988: Estado pela Constituição; instalação em 1º/1/1991 com Annibal Barcellos."],"q":[["A Cabanagem foi",["uma revolta popular no Grão-Pará, no período regencial, que reuniu indígenas, negros e mestiços pobres.","um movimento pela independência do Amapá.","uma revolta de fazendeiros paulistas contra o Império.","um ciclo econômico da borracha.","uma guerra entre Brasil e França."],0,"Cabanagem (1835–1840): revolta popular no Grão-Pará, região que incluía o atual Amapá."],["O Território Federal do Amapá foi criado em",["1900, após o Laudo Suíço.","1943, pelo Decreto-Lei nº 5.812, durante o governo de Getúlio Vargas.","1991, com a instalação do Estado.","1758, por Mendonça Furtado.","1988, pela Constituição Federal."],1,"13 de setembro de 1943, Decreto-Lei 5.812."],["O primeiro governador do Território Federal do Amapá foi",["Daniel Ludwig.","Annibal Barcellos.","Janary Gentil Nunes.","Barão do Rio Branco.","Cabralzinho."],2,"Janary Nunes assumiu em 25 de janeiro de 1944."],["A capital do Território Federal do Amapá foi transferida para Macapá em",["1988, com a Constituição.","1943, no mesmo decreto de criação.","1944, pelo Decreto-Lei nº 6.550.","1991, com a instalação do Estado.","1957, com a inauguração da ferrovia."],2,"A primeira capital foi a cidade de Amapá; a mudança para Macapá veio em 31/5/1944."],["A exploração do manganês na Serra do Navio, a partir da década de 1950, esteve ligada à empresa",["Jari Celulose.","Vale do Rio Doce, desde o início.","Petrobras.","ICOMI.","Eletronorte."],3,"A ICOMI recebeu a concessão e operou a mina e a ferrovia até 1997."],["A Estrada de Ferro do Amapá, inaugurada em 1957, ligava",["Macapá a Oiapoque.","Amapá a Calçoene.","Laranjal do Jari a Macapá.","Serra do Navio ao porto de Santana.","Mazagão a Santana."],3,"A ferrovia levava o minério de Serra do Navio ao porto de Santana."],["O Amapá foi transformado em Estado",["pelo Laudo Suíço de 1900.","por plebiscito em 1995.","pelo Decreto-Lei nº 5.812/1943.","pela Lei Complementar nº 141/2012.","pela Constituição Federal de 1988, sendo instalado em 1º de janeiro de 1991."],4,"A Constituição de 1988 transformou os territórios de Amapá e Roraima em Estados; a instalação foi em 1991."],["A primeira usina hidrelétrica da Amazônia, em operação desde 1975 no rio Araguari, é a",["UHE Santo Antônio do Jari.","UHE Coaracy Nunes.","UHE Cachoeira Caldeirão.","UHE Tucuruí.","UHE Belo Monte."],1,"Coaracy Nunes (Paredão), em Ferreira Gomes, foi a pioneira na Amazônia."]]},{"id":"A03","m":"amp","t":"Cultura, patrimônio e o Amapá no século XXI","ed":["H7","H8","H9","G14"],"v":[["mRYlsakqEgk","Marabaixo: tradição do Amapá"],["2tmtyjzq4gI","Batuque e Marabaixo: uma ciranda cultural"]],"obj":["Reconhecer as manifestações culturais amapaenses","Identificar o patrimônio material e imaterial, com destaque para Macapá","Relacionar cultura e sincretismo religioso","Acompanhar temas atuais do Amapá"],"s":[["Manifestações populares e sincretismo",[{"t":[["Manifestação","Como é"],["**Marabaixo**","Manifestação afro-amapaense de dança, canto e religiosidade. Os tambores se chamam **caixas**, os versos cantados são os **ladrões**, as mulheres dançam com saias rodadas, e se serve a **gengibirra**. Acontece no ciclo religioso do **Divino Espírito Santo** e da **Santíssima Trindade**, depois da Páscoa, com força nos bairros do **Laguinho** e de **Santa Rita** em Macapá. Foi registrado como **Patrimônio Cultural do Brasil** pelo Iphan em 2018"],["**Batuque**","Dança afro-brasileira de tambores, muito presente em comunidades rurais e quilombolas, como o **Curiaú**, ligada às festas de santos"],["**Festa de São Tiago**","Em **Mazagão Velho**, em julho: encenação da batalha entre **cristãos e mouros**, herança dos colonos vindos do Marrocos"],["**Círio de Nazaré**","Procissão católica em Macapá, em outubro"]]},"O **sincretismo** aparece na mistura de devoção católica (santos, novenas, procissões) com tradições africanas e indígenas (tambores, danças, comidas).",{"l":["**Arte Kusiwa**: pintura corporal e arte gráfica do povo **Wajãpi**, registrada como patrimônio imaterial brasileiro e reconhecida pela Unesco.","Culinária: açaí, tacacá, maniçoba, camarão no bafo, peixes como o pirarucu."]}]],["Patrimônio material, com destaque para Macapá",[{"l":["**Fortaleza de São José de Macapá** (1764–1782), tombada pelo Iphan em 1950, a maior fortificação do período colonial no Brasil, que nunca participou de combate.","**Igreja de São José de Macapá** (1761), uma das construções mais antigas da cidade.","**Marco Zero do Equador**: Macapá é a **única capital brasileira cortada pela Linha do Equador**. O estádio **Zerão** tem a linha passando pelo meio do campo.","**Pedra do Guindaste**, no rio Amazonas, em frente à cidade, com a imagem de São José.","**Museu Sacaca** e **Trapiche Eliezer Levy**.","Sítio arqueológico do **Rego Grande**, em Calçoene."]}]],["O Amapá no século XXI",[{"l":["**Ponte binacional** sobre o rio Oiapoque, ligando o Brasil à Guiana Francesa, concluída na década de 2010 e aberta ao tráfego em 2017.","Conexão ao Sistema Interligado Nacional de energia (Linhão de Tucuruí) em 2015.","**Apagão de novembro de 2020**: um incêndio numa subestação em Macapá deixou a maior parte do estado sem energia por cerca de três semanas.","Novas hidrelétricas no Araguari (Ferreira Gomes e Cachoeira Caldeirão) e no Jari (Santo Antônio do Jari).","**Petróleo na Foz do Amazonas**: em 2025, o Ibama autorizou a Petrobras a perfurar um poço exploratório na costa do Amapá, tema que opõe expectativa de desenvolvimento e preocupação ambiental.","Grande parte do território está em **unidades de conservação e terras indígenas**, tornando o Amapá um dos estados mais preservados do país."]},{"a":"Questões de atualidades costumam cobrar o apagão de 2020, a ponte binacional e a exploração de petróleo na Margem Equatorial. Acompanhe as notícias até a prova."}]]],"r":["Marabaixo: caixas, ladrões, saias rodadas, gengibirra; Divino e Santíssima Trindade; Laguinho e Santa Rita; patrimônio do Brasil (Iphan, 2018).","Batuque: tambores, comunidades quilombolas como o Curiaú.","São Tiago (Mazagão Velho, julho): cristãos × mouros.","Kusiwa: arte gráfica Wajãpi, patrimônio imaterial.","Fortaleza (tombada em 1950), Igreja de São José, Marco Zero, Pedra do Guindaste.","Macapá: única capital cortada pela Linha do Equador.","Século XXI: ponte do Oiapoque (2017), apagão de 2020, hidrelétricas, petróleo na Foz do Amazonas."],"q":[["A manifestação cultural afro-amapaense em que os tambores são chamados de “caixas”, os versos cantados de “ladrões” e se serve a gengibirra é o",["Boi-Bumbá.","Frevo.","Carimbó.","Sairé.","Marabaixo."],4,"Essas são marcas do Marabaixo, patrimônio cultural do Brasil."],["O Marabaixo está tradicionalmente ligado ao ciclo religioso",["do Natal.","de São João, em junho.","de Nossa Senhora Aparecida, em outubro.","do Divino Espírito Santo e da Santíssima Trindade, após a Páscoa.","do Carnaval."],3,"O ciclo do Marabaixo acompanha as festas do Divino e da Santíssima Trindade."],["A Festa de São Tiago, em Mazagão Velho, é conhecida pela encenação",["da batalha entre cristãos e mouros.","da construção da Fortaleza.","da criação do Território.","do ataque francês de 1895.","da chegada dos açorianos."],0,"A encenação remete à origem marroquina dos colonos de Mazagão."],["A arte gráfica e pintura corporal Kusiwa, reconhecida como patrimônio imaterial, pertence ao povo",["Galibi Marworno.","Karipuna.","Wajãpi.","Palikur.","Tiriyó."],2,"Kusiwa é a arte gráfica dos Wajãpi."],["Macapá é a única capital brasileira",["sem acesso por rio.","situada no litoral atlântico.","cortada pela Linha do Equador.","localizada no Hemisfério Sul.","que faz fronteira com a Venezuela."],2,"A Linha do Equador passa por Macapá, marcada pelo Marco Zero."],["A Fortaleza de São José de Macapá foi tombada pelo Iphan em",["1782.","1900.","1950.","1988.","2018."],2,"O tombamento é de 1950. 2018 é o ano do registro do Marabaixo."],["O apagão que deixou a maior parte do Amapá sem energia por cerca de três semanas ocorreu em",["2013.","2015.","2017.","2020.","2025."],3,"Foi em novembro de 2020, após incêndio numa subestação em Macapá."],["A ponte binacional sobre o rio Oiapoque liga o Brasil",["à Guiana Francesa.","à Guiana (ex-inglesa).","à Venezuela.","à ilha de Marajó.","ao Suriname."],0,"A ponte liga Oiapoque a Saint-Georges, na Guiana Francesa."]]},{"id":"A04","m":"amp","t":"Geografia do Amapá I: localização e espaço natural","ed":["G1","G4","G5","G6","G9","G10","G11"],"v":[["UTlwB8PaQKg","Revisão de Geografia do Amapá (Prof. Rodrigo Bandeira)"],["cEgl7WlG6N4","Geografia do Amapá: o clima amapaense"]],"obj":["Localizar o Amapá e seus limites","Caracterizar relevo, clima, vegetação e hidrografia","Conhecer as principais unidades de conservação","Relacionar recursos energéticos e sustentabilidade"],"s":[["Localização e limites",[{"t":[["Direção","Limite"],["Norte","Guiana Francesa (rio Oiapoque)"],["Noroeste","Suriname"],["Oeste e sul","Pará (o rio Jari marca boa parte da divisa)"],["Leste","Oceano Atlântico"],["Sudeste","Foz do rio Amazonas"]]},{"l":["Área de cerca de **142 mil km²**, com **16 municípios**.","Está quase todo no **Hemisfério Norte**; a Linha do Equador cruza Macapá.","É o **único estado brasileiro que faz fronteira com a Guiana Francesa**.","Fica na Região Norte e na Amazônia Legal."]},"**Cartografia e geotecnologias**: mapas, imagens de satélite, GPS e sistemas de informação geográfica são usados para monitorar desmatamento, garimpo e queimadas, e para planejar o território."]],["Relevo, clima e vegetação",[{"l":["**Relevo**: a leste, **planície costeira** baixa e alagável; a oeste, terrenos mais altos do **Planalto das Guianas** (escudo antigo), com a **Serra do Tumucumaque** na divisa com o Suriname e a Guiana Francesa.","**Clima**: **equatorial**, quente e úmido, com chuvas intensas no primeiro semestre (o “inverno amazônico”) e período mais seco no segundo semestre. As mudanças climáticas aumentam o risco de eventos extremos, como secas e cheias."]},{"t":[["Formação","Onde aparece"],["Floresta amazônica de terra firme","Maior parte do território, sobretudo no centro-oeste"],["Cerrado (savanas) amapaense","Faixa central e leste, entre Macapá e o norte do estado"],["Campos inundáveis e várzeas","Região dos lagos e áreas próximas ao litoral"],["Manguezais","Litoral, com destaque para a costa norte"]]}]],["Hidrografia",[{"l":["**Rio Amazonas**: banha Macapá e Santana na foz.","**Rio Oiapoque**: fronteira com a Guiana Francesa.","**Rio Jari**: divisa com o Pará.","**Rio Araguari**: um dos maiores do estado; recebe hidrelétricas. Sua famosa **pororoca** praticamente desapareceu na década de 2010, por mudanças no curso do rio.","Outros: Calçoene, Cassiporé, Cunani, Matapi, Vila Nova, Amapari."]}]],["Unidades de conservação e energia",[{"l":["**Parque Nacional Montanhas do Tumucumaque** (2002): o **maior parque nacional do Brasil**, no oeste do estado.","**Parque Nacional do Cabo Orange**, no litoral norte.","**Reserva Biológica do Lago Piratuba** e **Estação Ecológica de Maracá-Jipioca**.","**Floresta Nacional do Amapá** e **Floresta Estadual do Amapá**.","**Reserva Extrativista do Rio Cajari** e **RDS do Rio Iratapuru**, com populações tradicionais.","**APA do Rio Curiaú**, em Macapá, ligada à comunidade quilombola."]},"Somando unidades de conservação e terras indígenas, a maior parte do território está protegida. A **sustentabilidade** envolve conciliar essa proteção com o extrativismo (açaí, castanha), o turismo e a geração de renda.","**Recursos energéticos**: o estado depende principalmente de **hidrelétricas**: Coaracy Nunes, Ferreira Gomes e Cachoeira Caldeirão (rio Araguari) e Santo Antônio do Jari (rio Jari). Desde 2015 está ligado ao Sistema Interligado Nacional."]]],"r":["Limites: Guiana Francesa (N, rio Oiapoque), Suriname (NO), Pará (O e S, rio Jari), Atlântico (L), foz do Amazonas (SE).","Cerca de 142 mil km², 16 municípios; quase todo no Hemisfério Norte; único estado na fronteira com a Guiana Francesa.","Relevo: planície costeira a leste; Planalto das Guianas e Serra do Tumucumaque a oeste.","Clima equatorial; chuvas no 1º semestre.","Vegetação: floresta de terra firme, cerrado, campos inundáveis, manguezais.","Rios: Amazonas, Oiapoque, Jari, Araguari (pororoca desapareceu).","Tumucumaque (2002): maior parque nacional do Brasil. Cabo Orange, Lago Piratuba, Rio Cajari, Iratapuru, APA do Curiaú.","Energia: hidrelétricas no Araguari e no Jari; SIN desde 2015."],"q":[["O Amapá faz fronteira, ao norte, com",["a Venezuela.","a Guiana, pelo rio Amazonas.","o Suriname, pelo rio Jari.","a Guiana Francesa, pelo rio Oiapoque.","o Pará, pelo rio Oiapoque."],3,"Ao norte, a fronteira com a Guiana Francesa é marcada pelo rio Oiapoque."],["O rio que marca grande parte da divisa entre o Amapá e o Pará é o",["Oiapoque.","Calçoene.","Matapi.","Jari.","Araguari."],3,"O rio Jari separa o Amapá do Pará em boa parte da divisa."],["Sobre a localização do Amapá, é correto afirmar que",["tem mais de 50 municípios.","não possui litoral.","é o único estado brasileiro que faz fronteira com a Guiana Francesa.","está totalmente no Hemisfério Sul.","faz fronteira com a Bolívia."],2,"O Amapá é o único estado na fronteira com a Guiana Francesa e tem 16 municípios."],["O clima predominante no Amapá é",["temperado.","equatorial, quente e úmido.","tropical de altitude.","semiárido.","subtropical."],1,"Clima equatorial, com chuvas concentradas no primeiro semestre."],["A formação vegetal que ocupa a maior parte do território amapaense é",["a floresta amazônica de terra firme.","o pampa.","a mata de araucárias.","a caatinga.","a restinga."],0,"A floresta de terra firme predomina; há também cerrado, campos inundáveis e manguezais."],["O maior parque nacional do Brasil, criado em 2002 e localizado no Amapá, é o",["Parque Nacional Montanhas do Tumucumaque.","Parque Nacional do Jaú.","Parque Nacional da Amazônia.","Parque Nacional do Cabo Orange.","Parque Nacional da Serra do Divisor."],0,"O Tumucumaque é o maior parque nacional do país."],["O fenômeno da pororoca, que deixou de ocorrer de forma expressiva na década de 2010 devido a mudanças no curso do rio, era famoso no rio",["Oiapoque.","Matapi.","Amazonas, em Macapá.","Jari.","Araguari."],4,"A pororoca do Araguari praticamente desapareceu por mudanças no rio."],["A Usina Hidrelétrica Santo Antônio do Jari e as usinas Ferreira Gomes e Cachoeira Caldeirão evidenciam que a matriz energética do Amapá se baseia principalmente em",["energia solar.","hidrelétricas.","termelétricas a carvão.","usinas eólicas.","usinas nucleares."],1,"O estado depende principalmente de hidrelétricas nos rios Araguari e Jari."]]},{"id":"A05","m":"amp","t":"Geografia do Amapá II: população, economia, povos e conflitos","ed":["G2","G3","G7","G8","G12","G13","G15","G16","G17","G18","G19"],"v":[["8NhCZP6SjA8","Questões de História e Geografia do Amapá"],["vtaZBV0X4ns","Reta final: História e Geografia do Amapá"]],"obj":["Conhecer números da população e da urbanização","Caracterizar a economia do estado","Localizar povos indígenas e comunidades quilombolas","Identificar conflitos socioambientais e a questão fundiária"],"s":[["População e urbanização",[{"t":[["Indicador (Censo 2022, IBGE)","Valor"],["População do Amapá","733.759 habitantes"],["Macapá","442.933 habitantes"],["Santana","107.618 habitantes"],["Laranjal do Jari","35.114 habitantes"],["Oiapoque","27.482 habitantes"],["Município menos populoso","Pracuúba, com 3.803 habitantes"]]},{"l":["O Amapá é o **segundo estado menos populoso** do Brasil (só Roraima tem menos habitantes).","A **densidade demográfica é baixa**, em torno de 5 habitantes por km².","A população é muito **concentrada**: Macapá e Santana somam cerca de **três quartos** dos habitantes.","A **urbanização** é alta e foi rápida, impulsionada pelo Território, pelo manganês e pela migração, com crescimento de áreas de ocupação em zonas alagadas (as **ressacas**) em Macapá."]}]],["Aspectos políticos e economia",[{"l":["Capital: **Macapá**. O estado tem 16 municípios.","Grande peso do **setor público** e do **comércio e serviços**.","**Área de Livre Comércio de Macapá e Santana (ALCMS)**, criada em 1991.","**Mineração**: ouro, ferro e, no passado, manganês. Garimpo ilegal é um problema.","**Extrativismo**: açaí, castanha-do-brasil, madeira; pesca.","**Agronegócio**: expansão da soja em áreas de cerrado.","**Porto de Santana**: principal porto, à margem do Amazonas.","**Energia**: hidrelétricas; e debate sobre **petróleo na Foz do Amazonas**."]},"O Amapá ainda depende muito de **transferências federais** e tem o desafio de gerar desenvolvimento conciliado com a conservação da floresta."]],["Povos indígenas e quilombolas",[{"t":[["Povos","Terras indígenas (região)"],["Karipuna, Palikur, Galibi Marworno, Galibi Kali’na","Uaçá, Juminã e Galibi (Oiapoque)"],["Wajãpi","Terra Indígena Wajãpi (Pedra Branca do Amapari e Laranjal do Jari)"],["Tiriyó, Kaxuyana, Aparai, Wayana","Parque do Tumucumaque e Rio Paru d’Este (divisa com o Pará)"]]},"**Comunidades quilombolas** estão espalhadas pelo estado, como o **Curiaú** (Macapá), Mel da Pedreira, Conceição do Macacoari e Lagoa dos Índios. Elas preservam o Batuque, o Marabaixo e modos de vida ligados à terra e aos rios. A titulação de seus territórios é uma luta histórica."]],["Conflitos socioambientais e reforma agrária",[{"l":["**Garimpo ilegal**, com contaminação por mercúrio, especialmente no norte (Oiapoque, Calçoene).","**Hidrelétricas** no Araguari: impactos sobre pesca e comunidades ribeirinhas.","**Petróleo na Foz do Amazonas**: risco a manguezais e à pesca × geração de royalties e empregos.","**Expansão da soja** no cerrado e pressão sobre territórios tradicionais.","**Questão fundiária**: grande parte das terras pertenceu à União no período do Território; a regularização fundiária e os **assentamentos de reforma agrária** do Incra são temas centrais no campo."]}]],["O Amapá no contexto brasileiro",["É um estado jovem (instalado em 1991), de fronteira internacional, com baixa população, alta preservação ambiental e posição estratégica na foz do Amazonas e na Margem Equatorial."]]],"r":["Censo 2022: Amapá 733.759; Macapá 442.933; Santana 107.618; menor: Pracuúba.","Segundo estado menos populoso; baixa densidade; população concentrada em Macapá e Santana (cerca de 3/4).","Economia: setor público, comércio e serviços, ALCMS (1991), mineração, extrativismo, soja, porto de Santana.","Indígenas: povos do Oiapoque (Karipuna, Palikur, Galibi), Wajãpi, povos do Tumucumaque.","Quilombos: Curiaú, Mel da Pedreira, Conceição do Macacoari, Lagoa dos Índios.","Conflitos: garimpo, hidrelétricas, petróleo, soja, questão fundiária e reforma agrária."],"q":[["Segundo o Censo 2022 do IBGE, a população do Amapá era de aproximadamente",["1,5 milhão de habitantes.","733 mil habitantes.","450 mil habitantes.","300 mil habitantes.","2 milhões de habitantes."],1,"O Censo 2022 registrou 733.759 habitantes no Amapá."],["Em relação à distribuição da população amapaense, é correto afirmar que",["concentra-se fortemente em Macapá e Santana.","a maioria vive na zona rural.","está igualmente distribuída pelos 16 municípios.","Oiapoque é o município mais populoso.","a densidade demográfica é a maior do Norte."],0,"Macapá e Santana reúnem cerca de três quartos da população."],["O município menos populoso do Amapá, segundo o Censo 2022, é",["Serra do Navio.","Cutias.","Pracuúba.","Itaubal.","Amapá."],2,"Pracuúba tinha 3.803 habitantes."],["A Área de Livre Comércio criada em 1991 para estimular a economia do estado abrange os municípios de",["Laranjal do Jari e Vitória do Jari.","Oiapoque e Calçoene.","Mazagão e Porto Grande.","Serra do Navio e Pedra Branca do Amapari.","Macapá e Santana."],4,"É a Área de Livre Comércio de Macapá e Santana (ALCMS)."],["Os povos Karipuna, Palikur e Galibi Marworno vivem principalmente em terras indígenas localizadas no município de",["Santana.","Oiapoque.","Macapá.","Mazagão.","Laranjal do Jari."],1,"As TIs Uaçá, Juminã e Galibi ficam em Oiapoque."],["A comunidade quilombola localizada em Macapá, protegida por uma Área de Proteção Ambiental e conhecida pelo Batuque, é",["Vila Amazonas.","Santa Rita.","Cunani.","Curiaú.","Laguinho."],3,"O Curiaú fica em Macapá, na APA do Rio Curiaú. Laguinho e Santa Rita são bairros ligados ao Marabaixo."],["Um dos principais conflitos socioambientais no norte do Amapá, com contaminação dos rios por mercúrio, é causado",["pelo turismo ecológico.","pelo extrativismo do açaí.","pela pesca artesanal.","pela agricultura familiar.","pelo garimpo ilegal."],4,"O garimpo ilegal usa mercúrio e contamina rios e pessoas."],["Entre os estados brasileiros, o Amapá é o",["mais densamente povoado da Amazônia.","menos populoso do país.","único sem área urbana relevante.","segundo menos populoso do país, à frente apenas de Roraima.","mais populoso da Região Norte."],3,"Roraima é o menos populoso; o Amapá vem logo depois."]]},{"id":"I01","m":"inf","t":"Conceitos, hardware, periféricos e softwares utilitários","ed":["I1","I2","I3","I4"],"v":[["YrDLtdP4LI4","Informática para concursos: hardware, software e periféricos"],["BWHyFtCTtf0","Memória RAM, ROM e cache"]],"obj":["Diferenciar hardware, software e firmware","Conhecer processador e tipos de memória","Classificar periféricos","Reconhecer softwares utilitários"],"s":[["Hardware e software",[{"l":["**Hardware**: a parte física (processador, memória, teclado).","**Software**: os programas. **Sistema operacional** (Windows, Linux, Android) gerencia o computador; **aplicativos** fazem tarefas para o usuário; **utilitários** fazem manutenção e apoio.","**Firmware**: software gravado no hardware, como a **BIOS/UEFI** da placa-mãe.","**Software livre** permite usar, estudar, modificar e redistribuir (ex.: LibreOffice, Linux). Gratuito não é o mesmo que livre."]},"**Unidades**: 1 **byte** = 8 **bits**. Depois vêm KB, MB, GB e TB, cada um cerca de mil (1.024) vezes o anterior."]],["Processador e memórias",["O **processador (CPU)** executa as instruções. Tem a **Unidade de Controle (UC)**, que coordena, e a **Unidade Lógica e Aritmética (ULA)**, que faz os cálculos, além dos **registradores**.",{"t":[["Memória","Características"],["Registradores","Dentro da CPU; as mais rápidas e menores"],["Cache","Muito rápida, entre a CPU e a RAM; guarda dados usados com frequência"],["RAM","Memória principal; **volátil** (apaga sem energia); leitura e escrita; guarda o que está em uso"],["ROM","**Não volátil**; guarda o firmware (BIOS/UEFI); principalmente leitura"],["Secundária (de massa)","HD (magnético), SSD (memória flash, mais rápido), pendrive, cartão; guarda arquivos permanentemente"],["Memória virtual","Uso de parte do disco como extensão da RAM"]]},{"a":"Hierarquia: quanto mais perto da CPU, **mais rápida, menor e mais cara** por byte. RAM é volátil; ROM não."},"A **placa-mãe** conecta todos os componentes: soquete do processador, slots de memória e de expansão, chipset e o firmware."]],["Periféricos",[{"t":[["Tipo","Exemplos"],["Entrada","Teclado, mouse, scanner, microfone, webcam, leitor biométrico"],["Saída","Monitor, impressora, caixa de som, projetor"],["Entrada e saída (mistos)","Tela sensível ao toque, impressora multifuncional, headset com microfone, modem"],["Armazenamento","Pendrive, HD externo, cartão de memória (leitura e gravação)"]]},"Conexões comuns: **USB**, **HDMI** (vídeo e áudio), **Bluetooth** e **Wi-Fi** (sem fio)."]],["Softwares utilitários",[{"l":["**Compactadores**: reduzem e agrupam arquivos (formatos .zip, .rar, .7z; programas como 7-Zip e WinRAR).","**Antivírus**: detectam e removem códigos maliciosos.","**Limpeza e desfragmentação de disco**: a desfragmentação ajuda em HDs; em SSD não é recomendada.","**Backup**: cópias de segurança.","**Visualizadores**: de imagem, vídeo (VLC) e PDF.","**Comunicação**: e-mail (Outlook, Thunderbird), chat e videoconferência (WhatsApp, Teams, Meet, Zoom)."]}]]],"r":["Hardware: físico. Software: programas (SO, aplicativos, utilitários). Firmware: BIOS/UEFI.","Software livre: usar, estudar, modificar, redistribuir.","CPU: UC (controle), ULA (cálculos), registradores.","RAM volátil (principal); ROM não volátil (firmware); cache entre CPU e RAM.","Periféricos: entrada, saída, mistos (touchscreen, multifuncional) e armazenamento.","Utilitários: compactadores, antivírus, backup, limpeza, visualizadores."],"q":[["A memória principal do computador, volátil, que armazena temporariamente os programas e dados em uso, é a",["ROM.","memória flash do pendrive.","BIOS.","RAM.","HD."],3,"A RAM é a memória principal e volátil."],["O componente do processador responsável pelos cálculos aritméticos e pelas operações lógicas é a",["Unidade de Controle.","memória cache.","Unidade Lógica e Aritmética.","placa de vídeo.","fonte de alimentação."],2,"A ULA faz os cálculos; a UC coordena."],["A memória que armazena o firmware de inicialização do computador e não perde seu conteúdo quando o equipamento é desligado é a",["ROM.","RAM.","cache.","registrador.","memória virtual."],0,"A ROM é não volátil e guarda o firmware (BIOS/UEFI)."],["São exemplos de periféricos de entrada e saída (mistos):",["teclado e mouse.","tela sensível ao toque e impressora multifuncional.","scanner e microfone.","monitor e caixa de som.","projetor e impressora a laser."],1,"Tela sensível ao toque e multifuncional enviam e recebem dados."],["Um byte corresponde a",["2 bits.","4 bits.","8 bits.","16 bits.","1.024 bits."],2,"1 byte = 8 bits."],["Sobre software livre, é correto afirmar que",["permite ao usuário usar, estudar, modificar e redistribuir o programa.","não tem código-fonte disponível.","é sempre pago.","é sinônimo de freeware.","não pode ser instalado em computadores públicos."],0,"Essas são as liberdades do software livre. Freeware é gratuito, mas pode ser fechado."],["Os programas 7-Zip e WinRAR são exemplos de",["editores de texto.","compactadores de arquivos.","sistemas operacionais.","antivírus.","navegadores."],1,"Compactam e agrupam arquivos em formatos como .zip, .rar e .7z."],["Assinale a alternativa que ordena corretamente as memórias da mais rápida para a mais lenta.",["RAM, HD, cache, registradores.","HD, cache, RAM, registradores.","HD, RAM, cache, registradores.","Cache, registradores, HD, RAM.","Registradores, cache, RAM, HD."],4,"Registradores > cache > RAM > armazenamento secundário."]]},{"id":"I02","m":"inf","t":"Windows 10 e 11","ed":["I5"],"v":[["gGyyNiNuVdY","Informática para concursos: Windows 11 (Prof. Alan Souza)"],["9r5VY7ph37Y","Atalhos do Windows que caem em todo concurso"]],"obj":["Reconhecer as novidades do Windows 11","Usar o Explorador de Arquivos e a Lixeira","Dominar os atalhos mais cobrados","Entender copiar, mover e criar atalho com o mouse"],"s":[["O que mudou no Windows 11",[{"l":["**Menu Iniciar centralizado** na barra de tarefas (pode ser alinhado à esquerda).","**Configurações Rápidas**: rede, volume e bateria ficam num único botão; um clique abre o painel com Wi-Fi, Bluetooth, brilho e volume (**Win + A**).","Clicar na **data e hora** abre a **central de notificações** com o calendário (**Win + N**).","**Layouts de ajuste (Snap Layouts)** para organizar janelas (**Win + Z**).","**Widgets** (**Win + W**).","**Explorador de Arquivos com abas**.","O botão **Mostrar área de trabalho** continua no canto direito da barra."]},"No Windows 10, a **Central de Ações** (**Win + A**) reunia notificações e ações rápidas, e o menu Iniciar tinha **blocos dinâmicos**."]],["Explorador de Arquivos e Lixeira",[{"l":["**Win + E** abre o Explorador. Lá estão Este Computador, pastas, unidades e Rede.","Nomes de arquivos **não podem** conter: \\ / : * ? \" \u003c > |","Arquivos excluídos de unidades internas vão para a **Lixeira** e podem ser restaurados.","**Shift + Delete** exclui permanentemente, sem passar pela Lixeira.","Arquivos excluídos de **pendrive** ou da **rede** em geral não vão para a Lixeira.","Excluir um **atalho** não exclui o arquivo original."]},{"t":[["Ação com o mouse","Resultado"],["Arrastar na mesma unidade","Move"],["Arrastar para outra unidade","Copia"],["Ctrl + arrastar","Copia"],["Shift + arrastar","Move"],["Alt + arrastar","Cria atalho"]]}]],["Atalhos mais cobrados",[{"t":[["Atalho","Função"],["Ctrl + C / Ctrl + X / Ctrl + V","Copiar / recortar / colar"],["Ctrl + Z / Ctrl + Y","Desfazer / refazer"],["Ctrl + A","Selecionar tudo"],["F2","Renomear"],["F5","Atualizar"],["Alt + Tab","Alternar entre janelas"],["Alt + F4","Fechar a janela ativa"],["Win + D","Mostrar a área de trabalho"],["Win + E","Explorador de Arquivos"],["Win + L","Bloquear o computador"],["Win + I","Configurações"],["Win + R","Executar"],["Win + V","Histórico da área de transferência"],["Win + Shift + S","Captura de tela (Ferramenta de Captura)"],["Win + Tab","Visão de tarefas"],["Win + Ctrl + D","Nova área de trabalho virtual"],["Win + X","Menu de links rápidos"],["Ctrl + Shift + Esc","Gerenciador de Tarefas"]]}]]],"r":["Windows 11: Iniciar centralizado, Configurações Rápidas (Win+A), notificações e calendário (Win+N), Snap Layouts (Win+Z), widgets, Explorador com abas.","Lixeira: exclusões de unidades internas. Shift+Delete apaga de vez. Pendrive e rede não vão para a Lixeira.","Arrastar: mesma unidade move, outra unidade copia; Ctrl copia, Shift move, Alt cria atalho.","Win+D, Win+E, Win+L, Win+I, Win+R, Win+V, Win+Shift+S, Ctrl+Shift+Esc."],"q":[["No Windows 11, ao clicar com o botão esquerdo sobre os ícones de rede, volume e bateria na barra de tarefas,",["abre-se o painel de Configurações Rápidas, que permite ajustar conexões, volume e brilho.","nada acontece, pois os ícones são apenas informativos.","abre-se o Gerenciador de Tarefas.","o computador é bloqueado.","abre-se o Painel de Controle."],0,"No Windows 11 esses ícones foram unificados e abrem as Configurações Rápidas."],["O atalho que mostra a área de trabalho, minimizando todas as janelas, é",["Win + E.","Ctrl + Esc.","Alt + F4.","Win + D.","Win + L."],3,"Win + D mostra a área de trabalho. Win + L bloqueia; Win + E abre o Explorador."],["Para excluir um arquivo permanentemente, sem enviá-lo à Lixeira, utiliza-se",["Shift + Delete.","Alt + Delete.","Ctrl + Delete.","Delete.","F2."],0,"Shift + Delete exclui permanentemente."],["No Explorador de Arquivos, ao arrastar um arquivo com o mouse de uma pasta do disco C: para um pendrive, sem pressionar teclas, o arquivo será",["excluído.","copiado.","compactado.","movido.","renomeado."],1,"Entre unidades diferentes, arrastar copia. Na mesma unidade, move."],["O atalho do Windows que abre o histórico da área de transferência é",["Win + C.","Ctrl + V.","Ctrl + Shift + V.","Alt + V.","Win + V."],4,"Win + V mostra o histórico de itens copiados (se ativado)."],["Assinale a alternativa que apresenta um caractere NÃO permitido em nomes de arquivos no Windows.",["Número.","Parênteses ( ).","Ponto de interrogação (?).","S izar / localizar e substituir"],["Ctrl + Enter","Quebra de página"],["F7","Ortografia"],["Ctrl + F12","Inserir tabela"],["F5","Navegador"]]},{"a":"No LibreOffice o negrito é **Ctrl + B**; no Word em português é **Ctrl + N**. No LibreOffice, Ctrl + N cria um documento novo."},"Os **estilos** de título (Título 1, Título 2) permitem gerar **sumário automático**. O **Clonar formatação** (pincel) copia a formatação de um trecho para outro."]],["Calc: fórmulas e funções",["Toda fórmula começa com **=**. Os argumentos são separados por **;** e os intervalos por **:**.",{"t":[["Função","O que faz","Exemplo"],["SOMA","Soma valores","=SOMA(A1:A10)"],["MÉDIA","Média aritmética","=MÉDIA(B2:B8)"],["MÁXIMO / MÍNIMO","Maior / menor valor","=MÁXIMO(C1:C5)"],["CONT.NÚM","Conta células com números","=CONT.NÚM(A1:A20)"],["CONT.VALORES","Conta células não vazias","=CONT.VALORES(A1:A20)"],["CONT.SE","Conta células que atendem a um critério","=CONT.SE(B2:B31;\"Home Office\")"],["SOMASE","Soma conforme um critério","=SOMASE(A2:A10;\"Pago\";B2:B10)"],["SE","Teste lógico","=SE(A1>=30;\"Aprovada\";\"Reprovada\")"],["PROCV","Procura na primeira coluna e devolve outra coluna","=PROCV(E2;A2:C50;3;0)"],["HOJE / AGORA","Data atual / data e hora","=HOJE()"]]},{"l":["**Referência relativa** (A1) muda ao copiar a fórmula; **absoluta** ($A$1) não muda; **mista** ($A1 ou A$1) trava só a coluna ou só a linha.","No Calc, **Shift + F4** alterna os tipos de referência (no Excel é F4).","Referência a outra planilha no Calc usa ponto: **Planilha2.A1** (no Excel: Planilha2!A1).","**&** concatena textos. **^** é potência.","Erros: **#DIV/0!** (divisão por zero), **#NOME?** (nome de função errado), **#REF!** (referência inválida), **###** (coluna estreita)."]}]],["Impress",[{"l":["**Transição**: efeito na passagem de um slide para outro.","**Animação**: efeito aplicado a um objeto dentro do slide.","**F5** inicia a apresentação do primeiro slide; **Shift + F5**, do slide atual.","**Slide mestre** define o padrão visual de todos os slides.","Modos de exibição: Normal, Estrutura de tópicos, Notas e Classificador de slides."]}]]],"r":["Writer .odt, Calc .ods, Impress .odp; formato ODF; exporta PDF; abre arquivos do MS Office.","WPS: suíte gratuita compatível com o MS Office.","LibreOffice: Ctrl+B negrito, Ctrl+I itálico, Ctrl+U sublinhado, Ctrl+E centraliza, Ctrl+S salva.","Calc: = inicia fórmula; ; separa argumentos; : indica intervalo.","SOMA, MÉDIA, CONT.SE, SOMASE, SE, PROCV. Relativa × absoluta ($). Shift+F4 no Calc.","Transição (entre slides) × animação (objetos). F5 do início; Shift+F5 do atual."],"q":[["O formato padrão de arquivo do LibreOffice Writer é",[".odt.",".ods.",".odp.",".docx.",".txt."],0,"Writer salva em .odt; Calc em .ods; Impress em .odp."],["No LibreOffice Writer, o atalho para aplicar negrito ao texto selecionado é",["Ctrl + N.","Ctrl + S.","Ctrl + G.","Ctrl + B.","Ctrl + E."],3,"No LibreOffice, Ctrl + B. No Word em português é Ctrl + N."],["Em uma planilha, a coluna B registra o status de cada dia (“Presencial” ou “Home Office”). Para contar quantos dias foram de “Home Office”, a função adequada é",["PROCV.","MÁXIMO.","CLASSIFICAR.","CONT.SE.","SOMA."],3,"CONT.SE conta as células que atendem a um critério."],["No LibreOffice Calc, a fórmula =SE(A1>=30;\"Aprovada\";\"Eliminada\"), com o valor 28 em A1, retorna",["Aprovada.","VERDADEIRO.","#NOME?","28.","Eliminada."],4,"28 não é maior ou igual a 30: o teste é falso e retorna o terceiro argumento."],["Ao copiar a fórmula =$A$1*B1 da célula C1 para a célula C2, a nova fórmula será",["=$A$1*B2.","=$A$2*B2.","=A2*B2.","=$A$1*B1.","=$A$1*C2."],0,"$A$1 é absoluta e não muda; B1 é relativa e vira B2."],["No LibreOffice Impress, o efeito aplicado na passagem de um slide para o seguinte é chamado de",["animação personalizada.","transição de slides.","slide mestre.","layout.","marcador."],1,"Transição é entre slides; animação é em objetos."],["Para iniciar a apresentação a partir do slide atual no LibreOffice Impress, usa-se",["F7.","Alt + F5.","Ctrl + F5.","F5.","Shift + F5."],4,"F5 começa do primeiro slide; Shift + F5, do atual."],["Sobre o LibreOffice, é correto afirmar que",["não possui editor de planilhas.","não consegue abrir arquivos do Microsoft Office.","é livre e gratuito, usa o formato ODF e permite exportar documentos diretamente para PDF.","é um software proprietário pago.","só funciona no sistema Linux."],2,"O LibreOffice é livre, gratuito, multiplataforma e exporta PDF."]]},{"id":"I04","m":"inf","t":"Internet, navegadores, segurança e ferramentas Google","ed":["I8","I9","I10","I11"],"v":[["STDeZe68aS8","Navegadores da internet (Rodrigo Schaeffer)"],["K2aUdyJpd8k","Segurança da informação para concursos"]],"obj":["Diferenciar internet, intranet e protocolos","Usar atalhos e recursos dos navegadores","Reconhecer malwares e golpes","Usar Gmail, Drive, Docs, Formulários, Meet e Agenda"],"s":[["Internet e protocolos",[{"l":["**Internet**: rede mundial. **Intranet**: rede privada de uma organização, com as mesmas tecnologias da internet. **Extranet**: parte da intranet aberta a parceiros.","**HTTP** carrega páginas; **HTTPS** faz o mesmo com **criptografia** (cadeado na barra de endereço).","**DNS** traduz nomes (gov.br) em endereços IP.","E-mail: **SMTP** envia; **POP3** e **IMAP** recebem (o IMAP sincroniza com o servidor).","**URL** é o endereço: protocolo://domínio/caminho."]},{"t":[["Busca no Google","Efeito"],["\"frase exata\"","Busca a frase exata"],["-palavra","Exclui a palavra"],["site:gov.br","Busca só naquele site ou domínio"],["filetype:pdf","Busca por tipo de arquivo"],["OR","Uma palavra ou outra"]]}]],["Navegadores",[{"l":["**Chrome** (Google): a barra de endereço, chamada **Omnibox**, aceita endereços e pesquisas; tem **leitor de PDF** e **tradução** integrados; **não exige login** com conta Google.","**Edge** (Microsoft): baseado no Chromium; substituiu o Internet Explorer, encerrado em 2022.","**Firefox** (Mozilla): código aberto."]},{"t":[["Atalho","Função"],["Ctrl + T","Nova guia"],["Ctrl + W","Fechar guia"],["Ctrl + Shift + T","Reabrir guia fechada"],["Ctrl + Shift + N","Janela anônima (Chrome) / InPrivate (Edge)"],["Ctrl + Shift + P","Janela privativa (Firefox)"],["Ctrl + H / Ctrl + J","Histórico / downloads"],["Ctrl + D","Adicionar aos favoritos"],["F5 / Ctrl + F5","Atualizar / atualizar sem cache"],["Ctrl + L","Ir para a barra de endereço"]]},{"a":"A navegação anônima **não salva** histórico, cookies e dados de formulário no computador depois que a janela é fechada. Ela **não esconde** a navegação do provedor de internet, da empresa ou dos sites. Downloads e favoritos criados continuam."}]],["Segurança",[{"t":[["Ameaça","Como age"],["Vírus","Se anexa a arquivos e precisa ser executado para se espalhar"],["Worm","Se propaga sozinho pela rede, explorando falhas"],["Cavalo de Troia","Parece um programa legítimo e abre caminho para outros ataques"],["Ransomware","Criptografa os dados e exige resgate"],["Spyware / keylogger","Espiona; o keylogger registra o que é digitado"],["Phishing","Mensagem ou site falso que engana para roubar dados"],["Pharming","Redireciona o endereço verdadeiro para um site falso"]]},{"l":["Proteção: antivírus atualizado, **firewall** (filtra o tráfego da rede), atualizações do sistema, senhas fortes e diferentes, **verificação em duas etapas**, **backup**.","Desconfie de links e anexos inesperados; confira o **https** e o domínio antes de digitar senha ou cartão.","Princípios da segurança da informação: **confidencialidade**, **integridade** e **disponibilidade**, além da **autenticidade**."]}]],["Ferramentas Google",[{"l":["**Gmail**: usa **marcadores** em vez de pastas; **Cc** envia cópia visível e **Cco** cópia oculta; filtros e spam. O espaço gratuito (15 GB) é **compartilhado** com Drive e Fotos.","**Drive**: armazenamento em nuvem; compartilhamento com permissão de **leitor**, **comentarista** ou **editor**.","**Documentos, Planilhas e Apresentações**: edição **simultânea** por várias pessoas, salvamento automático, comentários e **histórico de versões**.","**Formulários**: questionários; as respostas aparecem em resumo com gráficos e podem ir para uma planilha.","**Meet**: videoconferência. **Agenda**: eventos, convites e lembretes."]}]]],"r":["Internet × intranet × extranet. HTTPS = criptografia (cadeado). DNS traduz nomes. SMTP envia; POP3/IMAP recebem.","Busca: aspas, menos, site:, filetype:, OR.","Chrome: Omnibox, PDF e tradução nativos, login opcional. Edge substituiu o IE.","Anônima: não guarda histórico local, mas não esconde do provedor.","Vírus precisa de execução; worm se propaga sozinho; ransomware pede resgate; phishing engana.","Gmail: marcadores, Cc/Cco, 15 GB compartilhados. Drive: leitor, comentarista, editor. Docs: edição simultânea e histórico."],"q":[["Ao acessar um site para digitar dados bancários, o indicativo de conexão segura é",["o endereço começar com https:// e exibir um cadeado na barra de endereço.","a barra de endereço ficar vermelha.","o site ter sido aberto por um link recebido por e-mail.","o endereço começar com http:// e não exibir cadeado.","a página ter muitas imagens."],0,"HTTPS com cadeado indica comunicação criptografada. Mesmo assim, confira o domínio."],["Sobre o Google Chrome em uma instalação padrão, assinale a alternativa INCORRETA.",["A navegação anônima não garante anonimato perante o provedor de internet.","O recurso de tradução pode oferecer a tradução de páginas em outro idioma.","É obrigatório fazer login com uma Conta Google para usar o navegador.","A Omnibox permite digitar endereços e fazer pesquisas.","O navegador abre arquivos PDF sem leitor externo."],2,"O login é opcional. As demais afirmações estão corretas."],["O malware que se propaga automaticamente pela rede, explorando vulnerabilidades, sem precisar ser executado pelo usuário, é o",["adware.","keylogger.","vírus.","worm.","cavalo de Troia."],3,"O worm se propaga sozinho. O vírus depende de execução do arquivo infectado."],["O tipo de ataque que criptografa os arquivos da vítima e exige pagamento para liberá-los é o",["spyware.","ransomware.","pharming.","phishing.","spam."],1,"Ransomware sequestra dados e cobra resgate."],["Uma mensagem que imita o banco e pede que o usuário clique num link para “atualizar seus dados” caracteriza",["backup.","worm.","firewall.","phishing.","criptografia."],3,"Phishing é golpe por mensagem ou site falso para roubar dados."],["No Gmail, para enviar uma cópia da mensagem a um destinatário sem que os demais saibam, usa-se o campo",["Cc.","Para.","Cco.","Assunto.","Marcador."],2,"Cco é cópia oculta."],["No Google Docs, é correto afirmar que",["várias pessoas podem editar simultaneamente, e há histórico de versões.","os arquivos ficam apenas no computador do usuário.","o documento precisa ser salvo manualmente a cada alteração.","não é possível inserir comentários.","só uma pessoa pode editar o documento por vez."],0,"Edição simultânea, salvamento automático, comentários e histórico de versões."],["Na pesquisa do Google, para buscar apenas resultados dentro de sites do governo brasileiro, utiliza-se",["-gov.br.","\"gov.br\".","filetype:gov.br.","gov.br OR.","site:gov.br."],4,"O operador site: restringe a busca a um domínio."]]},{"id":"R01","m":"rl","t":"Frações, porcentagem, razão e proporção","ed":["R1","R3","R7","R8"],"v":[["S0nPZnq7ApM","Matemática para concursos: porcentagem passo a passo"],["F88XEI5fW8s","Porcentagem: aumentos e descontos sucessivos"]],"obj":["Operar com frações e calcular fração de uma quantidade","Calcular porcentagens com fatores","Resolver aumentos e descontos sucessivos","Usar razão, proporção e divisão proporcional"],"s":[["Frações",[{"l":["**Fração de uma quantidade**: divida pelo denominador e multiplique pelo numerador. 2/5 de 200 = 200 ÷ 5 × 2 = **80**.","**Somar e subtrair**: iguale os denominadores (MMC). 1/2 + 1/3 = 3/6 + 2/6 = **5/6**.","**Multiplicar**: numerador × numerador e denominador × denominador.","**Dividir**: multiplique pela fração invertida. (1/2) ÷ (1/4) = 1/2 × 4 = **2**."]},{"ex":"Um jarro foi esvaziado até ficar com 2/7 da capacidade, restando 300 mL. Então 2/7 da capacidade = 300 mL; 1/7 = 150 mL; capacidade = 7 × 150 = **1.050 mL**."}]],["Porcentagem",["x% = x/100. Para calcular, transforme em decimal: 15% = 0,15.",{"t":[["Situação","Fator","Exemplo"],["Aumento de 20%","× 1,20","100 → 120"],["Desconto de 15%","× 0,85","200 → 170"],["Aumentos ou descontos sucessivos","Multiplique os fatores","Desconto de 20% e depois 30%: 0,8 × 0,7 = 0,56"]]},{"a":"Descontos sucessivos de 20% e 30% **não** somam 50%. O preço final é 56% do inicial (14/25), ou seja, desconto total de 44%. Subir 10% e depois descer 10% não volta ao valor: 1,1 × 0,9 = 0,99."},"**Variação percentual** = (valor novo − valor antigo) ÷ valor antigo × 100."]],["Razão e proporção",[{"l":["**Razão** é a divisão entre duas grandezas: 3 meninos para 2 meninas = 3/2.","**Proporção** é a igualdade entre duas razões: a/b = c/d, com a·d = b·c (multiplicação cruzada).","**Divisão proporcional**: dividir 120 em partes proporcionais a 2 e 3 → total de partes 5; cada parte vale 24; resultado **48 e 72**."]}]]],"r":["Fração de quantidade: ÷ denominador × numerador.","Soma de frações: MMC. Divisão: multiplicar pelo inverso.","Aumento de i%: × (1 + i). Desconto de i%: × (1 − i).","Sucessivos: multiplicar os fatores (20% e 30% de desconto = 0,56).","Proporção: produto cruzado. Divisão proporcional: some as partes e divida."],"q":[["Uma blusa custava R$ 200,00 e foi vendida com desconto de 15% para pagamento à vista. O valor pago foi",["R$ 150,00.","R$ 160,00.","R$ 165,00.","R$ 170,00.","R$ 185,00."],3,"200 × 0,85 = 170."],["Uma mercadoria sofreu um desconto de 20% e, sobre o novo preço, outro desconto de 30%. Ao final, o preço corresponde a que fração do preço inicial?",["1/2.","14/25.","3/50.","29/16.","100/30."],1,"0,8 × 0,7 = 0,56 = 56/100 = 14/25."],["Um jarro cheio de suco foi esvaziado até ficar com 2/7 da sua capacidade, restando 300 mL. A capacidade total do jarro é",["850 mL.","900 mL.","1.000 mL.","1.050 mL.","1.200 mL."],3,"2/7 = 300 mL → 1/7 = 150 mL → 7/7 = 1.050 mL."],["Quanto é 3/4 de 2/5 de 400?",["80.","100.","120.","150.","240."],2,"2/5 de 400 = 160; 3/4 de 160 = 120."],["Um salário de R$ 2.000,00 teve aumento de 10% e, no mês seguinte, redução de 10%. O valor final é",["R$ 2.000,00.","R$ 1.980,00.","R$ 2.020,00.","R$ 1.800,00.","R$ 2.200,00."],1,"2.000 × 1,1 × 0,9 = 1.980."],["Em uma classe hospitalar, a razão entre o número de meninos e de meninas é 3/2. Se há 10 meninas, o número de meninos é",["12.","13.","15.","18.","20."],2,"3/2 = x/10 → x = 15."],["Dividindo R$ 120,00 entre duas crianças, em partes diretamente proporcionais a 2 e 3, as partes serão",["R$ 50,00 e R$ 70,00.","R$ 60,00 e R$ 60,00.","R$ 40,00 e R$ 80,00.","R$ 48,00 e R$ 72,00.","R$ 24,00 e R$ 96,00."],3,"Total de 5 partes: 120 ÷ 5 = 24; 2 × 24 = 48 e 3 × 24 = 72."],["Um preço passou de R$ 80,00 para R$ 100,00. O aumento percentual foi de",["20%.","25%.","30%.","15%.","80%."],1,"(100 − 80) ÷ 80 = 20 ÷ 80 = 0,25 = 25%."]]},{"id":"R02","m":"rl","t":"Regra de três, equações, sistemas e função de 1º grau","ed":["R5","R6","R9","R10","R11"],"v":[["CQFFaa9fmS0","Regra de três simples e composta"],["BxGoikTpDm0","Regra de três composta: questões de concurso resolvidas"]],"obj":["Identificar grandezas diretas e inversas","Resolver regra de três simples e composta","Montar e resolver equações e sistemas de 1º grau","Interpretar a função afim f(x) = ax + b"],"s":[["Grandezas e regra de três simples",[{"l":["**Diretamente proporcionais**: uma aumenta e a outra também (mais horas, mais páginas).","**Inversamente proporcionais**: uma aumenta e a outra diminui (mais impressoras, menos tempo)."]},{"ex":"A impressora A imprime 3 páginas enquanto a B imprime 2. A leva 40 minutos para um lote. B é mais lenta, então leva mais tempo (grandezas inversas): tempo de B = 40 × 3 ÷ 2 = **60 minutos**."},"Passo a passo: mo
