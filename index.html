"]]},{"a":"Disgrafia é sobre o **traçado** (motor). Disortografia é sobre a **ortografia** (escrever errado as palavras). A AOCP adora trocar uma pela outra."},"O **TDAH** é um transtorno do neurodesenvolvimento diferente, mas aparece muito junto com os transtornos de aprendizagem (comorbidade) e também é citado na Lei 14.254/2021."]],["Lei 14.254/2021",["A lei garante **acompanhamento integral** para educandos com **dislexia**, **TDAH** ou outro **transtorno de aprendizagem**.",{"l":["O poder público deve desenvolver e manter programa de acompanhamento integral desses educandos.","As escolas da educação básica, públicas e privadas, com apoio da família e dos serviços de saúde, devem garantir a **identificação precoce**, o **encaminhamento para diagnóstico**, o **apoio educacional** na rede de ensino e o **apoio terapêutico** especializado na rede de saúde.","As necessidades de cada educando são identificadas por equipe **multidisciplinar**.","Os professores devem ter acesso a **formação continuada** para identificar sinais e dar suporte."]},{"a":"O diagnóstico é **multiprofissional**. O professor ou pedagogo observa, registra e encaminha, mas não fecha diagnóstico."}]],["O que o pedagogo faz",[{"l":["Observa e registra os sinais de forma descritiva, sem rotular.","Conversa com a família e com a escola de origem e encaminha para avaliação.","Adapta: mais tempo, leitura oral dos enunciados, avaliação oral, textos com fonte ampliada e espaçamento maior, materiais concretos, uso de calculadora quando o foco não é o cálculo.","Trabalha consciência fonológica, jogos de linguagem e de raciocínio matemático.","Fortalece a autoestima, porque esses alunos costumam ouvir que são “preguiçosos”."]},"No hospital, lembre que faltas e afastamentos por doença geram **dificuldade**, não transtorno. Antes de suspeitar de transtorno, considere a história escolar e de saúde da criança."]]],"r":["Dificuldade: causa externa e passageira. Transtorno: neurobiológico e persistente.","DSM-5-TR: transtorno específico da aprendizagem, com prejuízo em leitura, escrita ou matemática; mínimo de 6 meses apesar de intervenção.","Não é explicado por deficiência intelectual, problema sensorial ou falta de ensino.","Dislexia = leitura; disgrafia = traçado; disortografia = ortografia; discalculia = matemática.","Lei 14.254/2021: acompanhamento integral para dislexia, TDAH e outros transtornos; identificação precoce, diagnóstico, apoio educacional e terapêutico, equipe multidisciplinar, formação de professores.","Pedagogo observa, registra, encaminha e adapta. Não diagnostica."],"q":[["Assinale a alternativa que diferencia corretamente dificuldade de aprendizagem e transtorno de aprendizagem.",["A dificuldade é diagnosticada exclusivamente pelo professor da turma.","A dificuldade tem origem neurobiológica e o transtorno tem origem ambiental.","A dificuldade costuma estar ligada a fatores externos e ser passageira, enquanto o transtorno é intrínseco e persistente.","O transtorno só ocorre em alunos com deficiência intelectual.","Ambos desaparecem quando o aluno muda de escola."],2,"Dificuldade tem causas externas e tende a ser transitória; transtorno é neurobiológico e persistente. O transtorno não é explicado por deficiência intelectual."],["Um aluno lê de forma lenta e silabada, troca sons parecidos como /f/ e /v/ e tem dificuldade em atividades de rima e segmentação de sílabas, embora compreenda bem histórias lidas em voz alta. Esses sinais são mais compatíveis com",["discalculia.","dislexia.","disgrafia.","transtorno de conduta.","deficiência intelectual."],1,"Dificuldade de decodificação e de consciência fonológica, com boa compreensão oral, é o quadro típico da dislexia."],["A dificuldade persistente no traçado das letras, com escrita ilegível, tamanho irregular e espaçamento desorganizado, caracteriza a",["disgrafia.","dislexia.","disortografia.","dislalia.","discalculia."],0,"Disgrafia é a dificuldade motora no traçado. Disortografia se refere aos erros ortográficos."],["Segundo a Lei nº 14.254/2021, o acompanhamento integral nas escolas de educação básica é assegurado a educandos com",["altas habilidades ou superdotação, exclusivamente.","dislexia, TDAH ou outro transtorno de aprendizagem.","apenas dislexia diagnosticada antes dos 6 anos.","transtorno do espectro autista, exclusivamente.","apenas deficiência física ou sensorial."],1,"A lei trata de educandos com dislexia, TDAH ou outro transtorno de aprendizagem."],["De acordo com a Lei nº 14.254/2021, é correto afirmar que",["a lei se aplica apenas às escolas públicas.","a identificação precoce dispensa o encaminhamento para diagnóstico.","o apoio terapêutico especializado deve ser oferecido pela própria escola.","as necessidades específicas do educando devem ser identificadas por equipe multidisciplinar.","o diagnóstico deve ser feito pelo professor regente da turma."],3,"A lei fala em equipe multidisciplinar, alcança escolas públicas e privadas e prevê apoio terapêutico na rede de saúde."],["Pelos critérios do DSM-5-TR, o transtorno específico da aprendizagem NÃO é melhor explicado por",["início das dificuldades durante os anos escolares.","prejuízo no desempenho escolar.","habilidades acadêmicas abaixo do esperado para a idade.","dificuldades persistentes em leitura, escrita ou matemática.","deficiência intelectual, problemas sensoriais não corrigidos ou falta de oportunidade de aprendizagem."],4,"O diagnóstico exclui casos explicados por deficiência intelectual, visão ou audição não corrigidas, ensino inadequado ou falta de oportunidade. As outras alternativas são critérios do transtorno."],["Assinale a alternativa que apresenta uma adaptação pedagógica adequada para um aluno com discalculia.",["Retirar a matemática do seu currículo.","Aplicar avaliações apenas com tempo reduzido.","Exigir memorização da tabuada como condição para avançar.","Permitir o uso de material concreto e de calculadora em atividades cujo objetivo não seja o cálculo.","Comparar seus resultados com os dos colegas para estimulá-lo."],3,"Material concreto e calculadora, quando o foco é o raciocínio e não a conta, são adaptações recomendadas. Retirar o conteúdo ou expor o aluno não ajuda."],["Uma criança de 8 anos, afastada da escola por seis meses de tratamento, apresenta defasagem na leitura ao retornar às atividades pedagógicas no hospital. A interpretação mais adequada é",["a criança deve ser encaminhada imediatamente para avaliação de deficiência intelectual.","a criança tem dislexia, pois lê abaixo do esperado.","trata-se de dificuldade de aprendizagem possivelmente ligada ao afastamento, que deve ser trabalhada antes de qualquer suspeita de transtorno.","a defasagem é irreversível e o currículo deve ser reduzido de forma permanente.","a criança tem disgrafia, pois a leitura e a escrita estão relacionadas."],2,"A falta de oportunidade de aprender (afastamento) explica a defasagem: é dificuldade, não transtorno. O pedagogo intervém e observa a evolução."]]},{"id":"E06","m":"esp","t":"TEA, TDAH e deficiência intelectual","ed":["E5","E16"],"v":[["uiii_lMfFdQ","PEI para TEA e TDAH: guia prático"],["jhnDbhh-hSM","AEE para alunos com deficiência intelectual"]],"obj":["Situar TEA, TDAH e deficiência intelectual entre os transtornos do neurodesenvolvimento","Reconhecer os critérios centrais de cada quadro","Conhecer os direitos da Lei 12.764/2012","Planejar estratégias pedagógicas, inclusive no hospital"],"s":[["Transtornos do neurodesenvolvimento",["No **DSM-5-TR**, os transtornos do neurodesenvolvimento começam no período do desenvolvimento, em geral antes da idade escolar, e trazem prejuízos pessoais, sociais, escolares ou ocupacionais. O grupo inclui: **deficiência intelectual**, **transtornos da comunicação**, **transtorno do espectro autista (TEA)**, **TDAH**, **transtorno específico da aprendizagem** e **transtornos motores** (como os tiques).",{"a":"O nome antigo “transtornos globais do desenvolvimento (TGD)”, que aparece na Política de 2008, englobava o autismo. Hoje se usa TEA, mas a banca pode citar os dois termos."}]],["Transtorno do espectro autista (TEA)",["Dois grupos de critérios definem o TEA:",{"l":["**Déficits persistentes na comunicação e na interação social**: reciprocidade socioemocional, comunicação não verbal (contato visual, gestos), dificuldade em iniciar e manter relacionamentos.","**Padrões restritos e repetitivos** de comportamento, interesses ou atividades: estereotipias, insistência na mesmice e na rotina, interesses intensos e restritos, **hiper ou hiporreatividade sensorial** (incômodo com sons, luzes, texturas)."]},"O DSM-5-TR classifica por **níveis de suporte**: nível 1 (exige apoio), nível 2 (apoio substancial) e nível 3 (apoio muito substancial). É um **espectro**: as pessoas são muito diferentes entre si.",{"lei":"A pessoa com transtorno do espectro autista é considerada pessoa com deficiência, para todos os efeitos legais.","f":"LEI 12.764/2012, ART. 1º, § 2º"},{"l":["Em casos de comprovada necessidade, o aluno com TEA incluído nas classes comuns tem direito a **acompanhante especializado**.","O gestor escolar que **recusar a matrícula** de aluno com TEA, ou qualquer outro tipo de deficiência, será punido com **multa de 3 a 20 salários mínimos**.","A Lei 13.977/2020 (Lei Romeo Mion) criou a **Carteira de Identificação da Pessoa com TEA (Ciptea)**."]},"**Estratégias**: rotina previsível; avisar mudanças com antecedência; apoio visual (agenda com figuras, pictogramas); instruções curtas e concretas; usar os interesses da criança como porta de entrada; cuidar do ambiente sensorial. No hospital, monitores apitando, luzes e toques podem ser muito difíceis: antecipe procedimentos com histórias sociais e imagens."]],["TDAH",["O **transtorno do déficit de atenção com hiperatividade** é um padrão persistente de **desatenção** e/ou **hiperatividade-impulsividade** que interfere no funcionamento.",{"l":["Vários sintomas aparecem **antes dos 12 anos**.","Os sintomas ocorrem em **dois ou mais ambientes** (casa, escola, outros).","Apresentações: **predominantemente desatenta**, **predominantemente hiperativa-impulsiva** ou **combinada**."]},"**Estratégias**: dividir tarefas longas em etapas curtas; dar uma instrução por vez; pausas ativas; reduzir distratores; retorno imediato e elogio específico; combinar regras claras. A Lei 14.254/2021 também garante acompanhamento integral a educandos com TDAH."]],["Deficiência intelectual",["A deficiência intelectual envolve **limitações no funcionamento intelectual** (raciocínio, resolução de problemas, planejamento, pensamento abstrato, aprendizagem) **e no comportamento adaptativo**, nos domínios **conceitual**, **social** e **prático**, com início no período do desenvolvimento.",{"a":"No DSM-5, a gravidade (leve, moderada, grave, profunda) é definida pelo **funcionamento adaptativo**, e não apenas pelo QI. Alternativa que reduz a deficiência intelectual a um número de QI está desatualizada."},"As causas podem ser genéticas (a **síndrome de Down**, trissomia do cromossomo 21, é a mais conhecida), pré-natais, perinatais ou pós-natais.","**Estratégias**: partir do concreto; dividir em passos; repetir com sentido, em contextos variados; priorizar aprendizagens funcionais e a autonomia; avaliar pelo progresso da própria criança."]]],"r":["Neurodesenvolvimento: DI, comunicação, TEA, TDAH, aprendizagem e motores.","TEA: déficit na comunicação e interação social + padrões restritos e repetitivos (inclui sensorialidade). Níveis de suporte 1, 2 e 3.","Lei 12.764/2012: TEA é deficiência para todos os efeitos legais; acompanhante especializado se comprovada necessidade; multa de 3 a 20 salários mínimos por recusar matrícula.","TDAH: desatenção e/ou hiperatividade-impulsividade; antes dos 12 anos; em 2+ ambientes; três apresentações.","DI: limitações intelectuais e adaptativas (conceitual, social, prático); gravidade pelo funcionamento adaptativo.","Estratégias: rotina, apoio visual, tarefas curtas, concreto, funcionalidade."],"q":[["De acordo com o DSM-5-TR, o transtorno do espectro autista caracteriza-se por",["déficits persistentes na comunicação e na interação social e padrões restritos e repetitivos de comportamento, interesses ou atividades.","perda auditiva bilateral de 41 dB ou mais.","limitação do funcionamento intelectual medida exclusivamente pelo QI.","desatenção e hiperatividade presentes apenas no ambiente escolar.","dificuldade exclusiva na aprendizagem da leitura e da escrita."],0,"São os dois grupos de critérios do TEA. E é transtorno de aprendizagem, D descreve mal o TDAH, C é uma visão desatualizada da DI e B é deficiência auditiva."],["Segundo a Lei nº 12.764/2012, a pessoa com transtorno do espectro autista",["deve ser matriculada preferencialmente em escola especial.","só é considerada pessoa com deficiência se tiver deficiência intelectual associada.","tem direitos apenas na área da saúde.","não tem direito a acompanhante em sala comum.","é considerada pessoa com deficiência, para todos os efeitos legais."],4,"O art. 1º, § 2º, da lei equipara a pessoa com TEA à pessoa com deficiência para todos os efeitos legais."],["Conforme a Lei nº 12.764/2012, o gestor escolar ou a autoridade competente que recusar a matrícula de aluno com TEA ou qualquer outro tipo de deficiência será punido com",["suspensão de 30 dias.","advertência verbal.","multa de 1 salário mínimo.","multa de 3 a 20 salários mínimos.","perda imediata do cargo, sem processo."],3,"A lei prevê multa de 3 a 20 salários mínimos e, em caso de reincidência, perda do cargo após processo administrativo."],["Para o diagnóstico de TDAH, o DSM-5-TR exige que",["vários sintomas estejam presentes antes dos 12 anos e em dois ou mais ambientes.","haja deficiência intelectual associada.","os sintomas apareçam apenas na adolescência.","a criança apresente obrigatoriamente hiperatividade.","os sintomas estejam presentes em um único ambiente."],0,"Os sintomas devem surgir antes dos 12 anos e aparecer em pelo menos dois ambientes. Existe a apresentação predominantemente desatenta, sem hiperatividade."],["Sobre a deficiência intelectual, conforme o DSM-5, é correto afirmar que",["impede qualquer aprendizagem acadêmica.","é definida exclusivamente pela pontuação em teste de QI.","envolve limitações no funcionamento intelectual e no comportamento adaptativo, com início no período do desenvolvimento.","tem como única causa a síndrome de Down.","pode surgir pela primeira vez na vida adulta, sem relação com o desenvolvimento."],2,"A DI envolve limitação intelectual e adaptativa, com início no desenvolvimento. A gravidade é definida pelo funcionamento adaptativo, e as causas são variadas."],["Os domínios do comportamento adaptativo considerados na deficiência intelectual são",["linguístico, lógico-matemático e espacial.","motor, visual e auditivo.","conceitual, social e prático.","inicial, processual e final.","afetivo, cognitivo e motor."],2,"Os domínios adaptativos são conceitual, social e prático. C é a resposta; A lembra Gardner."],["Analise as estratégias para uma criança com TEA internada.\nI. Antecipar procedimentos com imagens e histórias sociais.\nII. Manter, sempre que possível, uma rotina previsível de atendimento.\nIII. Mudar atividades e horários sem aviso, para estimular a flexibilidade.\nIV. Considerar a sensibilidade a sons e luzes do ambiente hospitalar.\nEstão corretas apenas",["II, III e IV.","I, II e IV.","I, III e IV.","I e III.","II e III."],1,"Antecipação, rotina e atenção à sensorialidade ajudam. Mudanças bruscas sem aviso aumentam a ansiedade e não são recomendadas."],["Um aluno com TDAH, apresentação predominantemente desatenta, perde-se em tarefas longas com muitos comandos. A adaptação mais adequada é",["retirar o aluno das atividades em grupo.","aplicar a mesma tarefa com tempo reduzido.","aumentar a quantidade de exercícios para treinar a atenção.","esperar que ele peça ajuda quando precisar.","dividir a tarefa em etapas curtas, com uma instrução por vez e retorno imediato."],4,"Fragmentar a tarefa, dar uma instrução por vez e oferecer retorno imediato são estratégias clássicas para o TDAH."]]},{"id":"E07","m":"esp","t":"Deficiências física, visual, auditiva, surdocegueira e múltipla","ed":["E16","E17"],"v":[["wDKvu_u0zzQ","AEE e adaptações para estudantes com deficiência visual"],["bGrVPuQ1Qm4","Prática pedagógica para alunos com deficiência auditiva e surdez"]],"obj":["Usar o conceito de pessoa com deficiência da LBI","Diferenciar cegueira e baixa visão, surdez e deficiência auditiva","Conhecer recursos como braile, soroban, Libras e CAA","Adaptar o atendimento no hospital"],"s":[["O conceito de deficiência",[{"lei":"Considera-se pessoa com deficiência aquela que tem impedimento de longo prazo de natureza física, mental, intelectual ou sensorial, o qual, em interação com uma ou mais barreiras, pode obstruir sua participação plena e efetiva na sociedade em igualdade de condições com as demais pessoas.","f":"LEI 13.146/2015 (LBI), ART. 2º"},"Esse conceito segue o **modelo social** (ou biopsicossocial): a deficiência resulta da **interação** entre o impedimento e as **barreiras**. No modelo médico, antigo, o problema estaria só no corpo da pessoa.",{"a":"Palavras-chave da definição: impedimento de **longo prazo** + **barreiras** + participação em **igualdade de condições**. A banca troca “longo prazo” por “temporário”."}]],["Deficiência física",["É a alteração completa ou parcial de um ou mais segmentos do corpo, que compromete a função física: paraplegia, tetraplegia, hemiplegia, amputação, paralisia cerebral, ostomia, nanismo, entre outras.","A **paralisia cerebral** é uma lesão no cérebro em desenvolvimento que afeta movimento e postura. **Não** significa deficiência intelectual: muitas crianças com paralisia cerebral têm cognição preservada e precisam de recursos para se expressar.","Recursos: acessibilidade física, mesa recortada, adequação postural, engrossadores de lápis, pranchas inclinadas, acionadores e comunicação alternativa quando a fala é afetada."]],["Deficiência visual",[{"t":[["Condição","Critério (Decreto 5.296/2004)","Recursos principais"],["Cegueira","Acuidade visual igual ou menor que 0,05 no melhor olho, com a melhor correção óptica","Braile, reglete e punção, soroban (cálculo), materiais em relevo, audiodescrição, leitor de tela (DOSVOX, NVDA)"],["Baixa visão","Acuidade entre 0,3 e 0,05 no melhor olho, com a melhor correção óptica","Ampliação, lupas, alto contraste, iluminação adequada, fonte grande, ampliação de tela"]]},"O **braile** é um sistema de escrita em relevo baseado em **seis pontos**. O **soroban** é um ábaco japonês adaptado para cálculo por pessoas cegas.",{"a":"Para a criança com baixa visão, o objetivo é aproveitar ao máximo o resíduo visual. Não é preciso ensinar braile a todo aluno com baixa visão."}]],["Deficiência auditiva e surdez",["**Deficiência auditiva** é a perda bilateral, parcial ou total, de **41 decibéis ou mais**, aferida por audiograma nas frequências de 500, 1.000, 2.000 e 3.000 Hz (Decreto 5.626/2005).","**Pessoa surda** é aquela que compreende e interage com o mundo por meio de **experiências visuais** e manifesta sua cultura principalmente pela **Libras**.",{"lei":"É reconhecida como meio legal de comunicação e expressão a Língua Brasileira de Sinais – Libras e outros recursos de expressão a ela associados. [...] A Língua Brasileira de Sinais – Libras não poderá substituir a modalidade escrita da língua portuguesa.","f":"LEI 10.436/2002, ARTS. 1º E 4º"},"Na **educação bilíngue de surdos**, a Libras é a **primeira língua (L1)** e o português escrito é a **segunda língua (L2)**. Desde a Lei 14.191/2021, a educação bilíngue de surdos é uma **modalidade** prevista na LDB.","No hospital: fique de frente ao falar, garanta boa iluminação no rosto, use imagens e escrita. A máscara comum impede a leitura labial; prefira a máscara com visor transparente e solicite intérprete de Libras."]],["Surdocegueira e deficiência múltipla",["A **surdocegueira** é uma condição única que combina perdas visual e auditiva. A pessoa precisa de formas próprias de comunicação, como a **Libras tátil** e o apoio de um **guia-intérprete**.","**Deficiência múltipla** é a associação de duas ou mais deficiências. O planejamento precisa ser bem individualizado e feito com a família e a equipe."]]],"r":["LBI: impedimento de longo prazo + barreiras + participação em igualdade de condições (modelo social).","Paralisia cerebral afeta movimento e postura; não implica deficiência intelectual.","Cegueira: acuidade ≤ 0,05; baixa visão: entre 0,3 e 0,05 (melhor olho, melhor correção).","Braile (6 pontos), reglete e punção, soroban, audiodescrição, leitores de tela.","Deficiência auditiva: perda bilateral de 41 dB ou mais. Surdo: experiência visual e Libras.","Lei 10.436/2002: Libras é meio legal de comunicação e não substitui o português escrito.","Educação bilíngue: Libras L1, português escrito L2; modalidade na LDB (Lei 14.191/2021).","Surdocegueira: condição única; Libras tátil e guia-intérprete."],"q":[["De acordo com a Lei Brasileira de Inclusão, considera-se pessoa com deficiência aquela que tem impedimento de",["longo prazo, independentemente da existência de barreiras no ambiente.","curto prazo, que impede totalmente sua participação social.","natureza exclusivamente física ou sensorial.","qualquer duração, desde que comprovado por laudo médico.","longo prazo, de natureza física, mental, intelectual ou sensorial, que, em interação com barreiras, pode obstruir sua participação plena e efetiva em igualdade de condições."],4,"A LBI fala em impedimento de longo prazo que, em interação com barreiras, pode obstruir a participação. A presença das barreiras é parte do conceito."],["Sobre a paralisia cerebral, é correto afirmar que",["sempre vem acompanhada de deficiência intelectual.","é causada exclusivamente por fatores genéticos.","afeta principalmente o movimento e a postura, podendo a cognição estar preservada.","impede a escolarização em classe comum.","é uma doença degenerativa e progressiva."],2,"A paralisia cerebral é uma lesão não progressiva no cérebro em desenvolvimento, que afeta movimento e postura. Não implica deficiência intelectual."],["Pelo Decreto nº 5.296/2004, a baixa visão corresponde à acuidade visual",["maior que 0,5 em ambos os olhos.","entre 0,3 e 0,05 no melhor olho, com a melhor correção óptica.","medida apenas no olho de pior visão.","igual ou menor que 0,05 no melhor olho, com a melhor correção óptica.","igual a zero, sem percepção de luz."],1,"Baixa visão: entre 0,3 e 0,05 no melhor olho. Igual ou menor que 0,05 é cegueira."],["O instrumento de cálculo adaptado, de origem japonesa, utilizado por pessoas cegas é o",["punção.","DOSVOX.","plano inclinado.","soroban.","reglete."],3,"O soroban é o ábaco japonês adaptado. Reglete e punção servem para escrever em braile e DOSVOX é um sistema de leitura de tela."],["Conforme a Lei nº 10.436/2002, é correto afirmar que a Libras",["é reconhecida como meio legal de comunicação e expressão, mas não substitui a modalidade escrita da língua portuguesa.","é idêntica em todos os países.","é uma linguagem gestual sem gramática própria.","deve ser usada apenas por intérpretes.","substitui a modalidade escrita da língua portuguesa na educação de surdos."],0,"A lei reconhece a Libras como meio legal de comunicação e diz expressamente que ela não substitui o português escrito. Libras é língua com gramática própria."],["Na educação bilíngue de surdos, a organização linguística prevista é",["Libras exclusivamente, sem ensino da escrita.","português escrito como primeira língua e Libras opcional.","apenas leitura labial e português oral.","português oral como primeira língua e Libras como segunda.","Libras como primeira língua e português escrito como segunda língua."],4,"Libras é L1 e o português escrito é L2. Desde 2021 a educação bilíngue de surdos é modalidade prevista na LDB."],["Sobre a surdocegueira, assinale a alternativa correta.",["Dispensa recursos de comunicação, pois a pessoa usa leitura labial.","É a simples soma de duas deficiências, sem necessidades próprias.","Exige apenas o uso do braile.","É uma condição única que requer formas próprias de comunicação, como a Libras tátil e o apoio de guia-intérprete.","Atinge apenas pessoas idosas."],3,"A surdocegueira é condição única, com necessidades específicas de comunicação e orientação."],["O pedagogo vai atender, no leito, uma criança surda usuária de Libras. Considerando que a equipe usa máscaras cirúrgicas, a conduta mais adequada é",["solicitar intérprete de Libras, usar recursos visuais e escritos e, se possível, máscara com visor transparente.","falar mais alto e devagar, sem retirar a máscara.","adiar o atendimento até a alta hospitalar.","comunicar-se apenas com a mãe da criança.","usar somente gestos improvisados."],0,"A máscara comum impede a leitura labial e a expressão facial, que faz parte da Libras. Intérprete, recursos visuais e máscara transparente garantem a comunicação."]]},{"id":"E08","m":"esp","t":"Educação inclusiva: marcos legais, Política de 2008 e LBI","ed":["E12"],"v":[["YumTXMdA6PA","Política Nacional de Educação Especial na Perspectiva da Educação Inclusiva (com questões)"],["z33hEFMbHyw","Política Nacional (2008) e Diretrizes Nacionais (Resolução 2/2001)"]],"obj":["Diferenciar integração e inclusão","Ordenar os principais marcos da educação inclusiva","Dominar os pontos da Política de 2008 que caem em prova","Conhecer barreiras, adaptações razoáveis e o direito à educação na LBI"],"s":[["Integração não é inclusão",[{"t":[["","Integração","Inclusão"],["Quem se adapta","O aluno precisa se adaptar à escola","A escola se transforma para receber todos"],["Modelo","Médico: foco na limitação","Social: foco nas barreiras"],["Organização","Classes e escolas especiais como caminho comum","Classe comum com apoio, AEE complementar"]]},{"a":"Alternativa que diz que, na inclusão, “o aluno deve se adequar ao currículo existente” descreve integração."}]],["Linha do tempo dos marcos",[{"t":[["Ano","Marco","Ideia central"],["1988","Constituição Federal","Educação é direito de todos (art. 205); AEE preferencialmente na rede regular (art. 208, III)"],["1990","ECA e Declaração de Jomtien","Educação para Todos; AEE preferencialmente na rede regular (ECA, art. 54)"],["1994","Declaração de Salamanca","Escolas regulares com orientação inclusiva são o meio mais eficaz de combater a discriminação"],["1996","LDB","Educação especial como modalidade, preferencialmente na rede regular (arts. 58 a 60)"],["2001","Resolução CNE/CEB 2/2001","Diretrizes para a educação especial; inclui classes hospitalares"],["2006/2009","Convenção da ONU sobre os Direitos das Pessoas com Deficiência","Aprovada no Brasil com equivalência de emenda constitucional"],["2008","Política Nacional de Educação Especial na Perspectiva da Educação Inclusiva","Educação especial transversal; AEE complementar ou suplementar"],["2011","Decreto 7.611","Regulamenta educação especial e AEE"],["2015","LBI (Lei 13.146)","Sistema educacional inclusivo em todos os níveis"]]}]],["Política Nacional de 2008",["Objetivo: garantir o **acesso, a participação e a aprendizagem** dos alunos com deficiência, transtornos globais do desenvolvimento e altas habilidades/superdotação nas **escolas regulares**.",{"l":["A educação especial é **modalidade transversal** a todos os níveis, etapas e modalidades de ensino.","Ela realiza o **AEE**, disponibiliza recursos e serviços e orienta seu uso no ensino comum.","O AEE **complementa ou suplementa** a formação do aluno e **não substitui** a escolarização na classe comum.","**Público-alvo**: alunos com **deficiência**, **transtornos globais do desenvolvimento** e **altas habilidades/superdotação**.","Prevê formação de professores, acessibilidade e articulação intersetorial (saúde, assistência social)."]},{"a":"Transtornos de aprendizagem (como a dislexia) **não** fazem parte do público-alvo da educação especial na Política de 2008. Eles têm amparo na Lei 14.254/2021."}]],["LBI: o que mais cai",[{"l":["**Barreiras** (art. 3º): urbanísticas, arquitetônicas, nos transportes, nas comunicações e na informação, **atitudinais** e tecnológicas. A barreira atitudinal é o preconceito, a atitude que impede a participação.","**Adaptações razoáveis**: ajustes necessários e adequados, que não acarretem ônus desproporcional e indevido, para garantir igualdade de condições.","**Desenho universal**: produtos, ambientes e serviços pensados para serem usados por todos, sem necessidade de adaptação.","**Profissional de apoio escolar**: atua em alimentação, higiene e locomoção do estudante e nas atividades escolares em que for necessário, excluídas técnicas de profissões legalmente estabelecidas."]},{"lei":"A educação constitui direito da pessoa com deficiência, assegurados sistema educacional inclusivo em todos os níveis e aprendizado ao longo de toda a vida [...].","f":"LBI, ART. 27"},"As escolas **privadas** não podem cobrar valores adicionais nas mensalidades, anuidades e matrículas por causa das medidas de inclusão (art. 28, § 1º). Recusar ou cancelar a matrícula de aluno por causa da deficiência é **crime**, com pena de reclusão de 2 a 5 anos e multa (Lei 7.853/1989, com redação da LBI).","O **Desenho Universal para a Aprendizagem (DUA)** leva a mesma ideia para a aula: oferecer múltiplas formas de **engajamento**, de **representação** do conteúdo e de **ação e expressão** do aluno."]]],"r":["Integração: o aluno se adapta. Inclusão: a escola se transforma (modelo social).","Salamanca (1994): escola regular inclusiva combate a discriminação.","Política 2008: educação especial transversal; AEE complementar/suplementar, não substitutivo.","Público-alvo: deficiência, TGD (hoje TEA) e altas habilidades/superdotação.","LBI: barreiras (incluindo atitudinais), adaptações razoáveis, desenho universal, profissional de apoio.","LBI art. 27: sistema educacional inclusivo em todos os níveis; escola privada não cobra a mais; recusar matrícula é crime.","DUA: engajamento, representação, ação e expressão."],"q":[["Assinale a alternativa que caracteriza corretamente a perspectiva da inclusão escolar, em oposição à integração.",["O foco do trabalho pedagógico é a limitação biológica do aluno.","A escola reorganiza suas práticas, espaços e recursos para garantir a participação e a aprendizagem de todos.","A escolarização deve ocorrer prioritariamente em classes especiais.","O aluno com deficiência deve se adaptar ao currículo e às práticas já existentes na escola.","A inclusão se limita à garantia da matrícula."],1,"Na inclusão, a escola se transforma. D, C e A descrevem a lógica da integração e do modelo médico; E é insuficiente, pois a inclusão envolve participação e aprendizagem."],["O documento internacional de 1994 que afirma que escolas regulares com orientação inclusiva constituem os meios mais eficazes de combater atitudes discriminatórias é a",["Convenção sobre os Direitos da Criança.","Carta de Ottawa.","Declaração de Salamanca.","Declaração de Jomtien.","Declaração Universal dos Direitos Humanos."],2,"É a Declaração de Salamanca (1994). Jomtien (1990) é a Declaração Mundial sobre Educação para Todos."],["Conforme a Política Nacional de Educação Especial na Perspectiva da Educação Inclusiva (2008), a educação especial",["é uma modalidade transversal a todos os níveis, etapas e modalidades de ensino.","deve ser oferecida exclusivamente em instituições especializadas.","limita-se ao ensino fundamental.","substitui o ensino comum para os alunos com deficiência.","destina-se apenas a alunos com deficiência intelectual."],0,"A Política define a educação especial como modalidade transversal, que realiza o AEE de forma complementar ou suplementar."],["O público-alvo da educação especial, segundo a Política de 2008, é composto por alunos com",["defasagem idade-série.","deficiência, transtornos globais do desenvolvimento e altas habilidades/superdotação.","doenças crônicas que exigem internação.","dificuldades de aprendizagem de qualquer natureza.","dislexia, discalculia e TDAH."],1,"O público-alvo é: deficiência, TGD e altas habilidades/superdotação. Transtornos de aprendizagem e doenças crônicas não compõem esse público."],["Na LBI, o preconceito e as atitudes que impedem ou prejudicam a participação social da pessoa com deficiência são classificados como barreiras",["tecnológicas.","nos transportes.","arquitetônicas.","urbanísticas.","atitudinais."],4,"Barreiras atitudinais são atitudes ou comportamentos que impedem a participação em igualdade de condições."],["As modificações e ajustes necessários e adequados, que não acarretem ônus desproporcional e indevido, para assegurar à pessoa com deficiência o exercício de direitos em igualdade de condições, são denominados, pela LBI,",["tecnologia assistiva.","atendimento educacional especializado.","adaptações razoáveis.","acessibilidade atitudinal.","desenho universal."],2,"Essa é a definição de adaptações razoáveis. Desenho universal é pensar desde o início para todos, sem precisar adaptar."],["De acordo com a LBI, em relação às instituições privadas de ensino, é correto afirmar que",["podem recusar a matrícula quando não dispuserem de recursos de acessibilidade.","podem cobrar valor adicional para custear o profissional de apoio escolar.","estão dispensadas de oferecer adaptações razoáveis.","só precisam cumprir a LBI no ensino superior.","são proibidas de cobrar valores adicionais em mensalidades, anuidades e matrículas para cumprir as medidas de inclusão."],4,"O art. 28, § 1º, veda a cobrança de valores adicionais. Recusar matrícula por causa da deficiência é crime."],["O Desenho Universal para a Aprendizagem (DUA) orienta o planejamento a partir de",["separação dos alunos por nível de habilidade.","adaptações feitas apenas depois que o aluno com deficiência apresenta dificuldades.","um único formato de aula para garantir igualdade.","múltiplas formas de engajamento, de representação e de ação e expressão.","avaliações padronizadas iguais para todos os alunos."],3,"O DUA propõe, desde o planejamento, múltiplos meios de engajamento, representação e ação/expressão, beneficiando toda a turma."]]},{"id":"E09","m":"esp","t":"AEE, tecnologia assistiva e comunicação alternativa","ed":["E12","E17"],"v":[["ICxSQ2KDSko","Atendimento Educacional Especializado (AEE)"],["vJq4xjsZ0yw","Tecnologia Assistiva e Comunicação Alternativa"]],"obj":["Explicar o que é AEE, onde e quando acontece","Diferenciar AEE complementar e suplementar","Definir tecnologia assistiva e suas categorias","Usar comunicação alternativa no hospital"],"s":[["O que é AEE",[{"lei":"Considera-se atendimento educacional especializado o conjunto de atividades, recursos de acessibilidade e pedagógicos organizados institucional e continuamente, prestado de forma: I – complementar à formação dos estudantes com deficiência, transtornos globais do desenvolvimento [...]; ou II – suplementar à formação de estudantes com altas habilidades ou superdotação.","f":"DECRETO 7.611/2011, ART. 2º, § 1º"},{"t":[["Forma","Para quem"],["Complementar","Estudantes com deficiência e TGD (TEA)"],["Suplementar","Estudantes com altas habilidades ou superdotação"]]},{"a":"O AEE **não substitui** a escolarização na classe comum. Ele elimina barreiras e acontece em articulação com o professor da sala regular."}]],["Onde e como o AEE acontece",["A **Resolução CNE/CEB 4/2009** traz as diretrizes operacionais:",{"l":["O AEE é realizado **prioritariamente na sala de recursos multifuncionais** da própria escola ou de outra escola de ensino regular, **no turno inverso** da escolarização.","Também pode ocorrer em centros de AEE da rede pública ou de instituições comunitárias, confessionais ou filantrópicas sem fins lucrativos conveniadas.","O aluno tem **dupla matrícula** no Fundeb: na classe comum e no AEE.","O professor do AEE elabora e executa o **Plano de AEE**, com os demais professores e com a família."]},{"lei":"Em casos de Atendimento Educacional Especializado em ambiente hospitalar ou domiciliar, será ofertada aos alunos, pelo respectivo sistema de ensino, a Educação Especial de forma complementar ou suplementar.","f":"RESOLUÇÃO CNE/CEB 4/2009, ART. 6º"},"**Salas de recursos multifuncionais** são ambientes com equipamentos, mobiliário e materiais didáticos e pedagógicos para o AEE (Decreto 7.611/2011).","Entre as atribuições do professor do AEE estão: identificar necessidades, produzir recursos de acessibilidade, ensinar e usar tecnologia assistiva, orientar professores e famílias e acompanhar o uso dos recursos na sala comum."]],["Tecnologia assistiva",[{"lei":"Tecnologia assistiva ou ajuda técnica: produtos, equipamentos, dispositivos, recursos, metodologias, estratégias, práticas e serviços que objetivem promover a funcionalidade, relacionada à atividade e à participação da pessoa com deficiência ou com mobilidade reduzida, visando à sua autonomia, independência, qualidade de vida e inclusão social.","f":"LBI, ART. 3º, III"},"Tecnologia assistiva é uma **área do conhecimento interdisciplinar**. Ela inclui **recursos** (objetos, equipamentos) e **serviços** (avaliação, indicação, treino de uso).",{"t":[["Baixa tecnologia","Alta tecnologia"],["Engrossador de lápis, tesoura adaptada, prancha de comunicação em papel, plano inclinado, lupa simples","Leitor de tela, vocalizador, acionador por sopro ou piscar, computador com rastreamento ocular, aplicativos de comunicação"]]},"Categorias comuns: auxílios para a vida diária, **comunicação aumentativa e alternativa**, acessibilidade ao computador, adequação postural, mobilidade, órteses e próteses, recursos para cegos e baixa visão, recursos para surdos."]],["Comunicação aumentativa e alternativa (CAA)",["A CAA atende pessoas sem fala ou com fala insuficiente para se comunicar.",{"l":["**Alternativa**: substitui a fala.","**Aumentativa** (ou suplementar): complementa uma fala que existe, mas é limitada."]},"Recursos: pranchas e cartões com símbolos, fotos ou palavras, vocalizadores, aplicativos em tablet. Quem pode se beneficiar: pessoas com TEA, paralisia cerebral, deficiência múltipla e também **pacientes intubados ou traqueostomizados**, que temporariamente não conseguem falar.",{"ex":"Uma criança traqueostomizada recebe uma prancha com figuras de “dor”, “sede”, “mãe”, “quero brincar” e “sim/não”. Com ela, participa da atividade pedagógica e consegue expressar o que sente."}]]],"r":["AEE: atividades e recursos organizados de forma institucional e contínua.","Complementar (deficiência e TGD) ou suplementar (altas habilidades). Nunca substitutivo.","Prioritariamente na sala de recursos multifuncionais, no turno inverso (Res. 4/2009).","Res. 4/2009, art. 6º: AEE também em ambiente hospitalar ou domiciliar.","Dupla matrícula no Fundeb; Plano de AEE com professores e família.","TA: área interdisciplinar de produtos, recursos, metodologias, estratégias, práticas e serviços para funcionalidade, autonomia e inclusão.","Baixa tecnologia × alta tecnologia.","CAA: alternativa substitui a fala; aumentativa complementa. Serve também para pacientes intubados."],"q":[["Segundo o Decreto nº 7.611/2011, o atendimento educacional especializado deve ser prestado de forma",["suplementar, para estudantes com deficiência, e complementar, para estudantes com altas habilidades.","substitutiva ao ensino regular, para os estudantes com deficiência.","opcional, conforme a disponibilidade da escola.","complementar, para estudantes com deficiência e TGD, ou suplementar, para estudantes com altas habilidades ou superdotação.","exclusiva em instituições especializadas."],3,"Complementar para deficiência e TGD; suplementar para altas habilidades. A troca entre as duas palavras é a pegadinha clássica."],["De acordo com a Resolução CNE/CEB nº 4/2009, o AEE deve ser realizado prioritariamente",["na própria sala de aula comum, durante as aulas regulares.","em horário noturno, após as aulas.","na sala de recursos multifuncionais, no turno inverso ao da escolarização.","no domicílio do aluno, em todos os casos.","em escola especial, em substituição à classe comum."],2,"A Resolução 4/2009 fala em sala de recursos multifuncionais da própria escola ou de outra, no turno inverso."],["A Resolução CNE/CEB nº 4/2009 prevê, para os casos de AEE em ambiente hospitalar ou domiciliar, que",["o aluno perde o direito ao AEE durante a internação.","o AEE só pode acontecer após a alta hospitalar.","será ofertada pelo respectivo sistema de ensino a educação especial de forma complementar ou suplementar.","a família deve contratar profissional particular.","o atendimento fica sob responsabilidade exclusiva da equipe médica."],2,"O art. 6º garante a oferta, pelo sistema de ensino, da educação especial complementar ou suplementar em ambiente hospitalar ou domiciliar."],["Assinale a alternativa que apresenta corretamente o conceito de tecnologia assistiva.",["Programa governamental de distribuição de computadores nas escolas.","Área do conhecimento, de característica interdisciplinar, que engloba produtos, recursos, metodologias, estratégias, práticas e serviços que promovem funcionalidade, autonomia e inclusão.","Conjunto de adaptações arquitetônicas em prédios públicos.","Conjunto de equipamentos eletrônicos de alto custo destinados exclusivamente a pessoas cegas.","Terapia realizada exclusivamente por fisioterapeutas."],1,"Tecnologia assistiva inclui produtos, metodologias, estratégias, práticas e serviços. Não se limita a equipamentos caros."],["São exemplos de tecnologia assistiva de baixa tecnologia:",["aplicativo de comunicação em tablet e impressora braile.","vocalizador e leitor de tela.","implante coclear e cadeira de rodas motorizada.","computador com rastreamento ocular e acionador por sopro.","engrossador de lápis e prancha de comunicação em papel."],4,"Engrossador de lápis e prancha em papel são recursos simples, de baixa tecnologia. As outras opções trazem recursos de alta tecnologia."],["A comunicação aumentativa e alternativa (CAA) é indicada para",["pessoas sem fala ou com fala insuficiente, incluindo pacientes temporariamente impossibilitados de falar, como os intubados.","exclusivamente crianças com TEA.","crianças que ainda não foram alfabetizadas.","alunos com dislexia, para substituir a leitura.","apenas pessoas surdas usuárias de Libras."],0,"A CAA atende quem não tem fala funcional por diversas razões, inclusive temporárias, como intubação ou traqueostomia."],["Informe se é verdadeiro (V) ou falso (F) e assinale a sequência correta.\n( ) O AEE pode substituir a escolarização na classe comum quando a família desejar.\n( ) O aluno atendido no AEE é computado em dupla matrícula no Fundeb.\n( ) O Plano de AEE é elaborado pelo professor do AEE em articulação com os demais professores e com a família.\n( ) A tecnologia assistiva abrange apenas produtos, e não serviços.",["F – V – V – F.","V – F – V – F.","F – F – V – V.","V – V – F – F.","F – V – F – V."],0,"O AEE não substitui a classe comum (F). Há dupla matrícula (V). O Plano de AEE é articulado com professores e família (V). TA abrange também serviços (F)."],["Uma criança de 7 anos está traqueostomizada e não consegue falar, mas compreende bem o que ouve. Para viabilizar sua participação nas atividades pedagógicas no leito, o pedagogo deve priorizar",["atividades em que ela apenas observe, sem precisar se expressar.","uma prancha de comunicação alternativa com figuras e palavras, construída com a criança e a equipe.","comunicação apenas por meio da família.","esperar a retirada da traqueostomia para iniciar o atendimento.","exercícios orais de leitura em voz alta."],1,"A CAA garante que a criança expresse escolhas, sentimentos e respostas. A prancha deve ser construída com ela e com a equipe de saúde."]]},{"id":"E10","m":"esp","t":"Avaliação pedagógica: funções, concepções e prática no hospital","ed":["E6","E18"],"v":[["Y6QKkZ6qMuI","Avaliação escolar: diagnóstica, formativa e somativa"],["4KJMqbWUaZU","Avaliação de aprendizagem somativa, formativa e diagnóstica"]],"obj":["Diferenciar avaliação diagnóstica, formativa e somativa","Relacionar autores às suas concepções de avaliação","Conhecer o que a LDB diz sobre verificação do rendimento","Avaliar a criança hospitalizada de forma adequada"],"s":[["As três funções da avaliação",[{"t":[["Função","Quando","Para que serve"],["Diagnóstica","No início (de um curso, unidade ou atendimento)","Identificar o que o aluno já sabe, suas dificuldades e possíveis causas; base para planejar"],["Formativa","Durante o processo","Acompanhar, dar retorno e ajustar o ensino; regular a aprendizagem"],["Somativa","No final","Fazer um balanço, atribuir nota ou conceito, classificar, certificar"]]},"Os termos **formativa** e **somativa** foram propostos por **Michael Scriven** (1967) e popularizados por **Benjamin Bloom**.",{"a":"A função diagnóstica não é só “prova no primeiro dia”. Ela investiga conhecimentos prévios, interesses e necessidades para orientar o planejamento, e pode ocorrer sempre que algo novo começa."}]],["Autores que caem em prova",[{"l":["**Cipriano Luckesi**: diferencia **avaliação** de **exame**. O exame é classificatório, seletivo e pontual; a avaliação é **diagnóstica**, inclusiva e serve à **tomada de decisão** para melhorar a aprendizagem.","**Jussara Hoffmann**: **avaliação mediadora**. O professor acompanha, dialoga e intervém; o erro é visto como hipótese a ser compreendida.","**Philippe Perrenoud**: avaliação formativa como **regulação** das aprendizagens, a serviço de quem aprende.","**Ana Maria Saul**: **avaliação emancipatória**, que busca a consciência crítica dos envolvidos."]}]],["O que diz a LDB",[{"lei":"A verificação do rendimento escolar observará os seguintes critérios: a) avaliação contínua e cumulativa do desempenho do aluno, com prevalência dos aspectos qualitativos sobre os quantitativos e dos resultados ao longo do período sobre os de eventuais provas finais; [...] e) obrigatoriedade de estudos de recuperação, de preferência paralelos ao período letivo, para os casos de baixo rendimento escolar [...].","f":"LEI 9.394/1996, ART. 24, V"},{"a":"Duas trocas comuns da banca: “prevalência dos aspectos **quantitativos**” (errado, são os qualitativos) e recuperação “ao final do ano letivo” (a lei diz de preferência **paralela** ao período letivo)."}]],["Instrumentos",["Observação com registro, ficha de acompanhamento, portfólio, relatório descritivo, autoavaliação, produções da criança, provas adaptadas e rubricas (critérios por níveis de desempenho). Quanto mais variados, mais completa a avaliação."]],["Avaliação no hospital",[{"l":["**Começa com diagnóstico**: história escolar, série, contato com a escola de origem, interesses, o que a criança já sabe e as condições clínicas do dia.","**É processual e flexível**: o estado de saúde muda, e a avaliação acompanha esse ritmo. Um dia ruim não define a aprendizagem.","**Registra tudo**: frequência, atividades, avanços e dificuldades em ficha ou diário do atendimento.","**Gera relatório**: o relatório pedagógico subsidia a escola de origem e a certificação de frequência.","**Respeita adaptações**: para crianças com deficiência, considera o progresso individual."]},"Avaliação pedagógica não se confunde com avaliação clínica. O pedagogo avalia aprendizagem e desenvolvimento escolar; quem avalia a condição de saúde é a equipe de saúde. As duas conversam."]]],"r":["Diagnóstica (início, conhecer e planejar), formativa (durante, regular), somativa (final, classificar/certificar).","Scriven criou os termos formativa e somativa; Bloom difundiu.","Luckesi: avaliação × exame; avaliação diagnóstica para tomada de decisão.","Hoffmann: avaliação mediadora. Perrenoud: regulação. Saul: emancipatória.","LDB art. 24, V: contínua e cumulativa, qualitativo sobre quantitativo; recuperação de preferência paralela.","No hospital: diagnóstica inicial, processual, flexível ao quadro clínico, registros e relatório para a escola."],"q":[["A avaliação realizada no início de um processo, com o objetivo de identificar conhecimentos prévios, dificuldades e necessidades dos alunos para orientar o planejamento, é denominada",["somativa.","cumulativa.","diagnóstica.","classificatória.","certificativa."],2,"É a avaliação diagnóstica. A somativa acontece no fim e tem caráter de balanço e certificação."],["A avaliação que ocorre ao longo do processo de ensino, oferecendo retorno ao aluno e ao professor para ajustar as estratégias, corresponde à função",["classificatória.","formativa.","seletiva.","somativa.","diagnóstica inicial."],1,"A avaliação formativa acompanha e regula o processo durante o ensino."],["Para Cipriano Luckesi, diferentemente do exame, a avaliação da aprendizagem",["tem caráter classificatório e seletivo.","é pontual e se encerra na atribuição da nota.","deve ser aplicada apenas ao final do ano letivo.","é diagnóstica e está a serviço da tomada de decisão para melhorar a aprendizagem.","dispensa o acolhimento da situação do educando."],3,"Luckesi opõe exame (classificatório, seletivo) e avaliação (diagnóstica, inclusiva, voltada à decisão)."],["A concepção de avaliação mediadora, na qual o professor acompanha o processo, dialoga com o aluno e interpreta o erro como hipótese, está associada a",["Jussara Hoffmann.","Howard Gardner.","Jean Piaget.","B. F. Skinner.","Michael Scriven."],0,"A avaliação mediadora é de Jussara Hoffmann."],["De acordo com a LDB, a verificação do rendimento escolar observará, entre outros critérios,",["avaliação pontual, com prevalência dos aspectos quantitativos.","avaliação contínua e cumulativa, com prevalência dos aspectos qualitativos sobre os quantitativos.","proibição de avanço nos cursos e nas séries.","prevalência dos resultados das provas finais sobre os obtidos ao longo do período.","recuperação obrigatória apenas ao final do ano letivo."],1,"A LDB fala em avaliação contínua e cumulativa, com prevalência do qualitativo e dos resultados ao longo do período. A recuperação é, de preferência, paralela, e o avanço mediante verificação é permitido."],["Os termos avaliação formativa e avaliação somativa foram propostos originalmente por",["Henri Wallon.","Lev Vygotsky.","Paulo Freire.","Michael Scriven.","Jussara Hoffmann."],3,"Scriven propôs os termos em 1967; Bloom os difundiu na educação."],["Analise as afirmativas sobre a avaliação pedagógica no contexto hospitalar.\nI. Deve considerar o estado clínico da criança no dia do atendimento.\nII. Deve ser idêntica à aplicada na escola de origem, sem qualquer adaptação.\nIII. Os registros do atendimento podem subsidiar relatório para a escola de origem.\nIV. Substitui a avaliação clínica feita pela equipe de saúde.\nEstão corretas apenas",["II e IV.","I e II.","I, III e IV.","III e IV.","I e III."],4,"A avaliação no hospital considera o quadro clínico e gera registros e relatórios. Ela precisa de adaptações e não substitui a avaliação clínica."],["Ao receber uma criança de 10 anos recém-internada para tratamento prolongado, a primeira ação avaliativa do pedagogo deve ser",["atribuir nota zero até que ela retorne à escola.","aplicar imediatamente a prova bimestral da série.","fazer uma avaliação diagnóstica, levantando a história escolar, o contato com a escola de origem, os interesses e o que a criança já sabe.","aguardar a alta para avaliar.","avaliar apenas aspectos de comportamento."],2,"O atendimento começa com uma avaliação diagnóstica, que orienta o planejamento individual."]]},{"id":"E11","m":"esp","t":"Pedagogia hospitalar: conceito, histórico e modalidades","ed":["E1"],"v":[["kffk6ZnxkoY","Pedagogia Hospitalar"],["WdpBhWSLdpI","Curso de Pedagogia Hospitalar"]],"obj":["Definir pedagogia hospitalar e diferenciá-la de classe hospitalar","Distinguir classe hospitalar e atendimento pedagógico domiciliar","Ordenar os marcos históricos na França e no Brasil","Relacionar autores aos seus conceitos"],"s":[["O que é pedagogia hospitalar",["Pedagogia hospitalar é a atuação pedagógica em hospitais e serviços de saúde. O objetivo é que a criança ou o adolescente em tratamento **continue se desenvolvendo e aprendendo** e que consiga **voltar para a escola** sem perder o vínculo com os estudos.","Ela vai além de dar aula no hospital. Envolve **escuta**, **acolhimento**, **ludicidade** e apoio emocional por meio de atividades educativas. A ação pedagógica também **humaniza** o atendimento de saúde.",{"a":"Alternativa que reduz a pedagogia hospitalar a reforço escolar, ou só a recreação, costuma estar errada. O trabalho junta aprendizagem, desenvolvimento integral e humanização."},"As autoras **Elizete Matos e Margarida Mugiatti** tratam a pedagogia hospitalar como algo **mais amplo** que a classe hospitalar: uma ação educativa que integra educação e saúde. Elas também descrevem a **hospitalização escolarizada**: atendimento **personalizado** ao escolar hospitalizado por longos períodos, que respeita o ano escolar e o currículo de cada criança."]],["As duas modalidades oficiais",["O documento do MEC de 2002, **Classe hospitalar e atendimento pedagógico domiciliar: estratégias e orientações**, é a principal referência oficial.",{"t":[["Modalidade","Onde acontece","Para quem"],["Classe hospitalar","Em ambientes de tratamento de saúde: internação, hospital-dia, hospital-semana, serviços de saúde mental","Quem está em tratamento e não pode frequentar a escola"],["Atendimento pedagógico domiciliar","Na casa do aluno ou em casas de apoio, de passagem e casas-lar","Quem precisa ficar fora da escola por problema de saúde"]]},"O atendimento alcança crianças, jovens e adultos da **educação básica**, **matriculados ou não** nos sistemas de ensino.",{"l":["**Professor**: formação pedagógica, preferencialmente em educação especial, Pedagogia ou licenciaturas, e noções sobre as doenças e as condições psicossociais vividas pelos alunos.","**Espaço**: sala com mobiliário adequado e bancada com pia, instalações sanitárias próprias e adaptadas, área ao ar livre para atividades físicas e lúdicas, quando possível.","**Integração**: a classe hospitalar mantém vínculo com a escola de origem e a frequência é registrada para fins de certificação."]}]],["Linha do tempo",[{"t":[["Quando","Onde","O que aconteceu"],["1935","França","Henri Sellier inaugura, perto de Paris, uma escola para crianças consideradas inadaptadas. É o marco inicial mais citado."],["1939","França","Surge o CNEFEI, em Suresnes, que passa a formar professores para atuar com crianças hospitalizadas."],["Pós-Segunda Guerra","Europa","Muitas crianças e jovens feridos ou doentes aceleram a criação de classes hospitalares."],["1950","Brasil","Primeira classe hospitalar do país, no **Hospital Municipal Jesus**, no Rio de Janeiro."]]},{"a":"Guarde a dupla da prova: **1950 + Hospital Jesus (RJ)**."}]],["Autores que a banca pode citar",[{"l":["**Matos e Mugiatti**: pedagogia hospitalar como humanização que integra educação e saúde; hospitalização escolarizada.","**Eneida Simões da Fonseca**: mapeou as classes hospitalares no Brasil e defende o caráter escolar desse atendimento.","**Ricardo Burg Ceccim**: conceito de **escuta pedagógica**, ouvir a criança para entender medos, desejos e necessidades e partir disso no trabalho pedagógico."]}]]],"r":["Pedagogia hospitalar = aprender + desenvolver + humanizar; vai além da classe hospitalar.","MEC 2002: classe hospitalar (ambiente de tratamento) e atendimento pedagógico domiciliar (casa ou casas de apoio).","Atende alunos da educação básica, matriculados ou não.","Hospitalização escolarizada (Matos e Mugiatti): atendimento personalizado que segue o currículo da série.","França 1935 (Sellier) e 1939 (CNEFEI); Brasil 1950, Hospital Municipal Jesus (RJ).","Fonseca: classe hospitalar. Ceccim: escuta pedagógica."],"q":[["Sobre a pedagogia hospitalar, assinale a alternativa correta.",["Dispensa a articulação com a equipe de saúde, por ser uma atividade exclusivamente educacional.","Busca dar continuidade ao desenvolvimento e à aprendizagem da criança ou do adolescente em tratamento, contribuindo também para a humanização do atendimento.","Tem como finalidade exclusiva o reforço dos conteúdos escolares atrasados.","Restringe-se a atividades recreativas que distraem a criança durante a internação.","Só pode ser oferecida a estudantes regularmente matriculados na rede pública de ensino."],1,"A pedagogia hospitalar une aprendizagem, desenvolvimento e humanização. D e C reduzem seu papel, E erra porque o atendimento alcança alunos matriculados ou não, e A contraria o trabalho integrado com a saúde."],["De acordo com as orientações do MEC (2002), o atendimento educacional que ocorre no ambiente doméstico, para o aluno impedido de frequentar a escola por problema de saúde, denomina-se",["sala de recursos multifuncional.","atendimento pedagógico domiciliar.","educação a distância.","classe hospitalar.","brinquedoteca terapêutica."],1,"Na casa do aluno, ou em casas de apoio, é atendimento pedagógico domiciliar. Classe hospitalar acontece no ambiente de tratamento de saúde."],["A primeira classe hospitalar do Brasil foi criada em 1950, no(a)",["Hospital Municipal Jesus, no Rio de Janeiro.","Santa Casa de Misericórdia de Belém.","Hospital de Base de Brasília.","Hospital de Clínicas de Porto Alegre.","Hospital das Clínicas de São Paulo."],0,"Hospital Municipal Jesus, no Rio de Janeiro, em 1950."],["Segundo o documento do MEC (2002), a classe hospitalar pode ocorrer",["apenas para crianças de 6 a 14 anos.","apenas na enfermaria pediátrica, durante a internação.","somente em hospitais universitários.","em ambientes de tratamento de saúde, como internação, hospital-dia, hospital-semana e serviços de saúde mental.","exclusivamente em escolas próximas ao hospital."],3,"O documento cita internação, hospital-dia, hospital-semana e serviços de atenção integral à saúde mental."],["Um menino de 9 anos, internado por longo período, recebe atendimento pedagógico individual que acompanha o currículo do ano escolar que ele cursa. Segundo Matos e Mugiatti, essa forma de atendimento personalizado é chamada de",["atendimento educacional especializado.","brinquedoteca hospitalar.","hospitalização escolarizada.","recreação terapêutica.","classe multisseriada."],2,"Hospitalização escolarizada é o atendimento personalizado ao escolar internado por longos períodos, respeitando sua série e currículo."],["O conceito de escuta pedagógica, associado ao trabalho com a criança hospitalizada, é de autoria de",["Jean Piaget.","Eneida Simões da Fonseca.","Magda Soares.","Henri Sellier.","Ricardo Burg Ceccim."],4,"Ceccim propôs a escuta pedagógica: ouvir a criança para orientar a ação educativa a partir de suas necessidades."],["Considere as afirmativas. I. A classe hospitalar pode funcionar em hospital-dia. II. A pedagogia hospitalar teve marcos iniciais na França, na década de 1930. III. O atendimento pedagógico hospitalar destina-se somente a crianças de 6 a 14 anos. Está correto o que se afirma em",["II, apenas.","I, apenas.","I e II, apenas.","II e III, apenas.","I, II e III."],2,"I e II estão corretas. III erra porque o atendimento alcança crianças, jovens e adultos da educação básica."],["Em uma ala infantil, há crianças internadas por longos períodos que precisam dar continuidade aos conteúdos escolares regulares. Para isso, o pedagogo deve propor",["um centro de atendimento à família.","a criação de um parque infantil.","uma área de lazer para as crianças.","a implantação de uma classe hospitalar.","uma brinquedoteca."],3,"Continuidade dos conteúdos escolares é função da classe hospitalar. Brinquedoteca e áreas de lazer têm outra finalidade."]]},{"id":"E12","m":"esp","t":"Legislação da classe hospitalar e direitos da criança hospitalizada","ed":["E1","E13","E20"],"v":[["z33hEFMbHyw","Política Nacional (2008) e Resolução CNE/CEB 2/2001"],["Y-ec-_O5JrQ","Programa Classe Hospitalar"]],"obj":["Associar cada norma ao seu ano e ideia principal","Conhecer o art. 4º-A da LDB","Dominar o art. 13 da Resolução CNE/CEB 2/2001","Diferenciar brinquedoteca, exercícios domiciliares e direitos da criança hospitalizada"],"s":[["Quadro das normas",["Esta parte é decoreba de “qual norma diz o quê”. Associe cada norma ao ano e à ideia principal. Vale fazer cartões de memória.",{"t":[["Norma","O que garante"],["CF/88, art. 205","Educação é direito de todos e dever do Estado e da família."],["Decreto-Lei 1.044/1969","Exercícios domiciliares, com acompanhamento da escola, para estudantes com condições de saúde que impedem a frequência, como compensação da ausência às aulas."],["Lei 6.202/1975","Exercícios domiciliares para a estudante gestante, a partir do 8º mês, por 3 meses."],["Resolução CONANDA 41/1995","Direitos da criança e do adolescente hospitalizados, como recreação, educação para a saúde e acompanhamento do currículo escolar durante a internação."],["Resolução CNE/CEB 2/2001, art. 13","Classes hospitalares e atendimento domiciliar organizados pelos sistemas de ensino, integrados aos de saúde."],["MEC, 2002","Documento Classe hospitalar e atendimento pedagógico domiciliar: estratégias e orientações."],["Lei 11.104/2005","Brinquedoteca obrigatória nas unidades de saúde com atendimento pediátrico em regime de internação."],["Lei 13.716/2018","Incluiu o art. 4º-A na LDB: atendimento educacional ao aluno internado."]]}]],["LDB, art. 4º-A",[{"lei":"É assegurado atendimento educacional, durante o período de internação, ao aluno da educação básica internado para tratamento de saúde em regime hospitalar ou domiciliar por tempo prolongado, conforme dispuser o Poder Público em regulamento, na esfera de sua competência federativa.","f":"LEI 9.394/1996, ART. 4º-A (INCLUÍDO PELA LEI 13.716/2018)"},{"l":["Vale para a **educação básica** (educação infantil, ensino fundamental e médio).","Cobre o regime **hospitalar** e o **domiciliar**.","Exige internação **por tempo prolongado**.","Cada ente regulamenta na **sua esfera** de competência."]}]],["Resolução CNE/CEB 2/2001, art. 13",[{"l":["**Quem organiza**: os sistemas de ensino, em ação integrada com os sistemas de saúde.","**Para quem**: alunos impossibilitados de frequentar as aulas por internação hospitalar, atendimento ambulatorial ou permanência prolongada em domicílio.","**Finalidade**: dar continuidade ao processo de desenvolvimento e aprendizagem dos alunos matriculados, contribuindo para o **retorno e a reintegração** ao grupo escolar.","**Quem não está matriculado**: recebe currículo flexibilizado, que facilita seu acesso posterior à escola regular.","**Frequência**: é certificada com base no **relatório** elaborado pelo professor que atende o aluno."]},{"a":"O art. 13 fala em ação integrada entre **educação e saúde**. Alternativa que atribui a organização só ao hospital ou só à escola está errada."}]],["Brinquedoteca: Lei 11.104/2005",["A lei obriga os hospitais que oferecem **atendimento pediátrico em regime de internação** a terem **brinquedoteca**. A regra vale para qualquer unidade de saúde nessas condições.","Brinquedoteca é o **espaço provido de brinquedos e jogos educativos, destinado a estimular as crianças e seus acompanhantes a brincar**. A Portaria MS 2.261/2005 regulamentou o funcionamento, com atenção às normas de higiene e controle de infecção.",{"a":"Brinquedoteca e classe hospitalar são coisas diferentes. A brinquedoteca é espaço do brincar; a classe hospitalar é atendimento educacional com vínculo escolar."}]],["Para não confundir",[{"t":[["Se a questão fala em...","Pense em..."],["Brinquedoteca","Lei 11.104/2005"],["Art. 4º-A da LDB, aluno internado","Lei 13.716/2018"],["Direitos da criança hospitalizada","Resolução CONANDA 41/1995"],["Gestante, 8º mês","Lei 6.202/1975"],["Exercícios domiciliares por doença","Decreto-Lei 1.044/1969"],["Ação integrada educação e saúde, relatório do professor","Resolução CNE/CEB 2/2001, art. 13"]]}]]],"r":["Decreto-Lei 1.044/1969: exercícios domiciliares por doença. Lei 6.202/1975: gestante.","CONANDA 41/1995: direitos da criança e do adolescente hospitalizados.","Res. CNE/CEB 2/2001, art. 13: ação integrada ensino e saúde; continuidade e reintegração; frequência certificada por relatório.","MEC 2002: documento de orientações.","Lei 11.104/2005: brinquedoteca nas unidades com pediatria em internação.","Lei 13.716/2018: art. 4º-A da LDB, educação básica, hospitalar ou domiciliar, tempo prolongado."],"q":[["A Lei nº 11.104/2005 dispõe sobre",["o atendimento educacional ao aluno da educação básica internado para tratamento de saúde.","a obrigatoriedade de brinquedotecas nas unidades de saúde que ofereçam atendimento pediátrico em regime de internação.","os direitos da criança e do adolescente hospitalizados.","o regime de exercícios domiciliares da estudante gestante.","a Política Nacional de Educação Especial na Perspectiva da Educação Inclusiva."],1,"Lei 11.104/2005 é a lei da brinquedoteca. A é o art. 4º-A da LDB; C é a Resolução CONANDA 41/1995; D é a Lei 6.202/1975."],["O art. 4º-A, incluído na LDB pela Lei nº 13.716/2018, assegura",["atendimento educacional, durante o período de internação, ao aluno da educação básica internado para tratamento de saúde em regime hospitalar ou domiciliar por tempo prolongado.","exercícios domiciliares à estudante gestante a partir do oitavo mês.","a matrícula prioritária de crianças com doenças crônicas.","professor de apoio para todo estudante com deficiência.","a criação de brinquedotecas em todas as escolas públicas."],0,"É o texto quase literal do art. 4º-A. Atenção aos detalhes: educação básica, hospitalar ou domiciliar, tempo prolongado."],["Segundo a Resolução CNE/CEB nº 2/2001, as classes hospitalares e o atendimento em ambiente domiciliar devem",["atender apenas alunos com deficiência.","dar continuidade ao processo de desenvolvimento e aprendizagem, contribuindo para o retorno e a reintegração do aluno ao grupo escolar.","substituir definitivamente a matrícula do aluno na escola regular.","ser organizados exclusivamente pelos sistemas de saúde.","atender somente internações superiores a 30 dias."],1,"A finalidade é a continuidade e o retorno à escola. A organização é integrada entre ensino e saúde, e a norma não fixa prazo de 30 dias."],["O direito da criança e do adolescente hospitalizados de desfrutar de recreação, programas de educação para a saúde e acompanhamento do currículo escolar durante a internação está previsto",["na Lei nº 6.202/1975.","no Decreto-Lei nº 1.044/1969.","na Lei nº 11.104/2005.","na Resolução CONANDA nº 41/1995.","no Decreto nº 7.611/2011."],3,"Resolução CONANDA 41/1995, sobre os direitos da criança e do adolescente hospitalizados. O Decreto 7.611/2011 trata do AEE."],["A Lei nº 6.202/1975 atribui à estudante em estado de gravidez",["o regime de exercícios domiciliares a partir do oitavo mês de gestação, durante três meses.","matrícula automática em classe hospitalar.","dispensa de avaliações durante toda a gestação.","licença de 30 dias sem prejuízo da frequência.","atendimento educacional especializado no contraturno."],0,"A Lei 6.202/1975 estende à gestante o regime de exercícios domiciliares do Decreto-Lei 1.044/1969: a partir do 8º mês, por 3 meses."],["De acordo com a Resolução CNE/CEB nº 2/2001, a certificação de frequência do aluno atendido em classe hospitalar deve ser realizada",["somente após a alta e a realização de prova de recuperação.","pela direção do hospital, com base no prontuário médico.","mediante atestado assinado pelos responsáveis.","com base no relatório elaborado pelo professor que atende o aluno.","pelo Conselho Tutelar."],3,"A frequência é certificada com base no relatório do professor da classe hospitalar ou do atendimento domiciliar."],["O Decreto-Lei nº 1.044/1969 prevê, para estudantes com condições de saúde que os impeçam de frequentar as aulas,",["transferência compulsória para escola especial.","reprovação automática por faltas.","exercícios domiciliares com acompanhamento da escola, como compensação da ausência às aulas, quando compatíveis com o estado de saúde.","dispensa integral das atividades escolares do ano letivo.","classe hospitalar obrigatória em todos os hospitais."],2,"O decreto-lei criou o regime de exercícios domiciliares como compensação da ausência às aulas."],["Assinale a alternativa que associa corretamente a norma ao seu conteúdo.",["Decreto-Lei nº 1.044/1969 – educação bilíngue de surdos.","Lei nº 13.716/2018 – brinquedotecas hospitalares.","Lei nº 6.202/1975 – Política Nacional de Educação Especial.","Lei nº 11.104/2005 – atendimento educacional ao aluno internado (art. 4º-A da LDB).","Resolução CONANDA nº 41/1995 – direitos da criança e do adolescente hospitalizados."],4,"Só E está correta. B e D estão trocadas entre si; C e A não correspondem ao conteúdo das normas."]]},{"id":"E13","m":"esp","t":"A criança hospitalizada: escuta, acolhimento e cuidados no atendimento","ed":["E4","E15","E19"],"v":[["_-Ja6QgD--w","Criança hospitalizada: quando o tratamento passa pela brincadeira"],["z8fxSIXMn90","Pedagogia Hospitalar"]],"obj":["Compreender como a internação afeta a criança e sua aprendizagem","Aplicar a escuta pedagógica","Organizar o atendimento no leito e em grupo","Conhecer cuidados de biossegurança, incluindo os tipos de isolamento"],"s":[["O que a internação muda",["A criança internada continua sendo criança: tem curiosidade, vontade de brincar, de aprender e de ter controle sobre algo. Ao mesmo tempo, vive dor, medo, procedimentos invasivos, afastamento da família ampliada, dos amigos e da escola.",{"l":["Tempo de internação **incerto**: pode ser curto, médio, longo ou com **reinternações** frequentes, como nas doenças crônicas.","**Rotina do hospital** manda no horário: exames, medicação e visitas médicas têm prioridade.","**Grupo heterogêneo**: idades, séries e condições clínicas muito diferentes ao mesmo tempo, como numa turma multisseriada.","**Alta rotatividade**: a criança de hoje pode ter alta amanhã. Cada atendimento precisa ter começo, meio e fim."]}]],["Escuta pedagógica",["Ricardo Ceccim propõe a **escuta pedagógica**. Escutar não é só ouvir sons: é estar atento ao que a criança expressa por palavras, desenhos, brincadeiras e silêncios, para entender **necessidades, desejos e medos**, e partir disso para o trabalho educativo.","A escuta reconhece a criança como **sujeito**, e não como “o leito 12” ou “a leucemia”. Ela ajuda a criança a dar sentido ao que vive e a manter projetos para o futuro.",{"a":"Na prova, “escuta pedagógica” aparece ligada a acolhimento, atenção integral e protagonismo da criança. Não confunda com escuta clínica ou terapia: o pedagogo não faz psicoterapia."}]],["Como organizar o atendimento",[{"l":["**No leito (beira-leito)**: quando a criança não pode sair do quarto. Atividades individuais, com material que caiba na mesa de refeição.","**Em sala (classe hospitalar)**: quando ela pode se deslocar. Atividades em grupo, respeitando níveis diferentes.","**Sempre com a equipe**: confirmar com a enfermagem as condições do dia, restrições (jejum, repouso, isolamento) e horários de procedimentos.","**Com consentimento**: a criança pode recusar a atividade naquele momento. Respeitar o “não” também é educativo.","**Em cuidados paliativos**: o direito de aprender continua. Atividades com sentido, que valorizem desejos, memórias e qualidade de vida."]},"Em situações de crise emocional (choro intenso, ansiedade, crise após uma visita), a postura do pedagogo é de **calma**: falar com tranquilidade, oferecer conforto, ajudar a criança a se sentar ou deitar e chamar a equipe se necessário. Não se contém fisicamente nem se dá medicação: isso é atribuição da equipe de saúde."]],["Biossegurança: o básico que cai",["O pedagogo circula entre pacientes e precisa proteger a criança e a si mesmo.",{"l":["**Higiene das mãos** antes e depois de cada atendimento.","Materiais **laváveis** ou **descartáveis**; brinquedos e livros higienizados entre usos (por exemplo, com álcool 70% quando o material permitir).","Não compartilhar material entre pacientes em isolamento sem higienização."]},{"t":[["Tipo de isolamento","O que significa","Cuidado do pedagogo"],["De contato","Transmissão por contato com pele, secreções, sangue, urina","Luvas e avental conforme orientação; material exclusivo ou descartável"],["Respiratório (gotículas ou aerossóis)","Transmissão pelo ar, por gotículas ou partículas","Máscara adequada indicada pela equipe"],["Protetor (reverso)","O paciente está com **imunidade baixa** e precisa ser protegido de infecções trazidas por visitantes e profissionais","Rigor na higiene, máscara se indicada, nada de entrar gripado; materiais novos ou bem higienizados"]]},{"a":"No isolamento **protetor**, quem está em risco é a **criança** (imunidade baixa), não quem a visita."}]]],"r":["Internação: tempo incerto, rotina hospitalar prioritária, grupos heterogêneos, alta rotatividade.","Cada atendimento deve ter começo, meio e fim.","Escuta pedagógica (Ceccim): atenção ao que a criança expressa para orientar o trabalho; não é terapia.","Atendimento no leito ou em sala, sempre combinado com a equipe e respeitando o consentimento da criança.","Em crise: calma, conforto, chamar a equipe. Conter e medicar não são atribuições do pedagogo.","Isolamento de contato, respiratório e protetor (reverso); no protetor, a criança está imunossuprimida."],"q":[["Sobre a escuta pedagógica no contexto hospitalar, é correto afirmar que",["consiste em ouvir a família para planejar as atividades, sem envolver a criança.","é uma técnica de psicoterapia realizada pelo pedagogo.","deve ser feita apenas após a alta hospitalar.","busca compreender necessidades, desejos e medos da criança, expressos por diferentes linguagens, para orientar a ação educativa.","limita-se à aplicação de questionários sobre o conteúdo escolar."],3,"A escuta pedagógica é atenção ao que a criança expressa para orientar o trabalho educativo. Não é psicoterapia e não exclui a criança."],["Em relação às atividades pedagógicas com crianças em isolamento protetor, o pedagogo deve estar ciente de que",["o isolamento indica transmissão de microrganismos pelo contato com a pele, o suor e a urina do paciente.","nenhum cuidado especial é necessário.","a doença é transmitida pela respiração, exigindo luvas.","há risco de o pedagogo ser contaminado por gotículas ou aerossóis.","o paciente está com a imunidade baixa e pode adquirir mais facilmente infecções transmitidas por visitantes ou profissionais."],4,"No isolamento protetor (reverso), a criança está imunossuprimida e é ela quem precisa ser protegida."],["Considerando a rotatividade e a imprevisibilidade da internação, a organização mais adequada das atividades pedagógicas no hospital é",["planejar sequências longas que só fazem sentido se concluídas ao longo de várias semanas.","seguir rigidamente o cronograma da escola de origem.","propor atividades com começo, meio e fim no mesmo atendimento, articuladas a um planejamento flexível.","trabalhar apenas com recreação, sem objetivos de aprendizagem.","aguardar a alta para iniciar conteúdos novos."],2,"Como a criança pode ter alta ou piorar a qualquer momento, cada atendimento deve ser completo em si, dentro de um planejamento flexível."],["Durante o atendimento, uma criança tem uma crise de choro intenso e ansiedade logo após a saída da visita da família. A conduta adequada do pedagogo é",["agir com tranquilidade, conversar de forma acolhedora, ajudar a criança a se sentar ou deitar e acionar a equipe se necessário.","oferecer um calmante disponível no posto de enfermagem.","encerrar o atendimento e deixar a criança sozinha para se acalmar.","insistir firmemente para que ela pare de chorar.","conter fisicamente a criança para que não se machuque."],0,"Calma, acolhimento e acionamento da equipe. Conter e medicar não são atribuições do pedagogo."],["Antes de iniciar o atendimento no leito, o pedagogo deve",["iniciar a atividade independentemente do estado da criança.","verificar com a equipe de enfermagem as condições clínicas do dia, as restrições e os horários de procedimentos.","pedir que os procedimentos sejam remarcados para depois da atividade.","solicitar o prontuário completo para estudar o diagnóstico.","consultar apenas a escola de origem."],1,"O trabalho é integrado: a equipe informa restrições e horários. Procedimentos de saúde têm prioridade."],["Uma criança de 8 anos diz que hoje não quer fazer a atividade proposta. Considerando os princípios do atendimento pedagógico hospitalar, o pedagogo deve",["comunicar o fato ao médico como indisciplina.","encerrar definitivamente o atendimento dessa criança.","registrar falta e informar a escola de origem.","respeitar a recusa naquele momento, conversar sobre como ela está e oferecer outra possibilidade ou outro horário.","insistir, pois a frequência é obrigatória."],3,"Respeitar o “não” reconhece a criança como sujeito, num ambiente em que ela decide pouca coisa. O pedagogo acolhe e negocia."],["A presença simultânea de crianças de idades, séries e condições clínicas diferentes na classe hospitalar exige do pedagogo",["separar as crianças por idade, atendendo um grupo por semana.","atender apenas as crianças da mesma série.","dispensar o planejamento.","aplicar a mesma atividade, no mesmo nível, para todos.","propor atividades com diferentes níveis de desafio e trabalho a partir de temas comuns."],4,"A turma é heterogênea, como uma classe multisseriada: temas comuns com níveis diferentes de desafio."],["Sobre o atendimento pedagógico a crianças em cuidados paliativos, é correto afirmar que",["é atribuição exclusiva da equipe de psicologia.","o direito de aprender continua, e as atividades devem ter sentido para a criança, valorizando seus desejos e sua qualidade de vida.","só pode ocorrer com autorização judicial.","deve se restringir à preparação para provas.","deve ser suspenso, pois não há perspectiva de retorno à escola."],1,"A criança em cuidados paliativos mantém o direito à educação. O trabalho valoriza desejos, vínculos e qualidade de vida."]]},{"id":"E14","m":"esp","t":"Planejamento pedagógico e adaptação curricular no hospital","ed":["E7","E8","E18"],"v":[["cUHUfXZi8aY","Planejamento educacional: conhecimentos pedagógicos"],["AX6lPWWvGZ8","Adaptação curricular e inclusão"]],"obj":["Explicar o que é planejamento e seus níveis","Montar um plano com seus elementos","Diferenciar adaptações de grande e de pequeno porte","Planejar o atendimento individual no hospital"],"s":[["O que é planejar",["Para **José Carlos Libâneo**, o planejamento é um processo de **racionalização, organização e coordenação** da ação docente, que articula a atividade escolar com o contexto social. Planejar é pensar antes de agir, mas também **revisar** durante a ação.",{"t":[["Nível","O que planeja"],["Educacional","Políticas e sistema de ensino (planos nacionais, estaduais, municipais)"],["Institucional","A escola como um todo: o **Projeto Político-Pedagógico (PPP)**"],["Curricular","O percurso de conteúdos e experiências ao longo dos anos"],["De ensino","Plano de curso, de unidade e de aula, feito pelo professor"]]},"O **PPP** é **político** (expressa compromissos e escolhas de sociedade) e **pedagógico** (organiza o trabalho educativo). Deve ser construído **coletivamente**, com participação da comunidade, na lógica da gestão democrática (LDB, arts. 12 a 14)."]],["Elementos de um plano",[{"l":["**Objetivos**: o que se espera que o aluno aprenda, escritos com verbos de ação (identificar, comparar, produzir).","**Conteúdos**: conceitos, procedimentos e atitudes.","**Metodologia**: atividades e estratégias.","**Recursos**: materiais, espaços, tecnologias.","**Avaliação**: como saber se o objetivo foi alcançado.","**Tempo**: duração prevista."]},"Características de um bom plano: **flexibilidade**, **coerência** entre objetivos, atividades e avaliação, **continuidade**, **clareza** e **realismo** (adequado às condições reais)."]],["Adaptação e flexibilização curricular",["Adaptações curriculares s
