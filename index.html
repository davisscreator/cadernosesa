nte a tabela, compare o sentido das grandezas, multiplique cruzado se forem diretas ou em linha se forem inversas."]],["Regra de três composta",["Coloque a incógnita numa coluna e compare **cada** grandeza com ela, separadamente. Inverta as que forem inversas e monte uma única proporção.",{"ex":"6 pedagogos atendem 30 crianças em 5 dias. Quantos dias 3 pedagogos levam para atender 60 crianças? Dias × pedagogos: inversa (menos pedagogos, mais dias). Dias × crianças: direta (mais crianças, mais dias). x = 5 × (6/3) × (60/30) = 5 × 2 × 2 = **20 dias**."}]],["Equações e sistemas",[{"l":["**Equação de 1º grau**: isole o x. “Um número somado ao seu dobro dá 36” → x + 2x = 36 → x = **12**.","**Sistemas**: use substituição ou adição. x + y = 12 e x − y = 4 → somando, 2x = 16, x = 8 e y = 4."]},{"ex":"Mistura: quantos litros de solução A (20% de álcool) e B (50%) formam 12 L a 30%? a + b = 12 e 0,2a + 0,5b = 3,6. Substituindo b = 12 − a: 0,2a + 6 − 0,5a = 3,6 → a = **8 L** e b = **4 L**."}]],["Função de 1º grau (afim)",["f(x) = **a**x + **b**. O **a** (coeficiente angular) é a taxa de variação: se a > 0 a função cresce; se a \u003c 0, decresce. O **b** (coeficiente linear) é o valor quando x = 0, onde a reta corta o eixo y. A raiz é x = −b/a.",{"ex":"Táxi: R$ 5,00 de bandeirada + R$ 2,50 por km → f(x) = 2,5x + 5. Para 10 km: 2,5 × 10 + 5 = **R$ 30,00**."}]]],"r":["Diretas: mesmo sentido; inversas: sentidos opostos.","Simples: produto cruzado (direta) ou em linha (inversa).","Composta: compare cada grandeza com a incógnita; inverta as inversas.","Equação: isole x. Sistema: substituição ou adição.","f(x) = ax + b: a é a taxa (crescente se a > 0); b é o ponto em que corta o eixo y; raiz −b/a."],"q":[["A impressora A imprime 3 páginas enquanto a impressora B imprime 2. Se A leva 40 minutos para imprimir um lote sozinha, B levará",["60 minutos.","cerca de 27 minutos.","70 minutos.","entre 30 e 40 minutos.","mais de 80 minutos."],0,"A segunda impressora é mais lenta: 40 × 3 ÷ 2 = 60 minutos."],["Se 4 enfermeiras organizam uma ala em 6 horas, 3 enfermeiras, no mesmo ritmo, levarão",["6 horas.","8 horas.","9 horas.","4 horas e 30 minutos.","7 horas."],1,"Inversa: 6 × 4 ÷ 3 = 8 horas."],["Seis pedagogos atendem 30 crianças em 5 dias. Mantido o ritmo, três pedagogos atenderão 60 crianças em",["5 dias.","10 dias.","15 dias.","20 dias.","25 dias."],3,"5 × (6/3) × (60/30) = 20 dias."],["Um número somado ao seu triplo resulta em 48. Esse número é",["10.","12.","14.","16.","24."],1,"x + 3x = 48 → 4x = 48 → x = 12."],["Deseja-se obter 12 litros de mistura com 30% de álcool, a partir de uma solução A com 20% e uma solução B com 50%. A diferença entre as quantidades de A e de B é",["2 litros.","3 litros.","4 litros.","6 litros.","8 litros."],2,"a = 8 L e b = 4 L; diferença de 4 L."],["Em um grupo, há 30 pessoas entre adultos e crianças. O número de adultos é o dobro do de crianças. Quantas crianças há?",["8.","10.","12.","15.","20."],1,"x + 2x = 30 → x = 10 crianças."],["Uma corrida de táxi custa R$ 5,00 fixos mais R$ 2,50 por quilômetro. Uma corrida de 12 km custa",["R$ 30,00.","R$ 32,50.","R$ 35,00.","R$ 37,50.","R$ 40,00."],2,"2,5 × 12 + 5 = 30 + 5 = 35."],["Na função f(x) = −2x + 8, é correto afirmar que",["a função é crescente.","a raiz é x = 4.","a raiz é x = −4.","a reta corta o eixo y em −2.","f(1) = 10."],1,"−2x + 8 = 0 → x = 4. Como a \u003c 0, é decrescente; corta o eixo y em 8; f(1) = 6."]]},{"id":"R03","m":"rl","t":"Conjuntos e sequências","ed":["R2","R4"],"v":[["wumvgj2ZTGc","Como resolver problemas de conjuntos (diagrama de Venn)"],["-CKyLMxOF8o","Sequências de números, figuras, letras e palavras"]],"obj":["Usar união, interseção e diferença de conjuntos","Resolver problemas com diagrama de Venn de 2 e 3 conjuntos","Encontrar o padrão de sequências numéricas e de letras","Usar progressão aritmética"],"s":[["Operações com conjuntos",[{"l":["**União** (A ∪ B): elementos de A ou de B.","**Interseção** (A ∩ B): elementos de A e de B ao mesmo tempo.","**Diferença** (A − B): elementos de A que não estão em B.","**n(A ∪ B) = n(A) + n(B) − n(A ∩ B)**.","Com três conjuntos: n(A ∪ B ∪ C) = n(A) + n(B) + n(C) − n(A∩B) − n(A∩C) − n(B∩C) + n(A∩B∩C)."]},{"ex":"200 pessoas; 160 escolheram X e 80 escolheram Y; todas escolheram pelo menos um. Interseção = 160 + 80 − 200 = 40. **Só X** = 160 − 40 = 120, ou seja, 60% do grupo."},{"a":"No diagrama de Venn, comece **sempre pela interseção** e vá subtraindo para preencher as regiões de “somente”."},"Lembre: o **2** é o único número primo par. Se A é o conjunto dos primos e B o dos ímpares, A − B = {2}, um conjunto **unitário**."]],["Sequências",[{"l":["**Progressão aritmética (PA)**: soma-se sempre a mesma razão. aₙ = a₁ + (n − 1)·r.","**Progressão geométrica (PG)**: multiplica-se sempre pelo mesmo número.","**Sequências alternadas**: dois padrões intercalados (+3, +2, +3, +2...).","**Letras**: use a posição no alfabeto (A = 1, B = 2...; o alfabeto tem 26 letras, com K, W e Y).","**Padrões cíclicos**: use o **resto da divisão** para descobrir qual elemento aparece numa posição distante."]},{"ex":"Saulo pisa nos degraus 2, 5, 7, 10, 12, 15, 17... (soma 3, soma 2, alternando). Os números que aparecem são os terminados em 0, 2, 5 e 7: ele pisa em **todos os múltiplos de 5**."},{"ex":"Pares consecutivos a partir de 12: 12, 14, 16, 18, 20, 22, 24, 26. O 8º termo menos o 5º: 26 − 20 = **6** (três passos de razão 2)."}]]],"r":["União, interseção, diferença. n(A∪B) = n(A) + n(B) − n(A∩B).","Venn: comece pela interseção.","2 é o único primo par.","PA: aₙ = a₁ + (n−1)r. PG: multiplica.","Sequências alternadas, letras pela posição, ciclos pelo resto da divisão."],"q":[["Em um grupo de 200 pessoas, 160 preferem o produto X e 80 preferem o produto Y, e todas preferem pelo menos um deles. A porcentagem que prefere apenas o produto X é",["40%.","50%.","60%.","70%.","80%."],2,"Interseção = 40; só X = 120; 120/200 = 60%."],["Se A é o conjunto dos números primos e B é o conjunto dos números ímpares, o conjunto A − B",["só tem números ímpares.","é igual a B − A.","é unitário.","é vazio.","tem infinitos elementos."],2,"O único primo que não é ímpar é o 2, então a diferença entre os conjuntos é {2}, um conjunto unitário."],["Em uma pesquisa com 220 servidores, todos usam pelo menos um de três sistemas: 120 usam o sistema 1, 100 o sistema 2 e 80 o sistema 3; 40 usam 1 e 2; 30 usam 1 e 3; 25 usam 2 e 3. O número de servidores que usam exatamente dois sistemas é",["40.","50.","60.","70.","80."],1,"220 = 300 − 95 + x → x (os três) = 15. Exatamente dois: 25 + 15 + 10 = 50."],["Considere a sequência de números pares consecutivos iniciada em 12. A diferença entre o oitavo e o quinto termos é",["2.","3.","4.","6.","8."],3,"Três passos de razão 2: 6."],["O próximo termo da sequência 3, 7, 11, 15, ... é",["17.","18.","19.","20.","21."],2,"PA de razão 4: 15 + 4 = 19."],["Na sequência 2, 6, 18, 54, ..., o próximo termo é",["108.","148.","162.","216.","72."],2,"PG de razão 3: 54 × 3 = 162."],["Na sequência de letras A, C, F, J, O, ..., a próxima letra é",["S.","P.","U.","T.","Q."],2,"Posições 1, 3, 6, 10, 15 (somando 2, 3, 4, 5); a próxima soma 6: 21 = U."],["Uma sequência repete as cores azul, verde, amarelo, azul, verde, amarelo... A cor da 50ª posição é",["vermelho.","azul.","não é possível determinar.","verde.","amarelo."],3,"Ciclo de 3: 50 ÷ 3 deixa resto 2, que corresponde ao 2º elemento, verde."]]}],"sim":{"id":"sesa1","titulo":"Simulado SESA 1","desc":"60 questões inéditas no formato da prova do cargo 472: 10 de Português, 5 de Informática, 5 de Raciocínio Lógico, 5 de História e Geografia do Amapá, 5 de Legislação do SUS e 30 de Conhecimentos Específicos.","tempo":300,"textos":{"T1":{"titulo":"A estante do corredor","corpo":["Na ala pediátrica de um hospital público, uma estante de madeira resiste ao vaivém das macas. Os livros, que chegaram por doação, têm capas gastas e cheiro de papel guardado. Ninguém imaginava que aquela estante se tornaria o ponto mais disputado do corredor. As crianças escolhem histórias como quem escolhe um caminho para fugir, por alguns minutos, do barulho dos monitores.","A pedagoga responsável conta que, no início, os pais desconfiavam. Achavam que ler era um luxo diante da doença. Com o tempo, perceberam que a leitura não competia com o tratamento; ao contrário, ajudava a criança a atravessar a espera. Um menino de nove anos, internado havia dois meses, pediu para levar à escola, quando recebesse alta, o diário que escrevia no leito. Queria mostrar aos colegas que não tinha parado de aprender.","Há quem diga que um hospital não é lugar de biblioteca. Talvez não seja, se pensarmos no hospital apenas como lugar de remédios e exames. Mas, se o entendermos como lugar de cuidado, a estante faz todo o sentido. Cuidar também é garantir que a criança continue sendo criança: curiosa, inventiva, capaz de imaginar outros mundos enquanto o seu próprio corpo pede pausa."],"fonte":"Texto escrito para este simulado."}},"q":[["por","De acordo com o texto, a mudança de opinião dos pais ocorreu porque eles perceberam que",["os livros doados eram novos e bem conservados.","a leitura ajudava a criança a atravessar o período de espera, sem competir com o tratamento.","as crianças deixavam de ir aos exames para ler.","a leitura substituía parte do tratamento médico.","a estante atrapalhava a circulação das macas."],1,"O segundo parágrafo diz que a leitura “não competia com o tratamento; ao contrário, ajudava a criança a atravessar a espera”. Dizer que a leitura substitui o tratamento extrapola o texto, e os livros têm “capas gastas”.","T1"],["por","Infere-se do episódio do menino de nove anos que",["ele valorizava manter o vínculo com a escola e mostrar que continuou aprendendo durante a internação.","a escola exigia o diário como avaliação.","ele pretendia abandonar a escola depois da alta.","a pedagoga obrigava as crianças a escrever diários.","os colegas desconheciam a internação dele."],0,"Ele queria mostrar aos colegas que não tinha parado de aprender: valoriza o vínculo escolar. As demais alternativas extrapolam o texto.","T1"],["por","No último parágrafo, o autor",["limita-se a relatar fatos, sem se posicionar.","apresenta uma visão contrária e a refuta, condicionando a resposta à forma de compreender o hospital.","critica a pedagoga por instalar a estante.","concorda integralmente com quem diz que hospital não é lugar de biblioteca.","defende que o hospital deveria ser transformado em escola."],1,"O autor cita a opinião contrária (“Há quem diga...”), admite parcialmente (“Talvez não seja, se...”) e a refuta com “Mas, se o entendermos como lugar de cuidado...”.","T1"],["por","No trecho “a leitura não competia com o tratamento; ao contrário, ajudava a criança”, a expressão “ao contrário” introduz uma ideia que",["retifica a ideia de competição, opondo-lhe a ideia de ajuda.","indica uma condição para a afirmação anterior.","encerra o parágrafo com uma conclusão numérica.","expressa a causa da afirmação anterior.","confirma a anterior, acrescentando um exemplo."],0,"“Ao contrário” marca oposição: em vez de competir, a leitura ajudava.","T1"],["por","Em “enquanto o seu próprio corpo pede pausa”, o pronome “seu” refere-se a",["o autor.","a criança.","a estante.","os pais.","o hospital."],1,"O período fala da criança: é o corpo da criança que pede pausa.","T1"],["por","Assinale a alternativa em que a reescrita do trecho “Um menino de nove anos, internado havia dois meses” mantém a correção gramatical.",["Um menino de nove anos, internado haviam dois meses.","Um menino de nove anos, internado à dois meses.","Um menino de nove anos, internado fazia dois meses.","Um menino de nove anos, internado faziam dois meses.","Um menino de nove anos, internado a dois meses atrás."],2,"Fazer indicando tempo decorrido é impessoal e fica no singular: fazia dois meses. O mesmo vale para haver (havia, nunca haviam). “À dois meses” e “a dois meses atrás” erram o uso de há/a.","T1"],["por","No trecho “pediu para levar à escola”, o acento indicativo de crase é",["proibido, pois antecede verbo.","proibido, pois escola é palavra masculina.","facultativo, pois antecede palavra feminina.","obrigatório, pois o verbo levar pede a preposição a, e a palavra escola admite artigo feminino.","obrigatório, por se tratar de locução adverbial de tempo."],3,"Levar algo a algum lugar + artigo a de “a escola” = à. Troque por masculino: levar ao colégio.","T1"],["por","Considere o período “Os livros, que chegaram por doação, têm capas gastas”. Se as vírgulas forem retiradas,",["a oração passará a indicar causa.","a oração adjetiva passará a restringir o sentido, indicando que apenas os livros doados têm capas gastas.","o verbo deverá ir para o singular.","não haverá mudança de sentido.","o período ficará sem sujeito."],1,"Com vírgulas, a adjetiva é explicativa (todos os livros chegaram por doação). Sem vírgulas, vira restritiva (só os doados).","T1"],["por","Na oração “se o entendermos como lugar de cuidado”, o termo “se” estabelece relação de",["comparação.","finalidade.","condição.","causa.","concessão."],2,"Se = caso: conjunção condicional. Note também o pronome o (próclise ao verbo depois de conjunção subordinativa).","T1"],["por","Assinale a alternativa em que o termo “que” é conjunção integrante.",["“lugar que todos procuram”.","“Os livros, que chegaram por doação [...]”.","“o diário que escrevia no leito”.","“Há quem diga que um hospital não é lugar de biblioteca.” – apenas o termo quem.","“Ninguém imaginava que aquela estante se tornaria o ponto mais disputado do corredor.”"],4,"“Que aquela estante se tornaria...” é o objeto direto de imaginava (imaginava isso): conjunção integrante. Nas outras opções o que retoma um substantivo anterior: pronome relativo.","T1"],["inf","No Windows 10 e 11, o atalho que bloqueia o computador, exigindo nova autenticação do usuário, é",["Ctrl + Alt + Tab.","Win + D.","Win + L.","Win + E.","Alt + F4."],2,"Win + L bloqueia a sessão."],["inf","No LibreOffice Calc, as células A1 a A4 contêm 6, 8, 10 e 12. A fórmula =MÉDIA(A1:A4) retorna",["8.","9.","10.","36.","4."],1,"(6 + 8 + 10 + 12) ÷ 4 = 36 ÷ 4 = 9."],["inf","Para gerar um arquivo PDF a partir de um documento do LibreOffice Writer, sem programas adicionais, o usuário pode",["salvar o arquivo com extensão .odt.","copiar o texto para o Bloco de Notas.","imprimir o documento em papel e digitalizá-lo, obrigatoriamente.","usar a opção Exportar como PDF, no menu Arquivo.","instalar o Microsoft Word."],3,"O LibreOffice exporta diretamente para PDF pelo menu Arquivo."],["inf","Um servidor recebeu um e-mail supostamente do setor de RH, com link para “confirmar a senha do sistema” num site parecido com o oficial. Trata-se de",["phishing.","criptografia.","firewall.","backup.","atualização automática."],0,"Mensagem falsa que tenta roubar credenciais é phishing."],["inf","No Google Drive, para que uma colega possa apenas sugerir alterações e deixar comentários num documento, sem editá-lo diretamente, o compartilhamento deve ser feito com a permissão de",["comentarista.","leitor.","editor.","administrador do domínio.","proprietário."],0,"Comentarista pode comentar e sugerir; editor altera; leitor só visualiza."],["rl","Uma brinquedoteca recebeu 240 brinquedos; 3/8 foram para a ala de oncologia e 1/4 para a ala cirúrgica. Quantos brinquedos sobraram?",["60.","75.","90.","105.","150."],2,"3/8 de 240 = 90; 1/4 de 240 = 60; sobraram 240 − 150 = 90."],["rl","Um produto de R$ 250,00 teve aumento de 20% e, em seguida, desconto de 20%. O preço final é",["R$ 250,00.","R$ 240,00.","R$ 260,00.","R$ 200,00.","R$ 230,00."],1,"250 × 1,2 × 0,8 = 250 × 0,96 = 240."],["rl","Três pedagogas organizam o material de 90 crianças em 2 horas. No mesmo ritmo, duas pedagogas organizarão o material de 120 crianças em",["2 horas.","3 horas.","4 horas.","5 horas.","6 horas."],2,"Tempo × pedagogas: inversa; tempo × crianças: direta. x = 2 × (3/2) × (120/90) = 2 × 1,5 × 4/3 = 4 horas."],["rl","Em uma turma, 25 alunos leem gibis, 18 leem livros de aventura e 7 leem os dois tipos. Todos leem pelo menos um. Quantos alunos há na turma?",["43.","36.","32.","50.","29."],1,"25 + 18 − 7 = 36."],["rl","Na sequência 5, 8, 7, 10, 9, 12, ..., o próximo termo é",["10.","11.","13.","14.","15."],1,"Padrão alternado: +3, −1, +3, −1, +3, −1. Depois de 12 vem 12 − 1 = 11."],["amp","O Território Federal do Amapá foi criado em 1943 e teve como primeiro governador",["Mendonça Furtado.","Francisco Xavier da Veiga Cabral.","Annibal Barcellos.","Janary Gentil Nunes.","Barão do Rio Branco."],3,"Janary Nunes assumiu em janeiro de 1944. Annibal Barcellos foi o primeiro governador eleito do Estado."],["amp","O Laudo Suíço de 1900 encerrou a disputa conhecida como Contestado franco-brasileiro ao",["fixar o rio Oiapoque como fronteira entre o Brasil e a Guiana Francesa.","transferir a capital para Macapá.","criar a República do Cunani.","conceder à França o vale do Araguari.","dividir o Amapá entre Brasil e Holanda."],0,"O árbitro suíço deu ganho de causa ao Brasil, defendido pelo Barão do Rio Branco."],["amp","O registro do Marabaixo como Patrimônio Cultural do Brasil reconhece uma manifestação",["indígena, ligada aos povos do Oiapoque.","francesa, herdada do Contestado.","afro-amapaense de dança, canto e religiosidade, com caixas, ladrões e gengibirra.","portuguesa, trazida pelos colonos açorianos.","esportiva, ligada ao estádio Zerão."],2,"O Marabaixo é manifestação afro-amapaense ligada ao ciclo do Divino e da Santíssima Trindade."],["amp","Sobre a geografia do Amapá, é correto afirmar que",["o estado está totalmente no Hemisfério Sul.","Macapá é a única capital brasileira cortada pela Linha do Equador.","o estado não possui unidades de conservação.","o rio Jari marca a fronteira com a Guiana Francesa.","o clima predominante é semiárido."],1,"A Linha do Equador passa por Macapá. A fronteira com a Guiana Francesa é o Oiapoque; o Jari é divisa com o Pará."],["amp","A Estrada de Ferro do Amapá, inaugurada em 1957, foi construída principalmente para",["levar passageiros entre Macapá e Oiapoque.","abastecer as hidrelétricas do Araguari.","ligar o Amapá à Guiana Francesa.","transportar açaí para Belém.","escoar o manganês da Serra do Navio até o porto de Santana."],4,"A ferrovia da ICOMI levava o minério ao porto de Santana."],["sus","Conforme a Constituição Federal, as instituições privadas poderão participar do Sistema Único de Saúde",["apenas com recursos públicos a título de subvenção, inclusive as com fins lucrativos.","de forma suplementar, mediante contrato de direito privado.","somente quando houver capital estrangeiro.","substituindo o atendimento público nos municípios pequenos.","de forma complementar, segundo diretrizes do SUS, mediante contrato de direito público ou convênio, com preferência às entidades filantrópicas e sem fins lucrativos."],4,"Art. 199, § 1º: complementar, contrato de direito público ou convênio, preferência às filantrópicas."],["sus","De acordo com a Lei nº 8.080/1990, NÃO é princípio ou diretriz do SUS:",["universalidade de acesso aos serviços de saúde em todos os níveis de assistência.","igualdade da assistência à saúde, sem preconceitos ou privilégios de qualquer espécie.","centralização político-administrativa, com direção única no Ministério da Saúde.","integralidade de assistência.","participação da comunidade."],2,"A lei prevê descentralização, com direção única em cada esfera de governo, e não centralização."],["sus","Segundo a Lei nº 8.142/1990, o Conselho de Saúde tem caráter",["permanente e deliberativo, atuando na formulação de estratégias e no controle da execução da política de saúde.","eventual e consultivo, reunindo-se a cada quatro anos.","privado, sem participação de usuários.","exclusivamente técnico, composto apenas por gestores.","judicial, podendo aplicar penas."],0,"Conselho: permanente e deliberativo. A Conferência é que se reúne a cada quatro anos."],["sus","Conforme o Decreto nº 7.508/2011, são Portas de Entrada às ações e aos serviços de saúde nas Redes de Atenção à Saúde, EXCETO:",["atenção de urgência e emergência.","atenção hospitalar de alta complexidade.","atenção primária.","especiais de acesso aberto.","atenção psicossocial."],1,"A atenção hospitalar é referenciada pelas portas de entrada; não é porta de entrada."],["sus","Segundo a Lei Complementar nº 141/2012, considera-se despesa com ações e serviços públicos de saúde, para apuração dos percentuais mínimos,",["a vigilância epidemiológica e a capacitação do pessoal de saúde do SUS.","a merenda escolar.","o pagamento de aposentadorias dos servidores da saúde.","a limpeza urbana.","as obras de infraestrutura viária próximas a hospitais."],0,"Vigilância e capacitação do pessoal do SUS contam. As demais são excluídas pelo art. 4º."],["esp","Sobre a pedagogia hospitalar, assinale a alternativa correta.",["É uma atividade terapêutica de responsabilidade da equipe de enfermagem.","Busca garantir a continuidade do desenvolvimento e da aprendizagem de crianças e adolescentes em tratamento, articulando educação e saúde.","Destina-se exclusivamente a crianças matriculadas na rede particular.","Restringe-se a atividades de recreação, sem objetivos de aprendizagem.","Substitui a escola de origem de forma definitiva."],1,"A pedagogia hospitalar articula educação e saúde para dar continuidade ao desenvolvimento e à escolarização."],["esp","Segundo o documento do MEC “Classe hospitalar e atendimento pedagógico domiciliar” (2002), o atendimento educacional realizado em casas de apoio, casas de passagem ou casas-lar, para alunos impedidos de frequentar a escola por problema de saúde, enquadra-se como",["educação de jovens e adultos.","sala de recursos multifuncional.","atendimento pedagógico domiciliar.","classe hospitalar.","brinquedoteca comunitária."],2,"O atendimento pedagógico domiciliar ocorre na casa do aluno ou em estruturas de apoio como casas de passagem e casas-lar."],["esp","A primeira classe hospitalar brasileira, criada em 1950, funcionou",["no Hospital das Clínicas de São Paulo.","no Hospital Universitário de Macapá.","na Santa Casa de Belém.","no Hospital Municipal Jesus, no Rio de Janeiro.","no Hospital de Base do Distrito Federal."],3,"Hospital Municipal Jesus, Rio de Janeiro, 1950."],["esp","Matos e Mugiatti denominam “hospitalização escolarizada”",["o atendimento pedagógico personalizado ao escolar hospitalizado por longos períodos, que respeita a série e o currículo da criança.","a transferência do aluno para escola especial.","a internação de crianças por motivos educacionais.","o recreio realizado na brinquedoteca do hospital.","a construção de escolas dentro dos hospitais pelo Ministério da Saúde."],0,"É o atendimento personalizado ao escolar internado por longo tempo, acompanhando seu currículo."],["esp","Em relação ao atendimento a uma criança em isolamento protetor, o pedagogo deve considerar que",["a criança transmite microrganismos pelo contato com a pele.","não há necessidade de higienizar os materiais.","o pedagogo não pode, em nenhuma hipótese, atender a criança.","o isolamento indica transmissão por gotículas, exigindo luvas.","a criança está com a imunidade baixa e precisa ser protegida de infecções trazidas por profissionais e visitantes."],4,"No isolamento protetor (reverso), quem está vulnerável é a criança imunossuprimida."],["esp","A Lei nº 13.716/2018 incluiu na LDB dispositivo que assegura",["atendimento educacional, durante o período de internação, ao aluno da educação básica internado para tratamento de saúde em regime hospitalar ou domiciliar por tempo prolongado.","brinquedotecas em todas as unidades de saúde.","exercícios domiciliares à estudante gestante.","professor de apoio a todos os alunos com deficiência.","dispensa de frequência para qualquer aluno com atestado médico."],0,"É o art. 4º-A da LDB."],["esp","De acordo com a Resolução CNE/CEB nº 2/2001, a certificação da frequência do aluno atendido em classe hospitalar deve basear-se",["em autorização do Conselho Tutelar.","no prontuário médico.","no relatório elaborado pelo professor que o atende.","em prova aplicada após a alta.","em declaração do diretor do hospital."],2,"A frequência é certificada com base no relatório do professor."],["esp","A obrigatoriedade de brinquedotecas nas unidades de saúde que ofereçam atendimento pediátrico em regime de internação foi instituída pela",["Lei nº 11.104/2005.","Resolução CONANDA nº 41/1995.","Lei nº 14.254/2021.","Lei nº 13.716/2018.","Lei nº 6.202/1975."],0,"Lei 11.104/2005."],["esp","Para Piaget, a equilibração",["ocorre apenas no estágio sensório-motor.","é sinônimo de aprendizagem mecânica.","é o processo de autorregulação que coordena os demais fatores do desenvolvimento, buscando novos estados de equilíbrio diante dos desequilíbrios.","é um fator secundário, subordinado à transmissão social.","corresponde à zona de desenvolvimento proximal."],2,"A equilibração coordena maturação, experiência e transmissão social."],["esp","Uma criança de 4 anos, internada, brinca de dar injeção na boneca e diz que a cadeira “está triste” porque ninguém senta nela. Segundo Piaget, esses comportamentos são típicos do estágio",["sensório-motor.","operatório concreto.","categorial.","operatório formal.","pré-operatório."],4,"Jogo simbólico e animismo são marcas do pré-operatório. “Categorial” é estágio de Wallon."],["esp","Na perspectiva de Vygotsky, é correto afirmar que",["as funções psicológicas superiores têm origem exclusivamente biológica.","a mediação de um adulto ou de um colega mais experiente permite à criança realizar o que ainda não faz sozinha, atuando na zona de desenvolvimento proximal.","a linguagem não interfere no pensamento.","a aprendizagem só ocorre depois que o desenvolvimento se completa.","o brinquedo de faz de conta não tem relação com o desenvolvimento."],1,"A mediação atua na ZDP; as funções superiores têm origem social."],["esp","Para Henri Wallon, o desenvolvimento da criança deve ser compreendido",["pela sequência das inteligências múltiplas.","de forma integrada, considerando afetividade, ato motor e conhecimento, na constituição da pessoa.","apenas pela dimensão cognitiva.","como resultado exclusivo de reforços externos.","a partir da relação entre subsunçores."],1,"Wallon propõe a pessoa completa, integrando afetividade, motricidade e cognição."],["esp","Durante a adolescência, segundo Erikson, o conflito psicossocial central é",["produtividade × inferioridade.","identidade × confusão de papéis.","iniciativa × culpa.","confiança × desconfiança.","autonomia × vergonha."],1,"Na adolescência, a tarefa é construir a identidade."],["esp","Um aluno apresenta erros ortográficos persistentes, com omissões e junções indevidas de palavras, mas traçado legível e leitura fluente. O quadro é mais compatível com",["discalculia.","TDAH.","disgrafia.","dislexia.","disortografia."],4,"Erros de ortografia sem problema motor nem de leitura: disortografia."],["esp","Conforme a Lei nº 12.764/2012, em casos de comprovada necessidade, a pessoa com transtorno do espectro autista incluída nas classes comuns de ensino regular terá direito a",["transferência automática para o turno noturno.","matrícula exclusiva em escola especial.","redução da carga horária obrigatória.","acompanhante especializado.","dispensa das avaliações."],3,"O parágrafo único do art. 3º garante acompanhante especializado se comprovada a necessidade."],["esp","Na deficiência auditiva, conforme o Decreto nº 5.626/2005, considera-se a perda bilateral, parcial ou total, de",["21 decibéis ou mais.","31 decibéis ou mais.","91 decibéis ou mais.","41 decibéis ou mais.","61 decibéis ou mais."],3,"41 dB ou mais, aferida por audiograma nas frequências de 500, 1.000, 2.000 e 3.000 Hz."],["esp","Segundo a Lei Brasileira de Inclusão, as barreiras que correspondem a atitudes ou comportamentos que impedem ou prejudicam a participação social da pessoa com deficiência são as barreiras",["nas comunicações.","arquitetônicas.","urbanísticas.","atitudinais.","tecnológicas."],3,"Barreiras atitudinais: preconceito e comportamentos excludentes."],["esp","De acordo com a Política Nacional de Educação Especial na Perspectiva da Educação Inclusiva (2008), o atendimento educacional especializado",["é oferecido apenas na educação infantil.","substitui a escolarização na classe comum.","complementa ou suplementa a formação dos alunos, com vistas à autonomia e independência na escola e fora dela.","ocorre exclusivamente em instituições especializadas.","destina-se a todos os alunos com dificuldades de aprendizagem."],2,"O AEE é complementar ou suplementar e não substitui a classe comum."],["esp","A Resolução CNE/CEB nº 4/2009 estabelece que o AEE será realizado prioritariamente",["no domicílio do aluno, em todos os casos.","em escola especial, em turno integral.","na sala de recursos multifuncionais da própria escola ou de outra escola de ensino regular, no turno inverso da escolarização.","na classe comum, durante as aulas regulares, substituindo o professor regente.","no hospital, exclusivamente."],2,"Sala de recursos multifuncionais, no turno inverso, sem substituir a classe comum."],["esp","Uma criança com paralisia cerebral, sem fala funcional e com compreensão preservada, passa a usar uma prancha com símbolos para responder às atividades. Esse recurso é exemplo de",["terminalidade específica.","reforço negativo.","adaptação de grande porte.","avaliação somativa.","comunicação aumentativa e alternativa, uma categoria de tecnologia assistiva."],4,"Prancha de comunicação é recurso de CAA, categoria da tecnologia assistiva."],["esp","A avaliação realizada ao longo do processo, com retorno constante ao aluno e ajustes nas estratégias de ensino, é denominada",["classificatória.","seletiva.","formativa.","somativa.","diagnóstica."],2,"Avaliação formativa: durante o processo, regula o ensino e a aprendizagem."],["esp","Segundo o documento Adaptações Curriculares (MEC, 1998), as adaptações que dependem de decisões das instâncias político-administrativas e da gestão escolar, como criar serviços de apoio ou modificar objetivos essenciais, são chamadas de",["adaptações de pequeno porte.","flexibilizações de horário.","adaptações de acesso individual.","adaptações informais.","adaptações de grande porte (significativas)."],4,"Adaptações de grande porte, ou significativas, envolvem decisões institucionais."],["esp","Sobre o planejamento pedagógico no contexto hospitalar, assinale a alternativa INCORRETA.",["Deve ser rígido e cumprir integralmente o cronograma escolar, independentemente do estado da criança.","Deve considerar os horários de procedimentos e as condições clínicas.","Deve prever atividades com começo, meio e fim em cada atendimento.","Deve ser individualizado, a partir de avaliação diagnóstica.","Deve ser articulado com a escola de origem."],0,"O planejamento no hospital é flexível e revisável; rigidez é incompatível com a imprevisibilidade da internação."],["esp","Uma criança escreve “BL” para BOLA e “GT” para GATO, usando uma letra por sílaba. Segundo Ferreiro e Teberosky, ela está na hipótese",["silábico-alfabética.","alfabética.","pré-silábica.","silábica com valor sonoro.","ortográfica."],3,"Uma letra por sílaba, com letras presentes na pronúncia: silábica com valor sonoro."],["esp","Segundo Kishimoto, a distinção entre brinquedo e brincadeira consiste em que",["o brinquedo é a ação de brincar e a brincadeira é o objeto.","o brinquedo é o objeto, suporte da brincadeira, e a brincadeira é a ação lúdica.","brincadeira sempre tem regras escritas.","brinquedo é termo exclusivo da educação infantil.","ambos são sinônimos."],1,"Brinquedo é objeto; brincadeira é ação; jogo costuma ter regras."],["esp","Ao preparar o retorno de uma criança à escola após longo tratamento, o pedagogo hospitalar deve",["encerrar qualquer contato com a escola após a alta.","recomendar que a criança espere o próximo ano letivo.","divulgar o diagnóstico para toda a comunidade escolar.","orientar a escola sobre as adaptações necessárias e, com autorização da família e da criança, preparar a turma para recebê-la.","propor a transferência da criança para escola especial."],3,"Reinserção envolve orientar a escola e preparar a turma, respeitando o sigilo e a autorização da família."],["esp","A integração entre profissionais de diferentes áreas, com troca de saberes e construção de um plano comum de cuidado, como no Projeto Terapêutico Singular, caracteriza o trabalho",["burocrático.","hierárquico vertical.","disciplinar.","interdisciplinar.","multidisciplinar isolado."],3,"Interdisciplinaridade é integração com objetivos comuns."],["esp","Na Política Nacional de Humanização, são diretrizes:",["descentralização, regionalização e hierarquização.","transversalidade e indissociabilidade entre atenção e gestão, exclusivamente.","acolhimento, gestão participativa e cogestão, ambiência, clínica ampliada e compartilhada, valorização do trabalhador e defesa dos direitos dos usuários.","universalidade, integralidade e equidade.","autonomia, beneficência, não maleficência e justiça."],2,"São as diretrizes da PNH. Transversalidade e indissociabilidade são princípios da PNH; universalidade e descentralização são do SUS; autonomia e beneficência, da bioética."],["esp","De acordo com a Lei nº 14.254/2021, a identificação das necessidades específicas de educandos com dislexia, TDAH ou outro transtorno de aprendizagem deve ser feita",["por equipe multidisciplinar, com encaminhamento para diagnóstico e apoio educacional e terapêutico.","apenas em escolas públicas federais.","exclusivamente pelo professor regente.","pela família, sem participação da escola.","somente após o término do ensino fundamental."],0,"A lei prevê equipe multidisciplinar, identificação precoce, encaminhamento para diagnóstico e apoio educacional e terapêutico."],["esp","Durante o atendimento, o pedagogo percebe sinais que levantam suspeita de maus-tratos contra a criança. Segundo o ECA, a conduta adequada é",["manter sigilo, pois a informação foi obtida em atendimento.","aguardar provas concretas antes de qualquer providência.","registrar somente no diário pessoal.","conversar com o suposto agressor.","comunicar obrigatoriamente o caso ao Conselho Tutelar, seguindo também o fluxo da instituição."],4,"Art. 13 do ECA: a suspeita deve ser comunicada ao Conselho Tutelar."]]},"provas":[{"id":"unirio25","titulo":"UNIRIO 2025","cargo":"Pedagogo (Área)","banca":"Instituto AOCP","ano":2025,"gab":"definitivo","arq":"pedagogo_area.pdf","gabArq":"gabarito_definitivo.pdf","tempo":240,"sobre":"Prova mais recente da banca para pedagogo. Português, Informática e Raciocínio Lógico estão no mesmo nível que a SESA vai cobrar. Os Específicos são de pedagogia universitária, então vale fazer só os marcados.","secoes":[["por",1,20,"Língua Portuguesa"],["rl",21,30,"Raciocínio Lógico"],["leg",31,40,"Legislação do servidor federal"],["inf",41,45,"Informática"],["esp",46,70,"Conhecimentos Específicos (ensino superior)"]],"g":"ACBBDAEDDCCADEBEAEACBEADCEBCADCABEDBEADCCABEABBDCECDABCEBCDCDCBBEACDEA","st":"iiiiiiiiiiiiiiiiiiiiixxxiiiixxfffffffxffxiiiixfffiiiixffiiffififxfxffx","fora":{"leg":"Lei 8.112, improbidade, Lei de Acesso à Informação e Código de Ética do servidor federal não estão no edital da SESA.","esp":"PDI, PPC, NDE, avaliação institucional e gestão universitária não caem para o cargo 472."},"c":{"1":["P07","I e III estão corretas. I resume a comparação central do texto: “Tubarão” é aventura e terror com um animal, e “O Agente Secreto” é mistério e terror com violências humanas. II reduz o cinema a um cenário, mas o texto trata o cinema como tema (“um filme sobre cinema”, “lugar de refúgio”)."],"2":["P07","A incorreta é a C. A imensidão do filme não está na extensão da linha do tempo, e sim nas muitas camadas que o autor vai “fatiando”: o cinema, a violência oficial e particular, o roubo de ideias, a esperança. As outras alternativas descrevem essas camadas."],"3":["P08","F – V – V – F. Resenha crítica não é neutra: ela avalia e argumenta. Por isso são falsas a primeira (fala em neutralidade) e a última (fala em ausência de análise)."],"4":["P10","Refúgio e início são paroxítonas terminadas em ditongo crescente (-io). Mistério e história seguem a mesma regra (-io, -ia). Nas outras alternativas, pelo menos uma das palavras se acentua por outro motivo."],"5":["P05","As vírgulas separam expressões adverbiais em sequência: “pouco a pouco”, “neste filme realmente imenso”, “com um elenco…”. Em B, “de certa forma” é adverbial, não explicativo; em E, as vírgulas isolam um aposto e uma oração explicativa e não podem sair sem mudar o sentido."],"6":["P01","F – V – F – V. “Por que” separado também aparece em pergunta indireta (= o motivo pelo qual), então a primeira é falsa. Encontrar e comprovar têm complementos sem preposição. Existiu (pretérito perfeito) e pratica (presente) não estão no mesmo tempo."],"7":["P01","“de mistério e terror” caracteriza o substantivo obra: é adjunto adnominal. Em E, “moderna” também caracteriza um substantivo. Nas demais, os termos são complementos ou adjunto adverbial de lugar."],"8":["P04","Em locução verbal, o pronome pode ficar depois do verbo principal no gerúndio (vão perpetuando-se). Nas outras reescritas há palavra atrativa (já, que, nunca) e o pronome foi colocado depois do verbo flexionado, o que a norma não aceita."],"9":["P04","“Onde” com antecedente de lugar (“um lugar”) pode ser trocado por “no qual”. As demais trocas erram a gramática ou mudam o sentido (com “existir”, por exemplo, o verbo teria de ir para o plural: existem mais cinemas)."],"10":["P04","No enunciado, o “que” introduz uma oração que completa o verbo ser: é conjunção integrante. Em C, o “que” depois de “dizer” também é integrante. Nas outras, o “que” retoma um substantivo: é pronome relativo."],"11":["P09","Em C a frase é literal: o tubarão do filme de fato mata suas vítimas. Fatiar um horizonte, estar na cabeça de todo mundo, sair de uma fase e “máquina infernal” são usos figurados."],"12":["P08","Coesão referencial: o “-lo” retoma “horizonte aberto”; “quando” equivale a “em 1977”; o “que” retoma “um documento de identificação”; “ele” e “sua” se referem a Marcelo."],"13":["P09","Predecessor é quem veio antes. O sentido oposto é de quem vem depois: subsequente e sucessor. As outras alternativas misturam palavras de anterioridade."],"14":["P04","Pronome apassivador aparece com verbo transitivo direto e permite passar para a voz passiva com “ser”: “como se sabe” = “como é sabido”. A banca leu “se propõe como” do mesmo jeito (= é proposto como). Em I, o se faz parte do verbo tornar-se; em IV, é reflexivo (dizem a si mesmas)."],"15":["P09","Abarca = envolve; ressonâncias = repercussões; iníquas = injustas; deglutir = engolir."],"16":["P01","Em E, “para” indica destino (vai para uma comunidade), não finalidade. Nas outras, “para” introduz o objetivo da ação: para melhor compreensão, para viver, para encontrar, para apanhar."],"17":["P01","“Como já se pode notar” = conforme já se pode notar: conformidade. Nas outras, o valor entre parênteses está trocado: “isto é” é explicação, “como se sabe” também é conformidade e “tanto… como” indica adição."],"18":["P06","Predecessor tem o prefixo pre- (antes) e o sufixo -or, que forma substantivos e adjetivos. Ex-militares é prefixação, não composição; o re- não tem o mesmo sentido nas três palavras; -ado não forma advérbio; assombroso é derivação sufixal, não parassintética."],"19":["P01","“Tão vasto… que mais justo será fatiá-lo” expressa consequência, não causa. As outras classificações estão certas: proporção, tempo, alternância e adição."],"20":["P06","“Muito” é advérbio de intensidade nas três ocorrências e, em “muito pessoalmente”, reforça que a opinião é bem pessoal. Recife e Olinda não pedem artigo, então não haveria crase; e as aspas de “refugiadas” e de “Os Miseráveis” têm motivos diferentes."],"21":["R03","Pela fórmula da união: 120 + 100 + 80 − 40 − 30 − 25 + x = 220, então x = 15 usam os três. Exatamente dois: (40 − 15) + (30 − 15) + (25 − 15) = 25 + 15 + 10 = 50."],"22":["R03","40 falam pelo menos um idioma (50 − 10). Os dois: 30 + 20 − 40 = 10. Só um: 40 − 10 = 30. Probabilidade: 30/50 = 60%. Probabilidade não está no seu edital, mas a conta é de conjuntos e porcentagem."],"23":["R02","Cada período dobra o valor: 2, 4, 8, 16. São 4 períodos (2⁴ = 16). Juros compostos não estão no edital da SESA."],"24":["R03","Se P, então Q; não Q; logo, não P. É o modus tollens, um argumento válido. Lógica de argumentação não está no edital da SESA."],"25":["R02","A imprime 3 páginas enquanto B imprime 2, então B é mais lenta. Grandezas inversamente proporcionais: 40 × 3 ÷ 2 = 60 minutos."],"26":["R03","A regra troca as metades de lugar: AM|OR vira OR|AM, CA|SO vira SO|CA. RI|TO vira TO|RI = TORI."],"27":["R01","Em 1 hora, A enche 1/4, B enche 1/6 e o ralo tira 1/12. 3/12 + 2/12 − 1/12 = 4/12 = 1/3 por hora. A caixa enche em 3 horas."],"28":["R02","Sistema: a + b = 12 e 0,2a + 0,5b = 3,6 (30% de 12 litros). Resolvendo, b = 4 e a = 8. Diferença: 4 litros."],"29":["R03","UNIRIO tem 6 letras e o I aparece duas vezes: 6! ÷ 2! = 720 ÷ 2 = 360. Análise combinatória não está no edital da SESA."],"30":["R01","Calcule o contrário. Nenhum de pessoal = escolher os 3 entre os 6 de compras: 20 de 120 combinações possíveis = 1/6. Pelo menos um de pessoal: 1 − 1/6 = 5/6. Probabilidade não está no edital da SESA."],"38":["E19","A LGPD exige finalidade legítima e específica para tratar dados. Usar o acesso do trabalho para resolver um assunto particular viola a lei, mesmo com senha autorizada. Bom reforço para o tema sigilo e proteção de dados."],"41":["I04","A IA é ferramenta de apoio: a pessoa continua responsável pelo conteúdo final, confere as informações e não insere dados sensíveis."],"42":["I02","No Windows 11, rede, volume e bateria viraram um botão único que abre as Configurações Rápidas (atalho Win + A)."],"43":["I03","CONT.SE conta as células que atendem a um critério, como “Home Office”. SOMASE soma valores; CORRESP e PROCX procuram posições e valores; CLASSIFICAR ordena."],"44":["I04","A incorreta é a E: o Chrome funciona sem login na conta Google. O login serve só para sincronizar favoritos, senhas e histórico."],"45":["I04","Endereço com https:// e cadeado indica conexão criptografada. Http sem o “s” não protege os dados digitados."],"46":["E01","Cultura maker e computação criativa vêm do construcionismo de Seymour Papert, que parte do construtivismo de Piaget: o aluno aprende construindo algo que tem sentido para ele."],"50":["E02","Aprendizagem “situada, histórica e atravessada por sentidos” é a visão histórico-cultural de Vygotsky: problemas reais, interação coletiva e mediação. As outras alternativas são individualistas ou tecnicistas."],"51":["E02","Mesma lógica da anterior: se a aprendizagem é mediada e social, o caminho são atividades coletivas que juntam teoria e situações reais. Seminário expositivo, estudo individual e treino técnico não atendem."],"52":["E14","O planejamento tem níveis (institucional, curricular e de ensino) que precisam conversar entre si. A resposta articula os três para alinhar objetivos, currículo e prática."],"53":["E14","Mesma ideia: o planejamento integra as dimensões institucional, curricular e didática para dar coerência à formação."],"54":["E14","Inovação não substitui o planejamento: ela precisa estar ligada ao projeto institucional e ao currículo."],"57":["E10","Avaliação formativa é contínua, qualitativa e serve para reorientar o ensino durante o processo."],"58":["E10","Avaliação diagnóstica levanta informações no início para ajustar o planejamento e identificar necessidades."],"61":["E09","Baixa visão: a instituição deve garantir materiais acessíveis, tecnologia assistiva e adaptações razoáveis, sem exigir novo laudo e sem empurrar a responsabilidade para outro setor. Ampliar o material ajuda, mas sozinho não basta."],"63":["E14","O PPP é construção coletiva e política: planejar, executar, registrar e avaliar continuamente, com revisões nas instâncias colegiadas."],"65":["E18","Conflito se resolve com participação, diálogo e decisão coletiva, nunca com punição, isolamento ou centralização. Vale também para a equipe multiprofissional do hospital."],"67":["E14","O pedagogo orienta o professor a articular competências, objetivos e avaliação. É a lógica do planejamento coerente."],"70":["E08","Na LDB, a União coordena a política nacional de educação e os sistemas de ensino se organizam em regime de colaboração."]}},{"id":"hrl16","titulo":"EBSERH HRL-UFS 2016","cargo":"Pedagogo","banca":"Instituto AOCP","ano":2016,"gab":"definitivo","arq":"pedagogo-1.pdf","gabArq":"gabarito_oficial.pdf","tempo":240,"sobre":"Prova de hospital universitário, a mais parecida com o seu cargo: tem classe hospitalar, brinquedoteca, isolamento e hospitalização escolarizada. Português, Raciocínio Lógico e SUS também servem inteiros.","secoes":[["por",1,10,"Língua Portuguesa"],["rl",11,15,"Raciocínio Lógico"],["leg",16,20,"Legislação da EBSERH"],["sus",21,25,"Legislação do SUS"],["esp",26,50,"Conhecimentos Específicos"]],"g":"ECADBAEDCBDBCAEBEABCABEDCCABDDCDCABDEBACEEBCCECBAB","st":"iiiiiiiiiiiiiixfffffxiiixfxffiiifffffffffxxfffxiii","fora":{"leg":"A legislação própria da EBSERH não cai na SESA.","esp":"Administração, gestão de pessoas e liderança (pedagogia empresarial) não caem para o cargo 472."},"c":{"1":["P07","O final do texto diz que a inclusão positiva na mídia pode acelerar a mudança cultural. Quem defende o uso da mídia é Patrícia Almeida, não a autora do texto, e a organização da Austrália é de Cátia Malaquias."],"2":["P06","Capacitista é adjetivo (caracteriza “cultura”) e indica a discriminação contra pessoas com deficiência."],"3":["P10","A grafia correta é estereótipos."],"4":["P05","“na ONU” vem entre vírgulas por ser uma indicação de lugar intercalada na sequência de locais (na ONU, em Genebra). A vírgula antes de “participou” fecha o aposto e está correta."],"5":["P04","Falta o “que” integrante depois de afirmou: “Ela afirmou que a cultura vigente gera…”."],"6":["P04","Em A, “do que” introduz comparação. Nas outras, o “que” retoma um substantivo anterior: é pronome relativo."],"7":["P03","Pela norma-padrão, não se junta a preposição ao artigo do sujeito de um verbo no infinitivo: “a importância de as pessoas serem vistas”."],"8":["P07","“Infelizmente” revela a opinião do autor. As outras frases são constatações ou convites."],"9":["P02","Com expressão partitiva (a grande maioria de nós), o verbo pode ficar no singular ou concordar com o pronome: precisa ou precisamos."],"10":["P06","O trecho expressa desejo e hipótese, com formas no presente do subjuntivo e no gerúndio que apontam para o futuro."],"11":["R03","Os saltos alternam +3 e +2: 2, 5, 7, 10, 12, 15… A cada dois saltos ele anda 5 degraus e cai num múltiplo de 5 (5, 10, 15… 100)."],"12":["R01","Descontos sucessivos se multiplicam: 0,8 × 0,7 = 0,56 = 56/100 = 14/25."],"13":["R03","O único primo que não é ímpar é o 2. Então A − B = {2}: conjunto unitário."],"14":["R03","Pense em conjuntos: X está dentro de A, que está dentro de Y. Logo, todo X é Y."],"15":["R03","A equivalente de “se P, então Q” é a contrapositiva “se não Q, então não P”: se há fome, não há pão. Lógica proposicional não está no edital da SESA."],"21":["S01","O SUDS foi criado em julho de 1987, antes da Constituição. A história do SUS é complemento: não está listada no seu edital."],"22":["S02","A Lei 8.080 veda, em todas as esferas do SUS, dispensar, pagar ou reembolsar medicamento e produto sem registro na Anvisa."],"23":["S03","Desde 2015, o art. 23 permite capital estrangeiro em alguns casos, como hospital geral ou especializado, policlínica, clínicas e planejamento familiar. Serviço mantido por empresa para os empregados só é permitido sem fins lucrativos."],"24":["S04","Pela Resolução 453/2012, o Conselho de Saúde decide sobre o próprio orçamento. As reuniões são no mínimo mensais e abertas ao público, a pauta vai com 10 dias de antecedência e o quórum é de metade mais um."],"25":["S01","Contribuições para a seguridade social só podem ser cobradas 90 dias depois da publicação da lei (art. 195, § 6º). Fica fora dos artigos 196 a 200, mas é da mesma Constituição."],"27":["E17","Competência = conhecimentos + habilidades + atitudes (o famoso CHA). A mesma ideia está na definição de competência da BNCC."],"30":["E11","A classe hospitalar garante a continuidade dos conteúdos escolares durante a internação. Brinquedoteca e áreas de lazer têm outra finalidade."],"31":["E16","Para garantir atividades lúdicas, o pedagogo planeja e implanta uma brinquedoteca, obrigatória em hospital com internação pediátrica (Lei 11.104/2005)."],"32":["E13","Diante de uma crise, agir com calma, acolher, conversar e deixar a criança sentada ou deitada. Medicar ou conter não é papel do pedagogo."],"42":["E17","Feedback aproxima emissor e receptor, aumenta a confiança e corrige ruídos. Serve para o tema comunicação com família e equipe."],"43":["E17","Barreiras pessoais vêm da própria pessoa: emoções, hábitos de ouvir, preocupações e motivações."],"47":["E18","Quando o grupo se dispersa, falta coesão, a força que mantém a equipe unida em torno do objetivo comum."],"48":["E18","O pedagogo faz a ponte entre a linguagem médica e a linguagem da família, para que os pais entendam o que está acontecendo."],"49":["E11","Na hospitalização escolarizada, o atendimento é individual e segue o ano escolar da criança, com atividades ligadas à escola de origem."],"50":["E13","No isolamento protetor, quem está vulnerável é a criança, que tem imunidade baixa. O cuidado é para não levar micro-organismos até ela."]}},{"id":"chufpa16","titulo":"EBSERH CH-UFPA 2016","cargo":"Pedagogo","banca":"Instituto AOCP","ano":2016,"gab":"preliminar","arq":"pedagogo.pdf","gabArq":"gab_preliminar.pdf","tempo":240,"sobre":"Boa para treinar a parte básica: Português, Raciocínio Lógico e SUS estão no nível da SESA. Os Específicos são de pedagogia empresarial. O gabarito disponível é o preliminar, então alguma resposta pode ter mudado depois dos recursos.","secoes":[["por",1,10,"Língua Portuguesa"],["rl",11,15,"Raciocínio Lógico"],["leg",16,20,"Legislação da EBSERH"],["sus",21,25,"Legislação do SUS"],["esp",26,50,"Conhecimentos Específicos"]],"g":"EBBDEABAEDCDBAEDBDBCECDDAABDCECEADBCEBADABDCEDECBA","st":"iiiiiiiiiiiiiixfffffiiiiixfffxxfxfffffffffffffffff","fora":{"leg":"A legislação própria da EBSERH não cai na SESA.","esp":"Gestão de pessoas, educação corporativa, pesquisa e responsabilidade social (pedagogia empresarial) não caem para o cargo 472."},"c":{"1":["P07","Para Bauman, as relações líquidas geram ansiedade e trocam qualidade por quantidade de contatos, o que aparece nas relações em rede."],"2":["P07","O texto levanta uma hipótese (“Talvez sim”): as redes dão a sensação de aproximação em momentos de isolamento. A alternativa correta mantém esse tom de possibilidade."],"3":["P05","Frágeis e superficiais têm a mesma função na frase, por isso a vírgula. O travessão não introduz discurso indireto e os parênteses de “(enfim!)” marcam um comentário expressivo, não uma explicação."],"4":["P06","Portanto é conclusiva. “Pois” depois do verbo também é conclusivo: Tornamo-nos, pois, seres… Conquanto é concessiva, porquanto é causal, contudo e todavia são adversativas."],"5":["P04","“Somente se conectados” = somente se estiverem conectados: o se é conjunção condicional."],"6":["P01","Os dois “que” introduzem orações que completam verbos transitivos diretos (diz o quê? desejam o quê?): subordinadas substantivas objetivas diretas."],"7":["P06","Numa = preposição em + artigo indefinido uma."],"8":["P09","Prolífica = que produz muito, fecunda. Infértil é o oposto."],"9":["P06","“Vão” está no presente do indicativo. Com o infinitivo, forma uma locução com ideia de futuro, mas o tempo do auxiliar é o presente."],"10":["P08","O termo destacado retoma “essas redes sociais digitais”."],"11":["R03","160 + 80 − 200 = 40 escolheram os dois. Só X: 160 − 40 = 120. 120 de 200 = 60%."],"12":["R01","15% de 200 = 30. 200 − 30 = 170 reais."],"13":["R03","Pares a partir de 12: o 5º termo é 20 e o 8º é 26. Diferença: 6 (três passos de 2)."],"14":["R01","2/7 da capacidade = 300 mL, então 1/7 = 150 mL. Total: 7 × 150 = 1.050 mL."],"15":["R03","A negação de “todos” é “existe pelo menos um que não”. Negação de proposições não está no edital da SESA, mas é treino rápido."],"21":["S01","A incorreta é a E: quem compreende ações integradas de saúde, previdência e assistência social é a seguridade social (art. 194), não a previdência."],"22":["S04","A Resolução 453/2012 não permite que membros do Legislativo, do Judiciário e do Ministério Público sejam conselheiros. As vagas são 50% usuários, 25% trabalhadores e 25% governo e prestadores, e a função não é remunerada."],"23":["S06","Pelo Decreto 7.508, é competência exclusiva da CIT pactuar as diretrizes gerais da RENASES."],"24":["S06","O acordo de colaboração entre os entes para organizar a rede interfederativa é o COAP, Contrato Organizativo da Ação Pública da Saúde."],"25":["S03","Art. 8º: as ações do SUS são organizadas de forma regionalizada e hierarquizada, em níveis de complexidade crescente. Nas outras, as definições de vigilância sanitária e epidemiológica estão trocadas."],"26":["E17","Expor desempenho com frases humilhantes estimula a competição e reforça a ideia de que a capacidade é fixa e inata. Isso vai contra qualquer visão de desenvolvimento."],"30":["E17","Feedback eficaz motiva a pessoa a dar o melhor de si, focando em fatos e no momento certo."],"31":["E18","Em vez de ignorar, criar oportunidades para que as pessoas se conheçam e aprendam a conviver com as diferenças."],"33":["E17","A lista completa de habilidades de relacionamento: autoconhecimento, empatia, assertividade, cordialidade e ética. Competitividade e individualismo não entram."]}}],"edital":{"esp":{"nome":"Conhecimentos Específicos","itens":{"E1":"Fundamentos da Pedagogia Hospitalar e da atuação pedagógica em serviços de saúde e de reabilitação","E2":"Desenvolvimento humano e processos de aprendizagem: aspectos cognitivos, socioemocionais, motores e comunicativos na infância e adolescência","E3":"Teorias do desenvolvimento e da aprendizagem: Piaget, Vygotsky e outras abordagens aplicadas à prática pedagógica","E4":"Aprendizagem e desenvolvimento em crianças e adolescentes hospitalizados ou em reabilitação","E5":"Transtornos específicos de aprendizagem e transtornos do desenvolvimento","E6":"Avaliação pedagógica: necessidades educacionais, dificuldades, potencialidades e acompanhamento","E7":"Planejamento pedagógico em contexto hospitalar e de reabilitação","E8":"Adaptação curricular e flexibilização de atividades, materiais e recursos","E9":"Alfabetização e letramento em diferentes contextos de aprendizagem","E10":"Práticas para competências cognitivas, socioemocionais, comunicativas e funcionais","E11":"Ludicidade, jogos, brincadeiras e recursos pedagógicos no atendimento hospitalar","E12":"Educação inclusiva, acessibilidade e AEE no contexto hospitalar e de reabilitação","E13":"Continuidade do processo educacional: escola de origem, transição e reinserção escolar","E14":"Relação entre pedagogo, família, escola e equipe multiprofissional","E15":"Comunicação e estratégias de interação com crianças e adolescentes","E16":"Deficiências física, intelectual, sensorial e múltipla e transtornos do neurodesenvolvimento","E17":"Tecnologia assistiva e recursos pedagógicos acessíveis","E18":"Planejamento, registro e documentação do atendimento pedagógico","E19":"Humanização, acolhimento, autonomia, participação e respeito às singularidades","E20":"Ética, bioética, direitos da criança e do adolescente, sigilo e trabalho multiprofissional"}},"por":{"nome":"Língua Portuguesa","itens":{"P1":"Compreensão e interpretação de texto","P2":"Tipologias e gêneros textuais","P3":"Mecanismos de coesão textual","P4":"Estrutura e formação de palavras","P5":"Classes de palavras","P6":"Período simples e composto e relações sintático-semânticas","P7":"Funções do “que” e do “se”","P8":"Locuções verbais","P9":"Colocação pronominal","P10":"Concordância verbal e nominal","P11":"Regência verbal e nominal","P12":"Crase","P13":"Acentuação gráfica","P14":"Ortografia","P15":"Pontuação","P16":"Significação de palavras e expressões","P17":"Linguagem denotativa e conotativa","P18":"Figuras de linguagem","P19":"Sinonímia, antonímia, hiperonímia, homonímia e paronímia","P20":"Variação linguística"}},"sus":{"nome":"Legislação do SUS","itens":{"S1":"Saúde na Constituição Federal (arts. 196 a 200)","S2":"Lei 8.080/1990","S3":"Lei 8.142/1990: participação, conselhos, conferências e financiamento","S4":"Decreto 7.508/2011 e COAP","S5":"RAS, APS, Vigilância em Saúde e PNAB","S6":"Planejamento e gestão: Plano de Saúde, PAS, RAG, PRI","S7":"Direitos e deveres dos usuários, PNH e controle social","S8":"Lei Complementar 141/2012","S9":"Pactuação interfederativa: CIT, CIB e CIR","S10":"Determinantes e condicionantes sociais da saúde","S11":"Princípios doutrinários e organizativos do SUS","S12":"Participação complementar da iniciativa privada"}},"amp":{"nome":"História e Geografia do Amapá","itens":{"H1":"Povos originários","H2":"Colonização da região do Amapá","H3":"Disputas territoriais, guerras e conflitos estrangeiros","H4":"Atividades econômicas nos séculos XIX e XX","H5":"Cabanagem no Amapá","H6":"Território Federal e Estado do Amapá","H7":"Manifestações populares e sincretismo cultural","H8":"Patrimônio histórico material e imaterial, com destaque para Macapá","H9":"Amapá no século XXI e atualidades","G1":"Localização, divisão geográfica e territorial","G2":"Aspectos políticos","G3":"Aspectos geoeconômicos","G4":"Espaço natural: relevo, geologia, solos, clima, vegetação e hidrografia","G5":"Clima e mudanças climáticas","G6":"Recursos energéticos","G7":"Conflitos socioambientais no campo e na cidade","G8":"Reforma agrária","G9":"Unidades de Conservação","G10":"Sustentabilidade","G11":"Cartografia e geotecnologias","G12":"Urbanização","G13":"Demografia","G14":"Aspectos culturais","G15":"Comunidades indígenas","G16":"Comunidades quilombolas","G17":"Espaço econômico: agropecuária, extrativismo e indústria","G18":"Desenvolvimento econômico","G19":"O Amapá no contexto brasileiro"}},"inf":{"nome":"Informática","itens":{"I1":"Conceitos e fundamentos básicos","I2":"Softwares utilitários (compactadores, chat, e-mail, vídeo, imagem, antivírus)","I3":"Hardware: placa-mãe, memórias e processador","I4":"Periféricos","I5":"Windows 10 e 11","I6":"LibreOffice e WPS Office: texto, planilhas e apresentações","I7":"LibreOffice Writer, Calc e Impress (versões 6 e 7)","I8":"Internet, busca e pesquisa na Web","I9":"Navegadores: Edge, Firefox e Chrome","I10":"Segurança na Internet e vírus","I11":"Ferramentas Google: Gmail, Agenda, Meet, Drive, Documentos, Planilhas, Apresentações e Formulários"}},"rl":{"nome":"Raciocínio Lógico","itens":{"R1":"Problemas com frações","R2":"Conjuntos","R3":"Porcentagens","R4":"Sequências de números, figuras e palavras","R5":"Equações de 1º grau","R6":"Funções de 1º grau","R7":"Razão","R8":"Proporção","R9":"Regra de três simples","R10":"Regra de três composta","R11":"Sistemas de equações"}}},"cards":{"E01":[["Como se chama a teoria de Piaget e quais as duas palavras que a definem?","Epistemologia genética. Construtivista e interacionista: o conhecimento é construído na interação com o mundo."],["Assimilação × acomodação","Assimilação encaixa o novo num esquema que já existe. Acomodação muda o esquema para dar conta do novo."],["Quais são os 4 fatores do desenvolvimento para Piaget?","Maturação, experiência, transmissão social e equilibração (que coordena os outros três)."],["Os 4 estágios de Piaget, com as idades","Sensório-motor (0–2), pré-operatório (2–7), operatório concreto (7–11/12) e operatório formal (11/12 em diante)."],["Marcas do pré-operatório","Função simbólica, egocentrismo, animismo, centração e irreversibilidade. Ainda não conserva quantidades."],["Marcas do operatório concreto","Reversibilidade, conservação, classificação e seriação, apoiadas no concreto."],["Para Piaget, o que vem primeiro: desenvolvimento ou aprendizagem?","O desenvolvimento possibilita a aprendizagem. (Em Vygotsky é o contrário.)"]],"E02":[["Como se chama a abordagem de Vygotsky?","Histórico-cultural (sociointeracionista). As funções psicológicas superiores têm origem social."],["Instrumentos × signos","Instrumentos agem sobre o mundo; signos agem sobre o psiquismo. A linguagem é o principal signo."],["Lei da dupla formação","Toda função aparece primeiro no plano interpsicológico (entre pessoas) e depois no intrapsicológico (dentro da criança)."],["Nível real, nível potencial e ZDP","Real: o que faz sozinha. Potencial: o que faz com ajuda. ZDP: a distância entre os dois."],["Para Vygotsky, o que puxa o quê?","A aprendizagem impulsiona o desenvolvimento."],["O que acontece com a fala egocêntrica?","Vira fala interior."],["Brincadeira e defectologia em Vygotsky","A brincadeira cria ZDP. Na defectologia, a deficiência é compensada pelas relações sociais (compensação social)."]],"E03":[["Wallon: quais dimensões formam a pessoa completa?","Afetividade, ato motor e cognição. A emoção é a primeira forma de comunicação."],["Ausubel: aprendizagem significativa","O novo se ancora em conhecimentos que a pessoa já tem (subsunçores). Organizadores prévios ajudam. O oposto é a aprendizagem mecânica."],["Skinner: reforço × punição","Reforço (positivo ou negativo) aumenta o comportamento. Punição diminui."],["Gardner defende o quê?","Inteligências múltiplas, contra a ideia de uma inteligência única."],["Freire: educação bancária × problematizadora","Bancária deposita conteúdo num aluno passivo. Problematizadora se faz pelo diálogo e pela reflexão sobre a realidade."],["Estágios de Wallon","Impulsivo-emocional, sensório-motor e projetivo, personalismo, categorial, puberdade e adolescência."]],"E04":[["4 características do desenvolvimento","Contínuo, ao longo de toda a vida, multideterminado e com ritmo individual."],["Sentidos do desenvolvimento motor","Céfalo-caudal (da cabeça para os pés) e próximo-distal (do centro para as extremidades)."],["Crises de Erikson na infância e adolescência","Confiança, autonomia, iniciativa, produtividade e identidade."],["Domínios do desenvolvimento","Físico-motor, cognitivo, linguagem e socioemocional."],["Efeitos possíveis da internação no desenvolvimento","Regressão, privação de estímulos e impacto na autoestima."],["O que o pedagogo faz diante disso?","Propõe atividades adequadas à idade e ao quadro clínico, mantém rotina, oferece escolhas e preserva o vínculo com a escola."]],"E05":[["Dificuldade × transtorno de aprendizagem","Dificuldade: causa externa e passageira. Transtorno: origem neurobiológica e persistente."],["Critério de tempo do DSM-5-TR","Dificuldades por pelo menos 6 meses, apesar de intervenção direcionada."],["O que NÃO explica um transtorno específico de aprendizagem?","Deficiência intelectual, problema sensorial ou falta de ensino adequado."],["Dislexia, disgrafia, disortografia, discalculia","Leitura · traçado da letra · ortografia · matemática."],["O que a Lei 14.254/2021 garante?","Acompanhamento integral para dislexia, TDAH e outros transtornos: identificação precoce, diagnóstico, apoio educacional e terapêutico, equipe multidisciplinar e formação de professores."],["O pedagogo diagnostica transtorno?","Não. Observa, registra, encaminha e adapta."]],"E06":[["Os dois grupos de critérios do TEA","Déficit persistente na comunicação e interação social + padrões restritos e repetitivos (inclui alterações sensoriais)."],["Níveis do TEA","Níveis de suporte 1, 2 e 3."],["Lei 12.764/2012 em 3 pontos","TEA é deficiência para todos os efeitos legais; acompanhante especializado se comprovada necessidade; multa de 3 a 20 salários mínimos por recusar matrícula."],["Critérios do TDAH","Desatenção e/ou hiperatividade-impulsividade, sintomas antes dos 12 anos, em 2 ou mais ambientes. Três apresentações."],["Deficiência intelectual: o que define a gravidade?","O funcionamento adaptativo (domínios conceitual, social e prático), não só o QI."],["Estratégias pedagógicas para TEA, TDAH e DI","Rotina previsível, apoio visual, tarefas curtas, material concreto e foco na funcionalidade."]],"E07":[["Conceito de pessoa com deficiência na LBI","Impedimento de longo prazo que, em interação com barreiras, pode obstruir a participação em igualdade de condições (modelo social)."],["Paralisia cerebral implica deficiência intelectual?","Não. Afeta movimento e postura."],["Cegueira × baixa visão (acuidade no melhor olho, com a melhor correção)","Cegueira: 0,05 ou menos. Baixa visão: entre 0,3 e 0,05."],["A partir de quantos decibéis é deficiência auditiva?","Perda bilateral de 41 dB ou mais."],["Lei 10.436/2002","Reconhece a Libras como meio legal de comunicação. Ela não substitui o português escrito."],["Educação bilíngue de surdos","Libras como primeira língua e português escrito como segunda. Virou modalidade na LDB pela Lei 14.191/2021."],["Surdocegueira","Condição única. Comunicação por Libras tátil e apoio de guia-intérprete."]],"E08":[["Integração × inclusão","Na integração o aluno se adapta à escola. Na inclusão a escola se transforma."],["Declaração de Salamanca","1994. A escola regular inclusiva é o meio mais eficaz de combater a discriminação."],["Política de 2008: papel da educação especial","Modalidade transversal; AEE complementar ou suplementar, nunca substitutivo."],["Público-alvo da educação especial","Deficiência, TGD (hoje TEA) e altas habilidades/superdotação."],["LBI, art. 27 e cobranças","Sistema educacional inclusivo em todos os níveis. Escola privada não pode cobrar a mais. Recusar matrícula é crime."],["Os 3 princípios do DUA","Múltiplos meios de engajamento, de representação e de ação e expressão."]],"E09":[["AEE complementar × suplementar","Complementar: deficiência e TGD. Suplementar: altas habilidades. Nunca substitutivo."],["Onde e quando acontece o AEE (Res. 4/2009)?","Prioritariamente na sala de recursos multifuncionais, no turno inverso."],["AEE pode acontecer no hospital?","Sim. Res. 4/2009, art. 6º: também em ambiente hospitalar ou domiciliar."],["Financiamento e plano do AEE","Dupla matrícula no Fundeb. Plano de AEE feito com os professores e a família."],["O que é tecnologia assistiva?","Área interdisciplinar de produtos, recursos, metodologias, estratégias, práticas e serviços que promovem funcionalidade, autonomia e inclusão."],["Comunicação alternativa × aumentativa","Alternativa substitui a fala. Aumentativa complementa a fala. Serve também para paciente intubado."]],"E10":[["Diagnóstica, formativa e somativa: quando e para quê","Diagnóstica: no início, para conhecer e planejar. Formativa: durante, para regular. Somativa: no fim, para classificar ou certificar."],["Quem criou e quem difundiu formativa/somativa?","Scriven criou os termos. Bloom difundiu."],["Luckesi","Diferencia avaliação de exame. Avaliação diagnóstica serve para tomar decisão."],["Avaliação mediadora é de quem?","Jussara Hoffmann. (Perrenoud: regulação. Saul: emancipatória.)"],["LDB, art. 24, V","Avaliação contínua e cumulativa, com prevalência do qualitativo. Recuperação de preferência paralela."],["Avaliação no hospital","Diagnóstica no início, processual, flexível ao quadro clínico, com registros e relatório para a escola."]],"E11":[["Pedagogia hospitalar em 3 verbos","Aprender, desenvolver e humanizar. Vai além da classe hospitalar."],["As duas modalidades do MEC (2002)","Classe hospitalar (no ambiente de tratamento) e atendimento pedagógico domiciliar (casa ou casa de apoio)."],["Quem é atendido?","Alunos da educação básica, matriculados ou não."],["Hospitalização escolarizada","Matos e Mugiatti: atendimento personalizado que segue o currículo da série da criança."],["Marcos históricos","França: 1935 (Sellier) e 1939 (CNEFEI). Brasil: 1950, Hospital Municipal Jesus, no Rio de Janeiro."],["Fonseca e Ceccim","Fonseca: estudos sobre classe hospitalar. Ceccim: escuta pedagógica."]],"E12":[["Decreto-Lei 1.044/1969 e Lei 6.202/1975","1.044: exercícios domiciliares por doença. 6.202: estende o regime à estudante gestante."],["Resolução CONANDA 41/1995","Direitos da criança e do adolescente hospitalizados."],["Res. CNE/CEB 2/2001, art. 13","Ação integrada entre ensino e saúde, continuidade dos estudos, reintegração à escola e frequência certificada por relatório."],["Lei 11.104/2005","Brinquedoteca obrigatória nas unidades com atendimento pediátrico em regime de internação."],["Lei 13.716/2018","Incluiu o art. 4º-A na LDB: atendimento educacional ao aluno da educação básica internado, em regime hospitalar ou domiciliar, por tempo prolongado."],["O que é o documento do MEC de 2002?","Orientações sobre classe hospitalar e atendimento pedagógico domiciliar."]],"E13":[["Características do atendimento no hospital","Tempo incerto, rotina hospitalar em primeiro lugar, grupos heterogêneos e alta rotatividade."],["Como deve ser cada atendimento?","Com começo, meio e fim, porque a criança pode não voltar no dia seguinte."],["Escuta pedagógica (Ceccim) é terapia?","Não. É atenção ao que a criança expressa para orientar o trabalho educativo."],["Diante de uma crise da criança, o pedagogo…","Mantém a calma, dá conforto e chama a equipe. Conter e medicar não são atribuições dele."],["Os 3 tipos de isolamento","De contato, respiratório e protetor (reverso)."],["No isolamento protetor, quem está em risco?","A criança, que está imunossuprimida. O cuidado é não levar micro-organismos até ela."]],"E14":[["Planejamento segundo Libâneo","Racionalizar, organizar e coordenar a ação docente."],["Níveis de planejamento","Educacional, institucional (PPP), curricular e de ensino."],["Elementos de um plano","Objetivos, conteúdos, metodologia, recursos, avaliação e tempo. Flexível e coerente."],["Adaptações de grande × pequeno porte","Grande porte: dependem da gestão ou do sistema. Pequeno porte: feitas pelo professor."],["Tipos de adaptação curricular","Organizativas, de objetivos e conteúdos, de procedimentos, de avaliação e de temporalidade."],["Como é o planejamento no hospital?","Individual, de curto prazo, revisável e articulado com a escola e a equipe de saúde."]],"E15":[["Alfabetização × letramento","Alfabetização: domínio do sistema de escrita. Letramento: uso social da escrita. Magda Soares: alfabetizar letrando."],["Hipóteses de escrita (Ferreiro e Teberosky)","Pré-silábica, silábica (com ou sem valor sonoro), silábico-alfabética e alfabética."],["Realismo nominal","Achar que coisa grande tem nome grande."],["Como é feita a sondagem?","Sem cópia: 4 palavras do mesmo campo semântico (polissílaba, trissílaba, dissílaba e monossílaba) e 1 frase. Depois a criança lê apontando com o dedo."],["Métodos sintéticos × analíticos","Sintéticos: da parte para o todo. Analíticos: do todo para a parte. Construtivismo não é método."],["Foco da alfabetização na BNCC","Os dois primeiros anos do ensino fundamental."]],"E16":[["Kishimoto: brinquedo, brincadeira e jogo","Brinquedo é o objeto. Brincadeira é a ação. Jogo tem regras."],["Huizinga (Homo Ludens)","O jogo é livre, tem regras, tempo e espaço próprios e está na base da cultura."],["Brincar no ECA","Art. 16, IV: brincar faz parte do direito à liberdade."],["Lei 11.104/2005 e Portaria 2.261/2005","A lei obriga a brinquedoteca (para crianças e acompanhantes). A portaria regulamenta."],["Tipos de jogo em Piaget e o papel da brincadeira em Vygotsky","Piaget: exercício, simbólico e de regras. Vygotsky: a brincadeira cria ZDP."],["Para que serve o brincar no hospital?","Elaborar a experiência, recuperar o controle, aprender e socializar, com higiene e respeito às restrições."]],"E17":[["Competência na BNCC","Mobilizar conhecimentos, habilidades, atitudes e valores para resolver demandas complexas."],["Quantas são as competências gerais da BNCC?","Dez."],["Cite 4 competências gerais","Conhecimento, pensamento científico, repertório cultural, comunicação, cultura digital, trabalho e projeto de vida, argumentação, autoconhecimento, empatia e cooperação, responsabilidade e cidadania."],["Os 4 grupos de competências do edital","Cognitivas (inclui funções executivas), socioemocionais, comunicativas e funcionais (vida diária)."],["Boa comunicação com a criança","Linguagem adequada à idade, escuta ativa, validar sentimentos, honestidade e respeito ao tempo de resposta."]],"E18":[["Quando começa o vínculo com a escola de origem?","Desde o início da internação: contato, troca de atividades, relatório e frequência."],["Como preparar a reinserção escolar","Preparar a escola, a turma (com autorização) e a criança, e acompanhar depois da alta."],["Papel do pedagogo com a família","Acolher, informar direitos, envolver e orientar, sem substituir a família."],["Multi × inter × transdisciplinar","Multi: cada um na sua área. Inter: integração entre áreas. Trans: as fronteiras são atravessadas."],["O que é o PTS?","Projeto Terapêutico Singular: plano de cuidado construído pela equipe com o usuário e a família."],["O pedagogo informa diagnóstico ou prognóstico?","Não. Isso é da equipe de saúde."]],"E19":[["Registros do atendimento pedagógico","Cadastro, plano individual, diário de atendimento, relatório e portfólio."],["Como escrever um registro","De forma descritiva e objetiva, sem rótulos e sem diagnósticos."],["Dados de saúde na LGPD","São dados sensíveis: compartilhar só o necessário e com autorização."],["Princípios da PNH (2003)","Transversalidade; indissociabilidade entre atenção e gestão; protagonismo, corresponsabilidade e autonomia."],["Diretrizes da PNH","Acolhimento, cogestão, ambiência, clínica ampliada, valorização do trabalhador e defesa dos direitos dos usuários."],["Acolhimento é triagem?","Não. É postura ética. Ambiência é o espaço físico e relacional."]],"E20":[["Criança × adolescente no ECA","Criança até 12 anos incompletos. Adolescente de 12 a 18."],["ECA, art. 12","Direito a acompanhante em tempo integral durante a internação."],["Suspeita de maus-tratos: o que fazer?","Comunicação obrigatória ao Conselho Tutelar (art. 13). Omitir gera multa (art. 245)."],["Conselho Tutelar","Permanente, autônomo e não jurisdicional. 5 membros, mandato de 4 anos."],["Princípios da bioética","Autonomia, beneficência, não maleficência e justiça. Com criança, busca-se o assentimento dela."],["Doutrina do ECA","Proteção integral e prioridade absoluta."]],"P01":[["Período simples × composto","Simples: uma oração (um verbo ou locução). Composto: duas ou mais."],["Quando a oração não tem sujeito?","Com haver no sentido de existir ou de tempo, fazer indicando tempo e verbos de fenômenos da natureza."],["Complemento nominal × adjunto adnominal","Complemento nominal tem sentido passivo (amor à pátria). Adjunto adnominal tem sentido ativo ou de posse (amor da mãe)."],["As 5 coordenadas sindéticas","Aditiva, adversativa, alternativa, conclusiva e explicativa."],["“Pois” depois do verbo é…","Conclusivo (= portanto). Antes do verbo, costuma ser explicativo."],["Como reconhecer a oração substantiva?","Dá para trocar por “isso”."],["Adjetiva restritiva × explicativa","Restritiva vem sem vírgula e limita o termo. Explicativa vem entre vírgulas e generaliza."]],"P02":[["Sujeito composto depois do verbo","O verbo vai para o plural ou concorda com o núcleo mais próximo."],["“Mais de um” e “a maioria de”","Mais de um: singular. A maioria de: singular ou plural."],["Haver e fazer impessoais","Haver (existir/tempo) e fazer (tempo) ficam no singular, inclusive em locução: deve haver, vai fazer."],["Verbo + SE: quando o verbo varia?","VTD + se = voz passiva: o verbo concorda (vendem-se casas). VTI/VI + se = indeterminação: singular (precisa-se de ajudantes)."],["Meio e bastante","Variam quando são adjetivos (bastantes livros); não variam como advérbios (meio cansada)."],["Anexo, obrigado, mesmo, quite × em anexo, menos, alerta","Os primeiros concordam. “Em anexo”, “menos” e “alerta” não variam."],["“É proibido entrada” ou “É proibida a entrada”?","As duas. Sem artigo, fica no masculino; com artigo, concorda."]],"P03":[["Assistir: ver × ajudar","Ver: assistir a (assisti ao filme). Ajudar: assistir direto (o médico assistiu o paciente)."],["Aspirar e visar","Aspirar a = desejar; aspirar direto = inalar. Visar a = pretender."],["Preferir e implicar","Prefere-se algo a outra coisa (nunca “mais do que”). Implicar (acarretar) é direto: implica riscos."],["Esquecer e lembrar","Diretos (esqueci o nome) ou pronominais com “de” (esqueci-me do nome)."],["Teste rápido da crase","Troque a palavra feminina por uma masculina: se aparecer “ao”, tem crase."],["Onde a crase é proibida?","Antes de masculino, verbo, pronome pessoal e entre palavras repetidas (cara a cara)."],["Crase facultativa","Antes de possessivo feminino singular, de nome próprio de mulher e depois de “até”."],["Crase com nome de cidade","Vou a… volto da → crase (vou à Bahia). Vou a… volto de → sem crase (vou a Macapá)."]],"P04":[["Como identificar o QUE relativo, integrante e expletivo","Relativo troca por “o qual”. Integrante troca por “isso”. Expletivo pode sair da frase."],["SE apassivador × índice de indeterminação","Apassivador: com VTD, verbo concorda. Indeterminação: com VTI, VI ou VL, verbo no singular."],["Outras funções do SE","Reflexivo (a si mesmo), parte do verbo (queixar-se), conjunção condicional (= caso) e conjunção integrante (não sei se vou)."],["Palavras que atraem o pronome (próclise)","Negação, advérbio sem vírgula, pronomes relativos, indefinidos e demonstrativos, conjunções subordinativas."],["Quando usar mesóclise?","Futuro do presente ou do pretérito sem palavra atrativa: far-se-á."],["Quando usar ênclise?","No início da frase, no imperativo afirmativo, com gerúndio e com infinitivo."],["Pronome depois de particípio pode?","Nunca: “tinha dado-me” está errado."]],"P05":[["O que a vírgula nunca separa?","Sujeito do verbo, verbo do complemento e nome do complemento (a não ser com um par de vírgulas de intercalação)."],["Usos obrigatórios da vírgula","Adjunto adverbial deslocado (longo), aposto, vocativo, orações explicativas, intercalações, enumerações, conjunção deslocada e zeugma."],["Vírgula na oração adjetiva","Restritiva sem vírgula; explicativa com vírgula. Tirar ou pôr a vírgula muda o sentido."],["Ponto e vírgula × dois-pontos","Ponto e vírgula: enumerações longas e coordenadas extensas. Dois-pontos: citação, enumeração e explicação."],["Travessão, parênteses e aspas","Travessão: diálogo e destaque. Parênteses: informação acessória. Aspas: citação, ironia ou sentido especial."]],"P06":[["Classes variáveis e invariáveis","Variáveis: substantivo, artigo, adjetivo, numeral, pronome e verbo. Invariáveis: advérbio, preposição, conjunção e interjeição."],["O que o advérbio modifica?","Verbo, adjetivo e outro advérbio. É invariável."],["Derivação parassintética","Prefixo e sufixo entram juntos (entardecer, emagrecer)."],["Derivação regressiva × imprópria","Regressiva tira parte da palavra (lutar → luta). Imprópria muda a classe sem mudar a forma (o jantar)."],["Justaposição × aglutinação","Justaposição junta sem perder sons (girassol). Aglutinação perde algum som (planalto)."],["“Ex-militar” se forma por…","Derivação prefixal."]],"P07":[["Compreensão × interpretação","Compreensão: o que está explícito. Interpretação: o que se deduz (infere-se, conclui-se)."],["Os 3 erros clássicos nas alternativas","Extrapolação (vai além do texto), redução (fica com parte) e contradição (diz o oposto)."],["Pressuposto × subentendido","Pressuposto vem marcado nas palavras (“ainda”, “parou de”). Subentendido depende do contexto."],["Estratégia para interpretação","Leia a pergunta primeiro, volte ao trecho, desconfie de palavras absolutas (sempre, nunca, só) e ache
