ão ajustes no currículo para atender às necessidades de cada aluno, sem abrir mão de aprendizagens importantes. O documento do MEC **Adaptações Curriculares** (Parâmetros Curriculares Nacionais, 1998) as divide em dois portes:",{"t":[["Porte","Quem decide","Exemplos"],["Grande porte (significativas)","Instâncias político-administrativas e a gestão escolar","Alterar objetivos e conteúdos essenciais, criar serviços de apoio, mudar a temporalidade da escolarização"],["Pequeno porte (não significativas)","O professor, no planejamento da aula","Ajustar atividades, materiais, agrupamentos, tempo de uma tarefa, forma de avaliar"]]},"Elas podem ser **organizativas** (espaço, agrupamentos), nos **objetivos e conteúdos** (priorizar, sequenciar), nos **procedimentos didáticos e atividades**, na **avaliação** (instrumentos, formas de resposta) e na **temporalidade** (mais tempo).","O **Plano Educacional Individualizado (PEI)** registra objetivos, estratégias, recursos e avaliação para um aluno específico, construído com a família e a equipe.",{"a":"A LDB (art. 59, II) prevê **terminalidade específica** para quem não atingir o nível exigido para concluir o ensino fundamental em virtude de suas deficiências, e **aceleração** para superdotados concluírem em menor tempo."}]],["Planejar no hospital",[{"l":["**Individualizado**: parte da avaliação diagnóstica de cada criança e do currículo da sua série.","**Articulado com a escola de origem**: conteúdos, materiais e formas de avaliação combinados, para que o retorno seja tranquilo.","**Articulado com a equipe de saúde**: horários de procedimentos, restrições de movimento, energia e humor da criança.","**De curto prazo e revisável**: o replanejamento é constante.","**Com atividades completas** em cada atendimento e materiais fáceis de higienizar.","**Com registro**: o que foi feito, como a criança respondeu e o que vem depois."]},{"ex":"Uma menina do 4º ano vai ficar 40 dias internada. O pedagogo conversa com a professora dela, recebe o plano do bimestre (frações e textos informativos), adapta as atividades para o leito com material concreto e textos curtos, combina com a enfermagem os melhores horários e registra cada atendimento num relatório que vai para a escola."}]]],"r":["Planejamento (Libâneo): racionalizar, organizar e coordenar a ação docente.","Níveis: educacional, institucional (PPP), curricular e de ensino.","PPP: político e pedagógico, coletivo, gestão democrática.","Plano: objetivos, conteúdos, metodologia, recursos, avaliação e tempo; flexível e coerente.","Adaptações de grande porte (gestão/sistema) e de pequeno porte (professor).","Tipos: organizativas, objetivos e conteúdos, procedimentos, avaliação, temporalidade. PEI.","No hospital: individual, curto prazo, revisável, articulado com escola e equipe de saúde."],"q":[["Para Libâneo, o planejamento escolar é",["um processo de racionalização, organização e coordenação da ação docente, articulando a atividade escolar e o contexto social.","um documento burocrático exigido pela direção.","uma lista fixa de conteúdos a ser cumprida sem alterações.","um instrumento que dispensa a avaliação.","atividade exclusiva da coordenação pedagógica."],0,"Libâneo define o planejamento como racionalização, organização e coordenação da ação docente, ligada ao contexto social."],["O documento que expressa a identidade, as intenções e a organização do trabalho de toda a instituição educativa, construído coletivamente, é o",["plano de curso.","diário de classe.","Plano de AEE.","plano de aula.","Projeto Político-Pedagógico."],4,"O PPP é o planejamento institucional, construído coletivamente."],["São elementos básicos de um plano de ensino:",["apenas conteúdos e avaliação.","matrícula, frequência e boletim.","objetivos, conteúdos, metodologia, recursos e avaliação.","diagnóstico clínico, prescrição e alta.","regimento escolar e calendário."],2,"Objetivos, conteúdos, metodologia, recursos e avaliação são os elementos básicos de um plano."],["Segundo o documento Adaptações Curriculares (MEC, 1998), as adaptações realizadas pelo professor no planejamento das atividades em sala, como ajustar materiais, agrupamentos e tempo de uma tarefa, são de",["porte institucional.","natureza clínica.","terminalidade específica.","pequeno porte.","grande porte."],3,"Ajustes feitos pelo professor no cotidiano são adaptações de pequeno porte (não significativas)."],["Dar mais tempo para um aluno concluir uma atividade ou uma avaliação é um exemplo de adaptação",["de terminalidade.","de acesso arquitetônico.","nos objetivos essenciais.","organizativa de grande porte.","na temporalidade."],4,"Mais tempo é adaptação na temporalidade."],["A LDB prevê, para os educandos que não puderem atingir o nível exigido para a conclusão do ensino fundamental em virtude de suas deficiências,",["terminalidade específica.","transferência obrigatória para escola especial.","aceleração de estudos.","certificação apenas de frequência.","reprovação até que atinjam o nível exigido."],0,"É a terminalidade específica (art. 59, II). Aceleração é prevista para superdotados."],["Informe se é verdadeiro (V) ou falso (F) sobre o planejamento pedagógico no hospital e assinale a sequência correta.\n( ) Deve ser individualizado e partir da avaliação diagnóstica.\n( ) Deve ser rígido, para garantir o cumprimento do currículo.\n( ) Deve ser articulado com a escola de origem e com a equipe de saúde.\n( ) Pode ser revisto a cada atendimento, conforme as condições da criança.",["F – F – V – V.","V – F – F – V.","V – F – V – V.","F – V – V – F.","V – V – F – V."],2,"O planejamento no hospital é individual, articulado e flexível. Rigidez não combina com a imprevisibilidade da internação."],["Uma criança do 3º ano, internada por tempo prolongado, precisa acompanhar os conteúdos de sua turma. A ação inicial mais adequada do pedagogo é",["aguardar a escola entrar em contato.","contatar a escola de origem para conhecer o planejamento da turma e combinar adaptações e formas de registro.","aplicar o livro didático do 5º ano para adiantar conteúdos.","priorizar somente atividades recreativas.","elaborar um plano próprio, sem consultar a escola, para não sobrecarregar a professora."],1,"A articulação com a escola de origem garante continuidade e facilita o retorno."]]},{"id":"E15","m":"esp","t":"Alfabetização e letramento","ed":["E9"],"v":[["stnZuijFKxk","Alfabetização e letramento nos concursos: Emília Ferreiro e Magda Soares"],["gC8flh-bJoI","Níveis de alfabetização: pré-silábico, silábico, silábico-alfabético e alfabético"]],"obj":["Diferenciar alfabetização e letramento","Reconhecer as hipóteses de escrita da psicogênese","Diferenciar métodos sintéticos e analíticos","Planejar alfabetização com textos reais no hospital"],"s":[["Alfabetização e letramento",["Para **Magda Soares**, são processos **diferentes, mas inseparáveis**:",{"l":["**Alfabetização**: aprendizagem do **sistema de escrita alfabético-ortográfico**. É a parte técnica: relações entre sons e letras, direção da escrita, segmentação das palavras.","**Letramento**: uso competente da leitura e da escrita nas **práticas sociais**: ler um bilhete, uma receita, uma notícia, escrever uma carta."]},"Daí a expressão **alfabetizar letrando**: ensinar o sistema de escrita dentro de práticas reais de leitura e escrita.",{"a":"Alguém pode ser alfabetizado e pouco letrado (decodifica, mas não usa a escrita no dia a dia). E uma criança que ainda não lê pode ter algum letramento (sabe para que serve uma lista de compras)."}]],["Psicogênese da língua escrita",["**Emilia Ferreiro e Ana Teberosky** mostraram, com base em Piaget, que a criança **constrói hipóteses** sobre a escrita antes de dominá-la. O erro revela o que ela pensa.",{"t":[["Hipótese","O que a criança pensa","Exemplo para GATO"],["Pré-silábica","Ainda não relaciona escrita e sons. Usa letras ou rabiscos; pode achar que coisa grande se escreve com muitas letras (realismo nominal)","RTMOAIS"],["Silábica","Cada letra representa uma sílaba. Pode ser sem valor sonoro (letras quaisquer) ou com valor sonoro (letras que aparecem na fala)","AO"],["Silábico-alfabética","Transição: ora escreve uma letra por sílaba, ora representa os sons menores","GAO ou GTO"],["Alfabética","Compreende que as letras representam fonemas. Ainda pode errar a ortografia","GATO (e CAZA para casa)"]]},"A **sondagem** é a avaliação diagnóstica da escrita: a criança escreve, sem cópia, palavras de um mesmo campo semântico (uma polissílaba, uma trissílaba, uma dissílaba e uma monossílaba) e uma frase, e depois lê apontando com o dedo.",{"a":"Construtivismo é uma teoria sobre como se aprende, e não um método. A psicogênese descreve hipóteses; ela não manda “deixar a criança sozinha descobrir”."}]],["Métodos de alfabetização",[{"t":[["Métodos sintéticos (da parte para o todo)","Métodos analíticos (do todo para a parte)"],["Alfabético (soletração), fônico (sons das letras), silábico (famílias silábicas)","Palavração (palavra), sentenciação (frase), global ou de contos (texto)"]]},"A **consciência fonológica**, capacidade de refletir sobre os sons da fala (rimas, sílabas, sons iniciais, fonemas), está fortemente ligada ao avanço na alfabetização.","A **BNCC** define que a ação pedagógica nos **dois primeiros anos do ensino fundamental** deve ter como foco a alfabetização."]],["Alfabetizar no hospital",[{"l":["Faça a sondagem para saber a hipótese da criança.","Use **textos reais do ambiente**: nomes da equipe, placas, cardápio, rótulos, receitas, listas de brinquedos.","Produza textos com função: bilhete para a turma da escola, carta para um familiar, lista do que quer fazer depois da alta.","Trabalhe consciência fonológica com jogos de rima, parlendas e trava-línguas.","Respeite a hipótese em que a criança está e proponha desafios um pouco acima dela."]}]]],"r":["Alfabetização: sistema de escrita (técnica). Letramento: uso social da escrita. Alfabetizar letrando (Magda Soares).","Ferreiro e Teberosky: hipóteses pré-silábica, silábica (com ou sem valor sonoro), silábico-alfabética e alfabética.","Realismo nominal: achar que coisa grande tem nome grande.","Sondagem: 4 palavras do mesmo campo semântico + 1 frase, sem cópia.","Métodos sintéticos (parte → todo) e analíticos (todo → parte). Construtivismo não é método.","BNCC: foco na alfabetização nos dois primeiros anos do ensino fundamental."],"q":[["Segundo Magda Soares, letramento refere-se",["ao domínio da caligrafia.","à aprendizagem das relações entre fonemas e grafemas.","à memorização das famílias silábicas.","ao uso competente da leitura e da escrita nas práticas sociais.","à fase pré-silábica da escrita."],3,"Letramento é o uso social da escrita. A aprendizagem do sistema (relações som-letra) é a alfabetização."],["Uma criança escreve “AO” para GATO e “BL” para BOLA, usando uma letra para cada sílaba e letras que aparecem na pronúncia. Segundo Ferreiro e Teberosky, ela está na hipótese",["pré-silábica.","alfabética.","silábica com valor sonoro.","silábica sem valor sonoro.","silábico-alfabética."],2,"Uma letra por sílaba, com letras pertinentes aos sons: hipótese silábica com valor sonoro."],["A criança que acredita que a palavra BOI deve ser escrita com mais letras do que FORMIGA, porque o boi é maior, demonstra",["hipótese silábico-alfabética.","realismo nominal, típico da hipótese pré-silábica.","hipótese alfabética.","consciência fonêmica.","domínio ortográfico."],1,"Relacionar o tamanho da palavra ao tamanho do objeto é realismo nominal, típico do pré-silábico."],["São exemplos de métodos sintéticos de alfabetização:",["letramento e numeramento.","palavração e sentenciação.","método global e método de contos.","construtivismo e psicogênese.","alfabético, fônico e silábico."],4,"Sintéticos partem das unidades menores: letras, sons, sílabas. Palavração, sentenciação e global são analíticos."],["Sobre a psicogênese da língua escrita, é correto afirmar que",["é um método de alfabetização com cartilha própria.","foi elaborada por Vygotsky e Wallon.","descreve as hipóteses que a criança constrói sobre o sistema de escrita, compreendendo o erro como parte do processo.","considera a cópia o principal instrumento de diagnóstico.","propõe que a criança só deve escrever após dominar todas as letras."],2,"A psicogênese explica como a criança pensa a escrita. Não é método, e a sondagem é feita sem cópia."],["Na hipótese alfabética, a criança",["escreve sem nenhum erro ortográfico.","compreende que as letras representam unidades sonoras menores que a sílaba, podendo cometer erros ortográficos.","usa uma letra para cada sílaba.","alterna rabiscos e letras.","ainda não relaciona escrita e fala."],1,"Na hipótese alfabética a criança já compreende o princípio alfabético; a ortografia ainda está em construção."],["De acordo com a BNCC, a ação pedagógica deve ter como foco a alfabetização",["nos dois primeiros anos do ensino fundamental.","até o 5º ano do ensino fundamental.","na educação infantil, até os 5 anos.","apenas quando a criança atinge a hipótese silábica.","somente no 3º ano do ensino fundamental."],0,"A BNCC define os dois primeiros anos do ensino fundamental como foco da alfabetização."],["Para alfabetizar letrando uma criança internada, a estratégia mais adequada é",["produzir textos com função real, como um bilhete para a turma da escola, usando também textos do ambiente hospitalar.","copiar famílias silábicas no caderno durante todo o atendimento.","esperar a alta para trabalhar textos.","proibir a escrita espontânea para evitar erros.","apresentar apenas letras isoladas, sem contexto."],0,"Alfabetizar letrando é ensinar o sistema dentro de práticas reais de leitura e escrita."]]},{"id":"E16","m":"esp","t":"Ludicidade, jogos, brincadeiras e brinquedoteca","ed":["E11","E19"],"v":[["L3z-WuU5GMk","Brinquedoteca hospitalar traz benefícios para a recuperação das crianças"],["ANVKPcpNvS4","Como as brincadeiras ajudam na recuperação de crianças internadas"]],"obj":["Diferenciar jogo, brinquedo e brincadeira","Relacionar o brincar ao desenvolvimento segundo Piaget e Vygotsky","Conhecer o brincar como direito","Usar o lúdico com intencionalidade no hospital"],"s":[["Jogo, brinquedo e brincadeira",["A pesquisadora **Tizuko Kishimoto** ajuda a separar os termos:",{"l":["**Brinquedo**: o **objeto**, suporte da brincadeira (boneca, carrinho, bola).","**Brincadeira**: a **ação** de brincar, o lúdico em ação, com regras às vezes combinadas na hora.","**Jogo**: termo mais amplo, que costuma envolver **regras** explícitas (jogo da memória, dominó, futebol)."]},"Para **Johan Huizinga**, autor de **Homo Ludens**, o jogo é uma atividade **livre**, com **regras**, **tempo e espaço próprios**, separada da vida comum, e é um elemento fundador da cultura.","**Ludicidade** é mais amplo que jogar: é a experiência de prazer e inteireza que uma atividade proporciona. Uma contação de história, uma música ou uma pintura podem ser lúdicas."]],["O brincar no desenvolvimento",[{"t":[["Autor","O que diz sobre o brincar"],["Piaget","O tipo de jogo acompanha o estágio: exercício (sensório-motor), simbólico (pré-operatório), regras (operatório)."],["Vygotsky","A brincadeira de faz de conta cria uma zona de desenvolvimento proximal; na situação imaginária a criança segue regras e age além do habitual."],["Wallon","O brincar envolve corpo, emoção e cognição; a imitação é central no personalismo."]]}]],["Brincar é direito",[{"lei":"O direito à liberdade compreende os seguintes aspectos: [...] IV – brincar, praticar esportes e divertir-se; [...].","f":"ECA (LEI 8.069/1990), ART. 16"},"A **Convenção sobre os Direitos da Criança** (ONU, 1989) também reconhece o direito ao descanso, ao lazer e às brincadeiras próprias da idade.","A **Lei 11.104/2005** tornou obrigatória a **brinquedoteca** nas unidades de saúde com atendimento pediátrico em regime de internação. Brinquedoteca é o espaço com brinquedos e jogos educativos destinado a **estimular as crianças e seus acompanhantes a brincar**. A Portaria MS 2.261/2005 regulamentou o funcionamento, inclusive as regras de higiene.",{"a":"A lei diz “crianças **e seus acompanhantes**”. A banca já trocou por “apenas crianças em idade escolar”."}]],["O lúdico no hospital",["No hospital, brincar não é só passatempo. Ele ajuda a criança a:",{"l":["**Elaborar o que vive**: no faz de conta ela dá sentido ao medo, à dor e aos procedimentos.","**Recuperar controle**: no jogo, ela decide, escolhe e vence.","**Aprender**: jogos e brincadeiras são ótimos para trabalhar conteúdos escolares.","**Socializar**: brincar em grupo diminui o isolamento.","**Reduzir ansiedade e estresse**, colaborando com a recuperação."]},"O **brinquedo terapêutico** é uma técnica da enfermagem para preparar a criança para procedimentos (por exemplo, brincar de aplicar injeção num boneco). O pedagogo pode colaborar com a equipe, mas o foco dele é educativo: uso intencional do lúdico para desenvolvimento e aprendizagem.",{"l":["Brinquedos e materiais **laváveis**, higienizados entre usos, seguindo a comissão de controle de infecção hospitalar.","Atenção às restrições de cada criança (isolamento, imunidade baixa, mobilidade).","Quando faltam atividades lúdicas na unidade, cabe ao pedagogo **propor um projeto** (de brinquedoteca, por exemplo), e não improvisar deixando brinquedos soltos ao lado dos leitos."]}]]],"r":["Kishimoto: brinquedo (objeto), brincadeira (ação), jogo (regras).","Huizinga (Homo Ludens): jogo livre, com regras, tempo e espaço próprios; base da cultura.","Piaget: exercício, simbólico, regras. Vygotsky: brincadeira cria ZDP.","ECA, art. 16, IV: brincar faz parte do direito à liberdade.","Lei 11.104/2005: brinquedoteca para crianças e acompanhantes; Portaria 2.261/2005 regulamenta.","No hospital: elaborar a experiência, recuperar controle, aprender, socializar, com higiene e respeito às restrições."],"q":[["Segundo Kishimoto, o objeto que serve de suporte para a brincadeira é denominado",["ludicidade.","brinquedo.","jogo.","recreação.","atividade dirigida."],1,"Brinquedo é o objeto; brincadeira é a ação; jogo costuma envolver regras."],["Na obra Homo Ludens, Huizinga caracteriza o jogo como",["atividade obrigatória e sem regras.","atividade exclusivamente infantil e sem valor cultural.","técnica de treinamento para o trabalho.","instrumento de avaliação somativa.","atividade livre, com regras, tempo e espaço próprios, que tem papel na formação da cultura."],4,"Para Huizinga o jogo é livre, regrado, delimitado no tempo e no espaço e está na base da cultura."],["O direito de brincar, praticar esportes e divertir-se é previsto no ECA como aspecto do direito",["à liberdade.","à convivência familiar.","à saúde.","à profissionalização.","à previdência."],0,"O art. 16 do ECA inclui o brincar entre os aspectos do direito à liberdade."],["De acordo com a Lei nº 11.104/2005 e sua regulamentação, a brinquedoteca é o espaço provido de brinquedos e jogos educativos destinado a estimular",["apenas as crianças em idade escolar a estudar.","somente os adolescentes internados.","as crianças e seus acompanhantes a brincar.","os profissionais de saúde a se exercitar.","as famílias a aguardar consultas."],2,"A definição inclui crianças e acompanhantes."],["Para Vygotsky, a brincadeira de faz de conta contribui para o desenvolvimento porque",["substitui a aprendizagem escolar.","é apenas descarga de energia.","só ocorre após os 7 anos.","cria uma zona de desenvolvimento proximal, na qual a criança age além de seu comportamento habitual.","dispensa regras, liberando a criança de limites."],3,"Na situação imaginária a criança segue regras e se comporta “acima da idade”: a brincadeira cria ZDP."],["Em uma unidade pediátrica, algumas crianças internadas não têm acesso a atividades pedagógicas recreativas. Diante disso, a ação mais adequada do pedagogo é",["pedir aos colegas da escola que venham brincar com elas.","levar as crianças à escola no horário de visitas.","elaborar e implantar um projeto de brinquedoteca para o hospital.","deixar brinquedos ao alcance das crianças, numa mesa ao lado dos leitos.","distribuir cadernos de desenho para as crianças."],2,"A resposta institucional e intencional é o projeto de brinquedoteca, com regras de uso e higiene."],["Analise as afirmativas sobre o lúdico no hospital.\nI. Ajuda a criança a elaborar experiências de dor e medo.\nII. Deve ser evitado, pois atrapalha a recuperação.\nIII. Exige cuidados de higiene com brinquedos e materiais.\nIV. Pode ser usado para trabalhar conteúdos escolares.\nEstão corretas apenas",["I, III e IV.","II, III e IV.","II e III.","I e II.","I e IV."],0,"I, III e IV estão corretas. O brincar contribui para a recuperação e para a aprendizagem."],["Uma criança de 5 anos está muito ansiosa com as punções diárias. Uma estratégia lúdica adequada, em articulação com a equipe de enfermagem, é",["pedir que a família retire a criança da brinquedoteca.","proibir que ela fale sobre os procedimentos durante as atividades.","substituir as atividades lúdicas por exercícios escritos para distraí-la.","oferecer um boneco e materiais para que ela brinque de cuidar, encenando o procedimento e expressando o que sente.","prometer que a próxima punção não vai doer."],3,"Brincar de cuidar ajuda a criança a elaborar o procedimento. Prometer que não vai doer quebra a confiança."]]},{"id":"E17","m":"esp","t":"Competências cognitivas, socioemocionais, comunicativas e funcionais","ed":["E10","E15"],"v":[["0wZi40yae_4","Competências socioemocionais na BNCC"],["oDYoQxlGvvY","As 10 competências gerais da BNCC (questões comentadas)"]],"obj":["Definir competência segundo a BNCC","Reconhecer as dez competências gerais","Diferenciar competências cognitivas, socioemocionais, comunicativas e funcionais","Comunicar-se bem com crianças e adolescentes, inclusive com limitações de fala"],"s":[["O que é competência",[{"lei":"Competência é definida como a mobilização de conhecimentos (conceitos e procedimentos), habilidades (práticas, cognitivas e socioemocionais), atitudes e valores para resolver demandas complexas da vida cotidiana, do pleno exercício da cidadania e do mundo do trabalho.","f":"BNCC"},"As **dez competências gerais da BNCC**: 1) conhecimento; 2) pensamento científico, crítico e criativo; 3) repertório cultural; 4) comunicação; 5) cultura digital; 6) trabalho e projeto de vida; 7) argumentação; 8) autoconhecimento e autocuidado; 9) empatia e cooperação; 10) responsabilidade e cidadania."]],["Quatro grupos de competências",[{"t":[["Grupo","O que envolve","Como trabalhar no hospital"],["Cognitivas","Atenção, memória, raciocínio, resolução de problemas, **funções executivas** (memória de trabalho, controle inibitório, flexibilidade)","Jogos de estratégia e de regras, desafios lógicos, projetos curtos"],["Socioemocionais","Autoconhecimento, autorregulação, empatia, cooperação, resiliência, tomada de decisão responsável","Rodas de conversa, nomear emoções, diário de sentimentos, combinados, escolhas"],["Comunicativas","Expressar-se e compreender por fala, escrita, gestos, desenho e comunicação alternativa","Contação de histórias, produção de textos com destinatário real, pranchas de CAA"],["Funcionais","Atividades de vida diária e prática: alimentar-se, higiene, vestir-se, organizar materiais, usar dinheiro, orientar-se no tempo","Rotina visual, autocuidado possível no leito, jogos de mercado, calendário da internação"]]},"As competências **funcionais** ganham peso no atendimento de crianças com deficiência e nas internações longas, porque a autonomia nas tarefas do dia a dia costuma ser reduzida no hospital.",{"a":"Na BNCC, as habilidades socioemocionais estão dentro do conceito de competência. Elas não são um componente curricular separado."}]],["Comunicação com crianças e adolescentes",[{"l":["**Linguagem adequada à idade**: frases curtas e exemplos concretos para os pequenos; conversa franca para os adolescentes.","**Escuta ativa**: olhar nos olhos, deixar falar, repetir com outras palavras o que entendeu.","**Validar sentimentos**: “Percebo que você está com medo. Faz sentido.” Em vez de “não precisa chorar”.","**Honestidade**: não prometer o que não pode cumprir (“não vai doer”). Informações sobre diagnóstico e tratamento são da equipe de saúde.","**Respeitar o tempo de resposta** de quem tem dificuldade de fala; oferecer perguntas de sim e não, gestos, pranchas e escrita.","**Adolescentes**: privacidade, autonomia e participação nas decisões."]},"O pedagogo também pode ajudar a família a entender a linguagem técnica, sempre a partir do que a equipe informou, servindo de **ponte** entre o vocabulário clínico e o cotidiano."]]],"r":["BNCC: competência = conhecimentos + habilidades + atitudes e valores para resolver demandas complexas.","Dez competências gerais: conhecimento, pensamento científico, repertório cultural, comunicação, cultura digital, trabalho e projeto de vida, argumentação, autoconhecimento, empatia e cooperação, responsabilidade e cidadania.","Cognitivas (inclui funções executivas), socioemocionais, comunicativas e funcionais (vida diária).","Comunicação: linguagem adequada, escuta ativa, validar sentimentos, honestidade, respeitar o tempo de resposta."],"q":[["Segundo a BNCC, competência é definida como",["a mobilização de conhecimentos, habilidades, atitudes e valores para resolver demandas complexas da vida cotidiana, da cidadania e do trabalho.","a capacidade inata de aprender.","a nota mínima para aprovação.","o conjunto de conteúdos que o aluno deve memorizar em cada ano.","o domínio exclusivo de habilidades técnicas profissionais."],0,"É a definição literal da BNCC."],["Empatia e cooperação, autoconhecimento e autocuidado são exemplos de",["componentes curriculares obrigatórios.","competências gerais da BNCC ligadas à dimensão socioemocional.","métodos de alfabetização.","conteúdos de matemática.","funções executivas."],1,"Estão entre as dez competências gerais da BNCC (8 e 9), com forte dimensão socioemocional."],["Memória de trabalho, controle inibitório e flexibilidade cognitiva são componentes das",["competências funcionais.","barreiras atitudinais.","adaptações de grande porte.","funções executivas.","inteligências múltiplas."],3,"São as três funções executivas centrais, ligadas às competências cognitivas."],["Para uma criança com deficiência intelectual em internação prolongada, atividades que trabalham alimentar-se sozinha, organizar seus materiais e usar um calendário da internação desenvolvem principalmente competências",["de argumentação.","de cultura digital.","exclusivamente cognitivas.","de repertório cultural.","funcionais."],4,"Atividades de vida diária e prática são competências funcionais, ligadas à autonomia."],["Durante uma atividade, uma criança diz que está com medo da cirurgia do dia seguinte. A resposta mais adequada do pedagogo é",["“Percebo que você está com medo. Quer me contar o que te preocupa?”","Mudar de assunto rapidamente para distraí-la.","Explicar detalhadamente como será a cirurgia, com termos médicos.","“Isso é coisa de bebê.”","“Não precisa ter medo, não vai doer nada.”"],0,"Validar o sentimento e abrir espaço para a fala é escuta ativa. Prometer que não vai doer ou detalhar a cirurgia não cabe ao pedagogo."],["Assinale a alternativa que NÃO corresponde a uma das dez competências gerais da BNCC.",["Cultura digital.","Responsabilidade e cidadania.","Argumentação.","Competitividade.","Trabalho e projeto de vida."],3,"Competitividade não está entre as competências gerais. As demais estão."],["Ao se comunicar com um adolescente internado com limitação temporária de fala, o pedagogo deve",["usar linguagem infantilizada.","completar as frases por ele para agilizar a conversa.","respeitar seu tempo de resposta e oferecer recursos como perguntas de sim e não, escrita e prancha de comunicação.","evitar perguntas para não cansá-lo.","conversar apenas com o acompanhante."],2,"Respeitar o tempo e oferecer formas alternativas de expressão garantem participação e dignidade."],["Os pais de uma criança internada saem confusos de uma conversa com o médico, sem entender os termos técnicos. Considerando o papel do pedagogo na equipe, ele pode",["dizer aos pais que o caso não é grave para tranquilizá-los.","orientar os pais a procurar informações na internet.","fazer a ponte entre a linguagem técnica e o cotidiano dos pais, a partir do que a equipe informou, e incentivar que tirem dúvidas com o médico.","ignorar a situação, pois não é atribuição sua.","explicar o diagnóstico e o prognóstico com base no prontuário."],2,"O pedagogo pode mediar a comunicação e encorajar o diálogo com o médico, sem fornecer informações clínicas próprias."]]},{"id":"E18","m":"esp","t":"Escola de origem, reinserção escolar, família e equipe multiprofissional","ed":["E13","E14"],"v":[["rqurdT3jTFA","Equipe multiprofissional: o que é e qual a sua importância"],["sq5xNBLIFPI","Programa Pedagogia Hospitalar"]],"obj":["Manter o vínculo da criança com a escola de origem","Planejar o retorno à escola depois da alta","Trabalhar com a família como parceira","Diferenciar multi, inter e transdisciplinaridade"],"s":[["Vínculo com a escola de origem",["O hospital é uma passagem. O objetivo é que a criança **volte** para a escola e continue sua trajetória. Por isso, o vínculo com a escola de origem começa logo no início do atendimento.",{"l":["**Contato inicial**: identificar a escola, a série, a professora e o planejamento da turma.","**Troca contínua**: receber conteúdos e atividades, devolver produções e registros.","**Frequência e relatório**: o relatório do pedagogo subsidia a certificação de frequência (Resolução CNE/CEB 2/2001).","**Contato com colegas**: cartas, desenhos, vídeos e chamadas, sempre com autorização da família e da criança."]}]],["Reinserção escolar",["Voltar à escola pode ser difícil: defasagem de conteúdos, cansaço, mudanças no corpo, medo de perguntas e de apelidos, superproteção dos adultos.",{"l":["**Preparar a escola**: orientar professores sobre adaptações necessárias (cansaço, alimentação, medicação, acessibilidade, faltas para consultas).","**Preparar a turma**, quando a família e a criança autorizarem, para receber o colega sem estigma.","**Preparar a criança**: conversar sobre o retorno, ensaiar respostas para perguntas difíceis, combinar a quem pedir ajuda.","**Acompanhar depois da alta**: atendimento pedagógico domiciliar, se ela ainda não puder ir à escola, e contato com a escola nas primeiras semanas."]},{"a":"Informações de saúde pertencem à criança e à família. O que vai ser contado à escola e à turma é decidido com elas, respeitando o sigilo."}]],["Família: parceira do trabalho",[{"l":["**Acolher**: a família também vive medo, cansaço e mudanças de rotina.","**Informar direitos educacionais**: exercícios domiciliares (Decreto-Lei 1.044/1969), atendimento ao aluno internado (LDB, art. 4º-A), permanência do acompanhante (ECA, art. 12).","**Envolver**: a família conhece a criança, ajuda a escolher atividades e mantém a ponte com a escola.","**Orientar sem substituir**: o pedagogo não assume decisões que são da família."]}]],["Equipe multiprofissional",["O cuidado da criança envolve medicina, enfermagem, psicologia, serviço social, terapia ocupacional, fisioterapia, fonoaudiologia, nutrição e pedagogia, entre outros.",{"t":[["Termo","O que significa"],["Multidisciplinar / multiprofissional","Vários profissionais atuam com o mesmo paciente, cada um na sua área, com pouca integração"],["Interdisciplinar","Há troca e integração entre as áreas, com objetivos e plano comuns"],["Transdisciplinar","As fronteiras entre as áreas são atravessadas, construindo uma compreensão comum que vai além de cada disciplina"]]},"O **Projeto Terapêutico Singular (PTS)**, dispositivo da Política Nacional de Humanização, é um conjunto de propostas de cuidado construído pela equipe **com** o usuário e a família. O pedagogo contribui com o olhar sobre aprendizagem, escolarização e desenvolvimento.","Cada profissional respeita os limites da própria atuação. O pedagogo **não** dá informações sobre diagnóstico, medicação ou prognóstico; ele informa a equipe sobre o que observa no atendimento pedagógico."]]],"r":["Vínculo com a escola de origem desde o início: contato, troca, relatório, frequência.","Reinserção: preparar escola, turma (com autorização) e criança; acompanhar após a alta.","Família: acolher, informar direitos, envolver, orientar sem substituir.","Multi (cada um na sua área) × inter (integração) × trans (fronteiras atravessadas).","PTS: plano de cuidado construído pela equipe com usuário e família.","Pedagogo não informa diagnóstico nem prognóstico."],"q":[["Sobre o vínculo da criança hospitalizada com a escola de origem, é correto afirmar que",["deve ser evitado para não expor a criança.","deve ser construído desde o início do atendimento, com troca de informações, atividades e registros.","deve ser retomado apenas após a alta hospitalar.","é dispensável quando a internação é longa.","é responsabilidade exclusiva da família."],1,"O vínculo começa cedo e facilita a continuidade e o retorno."],["Uma criança vai ter alta após quatro meses de tratamento, mas ainda não poderá frequentar a escola por recomendação médica. A continuidade do atendimento educacional deve ocorrer por meio",["de matrícula em outra série.","da brinquedoteca hospitalar.","do atendimento pedagógico domiciliar.","da matrícula em escola especial.","da reprovação no ano letivo."],2,"Quando a criança está em casa e impedida de ir à escola por motivo de saúde, cabe o atendimento pedagógico domiciliar."],["A integração entre diferentes áreas profissionais, com troca de saberes e construção de objetivos e planos comuns, caracteriza o trabalho",["isolado.","multidisciplinar.","interdisciplinar.","hierárquico.","disciplinar."],2,"Interdisciplinaridade é integração com objetivos comuns. Na multidisciplinaridade cada área atua de forma mais isolada."],["O Projeto Terapêutico Singular (PTS), dispositivo da Política Nacional de Humanização, é",["um plano elaborado exclusivamente pelo médico responsável.","o plano de aula do pedagogo hospitalar.","um protocolo fixo, igual para todos os pacientes.","um conjunto de propostas de cuidado construído pela equipe em conjunto com o usuário e sua família.","um documento jurídico de alta hospitalar."],3,"O PTS é construído coletivamente pela equipe com o usuário e a família, de forma singular para cada caso."],["Ao preparar o retorno escolar de uma criança que passou por tratamento oncológico, o pedagogo deve",["orientar a escola sobre adaptações necessárias e, com autorização da família e da criança, preparar a turma para recebê-la.","evitar qualquer contato com a escola.","aconselhar a família a adiar o retorno para o ano seguinte.","recomendar que ela seja transferida para outra escola.","informar toda a turma sobre o diagnóstico, independentemente da vontade da família."],0,"A escola precisa saber das adaptações; o que é contado à turma depende da autorização da família e da criança."],["Analise as afirmativas sobre a relação com a família da criança hospitalizada.\nI. A família deve ser acolhida, pois também vive o impacto da internação.\nII. O pedagogo deve informar à família os direitos educacionais da criança.\nIII. O pedagogo deve tomar decisões sobre a escolarização no lugar da família.\nIV. A família pode ajudar a manter a ponte com a escola de origem.\nEstão corretas apenas",["I, II e IV.","II e III.","I, II, III e IV.","I e III.","III e IV."],0,"I, II e IV estão corretas. O pedagogo orienta, mas não substitui a família nas decisões."],["Durante uma atividade, a mãe pergunta ao pedagogo se o tratamento do filho vai funcionar. A conduta adequada é",["mudar de assunto.","acolher a angústia da mãe e orientá-la a conversar com a equipe médica, que é quem pode responder sobre o tratamento.","consultar o prontuário e explicar o prognóstico.","dizer que sim, para tranquilizá-la.","responder com base no que ouviu dos colegas."],1,"Prognóstico é informação da equipe médica. O pedagogo acolhe e orienta o caminho certo."],["O relatório elaborado pelo pedagogo que atende a criança em classe hospitalar serve, entre outras finalidades, para",["substituir o prontuário médico.","registrar a medicação administrada.","justificar a reprovação do aluno.","definir a alta hospitalar.","subsidiar a certificação de frequência e informar a escola de origem sobre o percurso de aprendizagem."],4,"O relatório pedagógico informa a escola e embasa a certificação de frequência."]]},{"id":"E19","m":"esp","t":"Registro do atendimento, humanização e acolhimento","ed":["E18","E19"],"v":[["Y9sjDH7RWzs","Política Nacional de Humanização para concursos"],["aZhLF_9Fq_A","HumanizaSUS: princípios"]],"obj":["Registrar o atendimento pedagógico de forma ética e útil","Conhecer princípios, diretrizes e dispositivos da PNH","Entender acolhimento, ambiência e autonomia","Proteger dados pessoais sensíveis"],"s":[["Registro e documentação",["Registrar é o que dá continuidade ao trabalho e permite comunicar com a escola, a família e a equipe.",{"l":["**Ficha de cadastro pedagógico**: escola, série, professora, contato, interesses, histórico escolar.","**Plano individual**: objetivos, conteúdos, estratégias e recursos.","**Diário ou ficha de atendimento**: data, duração, local (leito ou sala), atividade, objetivos, como a criança respondeu, intercorrências.","**Relatório**: para a escola de origem e na alta; base para a certificação de frequência.","**Portfólio**: produções da criança ao longo da internação."]},"A escrita deve ser **descritiva e objetiva**: o que a criança fez e como. Evite rótulos (“preguiçosa”) e hipóteses diagnósticas (“parece ter TDAH”). Registre o que observou.",{"a":"Dados de saúde são **dados pessoais sensíveis** pela LGPD (Lei 13.709/2018). Compartilhe só o necessário para a finalidade educacional, com autorização da família."}]],["Política Nacional de Humanização (HumanizaSUS)",["Criada em **2003**, a PNH busca pôr em prática os princípios do SUS no dia a dia dos serviços, mudando os modos de **gerir** e de **cuidar**. Antes dela houve o Programa Nacional de Humanização da Assistência Hospitalar (PNHAH).",{"t":[["Princípios","Diretrizes","Alguns dispositivos"],["Transversalidade; indissociabilidade entre atenção e gestão; protagonismo, corresponsabilidade e autonomia dos sujeitos e coletivos","Acolhimento; gestão participativa e cogestão; ambiência; clínica ampliada e compartilhada; valorização do trabalhador; defesa dos direitos dos usuários","Acolhimento com classificação de risco; visita aberta e direito a acompanhante; Projeto Terapêutico Singular; equipe de referência e apoio matricial; colegiado gestor; ouvidoria; grupo de trabalho de humanização"]]},{"a":"Não confunda os três princípios com as diretrizes. A banca costuma colocar “acolhimento” como princípio: na PNH ele é diretriz."}]],["Acolhimento, ambiência e autonomia",["**Acolhimento** é uma postura ética de escuta qualificada e responsabilização pelo outro, em todos os momentos do cuidado. Não é só recepção nem triagem.","**Ambiência** é o espaço físico, social, profissional e de relações interpessoais, que deve ser acolhedor, resolutivo e humano. O trabalho pedagógico contribui: produções das crianças nas paredes, brinquedoteca, espaços de convivência.","**Autonomia e protagonismo**: a criança participa das decisões possíveis. Ela escolhe a atividade, o lugar, a ordem. Isso devolve um pouco do controle que a internação tira."]]],"r":["Registros: cadastro, plano individual, diário de atendimento, relatório, portfólio.","Escrita descritiva e objetiva, sem rótulos nem diagnósticos.","Dados de saúde são sensíveis (LGPD): compartilhar só o necessário, com autorização.","PNH (2003): princípios transversalidade, indissociabilidade atenção-gestão, protagonismo/corresponsabilidade/autonomia.","Diretrizes: acolhimento, cogestão, ambiência, clínica ampliada, valorização do trabalhador, defesa dos direitos dos usuários.","Acolhimento é postura ética, não triagem. Ambiência é espaço físico e relacional."],"q":[["Assinale a alternativa que apresenta um registro pedagógico adequado sobre o atendimento de uma criança hospitalizada.",["“Provavelmente tem TDAH, pois não para quieta.”","“Criança difícil, família complicada.”","“Atendimento normal.”","“A criança é preguiçosa e não quis fazer nada.”","“Realizou a leitura de um texto curto com apoio, identificou as personagens e pediu para continuar no dia seguinte; atendimento no leito, 30 minutos.”"],4,"O registro deve ser descritivo e objetivo: o que foi feito, como a criança respondeu, local e duração. Sem rótulos nem diagnósticos."],["São princípios da Política Nacional de Humanização:",["acolhimento, ambiência e clínica ampliada.","transversalidade; indissociabilidade entre atenção e gestão; protagonismo, corresponsabilidade e autonomia dos sujeitos e coletivos.","universalidade, integralidade e equidade.","hierarquização, regionalização e descentralização.","beneficência, não maleficência e justiça."],1,"Esses são os três princípios da PNH. A traz diretrizes; C traz princípios do SUS; E traz princípios da bioética."],["Na Política Nacional de Humanização, o acolhimento é",["uma etapa exclusiva da recepção.","um programa de financiamento.","um princípio.","uma diretriz.","sinônimo de triagem."],3,"Na PNH, o acolhimento é uma diretriz. É postura ética de escuta e responsabilização, não triagem."],["São dispositivos da Política Nacional de Humanização:",["visita aberta e direito a acompanhante, Projeto Terapêutico Singular e colegiado gestor.","Conselho Tutelar e Ministério Público.","RENAME e RENASES.","PAS e RAG.","Conferência e Conselho de Saúde."],0,"Visita aberta, PTS e colegiado gestor são dispositivos da PNH. As demais alternativas trazem instrumentos de outras políticas."],["Segundo a Lei Geral de Proteção de Dados (Lei nº 13.709/2018), os dados referentes à saúde da criança atendida pelo pedagogo são",["dados anonimizados por natureza.","dados que podem ser publicados em redes sociais com finalidade educativa.","informações sem proteção legal.","dados pessoais sensíveis, que exigem cuidado especial no tratamento.","dados públicos, de livre divulgação."],3,"Dado referente à saúde é dado pessoal sensível pela LGPD."],["A ambiência, na Política Nacional de Humanização, refere-se",["exclusivamente à limpeza do hospital.","à classificação de risco dos pacientes.","ao espaço físico, social, profissional e de relações interpessoais, que deve ser acolhedor, resolutivo e humano.","ao controle de visitas.","à temperatura das enfermarias."],2,"Ambiência abrange o espaço físico e o das relações."],["Oferecer à criança internada a possibilidade de escolher a atividade, a ordem das tarefas e o lugar do atendimento contribui principalmente para",["a substituição da equipe de saúde.","a disciplina da criança.","sua autonomia e protagonismo, reduzindo a sensação de perda de controle.","o cumprimento rápido do currículo.","a redução do tempo de internação."],2,"Escolher devolve um pouco de controle e expressa o princípio do protagonismo e da autonomia."],["Informe se é verdadeiro (V) ou falso (F) e assinale a sequência correta.\n( ) O relatório pedagógico pode subsidiar a certificação de frequência.\n( ) No registro, o pedagogo deve incluir hipóteses de diagnóstico clínico.\n( ) A PNH foi lançada em 2003.\n( ) Acolhimento é sinônimo de triagem.",["V – F – V – F.","V – F – F – V.","V – V – F – F.","F – F – V – V.","F – V – V – F."],0,"O relatório subsidia a frequência (V). O pedagogo não registra hipóteses diagnósticas (F). A PNH é de 2003 (V). Acolhimento não é triagem (F)."]]},{"id":"E20","m":"esp","t":"ECA, ética, bioética e sigilo","ed":["E20"],"v":[["oQmr7Ymh008","ECA atualizado 2026 (aula 1)"],["xopAizH_Mdc","Bioética: os quatro pilares"]],"obj":["Dominar os artigos do ECA ligados à saúde e à educação","Saber o que fazer diante de suspeita de maus-tratos","Aplicar os princípios da bioética","Agir com sigilo e ética na equipe"],"s":[["ECA: o essencial",[{"l":["**Proteção integral**: criança e adolescente são sujeitos de direitos (art. 1º).","**Criança** até 12 anos incompletos; **adolescente** de 12 a 18 anos (art. 2º).","**Prioridade absoluta** (art. 4º): primazia de proteção e socorro, precedência de atendimento nos serviços públicos, preferência nas políticas públicas e destinação privilegiada de recursos.","Nenhuma criança ou adolescente será objeto de negligência, discriminação, exploração, violência, crueldade e opressão (art. 5º)."]},{"lei":"Os estabelecimentos de atendimento à saúde, inclusive as unidades neonatais, de terapia intensiva e de cuidados intermediários, deverão proporcionar condições para a permanência em tempo integral de um dos pais ou responsável, nos casos de internação de criança ou adolescente.","f":"ECA, ART. 12"},"**Respeito** (art. 17): inviolabilidade da integridade física, psíquica e moral, incluindo a preservação da **imagem**, da identidade, da autonomia, dos valores, das ideias, das crenças e dos objetos pessoais.","**Educação** (art. 53): igualdade de condições de acesso e permanência; ser respeitado pelos educadores; contestar critérios de avaliação; participar de entidades estudantis; escola pública e gratuita próxima de casa. O art. 54 garante, entre outros, atendimento educacional especializado às pessoas com deficiência, preferencialmente na rede regular."]],["Suspeita de maus-tratos",[{"lei":"Os casos de suspeita ou confirmação de castigo físico, de tratamento cruel ou degradante e de maus-tratos contra criança ou adolescente serão obrigatoriamente comunicados ao Conselho Tutelar da respectiva localidade, sem prejuízo de outras providências legais.","f":"ECA, ART. 13"},"Basta a **suspeita** para comunicar. Deixar de comunicar é infração administrativa para o médico, o professor ou o responsável por estabelecimento de saúde ou de ensino, com multa de 3 a 20 salários de referência (art. 245).","O **Conselho Tutelar** é órgão **permanente e autônomo, não jurisdicional**, encarregado de zelar pelos direitos da criança e do adolescente. Cada município tem pelo menos um, com **5 membros** escolhidos pela comunidade para mandato de **4 anos**.",{"a":"O dever de sigilo não impede a comunicação de suspeita de maus-tratos. Nesse caso, a lei manda comunicar. No hospital, siga também o fluxo da instituição (serviço social, equipe)."}]],["Bioética",[{"t":[["Princípio (Beauchamp e Childress)","Significado"],["Autonomia","Respeitar a capacidade de decidir; base do consentimento informado"],["Beneficência","Agir para o bem da pessoa"],["Não maleficência","Não causar dano (“primeiro, não prejudicar”)"],["Justiça","Equidade na distribuição de cuidados e recursos"]]},"Com crianças, além do **consentimento** dos responsáveis, valoriza-se o **assentimento**: a concordância da própria criança ou adolescente, adequada à sua capacidade de compreensão.","O **Relatório Belmont** (1978), sobre pesquisa com seres humanos, trouxe três princípios: respeito às pessoas, beneficência e justiça."]],["Ética no dia a dia do pedagogo",[{"l":["**Sigilo**: o que se sabe no atendimento fica entre quem precisa saber para cuidar e ensinar.","**Imagem**: nada de fotos de pacientes sem autorização, e nunca em redes sociais pessoais.","**Limites da profissão**: diagnóstico, prognóstico e medicação são assuntos da equipe de saúde.","**Respeito** às crenças, valores e decisões da família, dentro da lei.","**Trabalho em equipe**: compartilhar observações relevantes com a equipe, pelo canal certo."]}]]],"r":["ECA: proteção integral; criança até 12 incompletos, adolescente 12–18; prioridade absoluta.","Art. 12: acompanhante em tempo integral na internação. Art. 16: brincar. Art. 17: respeito à imagem e integridade.","Art. 13: suspeita de maus-tratos → comunicação obrigatória ao Conselho Tutelar. Art. 245: multa por omissão.","Conselho Tutelar: permanente, autônomo, não jurisdicional; 5 membros; mandato de 4 anos.","Bioética: autonomia, beneficência, não maleficência, justiça. Assentimento da criança.","Sigilo, imagem, limites da profissão."],"q":[["Segundo o ECA, considera-se criança a pessoa",["até 14 anos completos.","até 12 anos de idade incompletos.","até 18 anos incompletos.","até 16 anos incompletos.","até 10 anos de idade."],1,"Criança: até 12 anos incompletos. Adolescente: entre 12 e 18 anos."],["De acordo com o art. 12 do ECA, os estabelecimentos de atendimento à saúde devem, nos casos de internação de criança ou adolescente,",["exigir autorização judicial para a presença de acompanhante.","garantir acompanhante somente para menores de 6 anos.","proporcionar condições para a permanência em tempo integral de um dos pais ou responsável.","proibir a presença de familiares nas unidades de terapia intensiva.","permitir visitas apenas em horário comercial."],2,"O art. 12 garante a permanência em tempo integral de um dos pais ou responsável, inclusive em UTI e unidades neonatais."],["Durante o atendimento, o pedagogo observa marcas e ouve relatos que levantam suspeita de maus-tratos contra a criança. Segundo o ECA, a conduta correta é",["comunicar obrigatoriamente o caso ao Conselho Tutelar, seguindo também o fluxo da instituição.","manter sigilo absoluto, pois a informação foi obtida durante o atendimento.","aguardar a confirmação dos fatos antes de qualquer comunicação.","registrar apenas no diário pessoal.","conversar com o suposto agressor para esclarecer a situação."],0,"Pelo art. 13, a simples suspeita deve ser comunicada ao Conselho Tutelar. O sigilo não impede essa comunicação."],["O Conselho Tutelar é um órgão",["subordinado à direção das escolas.","temporário, criado apenas em situações de emergência.","permanente e autônomo, não jurisdicional, encarregado de zelar pelo cumprimento dos direitos da criança e do adolescente.","jurisdicional, vinculado ao Poder Judiciário.","composto por juízes e promotores."],2,"Essa é a definição do art. 131 do ECA."],["O princípio bioético que determina não causar dano ao paciente é o da",["justiça.","beneficência.","autonomia.","equidade.","não maleficência."],4,"Não maleficência: não causar dano. Beneficência é fazer o bem."],["No atendimento a crianças, além do consentimento dos responsáveis, a bioética valoriza",["a opinião dos colegas da escola.","a dispensa de qualquer informação à criança.","a decisão exclusiva da equipe de saúde.","o assentimento da criança, adequado à sua capacidade de compreensão.","a autorização do Conselho Tutelar."],3,"O assentimento é a concordância da criança ou adolescente, respeitando sua autonomia em desenvolvimento."],["A respeito da prioridade absoluta prevista no ECA, assinale a alternativa INCORRETA.",["Compreende preferência na formulação e execução das políticas sociais públicas.","Compreende destinação privilegiada de recursos públicos nas áreas relacionadas à proteção da infância e da juventude.","Compreende precedência de atendimento nos serviços públicos ou de relevância pública.","Restringe-se ao atendimento na área da saúde, não alcançando a educação.","Compreende primazia de receber proteção e socorro em quaisquer circunstâncias."],3,"A prioridade absoluta alcança todos os direitos, inclusive educação. As outras alternativas reproduzem o parágrafo único do art. 4º."],["Uma voluntária do hospital deseja publicar em sua rede social fotos das crianças participando das atividades pedagógicas. Considerando o ECA e a ética profissional, o pedagogo deve",["autorizar, desde que as crianças estejam sorrindo.","deixar a decisão para as próprias crianças.","permitir apenas fotos de crianças em isolamento.","autorizar, pois a divulgação valoriza o trabalho pedagógico.","orientar que não publique, pois o direito ao respeito inclui a preservação da imagem, e qualquer uso depende de autorização formal e das normas da instituição."],4,"O art. 17 do ECA protege a imagem. Fotos de pacientes exigem autorização e seguem as regras do hospital."]]},{"id":"P01","m":"por","t":"Sintaxe: termos da oração e período composto","ed":["P6"],"v":[["zRYeauBptu4","Orações coordenadas e subordinadas: resumão para concurso"],["mXlFi4ZPUF0","Orações subordinadas para concurso"]],"obj":["Identificar sujeito, predicado e complementos","Diferenciar complemento nominal de adjunto adnominal","Classificar orações coordenadas e subordinadas pela relação de sentido","Reconhecer orações sem sujeito"],"s":[["Frase, oração e período",["**Oração** é o enunciado organizado em torno de um verbo. **Período simples** tem uma oração; **período composto** tem duas ou mais.",{"t":[["Termo","Função","Exemplo"],["Sujeito","Ser de quem se declara algo","**A criança** desenhou."],["Predicado","O que se declara","A criança **desenhou um barco**."],["Objeto direto","Completa verbo sem preposição obrigatória","Leu **o livro**."],["Objeto indireto","Completa verbo com preposição obrigatória","Precisa **de apoio**."],["Complemento nominal","Completa nome (substantivo, adjetivo, advérbio), com preposição","Tem medo **do escuro**."],["Predicativo","Atribui característica ao sujeito ou ao objeto","A sala está **limpa**."],["Agente da passiva","Quem pratica a ação na voz passiva","Foi atendida **pela pedagoga**."],["Adjunto adnominal","Caracteriza, determina o nome","**Os** livros **novos**"],["Adjunto adverbial","Circunstância (tempo, lugar, modo...)","Estudou **à noite**."],["Aposto","Explica, resume ou enumera um termo","Macapá, **capital do Amapá**, fica na Linha do Equador."],["Vocativo","Chamamento, isolado por vírgula","**Sammy**, venha cá."]]}]],["Tipos de sujeito",[{"l":["**Simples** (um núcleo) e **composto** (dois ou mais núcleos).","**Oculto ou desinencial**: identificado pela terminação do verbo (“Estudamos ontem”).","**Indeterminado**: verbo na 3ª pessoa do plural sem referente (“Roubaram meu celular”) ou verbo não transitivo direto + **se** (“Precisa-se de professores”).","**Oração sem sujeito**: verbos impessoais, como **haver** no sentido de existir ou de tempo decorrido (“Há vagas”, “Há dois anos”), **fazer** indicando tempo (“Faz frio”, “Faz anos”) e verbos de fenômenos da natureza (“Choveu”)."]}]],["Complemento nominal × adjunto adnominal",["Os dois podem vir com preposição depois de um nome. A diferença está no sentido:",{"l":["**Complemento nominal**: o termo tem sentido **passivo**, é o alvo da ação. “A exploração **dos engenhos**” (os engenhos são explorados).","**Adjunto adnominal**: o termo tem sentido **ativo** ou de posse. “A análise **do professor**” (o professor analisa); “o livro **da aluna**” (posse)."]},{"a":"Se o termo completa um **adjetivo** ou um **advérbio** (“útil **à saúde**”, “favoravelmente **ao réu**”), é sempre complemento nominal."}]],["Período composto por coordenação",["As orações são independentes na estrutura. Podem ser **assindéticas** (sem conjunção) ou **sindéticas**:",{"t":[["Tipo","Conjunções","Exemplo"],["Aditiva","e, nem, mas também","Leu e resumiu."],["Adversativa","mas, porém, contudo, todavia, entretanto, no entanto","Estudou, mas não fez as questões."],["Alternativa","ou... ou, ora... ora, quer... quer","Ora chora, ora ri."],["Conclusiva","logo, portanto, por isso, pois (depois do verbo)","Estudou muito; foi, pois, aprovada."],["Explicativa","pois (antes do verbo), porque, que","Leve guarda-chuva, pois vai chover."]]},{"a":"**Pois** depois do verbo, entre vírgulas, é **conclusivo**. Antes do verbo, é **explicativo**."}]],["Período composto por subordinação",["Uma oração depende da outra e exerce uma função dentro dela.",{"l":["**Substantivas**: funcionam como sujeito, objeto, complemento nominal, predicativo ou aposto. Introduzidas pela **conjunção integrante** “que” ou “se”. Dica: dá para trocar a oração por **isso**. “Espero **que você passe**” → “Espero isso” (objetiva direta).","**Adjetivas**: funcionam como adjunto adnominal, introduzidas por **pronome relativo** (que, o qual, quem, cujo, onde). **Restritivas** não têm vírgula e limitam o sentido; **explicativas** vêm entre vírgulas e generalizam.","**Adverbiais**: indicam circunstância."]},{"t":[["Adverbial","Conectivos típicos"],["Causal","porque, como (no início), já que, visto que"],["Consecutiva","tão/tanto/tal... que, de modo que"],["Concessiva","embora, ainda que, mesmo que, conquanto, por mais que"],["Condicional","se, caso, desde que, contanto que"],["Conformativa","conforme, como, segundo"],["Comparativa","como, mais/menos... (do) que"],["Final","para que, a fim de que"],["Proporcional","à medida que, à proporção que, quanto mais... mais"],["Temporal","quando, enquanto, logo que, assim que"]]},{"ex":"“É tão vasto o horizonte **que** será preciso fatiá-lo.” A segunda oração é **consecutiva**: diz a consequência de ser tão vasto."}]]],"r":["Oração gira em torno de um verbo; período simples tem 1 oração, composto tem 2+.","Sujeito: simples, composto, oculto, indeterminado; oração sem sujeito com haver (existir/tempo), fazer (tempo) e fenômenos naturais.","Complemento nominal: sentido passivo; adjunto adnominal: sentido ativo ou posse.","Coordenadas: aditiva, adversativa, alternativa, conclusiva, explicativa. Pois depois do verbo = conclusivo.","Substantivas (troca por “isso”), adjetivas (pronome relativo; restritiva sem vírgula, explicativa com vírgula) e adverbiais (causa, consequência, concessão, condição...)."],"q":[["Assinale a alternativa em que há oração sem sujeito.",["Os alunos chegaram cedo.","Estudamos a lei ontem.","Precisa-se de voluntários na brinquedoteca.","Roubaram o material da sala.","Houve muitas internações neste mês."],4,"Haver no sentido de existir é impessoal: oração sem sujeito. C e D têm sujeito indeterminado; B tem sujeito oculto."],["Em “A leitura do texto pelas crianças foi animada”, o termo “do texto” exerce a função de",["complemento nominal, pois tem sentido passivo em relação a “leitura”.","agente da passiva.","adjunto adnominal, pois indica posse.","adjunto adverbial.","objeto indireto."],0,"O texto é lido: sentido passivo, logo complemento nominal. “Pelas crianças” indicaria quem lê."],["Em “As crianças, que estavam internadas, participaram da atividade”, a oração destacada entre vírgulas é",["subordinada substantiva objetiva direta.","subordinada adjetiva explicativa.","subordinada adjetiva restritiva.","subordinada adverbial causal.","coordenada sindética explicativa."],1,"Entre vírgulas e introduzida por pronome relativo: adjetiva explicativa. Ela generaliza (todas as crianças estavam internadas)."],["Na frase “Embora estivesse cansada, a criança terminou o desenho”, a oração destacada expressa",["condição.","consequência.","concessão.","causa.","finalidade."],2,"Embora introduz oração concessiva: um fato contrário que não impede o outro."],["Em “A dor era tanta que ela não conseguia dormir”, a segunda oração classifica-se como subordinada adverbial",["final.","comparativa.","causal.","consecutiva.","temporal."],3,"Tanto... que indica consequência: oração consecutiva."],["Assinale a alternativa em que o termo destacado tem valor conclusivo.",["Não saia, **pois** está frio.","Volte cedo, **pois** vai chover.","A lei é clara; deve, **pois**, ser cumprida.","Estude agora, **pois** a prova é amanhã.","Ela faltou, **pois** estava doente."],2,"Pois depois do verbo, entre vírgulas, é conclusivo (= portanto). Nas outras, antes do verbo, é explicativo."],["Em “A equipe espera que a criança receba alta logo”, a oração destacada é subordinada substantiva",["objetiva direta.","objetiva indireta.","completiva nominal.","subjetiva.","apositiva."],0,"Espera o quê? “Que a criança receba alta” → “espera isso”: objetiva direta."],["Em “Os alunos que faltaram farão a prova amanhã”, a ausência de vírgulas indica que a oração adjetiva",["é substantiva.","é restritiva e se refere apenas a parte dos alunos.","é coordenada aditiva.","é explicativa e se refere a todos os alunos.","está com pontuação incorreta."],1,"Sem vírgulas, a adjetiva é restritiva: só os alunos que faltaram farão a prova."]]},{"id":"P02","m":"por","t":"Concordância verbal e nominal","ed":["P10"],"v":[["jdqhnVUvqOc","Concordância verbal: teoria e questões para concurso"],["qFYxm6HrNrM","Concordância verbal e nominal para concursos"]],"obj":["Aplicar a regra geral e os casos especiais de concordância verbal","Lidar com haver, fazer, existir e ser","Diferenciar voz passiva sintética e índice de indeterminação","Acertar meio, bastante, anexo, obrigado e é proibido"],"s":[["Concordância verbal: casos que mais caem",[{"t":[["Caso","Regra","Exemplo"],["Regra geral","Verbo concorda com o núcleo do sujeito","As crianças **brincaram**."],["Sujeito composto anteposto","Plural","A mãe e o pai **chegaram**."],["Sujeito composto posposto","Plural ou com o mais próximo","**Chegou** (ou chegaram) a mãe e o pai."],["Partitivo (a maioria de, parte de)","Singular ou plural","A maioria dos alunos **passou** / **passaram**."],["Mais de um","Singular","Mais de um aluno **faltou**."],["Um dos que","Plural (preferência)","Ela é uma das que mais **estudam**."],["Pronome relativo que","Concorda com o antecedente","Fui **eu** que **fiz**."],["Pronome relativo quem","3ª do singular ou com o antecedente","Fui eu quem **fez** / quem **fiz**."]]}]],["Haver, fazer, existir e ser",[{"l":["**Haver** no sentido de existir, acontecer ou tempo decorrido é **impessoal**: fica no singular, inclusive em locução. “**Houve** problemas”; “**Deve haver** vagas”.","**Fazer** indicando tempo ou clima é impessoal: “**Faz** dois anos”; “**Vai fazer** dez dias”.","**Existir**, **ocorrer** e **acontecer** são pessoais: concordam normalmente. “**Existem** vagas”; “**Ocorreram** falhas”.","**Ser** em horas e datas concorda com o numeral: “**São** dez horas”; “**É** uma hora”; “Hoje **são** 20 de dezembro” ou “Hoje **é** dia 20”."]},{"a":"Pegadinha clássica: trocar “existiam” por “haviam”. Correto: “Existiam dúvidas” = “Havia dúvidas”."}]],["O SE na concordância",[{"t":[["","Voz passiva sintética","Índice de indeterminação do sujeito"],["Verbo","Transitivo direto + se","Transitivo indireto, intransitivo ou de ligação + se"],["Concordância","Com o sujeito paciente","Sempre no singular"],["Exemplo","**Vendem-se** casas. (casas são vendidas)","**Precisa-se** de professores. **Vive-se** bem aqui."]]},{"a":"Teste da passiva: se dá para transformar em “casas são vendidas”, o verbo concorda: “Alugam-se salas”. Com preposição depois do verbo, fica no singular: “Trata-se de casos graves”."}]],["Concordância nominal",[{"l":["**Adjetivo antes de vários substantivos**: concorda com o mais próximo. “**Excelente** professora e aluno.”","**Adjetivo depois**: concorda com o mais próximo ou vai ao plural (masculino, se houver gêneros diferentes). “Professora e aluno **dedicados**.”","**Meio**: adjetivo (metade) varia: “**meia** hora”; advérbio (um pouco) não varia: “Ela está **meio** cansada”.","**Bastante**: adjetivo (suficiente, muitos) varia: “**bastantes** alunos”; advérbio não varia: “Elas estudaram **bastante**”.","**Anexo, incluso, obrigado, mesmo, próprio, quite**: variam. “Seguem **anexas** as cópias”; “Ela disse **obrigada**”. Mas **em anexo** não varia.","**É proibido, é necessário, é bom**: sem artigo, ficam invariáveis (“É proibido entrada”); com artigo, concordam (“É proibida **a** entrada”).","**Menos** e **alerta** são invariáveis: “menos pessoas”, “os alunos ficaram alerta”."]}]]],"r":["Regra geral: verbo concorda com o núcleo do sujeito.","Sujeito composto anteposto: plural; posposto: plural ou o mais próximo.","Mais de um: singular. A maioria de: singular ou plural.","Haver (existir/tempo) e fazer (tempo) são impessoais, inclusive em locução. Existir concorda.","VTD + se: passiva, verbo concorda. VTI/VI + se: indeterminação, singular.","Meio e bastante: variam como adjetivo, não variam como advérbio.","Anexo, obrigado, mesmo, quite variam; em anexo, menos e alerta não.","É proibido entrada / É proibida a entrada."],"q":[["Assinale a alternativa correta quanto à concordância verbal.",["Houve várias reuniões com a equipe.","Existia dúvidas sobre o edital.","Devem haver vagas no cadastro de reserva.","Fazem dois anos que o concurso foi anunciado.","Haviam muitas crianças na brinquedoteca."],0,"Haver no sentido de existir é impessoal: houve. E e C deveriam usar havia e deve haver; B deveria ser existiam; D deveria ser faz."],["Assinale a alternativa em que a concordância está de acordo com a norma-padrão.",["Necessitam-se de recursos.","Vende-se brinquedos usados.","Precisam-se de pedagogos no hospital.","Alugam-se salas para reuniões.","Trata-se de questões difíceis, que exigem atenção, e tratam-se de leis."],3,"Alugar é transitivo direto: salas são alugadas, verbo no plural. Com verbo transitivo indireto (precisar de, tratar de, necessitar de) o se indetermina o sujeito e o verbo fica no singular. Vender também é transitivo direto: “vendem-se brinquedos”."],["Na frase “Mais de um candidato ___ o recurso”, a forma verbal correta é",["apresentassem.","apresentarão.","apresentamos.","apresentaram.","apresentou."],4,"Com “mais de um”, o verbo fica no singular."],["Assinale a alternativa INCORRETA quanto à concordância nominal.",["É proibido entrada de alimentos.","Havia menas pessoas na sala.","Ela estava meio preocupada com a prova.","As alunas disseram: “Muito obrigadas”.","Seguem anexas as declarações."],1,"Menos é invariável: “menos pessoas”. As demais estão corretas."],["Em “Faltam bastante materiais na classe hospitalar”, há erro de concordância porque",["materiais deveria estar no singular.","faltar deveria estar no singular.","bastante, como adjetivo, deveria concordar com materiais: bastantes.","bastante é sempre invariável.","o verbo faltar é impessoal."],2,"Bastante antes de substantivo é adjetivo e varia: bastantes materiais."],["Assinale a alternativa em que o verbo ser está corretamente flexionado.",["São meio-dia e meia.","Era duas horas quando a prova começou.","Já são uma hora.","É dez horas da manhã.","Hoje é 20 de dezembro, dia da prova."],4,"Com datas, ser pode concordar com “dia” subentendido (hoje é dia 20) ou com o numeral (hoje são 20). Em horas, concorda com o numeral: são dez horas, é meio-dia e meia, eram duas horas, é uma hora."],["Em “A maioria dos candidatos ___ a prova com antecedência”, são aceitas pela norma-padrão as formas",["chegaria e chegariam, apenas no futuro.","chegamos e chegaram.","chegou e chegaram, pois o sujeito é partitivo.","apenas chegaram.","apenas chegou."],2,"Com expressão partitiva seguida de plural, o verbo pode concordar com o núcleo (maioria) ou com o especificador (candidatos)."],["Assinale a frase correta.",["Ela mesmo fez o relatório.","Os documentos seguem anexo.","É necessário a paciência no atendimento.","É necessária paciência no atendimento.","Seguem em anexas as cópias."],3,"É necessária paciência está correto: o adjetivo concorda com o substantivo. Também seria correto “É necessário paciência”, sem artigo. C erra porque com artigo deve concordar; E, B e A têm erros de concordância."]]},{"id":"P03","m":"por","t":"Regência verbal, regência nominal e crase","ed":["P11","P12"],"v":[["5uMooAjtVis","Crase: as 6 regras mais cobradas em concurso"],["oziOOkwah2E","Regência verbal: aula completa para concursos"]],"obj":["Usar a regência correta dos verbos mais cobrados","Reconhecer a regência de nomes frequentes","Aplicar as regras de crase obrigatória, proibida e facultativa","Usar o truque da troca pelo masculino"],"s":[["Verbos que mudam de sentido",[{"t":[["Verbo","Regência e sentido","Exemplo"],["Assistir","a (ver, presenciar)","Assisti **ao** vídeo."],["","direto (ajudar)","A enfermeira assistiu **o** paciente."],["Aspirar","direto (inalar)","Aspirou **o** ar."],["","a (desejar)","Aspira **ao** cargo."],["Visar","direto (mirar, dar visto)","Visou **o** documento."],["","a (pretender)","Visa **ao** cadastro de reserva."],["Proceder","a (dar início, realizar)","Procedeu **à** leitura."],["Implicar","direto (acarretar)","A mudança implica **custos**."]]}]],["Outros verbos frequentes",[{"l":["**Preferir**: algo **a** outra coisa. “Prefiro estudar **a** sair.” Sem “mais” e sem “do que”.","**Obedecer / desobedecer**: **a**. “Obedeceu **às** normas.”","**Chegar / ir**: **a** (lugar). “Chegou **a** Macapá”, “vou **ao** hospital”.","**Esquecer / lembrar**: direto; pronominais pedem **de**. “Esqueci o livro” / “Esqueci-**me do** livro”.","**Pagar / perdoar / agradecer**: coisa direto, pessoa indireto. “Agradeceu **o** apoio **à** equipe.”","**Informar / avisar**: algo **a** alguém, ou alguém **de** algo.","**Namorar**: direto (“namora **a** vizinha”, sem “com”).","**Responder**: **a**. “Respondeu **ao** questionário.”"]}]],["Regência nominal",["Alguns nomes que pedem preposição: **acessível a**, **apto a/para**, **favorável a**, **contrário a**, **preferível a**, **residente em**, **situado em**, **obediência a**, **respeito a/por/com**, **ansioso por**, **desejoso de**, **atento a**."]],["Crase",["Crase é a fusão da **preposição a** com o **artigo a(s)** ou com o “a” de **aquele(s), aquela(s), aquilo**, **a qual, as quais**.",{"a":"Truque: troque a palavra feminina por uma masculina. Se aparecer **ao**, há crase. “Vou **à** escola” → “Vou **ao** colégio”."},{"t":[["Obrigatória","Proibida","Facultativa"],["Antes de palavra feminina regida por “a”: vou à escola","Antes de palavra masculina: a pé, a cavalo","Antes de pronome possessivo feminino singular: a/à minha mãe"],["Locuções femininas: às vezes, à noite, à medida que, à custa de","Antes de verbo: começou a chover, a partir de","Antes de nome próprio feminino de pessoa: a/à Maria"],["Horas determinadas: às 14 horas","Antes de pronomes pessoais e da maioria dos de tratamento: a ela, a Vossa Senhoria","Depois de até: até a/à porta"],["À moda de, mesmo oculta: bife à milanesa","Entre palavras repetidas: cara a cara, gota a gota",""],["","“a” no singular antes de plural: a pessoas",""]]},"**Cidades**: “Vou **a** Macapá” (volto **de** Macapá), mas “Vou **à** Macapá antiga” (com determinante). **Casa** sem determinante não tem crase (“voltei a casa”); com determinante tem (“voltei à casa dos pais”).",{"ex":"Truque das cidades e estados: “Vou a, volto da: crase há. Vou a, volto de: crase pra quê?” Vou à Bahia (volto da Bahia). Vou a Olinda (volto de Olinda)."}]]],"r":["Assistir a (ver) × assistir (ajudar). Aspirar a (desejar) × aspirar (inalar). Visar a (pretender).","Preferir algo a outra coisa; obedecer a; chegar a; implicar (direto).","Esquecer/lembrar diretos; esquecer-se de / lembrar-se de.","Crase: preposição a + artigo a. Troque pelo masculino: se der “ao”, tem crase.","Obrigatória: locuções femininas, horas, à moda de. Proibida: masculino, verbo, pronomes pessoais, palavras repetidas.","Facultativa: possessivo feminino singular, nome próprio de pessoa, depois de até.","Cidades: vou a, volto da → crase; vou a, volto de → sem crase."],"q":[["Assinale a alternativa correta quanto à regência verbal.",["Os candidatos devem obedecer às regras do edital.","Assisti o vídeo da aula ontem à noite.","Ela aspira o cargo de pedagoga.","Prefiro estudar de manhã do que à noite.","Chegamos no hospital cedo."],0,"Obedecer pede a: obedecer às regras. Assistir (ver) pede a; aspirar (desejar) pede a; preferir não aceita “do que”; chegar pede a."],["Em “A enfermeira assistiu o paciente durante a noite”, o verbo assistir tem o sentido de",["ajudar, prestar assistência.","presenciar.","caber.","morar.","ver."],0,"Assistir como transitivo direto significa ajudar, dar assistência."],["Assinale a alternativa em que o uso do sinal indicativo de crase está correto.",["Ficaram frente à frente.","A sala fica à direita da enfermaria.","Ela foi à pé até o hospital.","Começou à chover forte.","Entregou o relatório à ela."],1,"À direita é locução adverbial feminina: crase obrigatória. As outras têm crase proibida: antes de masculino, de verbo, de pronome pessoal e entre palavras repetidas."],["Em qual alternativa a crase é facultativa?",["Chegou às 14 horas.","Referiu-se àquela norma.","Saiu às pressas.","Fui à escola ontem.","Entregou o material à sua professora."],4,"Antes de pronome possessivo feminino no singular, a crase é facultativa. Nas outras é obrigatória."],["Considerando a regra para nomes de cidades, assinale a alternativa correta.",["Ela chegará à Oiapoque amanhã.","Retornou à Santana depois do plantão.","Vou à Macapá no fim de semana.","Viajou à Belém das mangueiras.","Vou à Laranjal do Jari na terça."],3,"Nome de cidade sem determinante não leva crase (vou a Macapá, volto de Macapá). Com determinante, sim: à Belém das mangueiras."],["Assinale a alternativa correta quanto à regência nominal.",["Estou ansiosa de você chegar.","O prédio é acessível para todos.","A decisão foi contrária ao parecer da equipe.","Ele é favorável com a proposta.","Ela é residente à Rua São José."],2,"Contrário pede a: contrária ao parecer. B pede acessível a; D favorável a; E residente na rua; A ansiosa por."],["Em “A mudança no horário implica ___ adaptação das atividades”, a forma adequada à norma-padrão é",["na.","em.","sem preposição: implica a adaptação.","a.","com."],2,"Implicar no sentido de acarretar é transitivo direto: implica a adaptação."],["Assinale a alternativa em que o termo destacado deveria receber o sinal de crase.",["Ela chegou **a** uma conclusão.","Referiu-se **a** pessoas da equipe.","Vou **a** Macapá amanhã.","Começou **a** escrever o bilhete.","Ficou **a** espera da alta médica."],4,"À espera é locução feminina: crase obrigatória. A tem artigo indefinido; D tem verbo; C é cidade sem determinante; B tem a singular antes de plural."]]},{"id":"P04","m":"por","t":"Funções do QUE e do SE, colocação pronominal e locuções verbais","ed":["P7","P8","P9"],"v":[["6zsVwix7Uh0","Colocação pronominal para concurso"],["zgNfk9msC5w","Colocação pronominal: próclise, mesóclise e ênclise"]],"obj":["Classificar o QUE nas funções mais cobradas","Classificar o SE (apassivador, indeterminação, reflexivo, integrante, conjunção)","Aplicar as regras de próclise, mesóclise e ênclise","Colocar pronomes em locuções verbais"],"s":[["As funções do QUE",[{"t":[["Função","Como reconhecer","Exemplo"],["Pronome relativo","Retoma um termo anterior; dá para trocar por o qual / a qual","O livro **que** li é ótimo."],["Conjunção integrante","Inicia oração substantiva; troca por “isso”","Disse **que** viria."],["Conjunção explicativa","= pois","Venha logo, **que** está tarde."],["Conjunção consecutiva","Depois de tão, tanto, tal","Chorou tanto **que** dormiu."],["Conjunção comparativa","Depois de mais, menos","Estuda mais **que** eu."],["Partícula expletiva (de realce)","Pode ser retirada sem prejuízo","Nós é **que** decidimos."],["Pronome interrogativo","Inicia pergunta","**Que** houve?"],["Advérbio de intensidade","Antes de adjetivo ou advérbio","**Que** lindo!"],["Preposição","= de, em locução verbal","Tenho **que** sair."],["Substantivo","Com artigo, acentuado","Ela tem um **quê** de mistério."]]}]],["As funções do SE",[{"t":[["Função","Como reconhecer","Exemplo"],["Pronome apassivador","Verbo transitivo direto; dá para passar à passiva analítica","Vendem-**se** casas. (casas são vendidas)"],["Índice de indeterminação do sujeito","Verbo transitivo indireto, intransitivo ou de ligação; fica no singular","Precisa-**se** de ajuda. Vive-**se** bem."],["Pronome reflexivo","A ação volta para o sujeito; troca por “a si mesmo”","Ela **se** cortou."],["Reflexivo recíproco","Ação mútua","Eles **se** abraçaram."],["Parte integrante do verbo","Verbo pronominal que não existe sem o se","Queixou-**se**, arrependeu-**se**."],["Partícula expletiva","Pode ser retirada","Foi-**se** embora."],["Conjunção condicional","= caso","**Se** chover, ficamos."],["Conjunção integrante","Inicia oração substantiva","Não sei **se** vou."]]}]],["Colocação pronominal",["Os pronomes oblíquos átonos (me, te, se, o, a, lhe, nos, vos...) podem ficar antes do verbo (**próclise**), no meio (**mesóclise**) ou depois (**ênclise**).",{"l":["**Próclise** obrigatória diante de palavras atrativas: **palavras negativas** (não, nunca, jamais, ninguém), **advérbios** sem vírgula (já, aqui, sempre, talvez), **pronomes relativos**, **indefinidos** e **demonstrativos**, **conjunções subordinativas**, frases exclamativas e **optativas** (“Deus te abençoe”).","**Mesóclise**: com verbo no **futuro do presente** ou do **pretérito**, sem palavra atrativa. “Far-**se**-á a prova.” “Dir-**te**-ia a verdade.”","**Ênclise**: no **início da frase** (a norma-padrão não começa frase com pronome átono), com **imperativo afirmativo** (“Ajude-**me**”), com **gerúndio** e **infinitivo** sem atrativo."]},{"a":"Nunca use ênclise com futuro (“dará-se”) nem depois de particípio (“tinha feito-se”). Com palavra atrativa, a próclise vence: “**Não** se pode notar”, e não “não pode-se”."}]],["Locuções verbais",["Locução verbal é **verbo auxiliar + forma nominal** (infinitivo, gerúndio ou particípio): “vou estudar”, “estava estudando”, “tinha estudado”. “Vão parar” tem o auxiliar no **presente do indicativo** com ideia de futuro.",{"l":["Com **infinitivo ou gerúndio**, sem atrativo: “Quero-**lhe** dizer”, “Quero **lhe** dizer” (uso brasileiro aceito) ou “Quero dizer-**lhe**”.","Com atrativo: “**Não lhe** quero dizer” ou “Não quero dizer-**lhe**”. É aceita também a ênclise ao verbo principal: “vão perpetuando-**se**”.","Com **particípio**: o pronome nunca fica depois do particípio. “Tinha-**se** feito” ou “**se** tinha feito”."]}]]],"r":["QUE relativo troca por o qual; integrante troca por isso; expletivo pode sair.","SE apassivador: VTD, verbo concorda. Indeterminação: VTI/VI/VL, singular.","SE reflexivo (a si mesmo), integrante do verbo (queixar-se), condicional (caso), integrante (não sei se).","Próclise com atrativos: negação, advérbio sem vírgula, relativos, indefinidos, demonstrativos, subordinativas.","Mesóclise com futuro do presente/pretérito sem atrativo. Ênclise no início da frase, imperativo afirmativo, gerúndio e infinitivo.","Locução: pronome nunca depois de particípio."],"q":[["Assinale a alternativa em que o QUE é pronome relativo.",["Tenho que revisar a lei.","Espero que você passe.","Estudou tanto que passou.","Ela estuda mais que eu.","O edital que saiu em setembro tem 16 páginas."],4,"Retoma “o edital” e pode ser trocado por “o qual”: pronome relativo. B é integrante, C consecutiva, D comparativa e A preposição."],["Em “Nós é que organizamos a brinquedoteca”, o termo QUE é",["pronome interrogativo.","conjunção causal.","partícula expletiva ou de realce.","conjunção integrante.","pronome relativo."],2,"Pode ser retirado (“Nós organizamos a brinquedoteca”) sem prejuízo: partícula expletiva, junto com “é”."],["Assinale a alternativa em que o SE é índice de indeterminação do sujeito.",["Se chover, a atividade será na sala.","A criança se olhou no espelho.","Vendem-se brinquedos usados.","Precisa-se de voluntários.","Não sei se ela virá."],3,"Precisar de é transitivo indireto: o se indetermina o sujeito. C é apassivador, B reflexivo, A conjunção condicional, E conjunção integrante."],["Em “Ela se queixou da dor”, o SE é classificado como",["parte integrante do verbo.","conjunção condicional.","índice de indeterminação do sujeito.","partícula expletiva.","pronome apassivador."],0,"Queixar-se é verbo pronominal: o se é parte integrante do verbo."],["Assinale a alternativa que respeita a norma-padrão de colocação pronominal.",["Não diga-me isso agora.","Me empresta o caderno?","Ninguém avisou-nos da mudança.","Far-se-á a revisão na sexta-feira.","Talvez convidem-me para a reunião."],3,"Futuro do presente sem atrativo pede mesóclise. B começa frase com pronome; A, C e E têm palavras atrativas (não, ninguém, talvez) que exigem próclise."],["Em “Como já se pode notar, estamos atrasados”, a reescrita que mantém a correção é",["Como já pode notar-se-á, estamos atrasados.","Como já pode-se notar, estamos atrasados.","Como já se pode notar, estamos atrasados.","Como pode-se já notar, estamos atrasados.","Como já notar-se pode, estamos atrasados."],2,"O advérbio já
