<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0E6A5B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caderno SESA">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Caderno SESA Pedagogo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Plataforma de estudo para o concurso SESA-AP 2026, cargo 472 · Pedagogo (Instituto AOCP).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,800&display=swap">
<style>
/* Identidade: caderno de estudo. Papel claro, verde-rio do Amapá como cor da marca,
   marca-texto amarelo para o que importa e uma cor por disciplina. */
:root{
  --bg:#F3F4EF; --surface:#FFFFFF; --surface-2:#EEF1EA; --surface-3:#E4E9E1;
  --ink:#17201D; --ink-2:#36423E; --muted:#5E6A65; --line:#DADFD6; --line-2:#C9D0C5;
  --brand:#0E6A5B; --brand-2:#0A5246; --brand-ink:#FFFFFF; --brand-soft:#DAEDE6;
  --hl:#FFD84D; --hl-soft:#FFF0B3; --hl-ink:#3B2F00;
  --ok:#1C7845; --ok-soft:#DCF1E3; --bad:#B23D2B; --bad-soft:#FBE3DD; --warn:#8F6200; --warn-soft:#FFF0C9;
  --m-esp:#6A4FBC; --m-por:#BF512A; --m-sus:#1E875A; --m-amp:#A87400; --m-inf:#2B66C6; --m-rl:#BF3A74; --m-x:#6C7772;
  --shadow:0 1px 2px rgb(23 32 29 / .05), 0 6px 22px rgb(23 32 29 / .06);
  --shadow-2:0 2px 6px rgb(23 32 29 / .08), 0 14px 40px rgb(23 32 29 / .10);
  --r:16px; --r-sm:11px; --r-xs:8px;
  --font-d:"Bricolage Grotesque", ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  --font-b:"Atkinson Hyperlegible", ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --side:252px;
  --q0:#E4E9E1; --q1:#7FC3AE; --q2:#45A58C; --q3:#1F7D68; --q4:#0B4F44;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101614; --surface:#171F1C; --surface-2:#1D2724; --surface-3:#25312D;
    --ink:#E6EDE9; --ink-2:#C7D2CD; --muted:#98A7A1; --line:#29352F; --line-2:#36443E;
    --brand:#5BC2AB; --brand-2:#7DD3C0; --brand-ink:#08201A; --brand-soft:#17392F;
    --hl:#F1C842; --hl-soft:#3D3415; --hl-ink:#FFF0BB;
    --ok:#69D198; --ok-soft:#163525; --bad:#F2917D; --bad-soft:#3C1E18; --warn:#F0C05E; --warn-soft:#382C12;
    --m-esp:#A893F2; --m-por:#F08B62; --m-sus:#5CCB95; --m-amp:#E2B33C; --m-inf:#7BA7F3; --m-rl:#F17BAD; --m-x:#9AA6A1;
    --q0:#25312D; --q1:#2B6457; --q2:#2F8A74; --q3:#4AB399; --q4:#86E0CA;
    --shadow:0 1px 2px rgb(0 0 0 / .3), 0 6px 22px rgb(0 0 0 / .25);
    --shadow-2:0 2px 6px rgb(0 0 0 / .35), 0 14px 40px rgb(0 0 0 / .35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#171F1C; --surface-2:#1D2724; --surface-3:#25312D;
  --ink:#E6EDE9; --ink-2:#C7D2CD; --muted:#98A7A1; --line:#29352F; --line-2:#36443E;
  --brand:#5BC2AB; --brand-2:#7DD3C0; --brand-ink:#08201A; --brand-soft:#17392F;
  --hl:#F1C842; --hl-soft:#3D3415; --hl-ink:#FFF0BB;
  --ok:#69D198; --ok-soft:#163525; --bad:#F2917D; --bad-soft:#3C1E18; --warn:#F0C05E; --warn-soft:#382C12;
  --m-esp:#A893F2; --m-por:#F08B62; --m-sus:#5CCB95; --m-amp:#E2B33C; --m-inf:#7BA7F3; --m-rl:#F17BAD; --m-x:#9AA6A1;
  --q0:#25312D; --q1:#2B6457; --q2:#2F8A74; --q3:#4AB399; --q4:#86E0CA;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 6px 22px rgb(0 0 0 / .25);
  --shadow-2:0 2px 6px rgb(0 0 0 / .35), 0 14px 40px rgb(0 0 0 / .35);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
h1,h2,h3,h4{font-family:var(--font-d);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- moldura ---------- */
.app{min-height:100vh;display:grid;grid-template-columns:var(--side) minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;padding:22px 16px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;border-right:1px solid var(--line);background:var(--surface)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;padding:2px 6px}
.logo-mark{width:36px;height:36px;border-radius:10px;background:var(--brand);display:grid;place-items:center;color:var(--brand-ink);flex:none}
.logo-mark svg{width:22px;height:22px}
.logo b{font-family:var(--font-d);font-size:1.12rem;display:block;line-height:1.1}
.logo small{display:block;color:var(--muted);font-size:.78rem;line-height:1.2}
.nav{display:grid;gap:3px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink-2);text-decoration:none;font-weight:700;font-size:.97rem}
.nav a svg{width:20px;height:20px;flex:none;opacity:.8}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--brand-soft);color:var(--brand-2)}
:root[data-theme="dark"] .nav a[aria-current="page"]{color:var(--brand-2)}
.nav .badge{margin-left:auto}
.side-foot{margin-top:auto;display:grid;gap:10px}
.count{border-radius:var(--r);padding:14px;background:var(--surface-2);display:grid;gap:2px}
.count b{font-family:var(--font-d);font-size:2rem;line-height:1}
.count span{color:var(--muted);font-size:.84rem}
.theme{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px}
.theme button{flex:1;border:0;background:none;padding:7px 4px;border-radius:9px;font-size:.8rem;color:var(--muted);font-weight:700}
.theme button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.top{display:none}
.tabs{display:none}
.main{min-width:0;padding-block:28px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:22px}
.wrap.narrow{max-width:820px}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .side{display:none}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
  .top .logo-mark{width:32px;height:32px}
  .top .logo b{font-size:1.02rem}
  .top .chip{font-size:.8rem}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabs a{display:grid;justify-items:center;gap:2px;padding:8px 2px 7px;color:var(--muted);text-decoration:none;font-size:.7rem;font-weight:700;position:relative}
  .tabs a svg{width:22px;height:22px}
  .tabs a[aria-current="page"]{color:var(--brand)}
  .tabs a[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
  .tabs .dot{position:absolute;top:6px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--bad)}
  .main{padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .wrap{gap:18px}
}

/* ---------- peças ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.card.tint{background:var(--surface-2);border-color:transparent;box-shadow:none}
.stack{display:grid;gap:12px;min-width:0}
.stack.s6{gap:6px}.stack.s18{gap:18px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--muted)}
.small{font-size:.88rem}.tiny{font-size:.8rem}
.eyebrow{font-size:.76rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.h1{font-size:clamp(1.7rem,3.4vw,2.35rem);font-weight:800}
.h2{font-size:1.3rem;font-weight:650}
.h3{font-size:1.06rem;font-weight:650}
.lead{font-size:1.04rem;color:var(--ink-2);max-width:62ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:11px 18px;font-weight:700;font-size:.97rem;text-decoration:none;line-height:1.2;min-height:44px;transition:background .15s,border-color .15s,transform .05s}
.btn:active{transform:translateY(1px)}
.btn svg{width:18px;height:18px;flex:none}
.btn.pri{background:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{background:var(--brand-2)}
.btn.sec{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn.sec:hover{background:var(--surface-2)}
.btn.ghost{background:none;color:var(--brand);padding-inline:10px}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.sm{min-height:36px;padding:7px 12px;font-size:.88rem;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:700;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.m{background:color-mix(in srgb,var(--mc) 14%,var(--surface));color:color-mix(in srgb,var(--mc) 78%,var(--ink))}
.chip .d{width:8px;height:8px;border-radius:50%;background:var(--mc)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.brand{background:var(--brand-soft);color:var(--brand-2)}
.badge{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--bad);color:#fff;font-size:.75rem;font-weight:700;display:inline-grid;place-items:center}
[data-m="esp"]{--mc:var(--m-esp)}[data-m="por"]{--mc:var(--m-por)}[data-m="sus"]{--mc:var(--m-sus)}[data-m="amp"]{--mc:var(--m-amp)}[data-m="inf"]{--mc:var(--m-inf)}[data-m="rl"]{--mc:var(--m-rl)}[data-m="x"],[data-m="leg"]{--mc:var(--m-x)}
.bar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--mc,var(--brand));transition:width .4s}
.ring{--p:0;--s:52px;width:var(--s);height:var(--s);border-radius:50%;background:conic-gradient(var(--mc,var(--brand)) calc(var(--p)*1%),var(--surface-3) 0);display:grid;place-items:center;flex:none}
.ring::before{content:"";grid-area:1/1;width:calc(var(--s) - 12px);height:calc(var(--s) - 12px);border-radius:50%;background:var(--surface)}
.ring b{grid-area:1/1;font-size:.82rem;font-family:var(--font-d)}
.icon-c{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--mc,var(--brand)) 14%,var(--surface));color:var(--mc,var(--brand));flex:none}
.icon-c svg{width:22px;height:22px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1.5px dashed var(--line-2);border-radius:var(--r)}
.seg{display:inline-flex;background:var(--surface-2);padding:4px;border-radius:12px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;font-weight:700;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.crumbs a{color:var(--muted);text-decoration:none;font-weight:700}
.crumbs a:hover{color:var(--brand)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.kpi b{display:block;font-family:var(--font-d);font-size:1.7rem;line-height:1.1}
.kpi span{color:var(--muted);font-size:.84rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;font-size:.92rem;z-index:50;box-shadow:var(--shadow-2);max-width:calc(100vw - 32px)}
@media (max-width:900px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}

/* ---------- início ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:stretch}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}
.next{position:relative;overflow:hidden;background:var(--brand);color:var(--brand-ink);border:0}
.next .eyebrow{color:color-mix(in srgb,var(--brand-ink) 75%,transparent)}
.next h2{font-size:clamp(1.35rem,2.6vw,1.75rem);font-weight:800}
.next .btn.pri{background:var(--brand-ink);color:var(--brand)}
.next .btn.pri:hover{background:color-mix(in srgb,var(--brand-ink) 88%,var(--brand))}
.next .chip{background:color-mix(in srgb,var(--brand-ink) 18%,transparent);color:var(--brand-ink)}
.next-art{position:absolute;right:-30px;bottom:-40px;width:200px;height:200px;opacity:.13;pointer-events:none}
.today li{list-style:none}
.today{margin:0;padding:0;display:grid;gap:8px}
.titem{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--surface-2);text-decoration:none;color:inherit}
.titem:hover{background:var(--surface-3)}
.titem .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;flex:none}
.titem.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.titem.done .tt{text-decoration:line-through;color:var(--muted)}
.titem .ck svg{width:14px;height:14px}
.titem .tt{font-weight:700;line-height:1.3}
.method{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;counter-reset:m}
@media (max-width:900px){.method{grid-template-columns:repeat(2,minmax(0,1fr))}}
.method div{padding:14px;border-radius:var(--r-sm);background:var(--surface-2);display:grid;gap:4px;align-content:start}
.method b{font-family:var(--font-d);font-size:1rem}
.method b::before{counter-increment:m;content:counter(m);display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-size:.8rem;margin-right:8px}
.mlist{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr) auto;gap:14px;align-items:center;text-decoration:none;color:inherit;padding:6px 4px;border-radius:10px}
.mrow:hover{background:var(--surface-2)}
@media (max-width:640px){.mrow{grid-template-columns:minmax(0,1fr) auto}.mrow .bar{grid-column:1/-1;order:3}}
.mrow b{font-size:.95rem}

/* ---------- trilha ---------- */
.week{display:grid;gap:10px}
.day{display:grid;grid-template-columns:86px minmax(0,1fr);gap:14px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.day.hoje{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.day.extra{background:var(--surface-2);border-style:dashed}
.day .dt{display:grid;align-content:start;gap:0}
.day .dt b{font-family:var(--font-d);font-size:1.5rem;line-height:1}
.day .dt span{font-size:.8rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.day ul{margin:0;padding:0;display:grid;gap:6px}
.day li{list-style:none;display:flex;gap:10px;align-items:center;min-width:0}
.day li a{color:inherit;text-decoration:none;font-weight:700;min-width:0}
.day li a:hover{color:var(--brand)}
.day li .d{width:10px;height:10px;border-radius:3px;background:var(--mc,var(--brand));flex:none}
.day li.ok a{color:var(--muted);text-decoration:line-through}
@media (max-width:640px){.day{grid-template-columns:62px minmax(0,1fr);gap:10px;padding:12px}.day .dt b{font-size:1.3rem}}
.wk-h{display:flex;align-items:baseline;gap:10px;margin-top:8px}

/* ---------- disciplinas ---------- */
.mcard{display:grid;gap:14px;text-decoration:none;color:inherit;border-top:5px solid var(--mc)}
.mcard:hover{box-shadow:var(--shadow-2)}
.mcard h3{font-size:1.14rem}
.peso{font-family:var(--font-d);font-weight:800;font-size:1.9rem;line-height:1;color:var(--mc)}
.mhead{border-radius:var(--r);padding:24px;background:color-mix(in srgb,var(--mc) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--mc) 25%,var(--line));display:grid;gap:12px}
.mhead .h1{color:color-mix(in srgb,var(--mc) 70%,var(--ink))}
.alist{display:grid;gap:8px}
.arow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line);text-decoration:none;color:inherit}
.arow:hover{border-color:var(--mc,var(--line-2))}
.arow .n{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-d);font-weight:800;background:color-mix(in srgb,var(--mc) 12%,var(--surface));color:color-mix(in srgb,var(--mc) 80%,var(--ink))}
.arow.done .n{background:var(--ok);color:#fff}
.arow .n svg{width:20px;height:20px}
.arow b{line-height:1.3}
.ed-l{display:grid;gap:6px}
.ed-i{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);align-items:start}
.ed-i .ck{width:22px;height:22px;border-radius:6px;border:2px solid var(--line-2);display:grid;place-items:center;margin-top:1px}
.ed-i.ok .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.ed-i .ck svg{width:13px;height:13px}
.ed-i a{font-size:.82rem;font-weight:700;text-decoration:none}

/* ---------- aula ---------- */
.ahead{display:grid;gap:12px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;position:sticky;top:calc(env(safe-area-inset-top,0px));z-index:10;background:var(--bg);padding-block:10px}

.step{display:grid;gap:6px;text-align:left;border:0;background:none;padding:0;color:var(--muted)}
.step i{display:block;height:5px;border-radius:9px;background:var(--surface-3)}
.step span{font-size:.84rem;font-weight:700;display:flex;align-items:center;gap:6px}
.step span svg{width:15px;height:15px}
.step.feito i{background:var(--mc)}
.step.feito{color:var(--ink-2)}
.step[aria-current="step"]{color:var(--ink)}
.step[aria-current="step"] i{background:linear-gradient(90deg,var(--mc) 50%,var(--surface-3) 50%)}
.step.feito[aria-current="step"] i{background:var(--mc)}
@media (max-width:520px){.step .lb{display:none}.step > span::after{content:attr(data-short)}}
.reader{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:28px;align-items:start}
@media (max-width:1100px){.reader{grid-template-columns:minmax(0,1fr)}.toc{display:none}}
.toc{position:sticky;top:90px;display:grid;gap:4px}
.toc button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:9px;color:var(--muted);font-weight:700;font-size:.88rem;line-height:1.3;display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px}
.toc button:hover{background:var(--surface-2)}
.toc button[aria-current="true"]{background:color-mix(in srgb,var(--mc) 12%,var(--surface));color:var(--ink)}
.toc button.vis .nn{color:var(--ok)}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(20px,4vw,40px);box-shadow:var(--shadow);min-width:0}
.prose{font-size:1.08rem;line-height:1.72;max-width:68ch;display:grid;gap:16px;color:var(--ink)}
.prose h2{font-size:clamp(1.35rem,2.6vw,1.65rem);font-weight:800}
.prose strong{font-weight:700;background:linear-gradient(180deg,transparent 56%,var(--hl-soft) 56%);padding:0 .08em;border-radius:2px}
.prose ul{margin:0;padding-left:1.25em;display:grid;gap:8px}
.prose li::marker{color:var(--mc)}
.callout{border-radius:var(--r-sm);padding:14px 16px;display:grid;gap:4px;font-size:1rem;line-height:1.6}
.callout > b{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;display:flex;gap:6px;align-items:center}
.callout > b svg{width:16px;height:16px}
.callout.alerta{background:var(--warn-soft);border-left:4px solid var(--warn)}
.callout.alerta > b{color:var(--warn)}
.callout.exemplo{background:var(--brand-soft);border-left:4px solid var(--brand)}
.callout.exemplo > b{color:var(--brand-2)}
.callout strong{background:none;padding:0}
blockquote.lei{margin:0;padding:14px 18px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line);font-size:1rem;line-height:1.6;display:grid;gap:6px}
blockquote.lei p::before{content:"“";font-family:var(--font-d);font-size:1.6rem;line-height:0;vertical-align:-.35em;color:var(--mc);margin-right:2px}
blockquote.lei cite{font-style:normal;font-size:.82rem;font-weight:700;color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
.tbl table{border-collapse:collapse;width:100%;font-size:.95rem;line-height:1.5;min-width:480px}
.tbl th{background:var(--surface-2);text-align:left;padding:10px 12px;font-size:.82rem;letter-spacing:.03em}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-weight:700}
.prose .objs,.objs{margin:0;padding:0;display:grid;gap:8px}
.objs li{list-style:none;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px}
.objs li svg{width:18px;height:18px;color:var(--mc);margin-top:3px}
.secnav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px;margin-top:6px}
.modn{font-size:.82rem;font-weight:700;color:var(--mc);letter-spacing:.06em;text-transform:uppercase}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--surface-3)}
.dots i.v{background:color-mix(in srgb,var(--mc) 45%,var(--surface-3))}
.dots i.c{background:var(--mc);transform:scale(1.25)}

/* ---------- questões ---------- */
.qbox{display:grid;gap:16px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pips{display:flex;gap:5px;flex-wrap:wrap}
.pips button{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line-2);background:var(--surface);font-size:.8rem;font-weight:700;color:var(--muted);padding:0}
.pips button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.pips button.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.pips button.on{background:var(--surface-2);border-color:var(--ink-2);color:var(--ink)}
.pips button.cur{outline:2px solid var(--brand);outline-offset:2px}
.pips button.flag{border-style:dashed;border-color:var(--warn)}
.enun{font-size:1.06rem;line-height:1.65;white-space:pre-line}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.alts{display:grid;gap:10px;margin:0;padding:0}
.alt{display:grid;grid-template-columns:36px minmax(0,1fr) 22px;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line-2);background:var(--surface);border-radius:13px;padding:12px 14px;font-size:1rem;line-height:1.5;width:100%;color:var(--ink)}
.alt:hover:not([disabled]){border-color:var(--brand);background:var(--surface-2)}
.alt .L{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--font-d);font-weight:800;font-size:1rem}
.alt .st svg{width:20px;height:20px}
.alt[disabled]{cursor:default}
.alt.sel{border-color:var(--ink-2);background:var(--surface-2)}
.alt.sel .L{background:var(--ink);color:var(--bg)}
.alt.ok{border-color:var(--ok);background:var(--ok-soft)}
.alt.ok .L{background:var(--ok);color:#fff}
.alt.ok .st{color:var(--ok)}
.alt.bad{border-color:var(--bad);background:var(--bad-soft)}
.alt.bad .L{background:var(--bad);color:#fff}
.alt.bad .st{color:var(--bad)}
.alt.dim{opacity:.62}
.alt.cut .tx{text-decoration:line-through;color:var(--muted)}
.feedback{border-radius:var(--r-sm);padding:16px;display:grid;gap:8px;line-height:1.6}
.feedback.ok{background:var(--ok-soft)}
.feedback.bad{background:var(--bad-soft)}
.feedback > b{font-family:var(--font-d);font-size:1.1rem;display:flex;gap:8px;align-items:center}
.feedback.ok > b{color:var(--ok)}.feedback.bad > b{color:var(--bad)}
.feedback > b svg{width:20px;height:20px}
.score{display:grid;justify-items:center;text-align:center;gap:10px;padding:10px 0}
.score .ring{--s:120px}
.score .ring::before{width:98px;height:98px}
.score .ring b{font-size:1.6rem}
.texto{border-radius:var(--r-sm);background:var(--surface-2);padding:16px 18px;display:grid;gap:10px;font-size:1rem;line-height:1.7}
.texto summary{cursor:pointer;font-weight:700}
.texto p{margin-top:10px}
.texto p{max-width:70ch}
.ask{display:grid;gap:10px;border-radius:var(--r-sm);padding:16px;background:var(--surface-2);border:1px solid var(--line)}
.ask textarea{width:100%;min-height:72px;border:1.5px solid var(--line-2);border-radius:10px;padding:10px 12px;background:var(--surface);resize:vertical;line-height:1.5}
.ask .out{white-space:pre-wrap;line-height:1.65;font-size:1rem}

/* ---------- prova online ---------- */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px;align-items:start}
@media (max-width:1000px){.exam{grid-template-columns:minmax(0,1fr)}}
.exam-side{position:sticky;top:16px;display:grid;gap:14px}
@media (max-width:1000px){.exam-side{position:static;order:-1}}
.timer{font-family:var(--font-d);font-size:1.9rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.grid-q{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}
.grid-q button{aspect-ratio:1;border-radius:8px;border:1.5px solid var(--line-2);background:var(--surface);font-size:.75rem;font-weight:700;padding:0;color:var(--muted);min-width:0}
.grid-q button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-2)}
.grid-q button.cur{outline:2px solid var(--ink);outline-offset:1px}
.grid-q button.flag{border-color:var(--warn);border-style:dashed}
.grid-q button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid-q button.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid-q .sep{grid-column:1/-1;font-size:.72rem;font-weight:700;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.06em}
.res-m{display:grid;grid-template-columns:minmax(0,160px) minmax(0,1fr) 64px;gap:12px;align-items:center}
.res-m span:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.rlist{display:grid;gap:12px}
.ritem{border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);padding:16px;display:grid;gap:10px}
.ritem.bad{border-left:4px solid var(--bad)}.ritem.ok{border-left:4px solid var(--ok)}.ritem.vazio{border-left:4px solid var(--line-2)}
.ritem .enun{font-size:1rem}
.ralts{display:grid;gap:4px;margin:0;padding:0;font-size:.95rem}
.ralts li{list-style:none;display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;padding:5px 8px;border-radius:8px}
.ralts li.c{background:var(--ok-soft)}
.ralts li.x{background:var(--bad-soft)}
.ralts b{font-family:var(--font-d)}

/* ---------- provas da banca ---------- */
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1000px){.split{grid-template-columns:minmax(0,1fr)}}
.pdfbox{position:sticky;top:12px;height:calc(100vh - 24px);overflow:auto;background:var(--surface-2);border-radius:var(--r);border:1px solid var(--line);padding:10px;display:grid;gap:10px;align-content:start}
.pdfbox canvas{width:100%;height:auto;border-radius:6px;background:#fff;box-shadow:var(--shadow)}
@media (max-width:1000px){.pdfbox{position:static;height:72vh}}
.sheet{display:grid;gap:14px}
.sh-sec{display:grid;gap:4px}
.sh-sec h3{font-size:.95rem;display:flex;align-items:center;gap:8px;padding:6px 2px}
.sh-row{display:grid;grid-template-columns:34px 58px minmax(0,1fr);gap:8px;align-items:center;padding:5px 6px;border-radius:9px}

.sh-row .num{font-family:var(--font-d);font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.st-tag{font-size:.68rem;font-weight:700;padding:2px 6px;border-radius:6px;text-align:center;letter-spacing:.02em}
.st-tag.i{background:var(--brand-soft);color:var(--brand-2)}
.st-tag.x{background:var(--warn-soft);color:var(--warn)}

.bubbles{display:flex;gap:6px}
.bubbles button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--surface);font-weight:700;font-size:.85rem;padding:0;color:var(--ink-2);flex:none}

.bubbles button.cg{border-color:var(--ok);border-width:2.5px;color:var(--ok)}
@media (max-width:420px){.bubbles{gap:4px}.bubbles button{width:30px;height:30px}.sh-row{grid-template-columns:28px 50px minmax(0,1fr)}}
.sh-com{grid-column:1/-1;font-size:.93rem;line-height:1.55;padding:4px 6px 8px 42px;color:var(--ink-2)}
.sh-com a{font-weight:700;font-size:.85rem}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);align-items:center}
.pcard{display:grid;gap:12px}
.pcard .sc{font-family:var(--font-d);font-weight:800;font-size:1.4rem}

/* vídeos */
.vids{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:700px){.vids{grid-template-columns:minmax(0,1fr)}}
.vid{display:grid;gap:10px;text-decoration:none;color:inherit;min-width:0}
.vthumb{aspect-ratio:16/9;max-width:100%;border-radius:var(--r-sm);background:linear-gradient(135deg,color-mix(in srgb,var(--mc) 70%,#000) 0%,color-mix(in srgb,var(--mc) 35%,#000) 100%);display:grid;place-items:center;position:relative;overflow:hidden;border:0;padding:0;width:100%}
.vthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vthumb .play{position:relative;width:62px;height:62px;border-radius:50%;background:rgb(255 255 255 / .92);display:grid;place-items:center;color:#111;box-shadow:0 6px 20px rgb(0 0 0 / .3)}
.vthumb .play svg{width:26px;height:26px;margin-left:4px}
.vthumb .yt{position:absolute;left:12px;bottom:10px;color:#fff;font-size:.78rem;font-weight:700;opacity:.9}
.vframe{aspect-ratio:16/9;width:100%;max-width:100%;border:0;border-radius:var(--r-sm);background:#000}
.resumo{margin:0;padding:0;display:grid;gap:10px;counter-reset:r}
.resumo li{list-style:none;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:14px 16px;border-radius:var(--r-sm);background:var(--surface-2);line-height:1.6;font-size:1.02rem}
.resumo li::before{counter-increment:r;content:counter(r);width:30px;height:30px;border-radius:9px;background:color-mix(in srgb,var(--mc) 16%,var(--surface));color:color-mix(in srgb,var(--mc) 80%,var(--ink));display:grid;place-items:center;font-family:var(--font-d);font-weight:800;font-size:.9rem}
.done-banner{display:flex;gap:14px;align-items:center;padding:16px;border-radius:var(--r);background:var(--ok-soft);color:var(--ok);font-weight:700}

details.fold{border-radius:var(--r-sm);background:var(--surface-2);padding:12px 14px}
details.fold summary{cursor:pointer;font-weight:700}
details.fold[open] summary{margin-bottom:10px}
.foot{color:var(--muted);font-size:.82rem;line-height:1.6;border-top:1px solid var(--line);padding-top:16px}

/* ---------- tempo de estudo ---------- */
.pulse{width:8px;height:8px;border-radius:50%;background:var(--line-2);display:inline-block;flex:none}
.pulse.on{background:var(--ok);animation:pl 2.2s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 45%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.tempo-side{display:flex;align-items:center;gap:9px;font-size:.86rem;color:var(--ink-2);padding:2px 8px;line-height:1.3}

.top-chips{display:flex;gap:6px;align-items:center}
.nudge{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:45;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow-2);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;width:min(580px,calc(100vw - 32px));font-size:.94rem}

.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:7px 11px;font-size:.8rem;display:grid;gap:1px;box-shadow:var(--shadow-2);max-width:240px;line-height:1.35}

/* painel */
.dash2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}

.kpi small{display:block;color:var(--muted);font-size:.78rem;margin-top:4px;line-height:1.35}
.kpi.dest{border-color:transparent;background:var(--brand-soft)}
.kpi.dest b{color:var(--brand-2)}
.today-head{display:flex;align-items:center;gap:14px}
.today-head .ring{--s:58px}
.today-head .ring::before{width:46px;height:46px}
.today-head .ring b{font-size:.72rem}
/* gráfico de colunas */
.cc{display:grid;grid-template-columns:38px minmax(0,1fr);grid-template-rows:170px auto;column-gap:8px;row-gap:6px}
.cc-y{position:relative}
.cc-y span{position:absolute;right:0;transform:translateY(50%);font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cc-plot{position:relative;border-bottom:1px solid var(--line-2)}
.cc-g{position:absolute;left:0;right:0;height:1px;background:var(--line)}

.cc-col:hover i,.cc-col:focus-visible i{filter:brightness(1.12)}
.cc-col b{position:absolute;left:50%;transform:translateX(-50%);font-size:.72rem;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.cc-x{grid-column:2;display:grid;grid-template-columns:repeat(14,minmax(0,1fr));text-align:center;font-size:.68rem;line-height:1.25;color:var(--muted);font-weight:700}
.cc-x .off{opacity:.55;font-weight:400}
.cc-x .hoje{color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
/* constância (mapa de calor) */
.hm{display:grid;gap:4px;justify-content:start;align-items:center}

.hm .c.q1{background:var(--q1)}.hm .c.q2{background:var(--q2)}.hm .c.q3{background:var(--q3)}.hm .c.q4{background:var(--q4)}

.hm .c.prova{background:var(--hl);box-shadow:none}
.hm-leg{display:flex;align-items:center;gap:4px;font-size:.74rem;color:var(--muted);flex-wrap:wrap}

.dr{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 92px;gap:12px;align-items:center;padding:4px 0}

@media (max-width:520px){.dr{grid-template-columns:minmax(0,1fr) 80px}.dr .bar{grid-column:1/-1;order:3}}
.ganho{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-sm);background:var(--hl-soft);color:var(--ink)}

.ftempo{display:grid;gap:10px;padding:14px;border-radius:var(--r-sm);background:var(--surface-2)}
.ftempo input{border:1.5px solid var(--line-2);border-radius:10px;padding:8px 10px;background:var(--surface);min-height:40px}
.ftempo input[type=number]{width:92px}
.ttab{width:100%;border-collapse:collapse;font-size:.88rem}
.ttab td,.ttab th{padding:7px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.ttab th{font-size:.76rem;color:var(--muted)}
.ttab td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.xbtn{border:0;background:none;color:var(--muted);padding:0 4px;font-size:1rem;line-height:1}
.xbtn:hover{color:var(--bad)}
/* rotina na trilha */
.wd button{min-width:50px}
.day{grid-template-columns:86px minmax(0,1fr) auto}
.day .dfolga{align-self:start}
.day.folga{background:var(--surface-2);border-style:dashed}
.day .tmin{font-size:.74rem;color:var(--ok);font-weight:700;margin-top:4px;text-transform:none;letter-spacing:0}
@media (max-width:640px){.day{grid-template-columns:62px minmax(0,1fr)}.day .dfolga{grid-column:2;justify-self:start}}


/* ---------- flashcards ---------- */
.fc-scene{perspective:1400px}
.fc{display:grid;width:100%;border:0;padding:0;background:none;text-align:left;cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1);color:var(--ink);font:inherit}
.fc.on{transform:rotateY(180deg)}
.fc-face{grid-area:1/1;min-height:300px;border-radius:22px;padding:clamp(22px,4vw,40px);display:flex;flex-direction:column;gap:16px;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);box-shadow:var(--shadow-2);background:var(--surface)}
.fc-f{border-top:6px solid var(--mc)}
.fc-v{transform:rotateY(180deg);background:color-mix(in srgb,var(--mc) 9%,var(--surface));border-top:6px solid var(--mc)}
.fc-face p{font-family:var(--font-d);font-size:clamp(1.25rem,3vw,1.7rem);font-weight:650;line-height:1.3;text-wrap:balance}
.fc-v p{font-family:var(--font-b);font-size:clamp(1.08rem,2.4vw,1.3rem);font-weight:400;line-height:1.55}
.fc-ctl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fc-ctl .btn{flex-direction:column;gap:2px;min-height:62px}
.fc-ctl .btn small{font-weight:400;font-size:.78rem;opacity:.85}
.fc-ctl .b0{background:var(--bad-soft);color:var(--bad)}
.fc-ctl .b1{background:var(--warn-soft);color:var(--warn)}
.fc-ctl .b2{background:var(--ok-soft);color:var(--ok)}
@media (max-width:520px){.fc-ctl .btn{font-size:.86rem;padding:8px}}
.decks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:640px){.decks{grid-template-columns:repeat(2,minmax(0,1fr))}}
.deck{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.92rem;border-left:4px solid var(--mc)}
.deck:hover{background:var(--surface-2)}
.deck span{font-weight:400;color:var(--muted);font-size:.82rem}
/* ---------- por que errei ---------- */
.mot{display:grid;gap:6px;padding-top:6px;border-top:1px dashed color-mix(in srgb,var(--bad) 30%,transparent)}
.mot-ops{display:flex;flex-wrap:wrap;gap:6px}
.mchip{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:6px 11px;font-size:.84rem;font-weight:700}
.mchip:hover{border-color:var(--ink-2)}
.mchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.mot-row{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr) 40px;gap:12px;align-items:center}
.mot-row .bar i{background:var(--brand)}
.mot-row span:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:520px){.mot-row{grid-template-columns:minmax(0,1fr) 34px}.mot-row .bar{grid-column:1/-1;order:3}}
/* ---------- backup ---------- */
.bk-code{width:100%;min-height:96px;border:1.5px solid var(--line-2);border-radius:12px;padding:10px 12px;background:var(--surface-2);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;line-height:1.4;word-break:break-all;resize:vertical;color:var(--ink)}
.bk-ok{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--ok-soft);color:var(--ok);font-weight:700}
.bk-ok svg{width:20px;height:20px;flex:none}
.side-link{font-size:.84rem;font-weight:700;color:var(--muted);text-decoration:none;padding:4px 8px;display:flex;gap:8px;align-items:center}
.side-link:hover{color:var(--brand)}
.side-link svg{width:16px;height:16px}
.passos{margin:0;padding-left:1.2em;display:grid;gap:6px;font-size:.95rem}
@media (prefers-reduced-motion: reduce){.fc{transition:none}}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

<script>
"use strict";
const DATA={"aulas":[{"id":"E01","m":"esp","t":"Piaget: como a criança constrói o conhecimento","ed":["E2","E3"],"v":[["ZuB-GM2laL8","Piaget para Concursos (Profª Fabiana Firmino)"],["t5aF99nWmqo","Como Piaget cai em concurso?"]],"obj":["Explicar a ideia central da epistemologia genética","Diferenciar assimilação, acomodação e equilibração","Reconhecer as características de cada estágio do desenvolvimento","Aplicar Piaget ao atendimento da criança hospitalizada"],"s":[["Quem foi Piaget e o que ele defendia",["Jean Piaget (1896–1980) era um biólogo suíço que dedicou a vida a uma pergunta: **como o conhecimento se forma?** A teoria dele se chama **epistemologia genética** (genética no sentido de gênese, origem, e não de DNA).","Para Piaget, o conhecimento não nasce pronto dentro da criança (isso seria **inatismo**) e também não entra pronto de fora para dentro (isso seria **empirismo**). Ele é **construído** na interação da criança com o mundo. Por isso a teoria é chamada de **construtivista** e **interacionista**.",{"a":"A criança é sujeito ativo. Ela age sobre os objetos, testa hipóteses, erra e reorganiza o que sabe. Alternativa que descreve a criança como “receptora passiva” ou que diz que Piaget era inatista está errada."}]],["Os mecanismos da construção",["**Esquema** é uma estrutura de ação ou de pensamento que a criança usa para lidar com o mundo (sugar, agarrar, classificar, contar).",{"l":["**Assimilação**: a criança encaixa a novidade num esquema que já tem. Ex.: vê uma baleia e diz “peixe”.","**Acomodação**: o esquema muda para dar conta da novidade. Ex.: aprende que a baleia é mamífero e cria uma nova categoria.","**Adaptação**: é o equilíbrio entre assimilação e acomodação.","**Equilibração**: processo de autorregulação que busca o equilíbrio. Quando algo não encaixa, surge um **desequilíbrio** (conflito cognitivo), e é ele que move a aprendizagem. Piaget fala em **equilibração majorante**: cada novo equilíbrio é mais completo que o anterior."]},"Piaget aponta **quatro fatores** do desenvolvimento: **maturação** biológica, **experiência** com os objetos (física e lógico-matemática), **transmissão social** (interação e educação) e **equilibração**, que coordena os outros três.",{"a":"Na visão de Piaget, o desenvolvimento cria as condições para a aprendizagem. Em Vygotsky é o contrário: a aprendizagem puxa o desenvolvimento. A AOCP gosta de trocar os dois."}]],["Os quatro estágios",["A ordem dos estágios é sempre a mesma e cada um integra o anterior. As idades são **aproximadas** e variam de criança para criança.",{"t":[["Estágio","Idade aproximada","Marcas principais"],["Sensório-motor","0 a 2 anos","Inteligência prática, ligada a percepção e movimento. Dos reflexos às ações coordenadas. Conquista da **permanência do objeto**."],["Pré-operatório","2 a 7 anos","Surge a **função simbólica**: linguagem, jogo simbólico (faz de conta), desenho, imitação diferida. **Egocentrismo**, **animismo** (dar vida a objetos), **centração** e **irreversibilidade**. Ainda não conserva quantidades."],["Operatório concreto","7 a 11/12 anos","**Reversibilidade**, **conservação** (número, massa, volume), **classificação** e **seriação**. Raciocina com lógica, mas apoiada em objetos concretos."],["Operatório formal","a partir de 11/12 anos","Pensamento **abstrato** e **hipotético-dedutivo**. Raciocina sobre possibilidades, hipóteses e proposições."]]},{"ex":"Mostre duas bolinhas iguais de massa e amasse uma como uma cobrinha. A criança pré-operatória diz que a cobrinha “tem mais massa porque é comprida” (centração). A criança operatória concreta explica que é a mesma quantidade, porque dá para voltar à forma de bolinha (reversibilidade)."}]],["Jogo e moral em Piaget",["O tipo de jogo acompanha os estágios: **jogo de exercício** (sensório-motor, repetir pelo prazer da ação), **jogo simbólico** (pré-operatório, faz de conta) e **jogo de regras** (operatório).","No desenvolvimento moral, a criança passa da **anomia** (ausência de regras) para a **heteronomia** (regras impostas de fora, respeito unilateral ao adulto) e chega à **autonomia** (regras construídas na cooperação e no respeito mútuo)."]],["Piaget no hospital",["O adoecimento e a internação podem provocar **regressões temporárias**: uma criança que já conservava quantidades pode voltar a raciocinar de forma mais centrada, por exemplo. O pedagogo deve respeitar o estágio em que a criança está naquele momento.",{"l":["Propor situações-problema no nível da criança, que gerem um desequilíbrio que ela consiga resolver.","Usar material concreto e manipulável, principalmente até os 11 anos.","Tratar o erro como parte do processo de construção, e não como falha.","Valorizar o jogo simbólico: no faz de conta a criança elabora o que está vivendo no hospital."]}]]],"r":["Piaget: epistemologia genética, construtivismo e interacionismo.","Assimilação encaixa o novo no esquema; acomodação muda o esquema; equilibração regula o processo.","Fatores: maturação, experiência, transmissão social e equilibração.","Estágios: sensório-motor (0–2), pré-operatório (2–7), operatório concreto (7–11/12), operatório formal (11/12+).","Pré-operatório: função simbólica, egocentrismo, animismo, centração, irreversibilidade.","Operatório concreto: reversibilidade, conservação, classificação, seriação.","Jogo: exercício, simbólico, de regras. Moral: anomia, heteronomia, autonomia.","Para Piaget, o desenvolvimento possibilita a aprendizagem."],"q":[["Sobre a concepção de Jean Piaget acerca da construção do conhecimento, assinale a alternativa correta.",["O conhecimento é transmitido pelo adulto e registrado pela criança de forma passiva.","O conhecimento surge apenas da linguagem, que antecede qualquer forma de pensamento.","O conhecimento é construído na interação entre o sujeito e o objeto, por meio da ação da criança sobre o meio.","O conhecimento depende exclusivamente dos estímulos do ambiente e dos reforços recebidos.","O conhecimento é inato e apenas se manifesta à medida que a criança amadurece."],2,"Piaget é construtivista e interacionista: o sujeito constrói o conhecimento agindo sobre os objetos. E é inatismo, A e D descrevem visões empiristas/comportamentalistas, e B não corresponde a Piaget, que vê a inteligência prática surgir antes da linguagem."],["Uma criança que nunca viu um pônei aponta para ele e diz “cavalinho”, usando o que já conhece para interpretar a novidade. Segundo Piaget, essa situação exemplifica a",["assimilação.","reversibilidade.","equilibração majorante.","acomodação.","conservação."],0,"Ela encaixou o objeto novo num esquema que já tinha: é assimilação. A acomodação aconteceria se ela modificasse o esquema, criando a categoria “pônei”."],["Egocentrismo, animismo, jogo simbólico e pensamento centrado em um só aspecto da situação são características típicas do estágio",["pós-formal.","pré-operatório.","operatório concreto.","operatório formal.","sensório-motor."],1,"Todas essas marcas aparecem no pré-operatório (cerca de 2 a 7 anos), quando surge a função simbólica mas o pensamento ainda é centrado e irreversível."],["Uma criança percebe que a quantidade de água não muda ao ser passada de um copo largo para um copo fino e explica que “dá para voltar a água para o copo de antes”. Ela demonstra",["animismo, típico do pré-operatório.","pensamento hipotético-dedutivo, típico do operatório formal.","centração, típica do operatório concreto.","reversibilidade e conservação, típicas do operatório concreto.","permanência do objeto, típica do sensório-motor."],3,"Conservar a quantidade e justificar pela possibilidade de voltar ao estado inicial são marcas do operatório concreto. Centração é justamente o que impede a conservação."],["O pensamento hipotético-dedutivo, que permite raciocinar sobre possibilidades e proposições abstratas, caracteriza o estágio",["intuitivo.","operatório formal.","pré-operatório.","sensório-motor.","operatório concreto."],1,"O operatório formal, a partir de 11 ou 12 anos, é o estágio do pensamento abstrato e hipotético-dedutivo."],["Informe se é verdadeiro (V) ou falso (F) o que se afirma sobre a teoria piagetiana e assinale a sequência correta.\n( ) A equilibração coordena os demais fatores do desenvolvimento.\n( ) As idades dos estágios são fixas e iguais para todas as crianças.\n( ) O desequilíbrio cognitivo impulsiona a construção de novos conhecimentos.\n( ) A ordem dos estágios pode variar conforme o meio social.",["V – F – V – V.","V – V – F – F.","F – V – V – F.","V – F – V – F.","F – F – V – V."],3,"A equilibração coordena maturação, experiência e transmissão social (V). As idades são aproximadas (F). O conflito cognitivo move a aprendizagem (V). A ordem dos estágios é invariável, o que varia é o ritmo (F)."],["Para Piaget, o tipo de jogo predominante entre 2 e 7 anos, no qual a criança faz de conta e atribui novos significados aos objetos, é o",["jogo cooperativo.","jogo de construção.","jogo de exercício.","jogo de regras.","jogo simbólico."],4,"O jogo simbólico é típico do pré-operatório e expressa a função simbólica. O jogo de exercício é do sensório-motor e o de regras aparece no operatório."],["Durante o atendimento, uma criança de 5 anos internada diz que o suporte do soro “ficou bravo” e por isso a picada doeu. Considerando Piaget, a atitude pedagógica mais coerente é",["acolher a fala, compreendendo-a como animismo típico da idade, e usar o faz de conta e a conversa para ajudá-la a elaborar a experiência da internação.","propor exercícios de raciocínio abstrato para acelerar a passagem ao estágio operatório.","ignorar a fala e seguir com o conteúdo escolar planejado para a série.","encaminhar a criança à psicologia, pois o pensamento animista é sinal de transtorno.","corrigir a criança imediatamente, explicando que objetos não têm sentimentos, pois essa ideia indica atraso no desenvolvimento."],0,"Animismo é esperado no pré-operatório. O pedagogo acolhe e usa o jogo simbólico para a criança elaborar o que vive. Não é atraso nem transtorno, e não se acelera estágio com tarefas abstratas."]]},{"id":"E02","m":"esp","t":"Vygotsky: mediação e zona de desenvolvimento proximal","ed":["E3","E15"],"v":[["pXn5Qso5sY0","Vygotsky para Concursos"],["c8hzOQ6bM4Y","Compreendendo Vygotsky: ZDP, mediação e teoria sociocultural"]],"obj":["Explicar a teoria histórico-cultural","Diferenciar instrumentos e signos na mediação","Definir zona de desenvolvimento proximal sem confundir os níveis","Comparar Vygotsky e Piaget na relação entre aprendizagem e desenvolvimento"],"s":[["A teoria histórico-cultural",["Lev Semionovitch Vygotsky (1896–1934), psicólogo russo, criou a abordagem **histórico-cultural**, também chamada de **sociointeracionista**. A ideia central: o ser humano se constitui nas relações sociais, dentro de uma cultura e de um momento histórico.","Ele separa as **funções psicológicas elementares** (reflexos, atenção involuntária, de base biológica) das **funções psicológicas superiores** (atenção voluntária, memória lógica, pensamento abstrato, planejamento, linguagem). As superiores têm **origem social** e só se desenvolvem na interação com outras pessoas."]],["Mediação: instrumentos e signos",["A relação do ser humano com o mundo não é direta. Ela é **mediada**.",{"t":[["Elemento mediador","Para que serve","Exemplos"],["Instrumento","Age sobre o mundo externo, transforma a natureza","Lápis, enxada, tesoura, computador"],["Signo","Age sobre o psiquismo, organiza o pensamento","Linguagem, números, desenhos, mapas, nós no lenço para lembrar"]]},"A **linguagem** é o signo mais importante: serve para comunicar e também para organizar o próprio pensamento.","**Internalização** é o processo pelo qual o que era externo e social passa a ser interno. Vygotsky formulou a **lei da dupla formação**: toda função aparece duas vezes no desenvolvimento da criança, primeiro no plano **social (interpsicológico)** e depois no plano **individual (intrapsicológico)**."]],["Zona de desenvolvimento proximal (ZDP)",[{"l":["**Nível de desenvolvimento real**: o que a criança já faz **sozinha**. Mostra funções já amadurecidas.","**Nível de desenvolvimento potencial**: o que ela consegue fazer **com ajuda** de um adulto ou de um colega mais experiente.","**ZDP**: a **distância** entre esses dois níveis. São as funções que estão em processo de amadurecimento."]},"O bom ensino é aquele que atua na ZDP, adiantando-se ao desenvolvimento. O que a criança faz hoje com ajuda, amanhã fará sozinha.",{"a":"Pegadinha frequente: dizer que a ZDP é “o que a criança faz sozinha” (isso é o nível real) ou que a ajuda deve ser permanente. A mediação é provisória e vai sendo retirada conforme a criança ganha autonomia."},"Por isso, para Vygotsky, **a aprendizagem impulsiona o desenvolvimento**. É o contrário de Piaget, para quem o desenvolvimento cria as condições da aprendizagem."]],["Pensamento, linguagem e brincadeira",["Pensamento e linguagem têm **raízes diferentes**. Por volta dos 2 anos esses caminhos se cruzam: o pensamento se torna verbal e a fala se torna intelectual.","A **fala egocêntrica** (a criança falando sozinha enquanto brinca) não desaparece, como pensava Piaget. Ela se **interioriza** e vira **fala interior**, que planeja e regula a ação.","Vygotsky distingue **conceitos cotidianos** (espontâneos, aprendidos na experiência) e **conceitos científicos** (sistematizados, aprendidos sobretudo na escola). Um ajuda o outro a se desenvolver.","A **brincadeira** de faz de conta cria uma ZDP: na situação imaginária a criança segue regras e age “acima da sua idade”."]],["Defectologia e inclusão",["Nos estudos de **defectologia**, Vygotsky afirmou que a deficiência é também um fenômeno **social**: o maior prejuízo vem das barreiras e da exclusão. Ele fala em **compensação social**, ou seja, caminhos alternativos de desenvolvimento criados pela mediação, como o braile para a criança cega.","No hospital, essa visão orienta o pedagogo a olhar para o que a criança **pode fazer com apoio**, e não só para as limitações causadas pela doença."]]],"r":["Vygotsky: abordagem histórico-cultural (sociointeracionista).","Funções psicológicas superiores têm origem social.","Mediação por instrumentos (agem no mundo) e signos (agem no psiquismo); a linguagem é o principal signo.","Lei da dupla formação: primeiro interpsicológico, depois intrapsicológico.","Real = sozinha; potencial = com ajuda; ZDP = distância entre os dois.","A aprendizagem impulsiona o desenvolvimento.","Fala egocêntrica vira fala interior.","Brincadeira cria ZDP. Defectologia: compensação social."],"q":[["De acordo com Vygotsky, a zona de desenvolvimento proximal corresponde",["ao período sensível para a aquisição da linguagem escrita.","à distância entre o nível de desenvolvimento real e o nível de desenvolvimento potencial.","ao conjunto de tarefas que a criança já realiza com autonomia.","às funções psicológicas elementares, de origem biológica.","ao estágio em que a criança domina o pensamento abstrato."],1,"ZDP é a distância entre o que a criança faz sozinha (real) e o que faz com ajuda (potencial). C descreve só o nível real."],["Na teoria histórico-cultural, a linguagem, os números e os mapas são exemplos de",["instrumentos, que agem sobre o mundo externo.","funções psicológicas elementares.","signos, que agem sobre o psiquismo e organizam o pensamento.","reflexos condicionados.","esquemas de ação sensório-motores."],2,"Signos são mediadores que atuam sobre o psiquismo. Instrumentos atuam sobre o mundo externo, como uma ferramenta."],["“Todas as funções no desenvolvimento da criança aparecem duas vezes: primeiro, no nível social, e, depois, no nível individual.” Esse princípio de Vygotsky refere-se à",["aprendizagem mecânica.","alternância funcional entre afetividade e cognição.","teoria das inteligências múltiplas.","equilibração majorante.","lei da dupla formação, ligada ao processo de internalização."],4,"É a lei da dupla formação: do interpsicológico para o intrapsicológico, por meio da internalização. Equilibração é de Piaget e alternância funcional é de Wallon."],["Assinale a alternativa que expressa corretamente a relação entre aprendizagem e desenvolvimento para Vygotsky.",["A aprendizagem só ocorre por reforço positivo do comportamento.","O desenvolvimento depende apenas da maturação biológica.","A aprendizagem bem organizada impulsiona o desenvolvimento, atuando sobre funções em amadurecimento.","Aprendizagem e desenvolvimento são processos independentes.","O desenvolvimento precisa estar completo para que a aprendizagem aconteça."],2,"Para Vygotsky, a aprendizagem puxa o desenvolvimento, atuando na ZDP. E é mais próxima de Piaget e A descreve o behaviorismo."],["Sobre a fala egocêntrica, Vygotsky afirma que ela",["se interioriza e se transforma em fala interior, que planeja e regula a ação.","é exclusiva de crianças com atraso de linguagem.","é sinal de imaturidade social e deve ser desestimulada.","surge apenas na adolescência.","desaparece por volta dos 7 anos, sem deixar função."],0,"Vygotsky discorda de Piaget nesse ponto: a fala egocêntrica se transforma em fala interior, com função de planejar e organizar a ação."],["Para Vygotsky, a brincadeira de faz de conta é importante porque",["só tem valor quando conduzida por um adulto.","cria uma zona de desenvolvimento proximal, na qual a criança age além do seu comportamento habitual.","dispensa regras e por isso libera a criança de qualquer limite.","serve apenas como descanso entre as atividades escolares.","substitui a aprendizagem de conceitos científicos."],1,"Na situação imaginária a criança segue regras e age “acima da idade”: a brincadeira cria ZDP. Toda brincadeira imaginária tem regras implícitas."],["Nos estudos de defectologia, Vygotsky defendeu que",["a criança com deficiência deve ser educada sempre em ambiente separado.","a deficiência é exclusivamente um fenômeno biológico.","o desenvolvimento da criança com deficiência segue leis completamente diferentes das demais.","a mediação social pode criar caminhos alternativos de desenvolvimento, num processo de compensação.","a deficiência determina de forma fixa os limites da aprendizagem."],3,"Vygotsky vê a deficiência também como fenômeno social e fala em compensação social pela mediação, como o braile e a língua de sinais."],["Uma criança internada não consegue montar sozinha um quebra-cabeça de 30 peças, mas consegue quando o pedagogo sugere separar primeiro as bordas e organizar por cores. Com base em Vygotsky, é correto afirmar que",["o pedagogo está atuando na zona de desenvolvimento proximal, e essa ajuda deve diminuir conforme a criança ganha autonomia.","a tarefa está no nível de desenvolvimento real da criança.","a criança está no estágio operatório formal.","a ajuda do pedagogo é inadequada, pois impede a construção individual.","a atividade deve ser substituída por outra que ela já faça sozinha."],0,"O que a criança faz com ajuda indica o nível potencial: o pedagogo atua na ZDP. A mediação é temporária e vai sendo retirada."]]},{"id":"E03","m":"esp","t":"Wallon, Ausubel, Skinner, Gardner e Freire","ed":["E3"],"v":[["6M9Vg5M1yMw","Wallon e a afetividade no desenvolvimento"],["-wCL9Wn7UP4","Aprendizagem significativa: a teoria de David Ausubel"]],"obj":["Reconhecer o papel da afetividade em Wallon","Explicar aprendizagem significativa e subsunçor","Diferenciar reforço negativo de punição","Identificar as inteligências múltiplas e a educação problematizadora"],"s":[["Henri Wallon: a pessoa completa",["Henri Wallon (1879–1962), médico e psicólogo francês, criou a **teoria psicogenética da pessoa completa**. Ele estuda a criança de forma integrada, em quatro **conjuntos funcionais**: **afetividade**, **ato motor**, **conhecimento (cognição)** e a **pessoa**, que integra os três.","A **emoção** é a primeira forma de comunicação do bebê: é pelo choro e pelo corpo que ele mobiliza o adulto. Por isso a afetividade tem papel central.",{"t":[["Estágio (Wallon)","Idade aproximada","Predomínio"],["Impulsivo-emocional","0 a 1 ano","Afetivo: emoção como comunicação"],["Sensório-motor e projetivo","1 a 3 anos","Cognitivo: exploração do mundo, marcha, fala"],["Personalismo","3 a 6 anos","Afetivo: formação do eu, crise de oposição, sedução e imitação"],["Categorial","6 a 11 anos","Cognitivo: atenção, memória, pensamento categorial"],["Puberdade e adolescência","a partir de 11 anos","Afetivo: questionamentos, afirmação da identidade"]]},"Wallon fala em **alternância funcional**: os estágios alternam predomínio **afetivo** (voltado para si, centrípeto) e **cognitivo** (voltado para o mundo, centrífugo). Afetividade e inteligência não se separam, apenas se alternam no comando.",{"a":"Se a questão fala em afetividade, emoção, “pessoa completa” ou personalismo, pense em Wallon."}]],["David Ausubel: aprendizagem significativa",["Para Ausubel, aprendizagem significativa acontece quando a nova informação se relaciona de forma **não arbitrária** e **não literal** com algo relevante que o aluno já sabe. Esse conhecimento prévio que serve de âncora se chama **subsunçor**.","Frase clássica: “O fator isolado mais importante que influencia a aprendizagem é aquilo que o aprendiz já sabe. Averigue isso e ensine-o de acordo.”",{"l":["**Condições**: material potencialmente significativo **e** predisposição do aluno para aprender.","**Organizadores prévios**: materiais introdutórios, mais gerais, que fazem ponte entre o que o aluno sabe e o que vai aprender.","**Aprendizagem mecânica**: memorização sem relação com o que já se sabe, a famosa decoreba.","Tanto a aprendizagem por **recepção** quanto a por **descoberta** podem ser significativas ou mecânicas."]}]],["Skinner: comportamentalismo",["B. F. Skinner (1904–1990) é o nome do **behaviorismo radical**. No **condicionamento operante**, o comportamento é controlado pelas suas **consequências**.",{"t":[["Conceito","O que acontece","Efeito no comportamento"],["Reforço positivo","Acrescenta algo agradável (elogio, prêmio)","Aumenta"],["Reforço negativo","Retira algo desagradável (tira uma tarefa chata)","Aumenta"],["Punição","Aplica algo desagradável ou retira algo agradável","Diminui"],["Extinção","Deixa de reforçar","Diminui até sumir"]]},{"a":"Reforço negativo **não** é punição. Todo reforço aumenta a chance do comportamento se repetir. O condicionamento clássico (respondente) é de Pavlov, não de Skinner."},"Skinner também propôs a **modelagem** (reforçar aproximações sucessivas do comportamento desejado) e a **instrução programada**, com pequenos passos e retorno imediato."]],["Howard Gardner: inteligências múltiplas",["Em 1983, Gardner questionou a ideia de uma inteligência única medida pelo QI. Ele propôs inteligências relativamente independentes: **linguística**, **lógico-matemática**, **espacial**, **musical**, **corporal-cinestésica**, **interpessoal** (entender os outros), **intrapessoal** (entender a si mesmo) e, depois, **naturalista**.","Na prática pedagógica, a teoria sustenta variar as formas de ensinar e de avaliar."]],["Paulo Freire: diálogo e autonomia",["Paulo Freire (1921–1997) criticou a **educação bancária**, em que o professor “deposita” conteúdos num aluno passivo, e defendeu a **educação problematizadora** ou libertadora, baseada no **diálogo** e na realidade do educando.","“Ensinar não é transferir conhecimento, mas criar as possibilidades para a sua própria produção ou a sua construção.” No hospital, essa postura combina com a escuta: partir do que a criança vive e sabe."]]],"r":["Wallon: pessoa completa; afetividade, ato motor, cognição; emoção é a primeira comunicação; alternância funcional.","Estágios de Wallon: impulsivo-emocional, sensório-motor e projetivo, personalismo, categorial, puberdade e adolescência.","Ausubel: aprendizagem significativa ancorada em subsunçores; organizadores prévios; oposto é aprendizagem mecânica.","Skinner: condicionamento operante; reforço (positivo ou negativo) aumenta; punição diminui.","Gardner: inteligências múltiplas, contra a inteligência única.","Freire: contra a educação bancária; diálogo e educação problematizadora."],"q":[["Para Henri Wallon, a primeira forma de comunicação do bebê com o meio humano se dá por meio",["da linguagem verbal.","da emoção.","do jogo de regras.","da imitação diferida.","do pensamento categorial."],1,"Wallon vê a emoção como primeira forma de expressão e comunicação, que mobiliza o adulto. Pensamento categorial é de um estágio posterior."],["O estágio walloniano marcado pela formação do eu, pela crise de oposição e pelas fases de sedução e imitação, entre 3 e 6 anos, denomina-se",["categorial.","personalismo.","impulsivo-emocional.","sensório-motor e projetivo.","operatório concreto."],1,"É o personalismo, de predomínio afetivo. Operatório concreto é um estágio de Piaget."],["Segundo Ausubel, o conhecimento relevante já existente na estrutura cognitiva do aluno, ao qual a nova informação se ancora, é chamado de",["reforço.","esquema motor.","subsunçor.","zona proximal.","organizador prévio."],2,"Subsunçor é o conhecimento prévio que serve de âncora. Organizador prévio é um material introdutório preparado pelo professor para criar essa ponte."],["Para que ocorra aprendizagem significativa, segundo Ausubel, são necessárias as seguintes condições:",["memorização literal e avaliação somativa.","maturação biológica completa e ausência de conhecimentos prévios.","reforço positivo imediato e repetição do conteúdo.","material potencialmente significativo e predisposição do aluno para aprender.","descoberta autônoma do conteúdo, sem exposição do professor."],3,"As duas condições são material potencialmente significativo e disposição para aprender. Ausubel admite que a aprendizagem por recepção também pode ser significativa."],["No condicionamento operante de Skinner, quando se retira um estímulo desagradável após um comportamento, aumentando a probabilidade de ele se repetir, ocorre",["punição negativa.","punição positiva.","extinção.","reforço negativo.","condicionamento clássico."],3,"Retirar algo desagradável e aumentar o comportamento é reforço negativo. Punição sempre diminui o comportamento."],["A capacidade de compreender os próprios sentimentos, motivações e limites corresponde, na teoria de Gardner, à inteligência",["naturalista.","corporal-cinestésica.","intrapessoal.","lógico-matemática.","interpessoal."],2,"Intrapessoal é compreender a si mesmo. Interpessoal é compreender os outros."],["Analise as associações entre autor e conceito.\nI. Wallon – alternância funcional entre afetividade e cognição.\nII. Ausubel – organizadores prévios.\nIII. Skinner – modelagem por aproximações sucessivas.\nIV. Gardner – epistemologia genética.\nEstão corretas apenas",["III e IV.","II e IV.","I, III e IV.","I e II.","I, II e III."],4,"I, II e III estão corretas. Epistemologia genética é de Piaget, não de Gardner."],["Na perspectiva de Paulo Freire, a chamada educação bancária caracteriza-se por",["tratar o educando como depósito de conteúdos transmitidos pelo educador.","promover a autonomia e a conscientização.","partir de situações-problema da realidade vivida.","integrar afetividade e cognição no processo educativo.","valorizar o diálogo e os saberes do educando."],0,"Educação bancária é a que “deposita” conteúdos num aluno passivo. As alternativas E, C e B descrevem a educação problematizadora que Freire defende."]]},{"id":"E04","m":"esp","t":"Desenvolvimento humano na infância e na adolescência","ed":["E2","E4"],"v":[["hlqWjGnQ-gE","Psicologia do Desenvolvimento: infância e desenvolvimento"],["IKZeE2mogLQ","Psicologia do Desenvolvimento: adolescência"]],"obj":["Definir desenvolvimento humano e seus domínios","Reconhecer marcos esperados por faixa etária","Usar os estágios de Erikson em questões","Identificar efeitos da doença e da internação no desenvolvimento"],"s":[["O que é desenvolvimento humano",["Desenvolvimento é o processo **contínuo** de mudanças que acontecem ao longo de toda a vida. Envolve mudanças **quantitativas** (crescer, ganhar vocabulário) e **qualitativas** (passar a pensar de outro jeito).","Ele é **multideterminado**: depende de fatores biológicos (hereditariedade, maturação), do ambiente (nutrição, estímulo, vínculos afetivos, condições de vida) e da cultura. Cada criança tem seu ritmo.",{"l":["**Físico-motor**: crescimento, coordenação ampla e fina.","**Cognitivo**: percepção, memória, raciocínio.","**Linguagem**: compreensão e expressão.","**Socioemocional**: vínculos, autoestima, regras, convivência."]},"Dois princípios do desenvolvimento motor caem em prova: o **céfalo-caudal** (o controle vai da cabeça para os pés: primeiro sustenta a cabeça, depois senta, depois anda) e o **próximo-distal** (do centro do corpo para as extremidades: primeiro o braço, depois os dedos)."]],["Marcos aproximados por faixa etária",[{"t":[["Faixa","Alguns marcos esperados"],["0 a 2 anos","Sustenta a cabeça, senta, engatinha, anda por volta de 1 ano; balbucio e primeiras palavras; apego às figuras de cuidado e ansiedade com estranhos"],["2 a 6 anos","Explosão do vocabulário; corre, pula; faz de conta; quer fazer sozinho; controle dos esfíncteres; primeiras amizades"],["6 a 11 anos","Alfabetização; raciocínio lógico com apoio concreto; jogos de regras; valoriza o grupo e a competência"],["Adolescência (12 a 18, pelo ECA)","Puberdade; pensamento abstrato; busca de identidade e autonomia; importância do grupo de amigos e da imagem corporal"]]},{"a":"As idades são referências, não regras. A banca costuma marcar como errada a alternativa que trata marcos como fixos ou que diz que o desenvolvimento termina na adolescência."}]],["Erikson: os conflitos de cada fase",["Erik Erikson descreveu o desenvolvimento **psicossocial** ao longo da vida em oito estágios, cada um com um conflito a ser resolvido. Os cinco primeiros:",{"t":[["Fase","Conflito"],["Bebê (0 a 1)","Confiança × desconfiança"],["1 a 3 anos","Autonomia × vergonha e dúvida"],["3 a 6 anos","Iniciativa × culpa"],["6 a 12 anos","Produtividade (diligência) × inferioridade"],["Adolescência","Identidade × confusão de papéis"]]},"Na fase escolar, a criança precisa se sentir **capaz** de produzir. Na adolescência, a tarefa é construir a **identidade**."]],["A doença e a internação no desenvolvimento",["A hospitalização interrompe a rotina, afasta a criança da escola, dos amigos e da família ampliada, e traz dor, medo e procedimentos invasivos. Isso pode afetar todos os domínios do desenvolvimento.",{"l":["**Regressão**: voltar temporariamente a comportamentos já superados, como fazer xixi na cama ou falar de forma mais infantilizada.","**Privação de estímulos**: longos períodos no leito reduzem experiências motoras, sociais e cognitivas.","**Autoestima e imagem corporal**: especialmente na adolescência, mudanças no corpo (queda de cabelo, cicatrizes, cateteres) pesam muito.","**Perda de controle**: a criança decide pouca coisa no hospital, o que pode gerar irritação ou apatia."]},"O pedagogo ajuda oferecendo atividades adequadas à idade e ao estado clínico, preservando uma rotina, dando escolhas possíveis (“quer começar pelo desenho ou pela história?”) e mantendo o vínculo com a escola."]]],"r":["Desenvolvimento: contínuo, por toda a vida, multideterminado, com ritmo individual.","Domínios: físico-motor, cognitivo, linguagem, socioemocional.","Céfalo-caudal (cabeça → pés) e próximo-distal (centro → extremidades).","Erikson: confiança, autonomia, iniciativa, produtividade, identidade.","Internação pode causar regressão, privação de estímulos e impacto na autoestima.","Pedagogo: atividade adequada à idade e ao quadro clínico, rotina, escolhas e vínculo com a escola."],"q":[["Sobre o desenvolvimento humano, assinale a alternativa correta.",["É um processo contínuo e multideterminado, que envolve fatores biológicos, ambientais e culturais.","Ocorre no mesmo ritmo para todas as crianças de uma mesma idade.","É determinado exclusivamente pela hereditariedade.","Restringe-se às mudanças quantitativas, como peso e altura.","Encerra-se ao final da adolescência."],0,"O desenvolvimento acontece por toda a vida, sofre influência de muitos fatores e tem ritmo individual. Inclui mudanças qualitativas, não só quantitativas."],["O fato de o bebê controlar primeiro a cabeça, depois o tronco e só mais tarde as pernas ilustra o princípio",["da reversibilidade.","céfalo-caudal.","da alternância funcional.","da equilibração.","próximo-distal."],1,"Céfalo-caudal: o controle avança da cabeça para os pés. Próximo-distal é do centro do corpo para as extremidades."],["Para Erikson, o conflito psicossocial característico da criança em idade escolar, entre 6 e 12 anos, é",["confiança × desconfiança.","identidade × confusão de papéis.","iniciativa × culpa.","autonomia × vergonha e dúvida.","produtividade × inferioridade."],4,"Na idade escolar a criança precisa se sentir capaz de produzir: produtividade (diligência) × inferioridade."],["Na adolescência, segundo Erikson, a principal tarefa do desenvolvimento é",["superar a crise de oposição.","desenvolver a confiança básica.","construir a identidade.","adquirir o controle esfincteriano.","conquistar a permanência do objeto."],2,"O conflito da adolescência é identidade × confusão de papéis."],["Uma criança de 6 anos, que já tinha controle urinário, volta a molhar a cama durante uma internação prolongada. Esse comportamento pode ser compreendido como",["falta de estímulo da escola de origem.","regressão temporária, comum em situações de estresse como a hospitalização.","característica permanente do desenvolvimento dessa criança.","indisciplina que deve ser punida.","sinal de deficiência intelectual."],1,"Regressões temporárias são reações esperadas ao estresse da internação e tendem a passar com acolhimento."],["Informe se é verdadeiro (V) ou falso (F) e assinale a sequência correta.\n( ) Os marcos do desenvolvimento são referências aproximadas.\n( ) A internação prolongada pode reduzir as experiências motoras e sociais da criança.\n( ) Na adolescência, a imagem corporal tem pouca importância.\n( ) Pelo ECA, adolescente é a pessoa entre 12 e 18 anos de idade.",["F – F – V – V.","V – V – V – F.","F – V – V – F.","V – V – F – V.","V – F – F – V."],3,"Marcos são aproximados (V); a internação reduz experiências (V); a imagem corporal é muito importante na adolescência (F); o ECA define adolescente entre 12 e 18 anos (V)."],["A ansiedade diante de pessoas estranhas, que costuma aparecer no segundo semestre de vida, está relacionada principalmente",["à aquisição da escrita.","à crise de identidade.","à formação do vínculo de apego com as figuras de cuidado.","ao pensamento hipotético-dedutivo.","ao jogo de regras."],2,"Por volta dos 8 meses o bebê já diferencia quem cuida dele e estranha desconhecidos: é um sinal do apego."],["Uma adolescente de 15 anos, em tratamento oncológico, recusa as atividades do pedagogo e diz que não quer que os colegas da escola a vejam “desse jeito” em chamadas de vídeo. A conduta pedagógica mais adequada é",["informar aos colegas sobre o diagnóstico para que entendam a situação.","substituir as atividades por tarefas de recreação infantil.","insistir nas chamadas de vídeo, pois o contato com a turma é obrigatório.","acolher a preocupação com a imagem corporal, combinar com ela formas de contato que a deixem confortável e manter atividades significativas.","suspender todo atendimento pedagógico até o fim do tratamento."],3,"A imagem corporal pesa muito na adolescência. O pedagogo acolhe, respeita a autonomia e o sigilo, e busca alternativas de contato e de estudo. Divulgar o diagnóstico fere o sigilo."]]},{"id":"E05","m":"esp","t":"Transtornos específicos de aprendizagem","ed":["E5","E16"],"v":[["68q7ZnmNWb4","Entenda os DIS: dislexia, discalculia, disortografia e disgrafia"],["rHS_IcjHrBo","Dislexia e discalculia: sinais e como ajudar"]],"obj":["Diferenciar dificuldade de aprendizagem de transtorno","Reconhecer dislexia, disgrafia, disortografia e discalculia","Conhecer a Lei 14.254/2021","Escolher intervenções pedagógicas adequadas"],"s":[["Dificuldade ou transtorno?",[{"t":[["","Dificuldade de aprendizagem","Transtorno de aprendizagem"],["Origem","Fatores externos: método, faltas, problemas emocionais, doença, ambiente","Neurobiológica, intrínseca à pessoa, com forte componente hereditário"],["Duração","Passageira, melhora quando a causa é resolvida","Persistente, apesar de intervenções adequadas"],["Exemplo","Aluno que ficou meses internado e perdeu conteúdos","Aluno com dislexia"]]},"No **DSM-5-TR**, o **Transtorno Específico da Aprendizagem** aparece entre os transtornos do neurodesenvolvimento. Ele pode ter prejuízo na **leitura**, na **expressão escrita** e/ou na **matemática**.",{"l":["As dificuldades persistem por pelo menos **6 meses**, mesmo com intervenções direcionadas.","As habilidades ficam bem abaixo do esperado para a idade e atrapalham a vida escolar.","Começam na idade escolar, mesmo que só fiquem evidentes quando as exigências aumentam.","**Não** são explicadas por deficiência intelectual, problemas de visão ou audição não corrigidos, falta de oportunidade de aprender ou ensino inadequado."]},{"a":"Inteligência na média é compatível com transtorno de aprendizagem. Alternativa que diz que a criança com dislexia “tem inteligência abaixo da média” está errada."}]],["Os quatro transtornos mais cobrados",[{"t":[["Transtorno","Área afetada","Sinais comuns"],["Dislexia","Leitura (decodificação, fluência, precisão)","Leitura lenta e silabada, trocas de sons parecidos (f/v, p/b), dificuldade de consciência fonológica, compreensão prejudicada pela decodificação"],["Disgrafia","Traçado da escrita (aspecto motor)","Letra ilegível, tamanho irregular, pressão excessiva, espaçamento desorganizado"],["Disortografia","Ortografia","Erros persistentes de grafia, omissões, junções e separações indevidas de palavras, sem problema motor"],["Discalculia","Matemática","Dificuldade com senso numérico, fatos básicos, contagem, cálculo e raciocínio matemático
