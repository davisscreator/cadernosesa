atrai o pronome: próclise ao auxiliar. A forma original é a correta. B e D colocam o pronome depois do auxiliar mesmo com palavra atrativa; E e A deformam a locução."],["Em “Os sinais nunca vão parar de piscar”, a forma verbal “vão” está no",["presente do subjuntivo.","presente do indicativo, como auxiliar em locução com ideia de futuro.","pretérito perfeito do indicativo.","futuro do presente do indicativo.","futuro do pretérito do indicativo."],1,"Vão é presente do indicativo do verbo ir, usado como auxiliar de uma locução que indica futuro."],["Assinale a alternativa INCORRETA quanto à colocação pronominal em locução verbal.",["Quero dizer-lhe a verdade.","Vou lhe mostrar o material.","As práticas vão perpetuando-se no tempo.","Não lhe quero mentir.","Tinha feito-se o relatório antes da alta."],4,"Com particípio, o pronome não fica depois dele: “tinha-se feito” ou “se tinha feito”. As outras formas são aceitas."]]},{"id":"P05","m":"por","t":"Pontuação","ed":["P15"],"v":[["S0dmQR6hpPE","Uso da vírgula: regras mais cobradas em concurso"],["G8Stjzy-87k","Pontuação: aulão completo para concurso"]],"obj":["Saber quando a vírgula é proibida, obrigatória e facultativa","Usar ponto e vírgula, dois-pontos e travessão","Interpretar o efeito de aspas, parênteses e reticências","Analisar alterações de pontuação em questões da banca"],"s":[["A regra de ouro da vírgula",["**Não se separa com vírgula** o sujeito do verbo, o verbo do complemento e o nome do seu complemento, quando estão na ordem direta.",{"ex":"Errado: “A pedagoga do hospital, chegou cedo.” Certo: “A pedagoga do hospital chegou cedo.” Mas é correto isolar um termo intercalado com um **par** de vírgulas: “A pedagoga, **como sempre**, chegou cedo.”"}]],["Quando usar vírgula",[{"l":["**Adjunto adverbial deslocado**: “Naquele ano, o concurso foi anunciado.” Se for curto, a vírgula é facultativa; se for longo, recomendada.","**Aposto explicativo**: “Macapá, **capital do Amapá**, fica no Equador.”","**Vocativo**: “Sammy, revise a lei.”","**Expressões explicativas**: isto é, ou seja, por exemplo, aliás.","**Oração adjetiva explicativa**: “Os alunos, que estudaram, passaram.”","**Orações intercaladas**: “A prova, disse ele, será à tarde.”","**Enumeração**: “Leu, resumiu e fez as questões.”","**Conjunções deslocadas** (porém, contudo, portanto, pois conclusivo): “Ela estudou; foi, portanto, aprovada.”","**Oração adverbial antes da principal**: “Quando a prova acabar, vamos comemorar.”","**Elipse do verbo (zeugma)**: “Eu prefiro Português; ela, Matemática.”","**Antes de e**: quando os sujeitos são diferentes ou quando o “e” tem valor adversativo."]},{"a":"Oração adjetiva **restritiva** não tem vírgula. Colocar vírgulas muda o sentido: “Os alunos que estudaram passaram” (só alguns) × “Os alunos, que estudaram, passaram” (todos estudaram)."}]],["Outros sinais",[{"t":[["Sinal","Usos principais"],["Ponto e vírgula","Separar itens longos de uma enumeração; separar orações coordenadas extensas ou que já têm vírgulas; antes de conjunção adversativa ou conclusiva deslocada"],["Dois-pontos","Introduzir citação, enumeração, explicação, esclarecimento ou aposto"],["Travessão","Indicar mudança de interlocutor no diálogo; destacar ou intercalar termos (como as vírgulas, com mais ênfase)"],["Parênteses","Intercalar informação acessória, comentário ou explicação"],["Aspas","Citações, ironia, estrangeirismos, neologismos, títulos, destaque de palavra"],["Reticências","Interrupção, hesitação, suspensão do pensamento, omissão de trecho em citação: [...]"]]},{"a":"As aspas não indicam sempre ironia. Em “comunidade de ‘refugiados’”, por exemplo, podem marcar que a palavra foi usada em sentido especial."}]]],"r":["Não separe sujeito-verbo, verbo-complemento, nome-complemento (salvo intercalação com par de vírgulas).","Vírgula: adjunto adverbial deslocado, aposto, vocativo, explicativas, adjetiva explicativa, intercaladas, enumeração, conjunções deslocadas, adverbial anteposta, zeugma.","Restritiva sem vírgula; explicativa com vírgula: muda o sentido.","Ponto e vírgula: enumeração longa e coordenadas extensas. Dois-pontos: citação, enumeração, explicação.","Travessão: diálogo e destaque. Parênteses: informação acessória. Aspas: citação, ironia, sentido especial."],"q":[["Assinale a alternativa pontuada de acordo com a norma-padrão.",["A pedagoga, que trabalha no hospital há dez anos, recebeu a nova turma.","Na semana passada a equipe, reorganizou a brinquedoteca.","As crianças internadas na pediatria participaram, da oficina de leitura.","A coordenadora da classe hospitalar, organizou as atividades.","O relatório foi enviado à escola, de origem."],0,"A oração adjetiva explicativa está corretamente isolada. As demais separam sujeito e verbo, verbo e complemento ou nome e complemento."],["Em “Naquele ano, também, o Brasil saía de uma fase difícil”, as vírgulas que isolam “também”",["separam orações coordenadas.","são obrigatórias, pois isolam o sujeito.","marcam elipse do verbo.","indicam vocativo.","isolam um termo intercalado e poderiam ser retiradas sem erro gramatical."],4,"“Também” é um adjunto adverbial curto intercalado: as vírgulas são facultativas."],["Na frase “Eu prefiro estudar de manhã; minha irmã, à noite”, a vírgula depois de “irmã” indica",["vocativo.","aposto.","oração intercalada.","enumeração.","omissão do verbo (zeugma)."],4,"A vírgula marca a omissão do verbo “prefere”, já expresso antes."],["Compare: I. Os alunos que estudaram passaram. II. Os alunos, que estudaram, passaram. É correto afirmar que",["a frase II tem erro de pontuação.","as duas frases têm o mesmo sentido.","a frase I tem erro de pontuação.","em I, a oração adjetiva é restritiva e indica que só parte dos alunos passou; em II, ela é explicativa e indica que todos estudaram.","em I, todos os alunos estudaram; em II, apenas alguns."],3,"Sem vírgula, a adjetiva restringe; com vírgulas, explica e generaliza."],["Em “O edital prevê três etapas: prova objetiva, exame documental e exame de saúde”, os dois-pontos introduzem",["um vocativo.","uma conclusão.","uma enumeração que explica o termo anterior.","uma fala de personagem.","uma citação."],2,"Os dois-pontos introduzem enumeração (aposto enumerativo)."],["Assinale a alternativa em que o ponto e vírgula está empregado corretamente.",["Comprei; canetas e lápis.","Ela estudou muito; não conseguiu, porém, terminar o edital.","O candidato; deve levar documento.","A prova será; no domingo.","Macapá; Santana e Mazagão ficam na região Central."],1,"O ponto e vírgula separa orações coordenadas, ainda mais com a conjunção adversativa deslocada. Nas demais, separa termos que não podem ser separados."],["Em “A comunidade de ‘refugiados’ onde Marcelo vive...”, as aspas em “refugiados” indicam, principalmente,",["título de obra.","citação literal de lei.","fala de outro personagem.","que o termo é usado em sentido especial, diferente do habitual.","que a palavra é estrangeira."],3,"As aspas destacam que o termo é usado num sentido particular, não no literal."],["Assinale a alternativa em que a vírgula é OBRIGATÓRIA.",["No hospital, há uma brinquedoteca.","Sammy, a prova é no dia 20.","Em 2026, o edital foi publicado.","Depois do almoço, ela descansou.","Ontem, fomos ao hospital."],1,"Vocativo é sempre isolado por vírgula. Nas outras, o adjunto adverbial curto deslocado admite vírgula facultativa."]]},{"id":"P06","m":"por","t":"Classes de palavras, estrutura e formação de palavras","ed":["P4","P5"],"v":[["ltrzPijgKi4","Morfologia: classes de palavras para concurso"],["8MWNzazS40E","Quais são as classes de palavras e como são cobradas"]],"obj":["Reconhecer as dez classes de palavras pela função no contexto","Diferenciar advérbio de adjetivo, preposição de conjunção","Identificar os elementos mórficos","Classificar os processos de formação de palavras"],"s":[["As dez classes",[{"t":[["Variáveis","Invariáveis"],["Substantivo, artigo, adjetivo, numeral, pronome, verbo","Advérbio, preposição, conjunção, interjeição"]]},{"l":["**Substantivo** nomeia seres, coisas, ideias. **Adjetivo** caracteriza o substantivo.","**Advérbio** modifica verbo, adjetivo ou outro advérbio e é invariável: “muito cansada”, “estudou **bastante**”.","**Pronome substantivo** substitui o nome (“**Isso** é difícil”); **pronome adjetivo** acompanha o nome (“**Esse** livro”).","**Preposição** liga palavras dentro da oração, subordinando uma à outra (de, a, em, por, para, com, sem, sob, sobre, entre, até, desde...).","**Conjunção** liga orações ou termos de mesma função: coordenativas e subordinativas."]},{"a":"A classe depende do **uso**. “O **jantar** estava ótimo” (substantivo); “Vamos **jantar**” (verbo). “**Muito** estudo” (pronome indefinido, adjetivo); “estudou **muito**” (advérbio)."}]],["Estrutura das palavras",[{"t":[["Elemento","O que é","Exemplo"],["Radical","Parte que carrega o significado básico","**pedag**ogo, **pedag**ógico"],["Afixos","Prefixo (antes) e sufixo (depois) do radical","**in**feliz, feliz**mente**"],["Desinências","Indicam gênero e número (nominais) ou modo, tempo, número e pessoa (verbais)","menin**a**, menin**os**; estud**á**va**mos**"],["Vogal temática","Liga o radical às desinências; nos verbos indica a conjugação","estud**a**r, beb**e**r, part**i**r"]]}]],["Processos de formação",[{"t":[["Processo","Como funciona","Exemplos"],["Derivação prefixal","Acrescenta prefixo","reler, infeliz, **ex-militar**"],["Derivação sufixal","Acrescenta sufixo","felizmente, pedagógico, beleza"],["Prefixal e sufixal","Prefixo e sufixo, mas a palavra existe sem um deles","deslealdade (desleal, lealdade)"],["Parassintética","Prefixo e sufixo **ao mesmo tempo**; sem um deles a palavra não existe","entardecer, amanhecer, envelhecer, emagrecer"],["Regressiva","Reduz a palavra, em geral verbo virando substantivo","lutar → luta; ajudar → ajuda; debater → debate"],["Imprópria","Muda a classe sem mudar a forma","o **olhar**, um **sim**, o **porquê**"],["Composição por justaposição","Une palavras sem alterar o som","guarda-chuva, girassol, passatempo"],["Composição por aglutinação","Une palavras com perda de som","planalto (plano + alto), embora (em + boa + hora), aguardente"],["Hibridismo","Elementos de línguas diferentes","automóvel, televisão, sociologia"],["Sigla e redução","Iniciais ou forma encurtada","SUS, ONU; foto, moto"]]},{"a":"“Ex-militar” é **derivação prefixal** (ex- é prefixo), mesmo com hífen. Não é composição."},"Prefixos que caem: **pre-** (anterioridade: predecessor, prever), **pós-** (posterioridade), **re-** (repetição: reler; ou retrocesso), **in-/des-** (negação), **anti-** (contra), **sub-** (abaixo), **hiper-/super-** (excesso). O sufixo **-or** forma substantivos e adjetivos de agente (predecess**or**, educad**or**); **-mente** forma advérbios."]]],"r":["Variáveis: substantivo, artigo, adjetivo, numeral, pronome, verbo. Invariáveis: advérbio, preposição, conjunção, interjeição.","A classe depende do uso no contexto.","Advérbio modifica verbo, adjetivo e advérbio; é invariável.","Elementos: radical, afixos, desinências, vogal temática.","Parassintética: prefixo e sufixo simultâneos (entardecer). Regressiva: lutar → luta. Imprópria: muda a classe.","Justaposição sem perda (girassol); aglutinação com perda (planalto).","Ex-militar: derivação prefixal."],"q":[["Em “A criança estudou bastante durante a internação”, a palavra “bastante” é",["pronome indefinido.","adjetivo, concordando com criança.","conjunção.","substantivo.","advérbio de intensidade, modificando o verbo."],4,"Bastante modifica o verbo estudou: advérbio, invariável."],["Assinale a alternativa em que a palavra destacada é substantivo.",["Precisamos **jantar** antes da prova.","Vamos **jantar** mais cedo.","Ela quer **jantar** com a família.","O **jantar** do hospital é servido às 18 horas.","Não pude **jantar** ontem."],3,"Precedido de artigo e funcionando como núcleo do sujeito, jantar é substantivo (derivação imprópria)."],["A palavra “entardecer” é formada por",["derivação prefixal.","derivação regressiva.","derivação parassintética.","derivação sufixal.","composição por aglutinação."],2,"Prefixo en- e sufixo -ecer entram ao mesmo tempo; não existem “entarde” nem “tardecer”."],["O substantivo “ajuda”, formado a partir do verbo “ajudar”, é exemplo de derivação",["sufixal.","regressiva.","imprópria.","prefixal.","parassintética."],1,"Substantivo formado pela redução do verbo: derivação regressiva."],["As palavras “planalto” e “aguardente” são formadas por",["justaposição.","aglutinação.","derivação prefixal e sufixal.","hibridismo.","derivação imprópria."],1,"Houve perda de som na junção (plano + alto; água + ardente): aglutinação."],["Em “Foi ameaçado por ex-militares”, o termo “ex-militares” formou-se por",["derivação prefixal.","composição por aglutinação.","composição por justaposição.","hibridismo.","derivação parassintética."],0,"Ex- é prefixo: derivação prefixal. O hífen não transforma a palavra em composta."],["Na palavra “predecessor”, há",["apenas radical, sem afixos.","sufixo formador de verbos.","prefixo de negação.","prefixo indicador de anterioridade e sufixo formador de substantivos e adjetivos.","prefixo indicador de posterioridade e sufixo formador de advérbio."],3,"Pre- indica anterioridade e -or forma substantivos e adjetivos (de agente)."],["Assinale a alternativa em que a palavra destacada é preposição.",["**Embora** cansada, continuou.","Ela estudou, **mas** não terminou.","Saiu **logo** depois da aula.","Ela **e** a mãe chegaram.","O livro **de** histórias ficou no leito."],4,"De liga palavras e subordina uma à outra: preposição. B, A e D trazem conjunções; C traz advérbio."]]},{"id":"P07","m":"por","t":"Compreensão e interpretação de texto","ed":["P1","P17"],"v":[["tDnUxMCQa9w","Compreensão e interpretação de texto para concurso público"],["IRe1duamo0M","Pressupostos e subentendidos (Prof. Noslen)"]],"obj":["Diferenciar compreender e interpretar","Reconhecer extrapolação, redução e contradição","Distinguir pressuposto e subentendido","Aplicar um passo a passo de resolução"],"s":[["O assunto que mais pesa",["Interpretação é o assunto que mais pesa nas 10 questões de Português. A AOCP costuma trazer um texto seguido de várias perguntas, misturando interpretação e gramática do próprio texto.",{"t":[["","O que é","Como a pergunta aparece"],["Compreensão","Entender o que o texto diz de forma explícita","De acordo com o texto...; Segundo o autor..."],["Interpretação","Tirar conclusões do que está implícito","Infere-se que...; Conclui-se...; O texto sugere..."]]}]],["Os três erros escondidos nas alternativas",[{"l":["**Extrapolação**: vai além do texto. Pode até ser verdade no mundo, mas o texto não diz.","**Redução**: pega uma parte da ideia e apresenta como se fosse o todo.","**Contradição**: diz o contrário do texto."]},{"a":"Se duas alternativas parecem certas, a correta é a que tem apoio direto em um trecho. A outra quase sempre extrapola."}]],["Pressuposto e subentendido",["**Pressuposto** é a informação marcada nas próprias palavras. Em “Ela **voltou a** estudar”, fica pressuposto que ela estudava antes e parou. Palavras como “ainda”, “já”, “de novo”, “deixou de” criam pressupostos.","**Subentendido** é uma insinuação que depende do contexto. “Esse quarto está quente, né?” pode ser um pedido para ligar o ar. O falante pode negar o subentendido, mas não o pressuposto."]],["Passo a passo para resolver",[{"l":["Leia a pergunta antes do texto. Assim você já lê procurando.","Desconfie de palavras absolutas: sempre, nunca, apenas, todos, exclusivamente.","Volte ao trecho antes de marcar. Não responda de memória.","Em questão de sentido no contexto, troque a palavra pela alternativa e veja se a frase diz a mesma coisa.","Pronomes como ele, isso, o qual e cujo retomam algo: encontre o que eles retomam.","Separe a opinião do autor (marcas como “infelizmente”, “felizmente”, adjetivos avaliativos) dos fatos que ele relata."]}]],["Texto para as questões",["Quando uma criança é internada, a rotina dela muda de uma hora para outra. Os amigos ficam longe, a escola fica para depois e o tempo passa devagar entre um exame e outro. Nesse cenário, a presença de um pedagogo pode parecer um detalhe, mas não é. Ao propor uma leitura, um jogo ou uma tarefa da escola, o profissional devolve à criança algo que a doença tinha tirado: a sensação de que a vida continua. Não se trata de transformar o leito em sala de aula a qualquer custo. O ritmo é outro, e cada atividade precisa respeitar o estado de saúde, o cansaço e a vontade do paciente. Ainda assim, quando o trabalho é bem feito, a volta para a escola costuma ser menos difícil, porque o aluno não perdeu completamente o vínculo com os estudos."]]],"r":["Compreensão: o explícito. Interpretação: o implícito (infere-se, conclui-se).","Erros comuns nas alternativas: extrapolação, redução e contradição.","Pressuposto vem marcado nas palavras; subentendido depende do contexto.","Leia a pergunta primeiro, volte ao trecho, desconfie de palavras absolutas, ache o referente dos pronomes."],"q":[["De acordo com o texto, a atuação do pedagogo no hospital",["deve seguir o mesmo ritmo das aulas da escola regular.","garante que o aluno não terá nenhuma dificuldade ao voltar para a escola.","ajuda a criança a perceber que a vida continua, mesmo durante a internação.","substitui o tratamento médico em casos de internação prolongada.","é dispensável quando a criança recebe visitas dos amigos."],2,"C está dito no texto. A contradiz (“o ritmo é outro”). D e E não têm base. B extrapola: o texto diz que a volta “costuma ser menos difícil”."],["No trecho “o profissional devolve à criança algo que a doença tinha tirado”, a expressão “algo que a doença tinha tirado” refere-se a",["a sensação de que a vida continua.","os amigos.","a escola.","o tempo livre.","o vínculo com a família."],0,"O próprio texto explica depois dos dois-pontos: “a sensação de que a vida continua”."],["Infere-se do texto que",["toda criança internada deve fazer tarefas escolares diariamente.","os exames médicos são a principal causa do atraso escolar.","a internação não altera a rotina da criança.","o vínculo com os estudos se perde em qualquer internação.","o pedagogo deve adaptar as atividades às condições do paciente."],4,"E se apoia em “cada atividade precisa respeitar o estado de saúde, o cansaço e a vontade do paciente”. A contradiz o texto; C contradiz a primeira frase; D e B extrapolam."],["No último período, a expressão “Ainda assim” estabelece, em relação ao que vem antes, uma relação de",["causa.","tempo.","finalidade.","conclusão.","oposição."],4,"“Ainda assim” equivale a “mesmo assim”: contrasta as limitações citadas com o resultado positivo."],["A expressão “a qualquer custo” pode ser substituída, sem alteração do sentido no texto, por",["em qualquer horário do dia.","com baixo custo financeiro.","com o apoio da família.","de qualquer jeito, sem considerar as condições.","de forma gratuita."],3,"“A qualquer custo” significa “de qualquer maneira, sem medir as consequências”. B e E fazem leitura literal de “custo”."],["Em “a presença de um pedagogo pode parecer um detalhe, mas não é”, o autor",["cita a opinião de um especialista.","apresenta uma ideia comum para, em seguida, contestá-la.","faz uma pergunta retórica.","concorda que a presença do pedagogo é um detalhe.","conclui o texto."],1,"O autor antecipa uma visão (parece detalhe) e a nega com “mas não é”, defendendo sua posição."],["Na frase “Ela voltou a estudar depois da alta”, a expressão “voltou a” pressupõe que",["ela vai parar de estudar.","ela estudava antes e havia interrompido os estudos.","ela estuda no hospital.","ela não quer estudar.","ela nunca tinha estudado."],1,"“Voltar a” marca um pressuposto: a ação existia, foi interrompida e recomeçou."],["Assinale a alternativa que identifica corretamente o tipo de erro da afirmação: “Segundo o texto, a presença do pedagogo elimina todas as dificuldades da criança internada”.",["Extrapolação, pois vai além do que o texto afirma.","Pressuposto do segundo período.","Contradição direta com a primeira frase.","Redução, pois apresenta apenas parte da ideia.","Paráfrase correta do último período."],0,"O texto fala em tornar a volta “menos difícil”, não em eliminar todas as dificuldades: é extrapolação."]]},{"id":"P08","m":"por","t":"Tipologia, gêneros textuais, coesão e coerência","ed":["P2","P3"],"v":[["Yj0cJ3D9WUg","Tipos e gêneros textuais: como nunca mais errar"],["60wyY63Lz0k","Coesão textual: teoria e questões"]],"obj":["Diferenciar tipo textual de gênero textual","Reconhecer gêneros comuns em prova, como resenha e crônica","Identificar mecanismos de coesão referencial e sequencial","Usar corretamente este, esse e aquele"],"s":[["Tipo × gênero",["**Tipos textuais** são modos de organizar o texto, em número limitado. **Gêneros textuais** são os textos concretos que circulam na sociedade, em número ilimitado. Um gênero pode misturar vários tipos.",{"t":[["Tipo","Marcas","Aparece em"],["Narrativo","Fatos no tempo, personagens, verbos de ação, geralmente no pretérito","Conto, crônica, notícia"],["Descritivo","Características, adjetivos, verbos de estado","Classificados, retratos, laudos"],["Dissertativo-argumentativo","Tese, argumentos, opinião, conectivos lógicos","Artigo de opinião, editorial, resenha crítica"],["Expositivo","Explica e informa, sem defender tese","Verbete, texto didático"],["Injuntivo (instrucional)","Orienta o leitor, verbos no imperativo ou infinitivo","Receita, manual, bula, edital"]]},{"l":["**Resenha crítica**: resume e **avalia** uma obra, com argumentos e juízo de valor.","**Crônica**: fatos do cotidiano, linguagem leve, reflexão.","**Notícia**: fato recente, linguagem objetiva, lide (o quê, quem, quando, onde, como, por quê).","**Editorial**: opinião do jornal, sem assinatura. **Artigo de opinião**: opinião assinada."]}]],["Coesão referencial",["É a retomada ou antecipação de termos para o texto não ficar repetitivo.",{"l":["**Anáfora**: retoma algo já dito. “A pedagoga chegou. **Ela** trouxe livros.”","**Catáfora**: antecipa algo que virá. “Só quero **isto**: que você passe.”","Recursos: pronomes, sinônimos, **hiperônimos** (fruta para manga), expressões nominais (“a profissional”), **elipse** (omissão de termo identificável)."]},{"t":[["Pronome","Uso no texto"],["Este, esta, isto","Antecipa o que vai ser dito (catáfora) ou retoma o último elemento citado"],["Esse, essa, isso","Retoma o que já foi dito (anáfora)"],["Aquele, aquela, aquilo","Retoma o elemento mais distante, citado primeiro"]]},{"ex":"“Piaget e Vygotsky estudaram o desenvolvimento: **este** destacou a mediação social; **aquele**, a equilibração.” Este = Vygotsky (último citado); aquele = Piaget (primeiro citado)."}]],["Coesão sequencial e coerência",["A **coesão sequencial** liga partes do texto com **conectivos**, que expressam relações: adição (e, além disso), oposição (mas, porém, embora), causa (porque, já que), conclusão (portanto, logo), condição (se, caso), finalidade (para que), tempo (quando, enquanto), explicação (pois, isto é).","**Coerência** é a lógica do sentido: o texto não se contradiz e faz sentido para o leitor. Um texto pode ter conectivos e ainda assim ser incoerente.",{"a":"Na questão de troca de conectivo, verifique se o novo conectivo mantém a mesma relação de sentido e se a frase continua correta. “Portanto” (conclusão) não pode virar “porquanto” (causa)."}]]],"r":["Tipo: modo de organizar (narrar, descrever, argumentar, expor, instruir). Gênero: texto concreto (resenha, notícia, bula).","Resenha crítica: resume e avalia. Editorial sem assinatura; artigo de opinião assinado.","Anáfora retoma; catáfora antecipa. Hiperônimo, sinônimo, pronome e elipse fazem coesão.","Este: antecipa ou último citado. Esse: já citado. Aquele: o mais distante.","Conectivos expressam relações; troque só por outro de mesmo sentido."],"q":[["Sobre tipos e gêneros textuais, assinale a alternativa correta.",["Tipos textuais são ilimitados, e gêneros textuais são poucos e fixos.","A receita culinária é predominantemente argumentativa.","A crônica é necessariamente descritiva.","A notícia é um tipo textual.","Um gênero textual pode combinar diferentes tipos textuais."],4,"Gêneros são muitos e podem combinar tipos. A receita é injuntiva; notícia é gênero."],["Um texto que resume um filme, analisa seus elementos, emite juízos de valor e o compara a outras obras pertence ao gênero",["notícia.","resenha crítica.","ata.","bula.","verbete."],1,"Resumo + avaliação + argumentação caracterizam a resenha crítica."],["Em “A pedagoga organizou a sala. A profissional também preparou os jogos”, a expressão “A profissional” é um recurso de",["coesão sequencial por conectivo.","elipse.","coesão referencial por expressão nominal que retoma “A pedagoga”.","catáfora.","coerência por contradição."],2,"A expressão nominal retoma um termo anterior: coesão referencial (anáfora)."],["Em “Só desejo isto: que todos sejam aprovados”, o pronome “isto”",["refere-se a um objeto próximo do falante.","está empregado de forma incorreta.","antecipa o conteúdo que vem depois dos dois-pontos.","é conjunção integrante.","retoma um termo anterior."],2,"Isto anuncia o que vem a seguir: catáfora."],["Em “Piaget e Wallon estudaram a criança; este valorizou a afetividade, e aquele, a equilibração”, os pronomes “este” e “aquele” referem-se, respectivamente, a",["afetividade e equilibração.","criança e Piaget.","Piaget e Wallon.","Wallon e criança.","Wallon e Piaget."],4,"Este retoma o último citado (Wallon); aquele, o primeiro (Piaget)."],["Em “Ela estudou todo o edital; portanto, está preparada”, o conectivo “portanto” pode ser substituído, sem alteração de sentido, por",["logo.","pois que.","contudo.","porquanto.","embora."],0,"Portanto e logo são conclusivos. Porquanto e pois que são causais; contudo é adversativo; embora é concessivo."],["Os textos que orientam o leitor a realizar uma ação, com verbos no imperativo ou no infinitivo, como manuais e receitas, são predominantemente",["argumentativos.","expositivos.","descritivos.","injuntivos.","narrativos."],3,"Textos instrucionais são injuntivos."],["Assinale a alternativa em que há problema de coerência.",["Estava sem febre; portanto, a temperatura estava muito alta.","Choveu muito, por isso a atividade foi na sala.","Embora estivesse cansada, terminou a leitura.","Ela faltou porque estava internada.","Como estudou, foi aprovada."],0,"Não há lógica entre estar sem febre e concluir que a temperatura estava alta: o conectivo conclusivo liga ideias incompatíveis."]]},{"id":"P09","m":"por","t":"Semântica: sentido das palavras e figuras de linguagem","ed":["P16","P17","P18","P19"],"v":[["yiNBsB6hfPo","Figuras de linguagem: as que mais caem em concurso"],["CbpM0LBACdQ","Figuras de linguagem mais cobradas em concursos"]],"obj":["Diferenciar denotação e conotação","Reconhecer as figuras de linguagem mais cobradas","Diferenciar sinônimos, antônimos, hiperônimos, homônimos e parônimos","Escolher o sentido certo de uma palavra no contexto"],"s":[["Denotação e conotação",["**Denotação** é o sentido literal, de dicionário: “O tubarão é um peixe.” **Conotação** é o sentido figurado, criado pelo contexto: “Aquele empresário é um tubarão.”",{"a":"Questões perguntam qual trecho **não** tem sentido figurado. Procure o trecho em que todas as palavras estão no sentido literal."}]],["Figuras de linguagem",[{"t":[["Figura","O que faz","Exemplo"],["Metáfora","Comparação implícita, sem conectivo","A internação é **uma longa estrada**."],["Comparação","Comparação explícita, com conectivo","Corria **como** o vento."],["Metonímia","Troca por relação próxima: autor pela obra, parte pelo todo, continente pelo conteúdo, marca pelo produto","Li **Paulo Freire**. Bebeu **um copo**."],["Catacrese","Metáfora já desgastada, por falta de termo próprio","**Pé** da mesa, **braço** da cadeira"],["Hipérbole","Exagero","Já falei **um milhão de vezes**."],["Eufemismo","Suaviza uma ideia","Ele **partiu** (morreu)."],["Ironia","Diz o contrário do que pensa","Que **ótimo**, perdi o ônibus."],["Antítese","Aproxima ideias opostas","Entre a **vida** e a **morte**."],["Paradoxo","Ideias opostas que se fundem num absurdo aparente","Dor que desatina **sem doer**."],["Personificação","Dá características humanas a seres inanimados","O vento **sussurrava**."],["Sinestesia","Mistura sentidos","Voz **doce**, cheiro **quente**."],["Pleonasmo","Repetição para reforçar (o vicioso é erro)","Vi com **meus próprios olhos**."],["Gradação","Sequência crescente ou decrescente","Maior, mais ameaçador, mais furioso."],["Aliteração / assonância","Repetição de consoantes / de vogais","O **r**ato **r**oeu a **r**oupa do **r**ei."]]}]],["Relações de sentido",[{"l":["**Sinônimos**: sentido semelhante (prolífico, fecundo). **Antônimos**: sentido oposto (predecessor × sucessor).","**Hiperônimo**: termo geral (profissional de saúde); **hipônimo**: termo específico (enfermeira).","**Homônimos**: mesma pronúncia e/ou grafia, sentidos diferentes. Homófonos: cela/sela, concerto/conserto, sessão/seção/cessão. Homógrafos: o **almoço** (ô) / eu **almoço** (ó).","**Parônimos**: palavras parecidas, sentidos diferentes: eminente (notável) / iminente (prestes a acontecer); descrição / discrição; ratificar (confirmar) / retificar (corrigir); comprimento / cumprimento; tráfego (trânsito) / tráfico (comércio ilegal); infringir (violar) / infligir (aplicar pena).","**Polissemia**: uma palavra com vários sentidos (banco de sentar, banco de dinheiro, banco de sangue)."]}]]],"r":["Denotação: literal. Conotação: figurado.","Metáfora sem conectivo; comparação com conectivo.","Metonímia: autor pela obra, parte pelo todo, continente pelo conteúdo.","Catacrese: pé da mesa. Eufemismo suaviza. Hipérbole exagera. Ironia diz o contrário.","Antítese aproxima opostos; paradoxo funde opostos.","Sinestesia mistura sentidos; personificação humaniza.","Hiperônimo geral, hipônimo específico. Parônimos: eminente/iminente, ratificar/retificar, tráfego/tráfico."],"q":[["Assinale a alternativa em que há sentido conotativo.",["O tubarão é um peixe cartilaginoso.","A prova terá 60 questões.","Aquele concurso foi uma maratona.","O hospital fica perto do rio Amazonas.","A criança leu o livro inteiro."],2,"“Uma maratona” está em sentido figurado (algo longo e cansativo): metáfora, sentido conotativo."],["Em “Passei a tarde lendo Monteiro Lobato para as crianças”, há",["hipérbole.","catacrese.","antítese.","metáfora.","metonímia, pois o autor está no lugar da obra."],4,"Ler Monteiro Lobato = ler as obras dele: metonímia (autor pela obra)."],["A expressão “pé da mesa” constitui",["eufemismo.","sinestesia.","metáfora inédita.","ironia.","catacrese."],4,"É uma metáfora desgastada, usada por falta de termo próprio: catacrese."],["Em “Ele nos deixou ontem, cercado pela família”, para se referir à morte, emprega-se",["ironia.","pleonasmo vicioso.","paradoxo.","eufemismo.","hipérbole."],3,"Suavizar a ideia de morte é eufemismo."],["Em “O silêncio da enfermaria gritava”, há",["catacrese.","personificação e paradoxo.","comparação.","metonímia.","eufemismo."],1,"Silêncio que grita: personificação (gritar é ação humana) e paradoxo (silêncio que faz barulho)."],["Assinale a alternativa que apresenta apenas termos com sentido oposto a “predecessor”.",["ascendente, ulterior.","subsequente, sucessor.","antecessor, posterior.","precursor, sucessivo.","antecedente, prenunciador."],1,"Predecessor é quem veio antes. Subsequente e sucessor indicam quem vem depois."],["Assinale a alternativa em que o parônimo está empregado corretamente.",["A prova é iminente: será daqui a poucos dias.","A descrição dos funcionários garantiu o sigilo.","Ele infligiu as regras do hospital.","O tráfico de veículos na avenida estava intenso.","O diretor ratificou o erro do relatório, corrigindo a data."],0,"Iminente = prestes a acontecer. Corrigir é retificar; trânsito é tráfego; violar regras é infringir; reserva é discrição."],["Em relação a “profissional de saúde”, a palavra “enfermeira” é",["hipônimo.","antônimo.","parônimo.","hiperônimo.","homônimo."],0,"Enfermeira é um tipo específico de profissional de saúde: hipônimo."]]},{"id":"P10","m":"por","t":"Acentuação, ortografia, hífen e variação linguística","ed":["P13","P14","P20"],"v":[],"vb":"acentuação gráfica novo acordo ortográfico para concursos","obj":["Aplicar as regras de acentuação depois do Novo Acordo","Usar os porquês e outras grafias que confundem","Empregar o hífen com prefixos","Reconhecer os tipos de variação linguística"],"s":[["Acentuação",[{"t":[["Grupo","Acentua quando...","Exemplos"],["Oxítonas","Terminam em a(s), e(s), o(s), em, ens","sofá, café, avô, também, parabéns"],["Paroxítonas","Terminam em l, n, r, x, ps, ã(s), ão(s), i(s), us, um, uns, ditongo","fácil, hífen, caráter, tórax, órfã, órgão, júri, vírus, álbum, história, mistério"],["Proparoxítonas","Sempre","única, lâmpada, médico"],["Monossílabos tônicos","Terminam em a(s), e(s), o(s)","pá, pé, pó, há, já"],["Hiatos i e u tônicos","Sozinhos na sílaba ou com s","saída, saúde, país, baú"]]},{"l":["Ditongos abertos **éi, ói, éu** só têm acento em oxítonas e monossílabos: papéis, herói, céu. Nas paroxítonas perderam: ideia, assembleia, heroico, plateia.","Sem acento depois do Novo Acordo: creem, deem, leem, veem, voo, enjoo; feiura; para (verbo), pelo, polo, pera.","Acentos diferenciais que ficaram: **pôde** (passado) × pode; **pôr** (verbo) × por; **têm, vêm** (plural) × tem, vem.","Hiato com i seguido de **nh** não tem acento: rainha, moinho.","O **trema** caiu (frequente, linguiça), exceto em nomes próprios estrangeiros."]},{"ex":"“Mistério” e “história” têm acento pela mesma regra: paroxítonas terminadas em ditongo."}]],["Os porquês e outras confusões",[{"t":[["Forma","Quando usar","Exemplo"],["Por que","Perguntas (diretas ou indiretas) e quando equivale a “pelo qual”","Por que você estuda? Não sei por que faltou."],["Por quê","No fim da frase","Faltou por quê?"],["Porque","Explicação ou causa (= pois)","Faltei porque estava doente."],["Porquê","Substantivo, com artigo","Não sei o porquê da mudança."]]},{"l":["**Mal** (oposto de bem) × **mau** (oposto de bom).","**Há** (tempo passado: há dois anos) × **a** (futuro ou distância: daqui a dois anos).","**Onde** (lugar fixo) × **aonde** (movimento, com verbo que pede a: aonde você vai?).","**Sessão** (reunião), **seção** (divisão), **cessão** (ato de ceder).","**Senão** (caso contrário) × **se não** (caso não).","**A fim de** (finalidade) × **afim** (semelhante).","**Acerca de** (sobre) × **há cerca de** (faz aproximadamente)."]}]],["Hífen com prefixos",[{"l":["Prefixo terminado em vogal + palavra com a **mesma vogal**: hífen (micro-ondas, anti-inflamatório).","**Vogais diferentes**: junta (autoescola, infraestrutura, extraoficial).","Prefixo + palavra com **h**: hífen (anti-higiênico, super-herói).","Prefixo terminado em vogal + **r** ou **s**: dobra a consoante (antirrábico, contrassenso, minissaia).","**Ex-, vice-, recém-, sem-, pós-, pré-, pró-** (tônicos): hífen (ex-aluno, vice-diretor, recém-nascido, pré-natal, pós-graduação).","**Co-** em geral junta: coautor, cooperar, coerdeiro."]}]],["Variação linguística",[{"t":[["Tipo","Varia conforme","Exemplo"],["Diatópica (geográfica)","A região","Expressões do Norte, como “égua!”, ou macaxeira, aipim e mandioca"],["Diastrática (social)","Grupo social, idade, escolaridade, profissão","Gírias de jovens, jargão médico"],["Diafásica (situacional)","A situação de comunicação, o grau de formalidade","Conversa com amigos × entrevista de emprego"],["Diacrônica (histórica)","O tempo","Vossa mercê → vosmecê → você"]]},"Todas as variedades têm regras próprias. A norma-padrão é a referência para situações formais, mas usar outra variedade não é “erro” em si: é questão de **adequação** à situação. Tratar variedades populares como inferiores é **preconceito linguístico**."]]],"r":["Oxítonas: a, e, o, em, ens. Paroxítonas: l, n, r, x, ps, ã, ão, i, us, um, ditongo. Proparoxítonas: todas.","Éi, ói, éu só em oxítonas e monossílabos. Creem, voo, ideia, feiura sem acento.","Diferenciais: pôde, pôr, têm, vêm.","Por que (pergunta), por quê (final), porque (causa), porquê (substantivo).","Há (passado) × a (futuro). Onde × aonde. Sessão, seção, cessão.","Hífen: mesma vogal ou h; vogais diferentes juntam; r/s dobram; ex-, vice-, recém-, pré-, pós- com hífen.","Variação diatópica, diastrática, diafásica, diacrônica. Adequação, não erro."],"q":[["Os vocábulos “mistério” e “história” são acentuados pelo mesmo motivo que",["saúde e país.","única e lâmpada.","herói e papéis.","café e avô.","série e infância."],4,"Todas são paroxítonas terminadas em ditongo. D traz oxítonas; B, proparoxítonas; A, hiatos; C, ditongos abertos em oxítonas."],["Assinale a alternativa em que todas as palavras estão grafadas de acordo com o Novo Acordo Ortográfico.",["ideia, assembléia, vôo.","ideia, assembleia, voo.","idéia, assembléia, vôo.","ideia, asembleia, vou.","idéia, assembleia, voo."],1,"Paroxítonas com ditongo aberto ei perderam o acento, e voo também."],["Assinale a alternativa em que o porquê está empregado corretamente.",["Porquê você escolheu esse cargo?","Faltei por que estava doente.","Ninguém entendeu o por que da mudança.","Você estudou por quê?","Não sei porque ela faltou à aula."],3,"No fim da frase usa-se “por quê”. E pede “por que” (pergunta indireta); B pede “porque” (causa); C pede “porquê” (substantivo); A pede “Por que”."],["Assinale a alternativa correta quanto ao uso de há e a.",["Ela trabalha no hospital há dez anos.","A prova será daqui há 50 dias.","O concurso foi anunciado a cerca de um ano.","Estudo esse edital a muito tempo.","Daqui há dois meses será a prova."],0,"Há indica tempo passado: trabalha há dez anos. Para o futuro usa-se a: daqui a dois meses."],["Assinale a alternativa em que o hífen está empregado corretamente.",["co-autor.","micro-ondas.","auto-escola.","anti-rábico.","contra-senso."],1,"Mesma vogal (o-o) pede hífen: micro-ondas. As demais: antirrábico, autoescola, contrassenso, coautor."],["O uso de expressões como “égua!” e “maninho”, comuns no falar do Pará e do Amapá, exemplifica a variação",["morfológica.","diastrática.","diatópica.","diacrônica.","diafásica."],2,"Variação ligada à região é diatópica (geográfica)."],["Uma pessoa que fala de modo descontraído com os amigos e formal numa entrevista de emprego está exercendo a variação",["diacrônica.","histórica.","diafásica.","diatópica.","geográfica."],2,"Variação conforme a situação de comunicação é diafásica (situacional)."],["Assinale a alternativa em que a palavra destacada está corretamente empregada.",["Ele é um **mal** profissional.","A **seção** do conselho começou às 9 horas.","A **sessão** de livros infantis fica no segundo andar.","**Aonde** você mora?","Estude, **senão** não vai dar tempo."],4,"Senão = caso contrário. C pede seção; A pede mau; D pede onde; B pede sessão."]]},{"id":"S01","m":"sus","t":"Saúde na Constituição: artigos 196 a 200","ed":["S1","S11","S12"],"v":[["aMVlNgW0P_4","Art. 196 a 200: Saúde na Constituição Federal de 1988"],["nonAIeBzlgU","Aulão sobre a Constituição Federal e o SUS (arts. 196 a 200)"]],"obj":["Memorizar o art. 196 e seus termos","Conhecer as três diretrizes do art. 198","Dominar as regras sobre a iniciativa privada (art. 199)","Saber o que compete ao SUS (art. 200) e a cada ente"],"s":[["Art. 196: o direito à saúde",["É a base da Legislação do SUS. São só cinco artigos, e a AOCP costuma cobrar o texto quase literal. Leia a lei seca pelo menos duas vezes.",{"lei":"A saúde é direito de todos e dever do Estado, garantido mediante políticas sociais e econômicas que visem à redução do risco de doença e de outros agravos e ao acesso universal e igualitário às ações e serviços para sua promoção, proteção e recuperação.","f":"CF/88, ART. 196"},{"l":["**Universal**: para todas as pessoas, sem exigir contribuição.","**Igualitário**: sem privilégios.","Ações de **promoção, proteção e recuperação** da saúde."]},"Antes do SUS, a assistência médica pública (INAMPS) atendia sobretudo quem contribuía para a previdência. O SUS rompeu com esse modelo."]],["Art. 197: relevância pública",["As ações e serviços de saúde são de **relevância pública**. Cabe ao Poder Público dispor sobre sua **regulamentação, fiscalização e controle**. A execução pode ser feita diretamente ou por terceiros, inclusive por pessoa física ou jurídica de direito privado."]],["Art. 198: como o SUS se organiza",[{"lei":"As ações e serviços públicos de saúde integram uma rede regionalizada e hierarquizada e constituem um sistema único, organizado de acordo com as seguintes diretrizes: I – descentralização, com direção única em cada esfera de governo; II – atendimento integral, com prioridade para as atividades preventivas, sem prejuízo dos serviços assistenciais; III – participação da comunidade.","f":"CF/88, ART. 198"},{"t":[["Diretriz","O que quer dizer"],["Descentralização","Cada esfera (União, estado, município) tem uma única direção do SUS no seu território."],["Atendimento integral","A prevenção tem prioridade, sem abandonar a assistência."],["Participação da comunidade","Conselhos e conferências de saúde, detalhados na Lei 8.142/1990."]]},"O SUS é financiado com recursos da **seguridade social**, da União, dos estados, do Distrito Federal e dos municípios, além de outras fontes. Os mínimos de aplicação estão na Lei Complementar 141/2012 (estados 12% e municípios 15% dos impostos; União com regra própria, hoje 15% da receita corrente líquida)."]],["Art. 199: a iniciativa privada",[{"l":["A assistência à saúde é **livre à iniciativa privada**.","Instituições privadas podem participar do SUS de forma **complementar**, mediante **contrato de direito público ou convênio**.","Têm **preferência** as entidades **filantrópicas e sem fins lucrativos**.","É **vedada** a destinação de recursos públicos para auxílios ou subvenções a instituições privadas **com fins lucrativos**.","É vedada a participação direta ou indireta de empresas ou capitais estrangeiros na assistência à saúde, **salvo nos casos previstos em lei**.","É vedado todo tipo de **comercialização** de órgãos, tecidos, substâncias humanas, sangue e derivados."]},{"a":"A AOCP adora trocar “complementar” por “suplementar” e “contrato de direito público” por “contrato de direito privado”. Lembre: o privado COMPLEMENTA o SUS por contrato PÚBLICO ou convênio."}]],["Art. 200: o que compete ao SUS",["A lista é exemplificativa (“além de outras atribuições, nos termos da lei”):",{"l":["Controlar e fiscalizar procedimentos, produtos e substâncias de interesse para a saúde e participar da produção de medicamentos, equipamentos, imunobiológicos e hemoderivados.","Executar ações de **vigilância sanitária e epidemiológica** e de **saúde do trabalhador**.","**Ordenar a formação de recursos humanos** na área de saúde.","Participar da formulação da política e da execução das ações de **saneamento básico**.","Incrementar o desenvolvimento científico, tecnológico e a inovação.","Fiscalizar e inspecionar alimentos, bebidas e águas para consumo humano.","Participar do controle de substâncias psicoativas, tóxicas e radioativas.","Colaborar na proteção do meio ambiente, **nele compreendido o do trabalho**."]},{"t":[["Artigo","Tipo de competência","O que diz"],["Art. 23, II","Comum (todos os entes)","Cuidar da saúde e assistência pública"],["Art. 24, XII","Concorrente (União, estados e DF)","Legislar sobre proteção e defesa da saúde"],["Art. 30, VII","Município","Prestar serviços de atendimento à saúde, com cooperação técnica e financeira da União e do estado"]]},{"a":"Comum: todos os entes FAZEM. Concorrente: União, estados e DF LEGISLAM."}]]],"r":["Art. 196: direito de todos e dever do Estado; políticas sociais e econômicas; acesso universal e igualitário; promoção, proteção e recuperação.","Art. 197: relevância pública; execução direta ou por terceiros.","Art. 198: rede regionalizada e hierarquizada; descentralização com direção única, atendimento integral com prioridade preventiva, participação da comunidade.","Art. 199: privado complementar, por contrato de direito público ou convênio; preferência a filantrópicas; vedada subvenção a quem tem fins lucrativos.","Art. 200: vigilâncias, saúde do trabalhador, recursos humanos, saneamento, alimentos e água, meio ambiente do trabalho.","Cuidar da saúde: competência comum. Legislar: concorrente."],"q":[["Conforme o art. 196 da Constituição Federal, a saúde é direito de todos e dever do Estado, garantido mediante políticas sociais e econômicas que visem",["ao acesso prioritário da população de baixa renda aos serviços hospitalares.","à oferta gratuita de planos de saúde privados à população.","exclusivamente ao tratamento de doenças já instaladas.","à cobertura dos trabalhadores que contribuem para a previdência social.","à redução do risco de doença e de outros agravos e ao acesso universal e igualitário às ações e serviços para sua promoção, proteção e recuperação."],4,"E é o texto literal. A erra porque o acesso é universal e igualitário. D descreve o modelo anterior ao SUS."],["São diretrizes do Sistema Único de Saúde previstas no art. 198 da Constituição Federal:",["universalidade de financiamento; gratuidade parcial; participação dos profissionais de saúde.","descentralização, com direção compartilhada entre as esferas; atendimento integral, com prioridade para os serviços assistenciais; controle exclusivo do Estado.","descentralização, com direção única em cada esfera de governo; atendimento integral, com prioridade para as atividades preventivas, sem prejuízo dos serviços assistenciais; participação da comunidade.","regionalização sem hierarquização; atendimento seletivo; participação das entidades privadas.","centralização, com direção única federal; atendimento hospitalar prioritário; participação da comunidade."],2,"Decore os três incisos. Pegadinhas: centralização, direção compartilhada e inverter a prioridade (é das atividades preventivas)."],["Sobre a participação da iniciativa privada na assistência à saúde, de acordo com a Constituição Federal, é correto afirmar que",["é livre a participação de capital estrangeiro na assistência à saúde no País.","é permitida a destinação de recursos públicos para subvenção de instituições privadas com fins lucrativos.","as instituições privadas poderão participar de forma complementar do SUS, mediante contrato de direito público ou convênio, tendo preferência as entidades filantrópicas e as sem fins lucrativos.","as instituições privadas participam do SUS de forma suplementar, mediante contrato de direito privado.","a assistência à saúde é atividade exclusiva do Poder Público."],2,"Art. 199, § 1º. A troca complementar/suplementar e público/privado é a pegadinha mais comum."],["Segundo o art. 200 da Constituição Federal, NÃO compete ao Sistema Único de Saúde",["executar as ações de vigilância sanitária e epidemiológica, bem como as de saúde do trabalhador.","fiscalizar e inspecionar alimentos, bebidas e águas para consumo humano.","participar da formulação da política e da execução das ações de saneamento básico.","conceder aposentadorias e demais benefícios previdenciários.","ordenar a formação de recursos humanos na área de saúde."],3,"Benefícios previdenciários são da Previdência Social. As outras alternativas estão no art. 200."],["De acordo com a Constituição Federal, cuidar da saúde e da assistência pública é competência",["comum da União, dos Estados, do Distrito Federal e dos Municípios.","exclusiva dos Estados.","concorrente apenas entre a União e os Estados.","privativa da União.","exclusiva dos Municípios."],0,"Art. 23, II: competência comum. A concorrente (art. 24, XII) é para legislar sobre defesa da saúde."],["De acordo com o art. 197 da Constituição Federal, as ações e serviços de saúde",["são de responsabilidade exclusiva dos Municípios.","são de relevância pública, cabendo ao Poder Público dispor sobre sua regulamentação, fiscalização e controle.","só podem ser executados diretamente pelo Poder Público.","são de interesse exclusivamente privado.","dispensam regulamentação quando prestados por particulares."],1,"Relevância pública, com regulamentação, fiscalização e controle do Poder Público; execução direta ou por terceiros."],["Assinale a alternativa INCORRETA de acordo com a Constituição Federal.",["Ao SUS compete participar da formulação da política e da execução das ações de saneamento básico.","É vedada a destinação de recursos públicos para auxílios ou subvenções às instituições privadas com fins lucrativos.","A saúde é direito de todos e dever do Estado.","São de relevância pública as ações e serviços de saúde.","A previdência social compreende um conjunto integrado de ações destinado a assegurar os direitos relativos à saúde, à educação, à moradia e à assistência social."],4,"Quem compreende saúde, previdência e assistência social é a seguridade social (art. 194), que não inclui educação e moradia."],["Conforme a Constituição Federal, ao SUS compete colaborar na proteção do meio ambiente,",["apenas por meio de convênios com empresas privadas.","nele compreendido o do trabalho.","somente quando houver epidemias.","apenas em áreas urbanas.","exceto o do trabalho, que é competência exclusiva do Ministério do Trabalho."],1,"O inciso VIII do art. 200 diz: “colaborar na proteção do meio ambiente, nele compreendido o do trabalho”."]]},{"id":"S02","m":"sus","t":"Lei 8.080/1990 (I): objetivos, campo de atuação e princípios","ed":["S2","S10","S11"],"v":[["mmN5HHDtM0A","SUS para concursos: por dentro da Lei 8.080/90"],["gsFwPUc0T_o","Resumão de SUS: Lei 8.080/90"]],"obj":["Conhecer as disposições gerais da Lei Orgânica da Saúde","Listar determinantes e condicionantes da saúde","Diferenciar vigilância sanitária, epidemiológica e saúde do trabalhador","Dominar os princípios e diretrizes do art. 7º"],"s":[["Disposições gerais",["A Lei 8.080/1990, chamada **Lei Orgânica da Saúde**, regula as ações e serviços de saúde em todo o país e a organização e o funcionamento do SUS.",{"l":["**Art. 2º**: a saúde é direito fundamental do ser humano, e o Estado deve prover as condições para seu pleno exercício. O dever do Estado **não exclui** o das pessoas, da família, das empresas e da sociedade.","**Art. 3º**: os níveis de saúde expressam a organização social e econômica do país."]},{"lei":"Os níveis de saúde expressam a organização social e econômica do País, tendo a saúde como determinantes e condicionantes, entre outros, a alimentação, a moradia, o saneamento básico, o meio ambiente, o trabalho, a renda, a educação, a atividade física, o transporte, o lazer e o acesso aos bens e serviços essenciais.","f":"LEI 8.080/1990, ART. 3º"},"**Art. 4º**: o SUS é o conjunto de ações e serviços de saúde prestados por órgãos e instituições públicas federais, estaduais e municipais, da administração direta e indireta e das fundações mantidas pelo Poder Público. A iniciativa privada participa em **caráter complementar**."]],["Objetivos e campo de atuação",[{"l":["**Objetivos (art. 5º)**: identificar e divulgar os fatores condicionantes e determinantes da saúde; formular a política de saúde; prestar assistência por meio de ações de promoção, proteção e recuperação, integrando ações assistenciais e preventivas.","**Campo de atuação (art. 6º)**: vigilância sanitária, vigilância epidemiológica, saúde do trabalhador, assistência terapêutica integral, inclusive farmacêutica; saneamento básico; formação de recursos humanos; vigilância nutricional; meio ambiente (incluído o do trabalho); política de medicamentos e de sangue; fiscalização de alimentos e água; desenvolvimento científico."]},{"t":[["Conceito","Definição da lei (resumida)"],["Vigilância sanitária","Ações capazes de **eliminar, diminuir ou prevenir riscos** à saúde e intervir nos problemas sanitários do meio ambiente, da produção e circulação de bens e da prestação de serviços"],["Vigilância epidemiológica","Ações que proporcionam o **conhecimento, a detecção ou a prevenção** de mudanças nos fatores determinantes e condicionantes da saúde, para recomendar e adotar medidas de prevenção e controle de doenças"],["Saúde do trabalhador","Atividades que, por meio das vigilâncias, promovem e protegem a saúde dos trabalhadores e buscam a recuperação e reabilitação dos expostos a riscos e agravos do trabalho"]]},{"a":"A banca troca as definições das duas vigilâncias. Sanitária: **eliminar, diminuir ou prevenir riscos** (produtos, serviços, ambiente). Epidemiológica: **conhecer, detectar ou prevenir** mudanças nos determinantes, para controlar doenças."}]],["Princípios e diretrizes (art. 7º)",[{"l":["**Universalidade** de acesso em todos os níveis de assistência.","**Integralidade** de assistência: conjunto articulado e contínuo de ações preventivas e curativas, individuais e coletivas, em todos os níveis de complexidade.","Preservação da **autonomia** das pessoas na defesa de sua integridade física e moral.","**Igualdade** da assistência, sem preconceitos ou privilégios de qualquer espécie.","Direito à **informação** sobre sua saúde e **divulgação** de informações sobre os serviços.","Utilização da **epidemiologia** para estabelecer prioridades e alocar recursos.","**Participação da comunidade**.","**Descentralização** político-administrativa, com direção única em cada esfera, ênfase na descentralização para os municípios, **regionalização e hierarquização** da rede.","Integração das ações de saúde, meio ambiente e saneamento básico.","Conjugação de recursos dos entes; capacidade de resolução em todos os níveis; organização para evitar duplicidade.","Atendimento específico e especializado para mulheres e vítimas de violência doméstica."]},"Na doutrina, costuma-se separar **princípios doutrinários** (universalidade, integralidade e **equidade**) e **princípios organizativos** (descentralização, regionalização e hierarquização, participação da comunidade). **Equidade** é tratar desigualmente os desiguais, dando mais a quem precisa mais."]],["Determinantes sociais da saúde",["Determinantes sociais são fatores sociais, econômicos, culturais, étnico-raciais, psicológicos e comportamentais que influenciam a ocorrência de problemas de saúde. O modelo de **Dahlgren e Whitehead** organiza esses fatores em camadas: no centro, idade, sexo e fatores hereditários; depois, estilo de vida; redes sociais e comunitárias; condições de vida e de trabalho (educação, trabalho, saneamento, habitação, serviços de saúde, alimentação); e, na camada mais ampla, as condições socioeconômicas, culturais e ambientais gerais."]]],"r":["Lei 8.080 = Lei Orgânica da Saúde. Dever do Estado não exclui o das pessoas, família, empresas e sociedade.","Determinantes (art. 3º): alimentação, moradia, saneamento, meio ambiente, trabalho, renda, educação, atividade física, transporte, lazer, bens essenciais.","SUS (art. 4º): instituições públicas; privado complementar.","Vigilância sanitária: eliminar, diminuir, prevenir riscos. Epidemiológica: conhecer, detectar, prevenir mudanças nos determinantes.","Art. 7º: universalidade, integralidade, autonomia, igualdade, informação, epidemiologia, participação, descentralização com direção única, regionalização e hierarquização.","Doutrinários: universalidade, integralidade, equidade. Organizativos: descentralização, regionalização/hierarquização, participação."],"q":[["De acordo com a Lei nº 8.080/1990, o dever do Estado de garantir a saúde",["não exclui o das pessoas, da família, das empresas e da sociedade.","cabe exclusivamente à União.","exclui o dever das pessoas e da família.","só se aplica a quem contribui para a previdência.","restringe-se ao atendimento hospitalar."],0,"Art. 2º, § 2º: o dever do Estado não exclui o das pessoas, da família, das empresas e da sociedade."],["Segundo a Lei nº 8.080/1990, são determinantes e condicionantes da saúde, entre outros,",["somente o acesso a hospitais e medicamentos.","apenas fatores genéticos e hereditários.","a religião e a orientação política.","exclusivamente as condições de trabalho.","alimentação, moradia, saneamento básico, meio ambiente, trabalho, renda, educação, atividade física, transporte, lazer e acesso aos bens e serviços essenciais."],4,"É o rol do art. 3º, que é exemplificativo (“entre outros”)."],["O conjunto de ações capaz de eliminar, diminuir ou prevenir riscos à saúde e de intervir nos problemas sanitários decorrentes do meio ambiente, da produção e circulação de bens e da prestação de serviços de interesse da saúde é a",["saúde do trabalhador.","vigilância sanitária.","vigilância nutricional.","assistência farmacêutica.","vigilância epidemiológica."],1,"Essa é a definição de vigilância sanitária (art. 6º, § 1º)."],["Entende-se por vigilância epidemiológica, segundo a Lei nº 8.080/1990,",["um conjunto de ações que proporcionam o conhecimento, a detecção ou a prevenção de qualquer mudança nos fatores determinantes e condicionantes de saúde individual ou coletiva, com a finalidade de recomendar e adotar as medidas de prevenção e controle das doenças ou agravos.","a distribuição de medicamentos à população.","a fiscalização de portos e aeroportos, exclusivamente.","a assistência ao trabalhador acidentado.","o controle de bens de consumo e da prestação de serviços."],0,"Conhecer, detectar ou prevenir mudanças nos determinantes, para controlar doenças: vigilância epidemiológica."],["A integralidade de assistência, prevista na Lei nº 8.080/1990, é entendida como",["acesso aos serviços apenas para quem contribui.","garantia de medicamentos importados a todos os usuários.","prioridade absoluta para ações curativas.","atendimento exclusivo em hospitais de alta complexidade.","conjunto articulado e contínuo das ações e serviços preventivos e curativos, individuais e coletivos, exigidos para cada caso em todos os níveis de complexidade do sistema."],4,"É o texto do art. 7º, II."],["Assinale a alternativa que apresenta princípios doutrinários do SUS, segundo a classificação usual da doutrina.",["Participação da comunidade e resolutividade.","Centralização e privatização.","Universalidade, integralidade e equidade.","Complementaridade e suplementaridade.","Descentralização, regionalização e hierarquização."],2,"Universalidade, integralidade e equidade são os princípios doutrinários. E e A trazem princípios organizativos."],["Conforme a Lei nº 8.080/1990, a descentralização político-administrativa do SUS deve ter",["ênfase na descentralização dos serviços para os Estados.","direção única em cada esfera de governo, com ênfase na descentralização dos serviços para os Municípios, regionalização e hierarquização da rede.","organização sem regionalização.","direção compartilhada entre os entes em cada esfera.","comando exclusivo do Ministério da Saúde."],1,"Art. 7º, IX: direção única em cada esfera, ênfase nos municípios, regionalização e hierarquização."],["Informe se é verdadeiro (V) ou falso (F) e assinale a sequência correta.\n( ) A iniciativa privada participa do SUS em caráter complementar.\n( ) A assistência terapêutica integral, inclusive farmacêutica, está no campo de atuação do SUS.\n( ) O uso da epidemiologia para estabelecer prioridades é vedado pela lei.\n( ) O direito à informação sobre a própria saúde é um dos princípios do SUS.",["V – F – V – F.","V – V – V – F.","F – F – F – V.","V – V – F – V.","F – V – V – V."],3,"Complementar (V); assistência terapêutica e farmacêutica (V); a epidemiologia deve ser usada para prioridades (F); direito à informação é princípio (V)."]]},{"id":"S03","m":"sus","t":"Lei 8.080/1990 (II): organização, competências e serviços privados","ed":["S2","S9","S12"],"v":[["v9JBCZeQY4A","SUS para concursos: os principais artigos da Lei 8.080/90"],["P_gY-wYmUIw","SUS para concursos: a Lei 8.080/90 na sua prova"]],"obj":["Saber quem exerce a direção do SUS em cada esfera","Diferenciar competências da União, dos estados e dos municípios","Conhecer os subsistemas e direitos específicos","Dominar as regras sobre serviços privados e capital estrangeiro"],"s":[["Organização e direção",[{"l":["**Art. 8º**: as ações e serviços do SUS são organizados de forma **regionalizada e hierarquizada em níveis de complexidade crescente**.","**Art. 9º**: direção única em cada esfera: na **União**, o **Ministério da Saúde**; nos **estados e DF**, a **Secretaria de Saúde** ou órgão equivalente; nos **municípios**, a **Secretaria de Saúde** ou órgão equivalente.","**Art. 10**: os municípios podem formar **consórcios** para desenvolver ações e serviços em conjunto. **Aplica-se aos consórcios o princípio da direção única.**","**Art. 12**: comissões intersetoriais nacionais, **subordinadas ao Conselho Nacional de Saúde**.","**Art. 14-A**: a **CIT** e as **CIB** são foros de negociação e pactuação entre gestores quanto aos aspectos operacionais do SUS. **CONASS** e **CONASEMS** são entidades representativas dos secretários estaduais e municipais."]}]],["Quem faz o quê",[{"t":[["Esfera","Exemplos de competências"],["Comum (art. 15)","Definir mecanismos de controle e avaliação; administrar recursos; elaborar normas técnicas; organizar sistema de informação; elaborar plano de saúde; fazer **requisição** de bens e serviços em caso de perigo iminente, calamidade ou epidemia, com justa indenização"],["União (art. 16)","Formular políticas nacionais; definir e coordenar redes de alta complexidade, laboratórios e vigilâncias; **vigilância sanitária de portos, aeroportos e fronteiras**; cooperação técnica e financeira; Planejamento Estratégico Nacional"],["Estado (art. 17)","**Promover a descentralização para os municípios**; apoio técnico e financeiro aos municípios; executar ações **supletivamente**; coordenar e, em caráter complementar, executar vigilâncias; gerir alta complexidade de referência estadual e regional; coordenar laboratórios e hemocentros"],["Município (art. 18)","Planejar, organizar, controlar, avaliar e **executar** os serviços de saúde; executar vigilâncias, alimentação e nutrição, saneamento, saúde do trabalhador; formar consórcios; contratar e fiscalizar serviços privados"],["Distrito Federal (art. 19)","Competências de estados e municípios"]]},{"a":"Município **executa**; estado **descentraliza, apoia e executa supletivamente**; União **formula e coordena** em âmbito nacional."}]],["Subsistemas e direitos específicos",[{"l":["**Subsistema de Atenção à Saúde Indígena** (art. 19-A): financiado pela União, organizado em Distritos Sanitários Especiais Indígenas, respeitando a cultura dos povos.","**Atendimento e internação domiciliar** (art. 19-I): equipes multidisciplinares, com indicação médica e concordância do paciente e da família.","**Acompanhante no parto** (art. 19-J): um acompanhante durante trabalho de parto, parto e pós-parto imediato, indicado pela parturiente.","**Assistência terapêutica e incorporação de tecnologias** (arts. 19-M a 19-U): a **CONITEC** assessora o Ministério; o processo deve ser concluído em até **180 dias**, prorrogáveis por **90**. É vedado, em todas as esferas, pagar ou dispensar medicamento ou produto **sem registro na Anvisa** ou experimental."]}]],["Serviços privados e capital estrangeiro",[{"l":["Quando as disponibilidades forem insuficientes, o SUS pode recorrer aos serviços privados: **participação complementar**, por **contrato ou convênio**, observadas as normas de direito público (art. 24).","**Preferência** às entidades **filantrópicas e sem fins lucrativos** (art. 25).","Critérios e valores de remuneração são definidos pela direção nacional e **aprovados pelo Conselho Nacional de Saúde** (art. 26)."]},{"lei":"É permitida a participação direta ou indireta, inclusive controle, de empresas ou de capital estrangeiro na assistência à saúde nos seguintes casos: I – doações de organismos internacionais vinculados à ONU, de entidades de cooperação técnica e de financiamento e empréstimos; II – pessoas jurídicas destinadas a instalar, operacionalizar ou explorar: a) hospital geral, inclusive filantrópico, hospital especializado, policlínica, clínica geral e clínica especializada; e b) ações e pesquisas de planejamento familiar; III – serviços de saúde mantidos, sem finalidade lucrativa, por empresas, para atendimento de seus empregados e dependentes, sem qualquer ônus para a seguridade social; IV – demais casos previstos em legislação específica.","f":"LEI 8.080/1990, ART. 23 (REDAÇÃO DA LEI 13.097/2015)"},"**Gratuidade**: as ações e serviços públicos e os privados contratados ou conveniados são gratuitos para o usuário (art. 43). Os recursos financeiros do SUS são depositados em conta especial e movimentados **sob fiscalização dos Conselhos de Saúde** (art. 33). O planejamento é **ascendente**, do nível local ao federal (art. 36)."]]],"r":["Regionalizada e hierarquizada em níveis de complexidade crescente.","Direção: MS (União); Secretarias de Saúde (estados, DF e municípios).","Consórcios intermunicipais seguem a direção única.","Comissões intersetoriais subordinadas ao CNS. CIT e CIB: foros de pactuação.","Município executa; estado descentraliza e executa supletivamente; União formula e coordena (portos, aeroportos e fronteiras).","Subsistema indígena; internação domiciliar; acompanhante no parto; CONITEC (180 + 90 dias); vedado produto sem registro na Anvisa.","Privado complementar por contrato ou convênio; filantrópicas com preferência; remuneração aprovada pelo CNS.","Capital estrangeiro permitido: doações, hospital geral/especializado, planejamento familiar, serviços sem fins lucrativos para empregados."],"q":[["Segundo a Lei nº 8.080/1990, as ações e serviços de saúde executados pelo SUS serão organizados de forma",["exclusivamente municipal, sem hierarquia.","regionalizada e hierarquizada em níveis de complexidade crescente.","privada e complementar.","hierarquizada em níveis de complexidade decrescente.","centralizada e em nível único de complexidade."],1,"Art. 8º: regionalizada e hierarquizada em níveis de complexidade crescente."],["No âmbito da União, a direção do SUS é exercida",["pelo Presidente da República.","pela Comissão Intergestores Tripartite.","pelo CONASS.","pelo Conselho Nacional de Saúde.","pelo Ministério da Saúde."],4,"Art. 9º: na União, Ministério da Saúde; nos estados e municípios, a respectiva Secretaria de Saúde ou órgão equivalente."],["Sobre os consórcios intermunicipais de saúde, a Lei nº 8.080/1990 estabelece que",["são proibidos.","só podem ser formados por capitais.","aplica-se a eles o princípio da direção única.","devem ser dirigidos pelo Ministério da Saúde.","não se aplica a eles o princípio da direção única."],2,"Art. 10, § 1º: aplica-se aos consórcios o princípio da direção única."],["Compete à direção estadual do SUS, segundo a Lei nº 8.080/1990,",["promover a descentralização para os Municípios dos serviços e das ações de saúde.","formular a política nacional de produção de insumos.","celebrar contratos com entidades privadas no âmbito municipal, com exclusividade.","executar a vigilância sanitária de portos, aeroportos e fronteiras, com exclusividade.","elaborar o Planejamento Estratégico Nacional."],0,"Promover a descentralização para os municípios é competência estadual (art. 17, I). Portos, aeroportos, fronteiras e planejamento nacional são da União."],["De acordo com a Lei nº 8.080/1990, é permitida a participação de empresas ou de capital estrangeiro na assistência à saúde no caso de",["qualquer serviço com finalidade lucrativa.","gestão das Secretarias Municipais de Saúde.","controle de laboratórios públicos.","pessoas jurídicas destinadas a instalar, operacionalizar ou explorar hospital especializado.","serviços mantidos com finalidade lucrativa por empresas para seus empregados."],3,"Hospital geral e especializado estão entre os casos permitidos pelo art. 23. Serviços para empregados só sem finalidade lucrativa."],["Conforme a Lei nº 8.080/1990, são vedados, em todas as esferas de gestão do SUS,",["a dispensação, o pagamento, o ressarcimento ou o reembolso de medicamento e produto, nacional ou importado, sem registro na Anvisa.","as ações de saúde do trabalhador.","a compra de medicamentos genéricos.","os consórcios intermunicipais.","os convênios com entidades filantrópicas."],0,"É o art. 19-T, II: vedação em todas as esferas (não só na municipal)."],["A participação complementar dos serviços privados no SUS, segundo a Lei nº 8.080/1990,",["tem critérios de remuneração definidos livremente por cada prestador.","dispensa formalização.","será formalizada mediante contrato ou convênio, observadas as normas de direito público.","só pode ocorrer em situações de calamidade.","é proibida às entidades filantrópicas."],2,"Art. 24, parágrafo único. Os critérios de remuneração são definidos pela direção nacional e aprovados pelo CNS."],["Segundo a Lei nº 8.080/1990, o processo administrativo de incorporação, exclusão ou alteração de medicamentos, produtos e procedimentos pelo SUS deve ser concluído em prazo não superior a",["1 ano.","30 dias, prorrogáveis por 30.","60 dias, improrrogáveis.","90 dias, prorrogáveis por 30.","180 dias, prorrogáveis por 90."],4,"Art. 19-R: até 180 dias, admitida prorrogação por 90 dias corridos."]]},{"id":"S04","m":"sus","t":"Lei 8.142/1990, conselhos e conferências de saúde","ed":["S3","S7"],"v":[["SKjG0NQuVeg","Lei 8.142: conselhos e conferências de saúde (aula completa)"],["MN0wipfkWpU","Composição do Conselho Nacional de Saúde (Lei 8.142 e Resolução 453/2012)"]],"obj":["Diferenciar conferência e conselho de saúde","Conhecer a composição paritária","Saber como os recursos do Fundo Nacional de Saúde são repassados","Dominar as regras da Resolução CNS 453/2012"],"s":[["Conferência × conselho",["A Lei 8.142/1990 trata da **participação da comunidade** na gestão do SUS e das **transferências** de recursos. Em cada esfera de governo existem duas instâncias colegiadas, sem prejuízo das funções do Poder Legislativo:",{"t":[["","Conferência de Saúde","Conselho de Saúde"],["Frequência","A cada **4 anos**","Permanente"],["Caráter","Avalia a situação de saúde e **propõe diretrizes** para a política de saúde","**Permanente e deliberativo**: formula estratégias e controla a execução da política, inclusive nos aspectos econômicos e financeiros"],["Convocação","Pelo **Poder Executivo** ou, extraordinariamente, por ela própria ou pelo Conselho","Funciona continuamente; suas decisões são **homologadas pelo chefe do poder** em cada esfera"],["Composição","Representação dos vários segmentos sociais","Governo, prestadores, profissionais de saúde e usuários"]]},{"a":"A representação dos **usuários** é **paritária** em relação ao conjunto dos demais segmentos: metade dos assentos. O CONASS e o CONASEMS têm representação no Conselho Nacional de Saúde."}]],["Recursos do Fundo Nacional de Saúde",["Os recursos do FNS serão alocados como: despesas de custeio e de capital do Ministério da Saúde; investimentos previstos em lei orçamentária e no Plano Quinquenal do Ministério; e **cobertura das ações e serviços** a serem implementados por municípios, estados e DF.",{"l":["Os repasses são **regulares e automáticos**.","**Pelo menos 70%** dos recursos para cobertura de ações e serviços vão para os **municípios**; o restante, para os estados."]},"Para receber os recursos, municípios, estados e DF devem ter (art. 4º):",{"l":["**Fundo de Saúde**;","**Conselho de Saúde** com composição paritária;","**Plano de saúde**;","**Relatório de gestão**;","**Contrapartida** de recursos no orçamento;","**Comissão de elaboração do Plano de Carreira, Cargos e Salários (PCCS)**, com prazo de dois anos para implantação."]},"Se o ente não cumprir os requisitos, os recursos passam a ser administrados pelo estado ou pela União."]],["Resolução CNS 453/2012",[{"t":[["Segmento","Vagas"],["Usuários","50%"],["Trabalhadores da saúde","25%"],["Gestores e prestadores (governo e prestadores privados conveniados ou sem fins lucrativos)","25%"]]},{"l":["O **número de conselheiros** é definido pelos Conselhos de Saúde e constituído **em lei**.","As funções de conselheiro são de **relevância pública** e **não são remuneradas**; garantem a dispensa do trabalho sem prejuízo.","A participação de **membros eleitos do Poder Legislativo**, de representação do **Judiciário** e do **Ministério Público** como conselheiros **não é permitida**.","Quem ocupa **cargo de direção ou de confiança** na gestão do SUS, ou é prestador, **não pode** representar usuários ou trabalhadores.","O plenário reúne-se **no mínimo mensalmente** e, extraordinariamente, quando necessário.","A pauta e o material de apoio são enviados com antecedência mínima de **10 dias**.","As reuniões são **abertas ao público**.","As decisões exigem quórum mínimo de **metade mais um** dos integrantes.","O Conselho **decide sobre seu orçamento** e tem secretaria executiva subordinada ao plenário."]}]]],"r":["Conferência: a cada 4 anos, avalia e propõe diretrizes; convocada pelo Executivo (ou por ela/Conselho, extraordinariamente).","Conselho: permanente e deliberativo; controla a execução, inclusive financeira; decisões homologadas pelo chefe do poder.","Usuários: paridade (50%). CONASS e CONASEMS no CNS.","Repasses regulares e automáticos; pelo menos 70% aos municípios.","Requisitos: fundo, conselho paritário, plano, relatório de gestão, contrapartida, comissão do PCCS.","Res. 453: 50/25/25; conselheiro não remunerado; vedado Legislativo, Judiciário e MP; reunião mensal; pauta com 10 dias; reuniões abertas; Conselho decide seu orçamento."],"q":[["De acordo com a Lei nº 8.142/1990, a Conferência de Saúde",["reúne-se a cada 2 anos e é convocada pelo Conselho Nacional de Saúde.","reúne-se a cada 4 anos para avaliar a situação de saúde e propor as diretrizes para a formulação da política de saúde, convocada pelo Poder Executivo ou, extraordinariamente, por ela própria ou pelo Conselho de Saúde.","é composta apenas por gestores.","tem caráter permanente e deliberativo.","substitui o Poder Legislativo na aprovação do orçamento."],1,"Conferência: a cada 4 anos, avalia e propõe diretrizes. O caráter permanente e deliberativo é do Conselho."],["O Conselho de Saúde, segundo a Lei nº 8.142/1990, tem caráter",["eventual e fiscalizador.","privado e voluntário.","permanente e deliberativo.","exclusivamente técnico.","temporário e consultivo."],2,"O Conselho é permanente e deliberativo."],["A representação dos usuários nos Conselhos de Saúde e nas Conferências será",["inexistente nas Conferências.","minoritária, de 25%.","igual à de cada segmento isoladamente, de 33%.","paritária em relação ao conjunto dos demais segmentos.","definida livremente por cada gestor."],3,"Paridade em relação ao conjunto dos demais segmentos: 50% de usuários."],["Segundo a Lei nº 8.142/1990, os recursos destinados à cobertura das ações e serviços de saúde a serem implementados pelos entes serão destinados",["conforme decisão anual do Presidente da República.","pelo menos 70% aos Municípios, afetando-se o restante aos Estados.","integralmente aos Estados.","exclusivamente aos consórcios.","pelo menos 50% aos Estados."],1,"Art. 3º, § 2º: pelo menos 70% aos municípios."],["NÃO é requisito previsto na Lei nº 8.142/1990 para que municípios, estados e DF recebam os recursos do Fundo Nacional de Saúde:",["Relatório de gestão.","Plano de saúde.","Conselho de Saúde com composição paritária.","Fundo de Saúde.","Hospital universitário próprio."],4,"A lei não exige hospital universitário. Os requisitos incluem ainda contrapartida e comissão do PCCS."],["De acordo com a Resolução CNS nº 453/2012, as vagas nos Conselhos de Saúde são distribuídas da seguinte forma:",["25% usuários; 25% trabalhadores; 50% governo e prestadores.","70% usuários; 30% demais segmentos.","50% usuários; 25% trabalhadores de saúde; 25% gestores e prestadores de serviços.","50% trabalhadores; 50% usuários.","33% para cada segmento."],2,"50% usuários, 25% trabalhadores e 25% gestores/prestadores."],["Sobre a estrutura e o funcionamento dos Conselhos de Saúde, conforme a Resolução CNS nº 453/2012, é correto afirmar que",["o Conselho de Saúde decide sobre o seu orçamento.","as funções de conselheiro são remuneradas por subsídio.","as reuniões plenárias são sigilosas.","o plenário se reúne, no mínimo, uma vez por ano.","a pauta deve ser enviada com antecedência mínima de 30 dias."],0,"O Conselho decide sobre seu orçamento. O plenário se reúne no mínimo mensalmente, a pauta vai com 10 dias de antecedência, as reuniões são abertas e o cargo não é remunerado."],["Conforme a Resolução CNS nº 453/2012, a participação de membros eleitos do Poder Legislativo, de representação do Poder Judiciário e do Ministério Público como conselheiros",["não é permitida nos Conselhos de Saúde.","é permitida apenas no Conselho Nacional.","é obrigatória.","depende de autorização do gestor.","é permitida no segmento de usuários."],0,"A resolução proíbe essa participação como conselheiros."]]},{"id":"S05","m":"sus","t":"Lei Complementar 141/2012: financiamento da saúde","ed":["S8"],"v":[["4Rrvycw4Phc","Lei Complementar 141/2012: legislação do SUS (aula 1)"],["RCRUtuz34ls","Introdução à Lei Complementar 141"]],"obj":["Saber os percentuais mínimos de cada ente","Diferenciar o que conta e o que não conta como ação de saúde","Conhecer a movimentação dos recursos e o papel do conselho","Dominar os prazos de prestação de contas"],"s":[["Para que serve a LC 141/2012",["A Lei Complementar 141/2012 regulamenta o § 3º do art. 198 da Constituição. Ela define os **valores mínimos** que cada ente aplica por ano em **ações e serviços públicos de saúde (ASPS)**, os critérios de rateio e as normas de fiscalização, avaliação e controle.",{"t":[["Ente","Mínimo","Base"],["Estados","**12%**","Arrecadação de impostos estaduais (ICMS, IPVA, ITCMD) e transferências, descontadas as parcelas dos municípios"],["Municípios","**15%**","Arrecadação de impostos municipais (IPTU, ISS, ITBI) e transferências recebidas"],["Distrito Federal","12% e 15%","Conforme a natureza da receita (estadual ou municipal)"],["União","Regra própria","O texto original da LC usava o valor empenhado no ano anterior + variação nominal do PIB; a Constituição passou a fixar **15% da receita corrente líquida**"]]},{"a":"Para a prova, guarde **12% estados** e **15% municípios**. Se a questão perguntar o texto original da LC 141 sobre a União, a resposta é: valor do ano anterior acrescido da variação nominal do PIB."}]],["O que conta como ação de saúde",["Para entrar no mínimo, a despesa deve ser de acesso **universal, igualitário e gratuito**, estar de acordo com o **plano de saúde** e ser de responsabilidade específica do setor saúde.",{"t":[["Conta (exemplos)","NÃO conta (exemplos)"],["Vigilância em saúde; atenção integral em todos os níveis; capacitação de pessoal do SUS; medicamentos e insumos; saneamento de domicílios ou pequenas comunidades aprovado pelo Conselho; saneamento em distritos indígenas e quilombos; obras na rede física do SUS; pessoal da saúde em atividade na saúde","Aposentadorias e pensões (inclusive de servidores da saúde); pessoal da saúde em atividade fora da saúde; assistência de clientela fechada (planos de servidores); merenda escolar; saneamento financiado por taxas e tarifas; limpeza urbana e resíduos; preservação ambiental; assistência social; obras de infraestrutura, mesmo que beneficiem a rede"]]},{"a":"Merenda escolar e aposentadoria **não** contam como gasto em saúde. É a pegadinha mais cobrada da LC 141."}]],["Movimentação e transparência",[{"l":["Os recursos são aplicados por meio do **Fundo de Saúde**, movimentados **sob fiscalização do Conselho de Saúde**.","Transferências da União para estados e municípios e dos estados para os municípios são **fundo a fundo**, de forma **regular e automática**.","Os critérios de rateio consideram as necessidades de saúde, as dimensões epidemiológica, demográfica, socioeconômica e espacial e a capacidade de oferta, buscando **reduzir desigualdades regionais**.","Se o ente aplicar m
